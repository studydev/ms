body{

.bar{

  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);
}
.bar-in{max-width:1080px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}

.kicker{font-size:12.5px;color:var(--fg3);letter-spacing:.01em;flex:1;min-width:0;

.seg{display:flex;background:var(--bg2);border-radius:980px;padding:3px}
.seg button{

}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.icobtn{border:1px solid var(--line);background:transparent;color:var(--fg2);width:32px;height:32px;
  border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center}

/* ---------- hero ---------- */
.hero{max-width:900px;margin:0 auto;padding:74px 24px 30px;text-align:center}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:20px}
h1{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Apple SD Gothic Neo",sans-serif;
  font-size:clamp(34px,5.6vw,62px);line-height:1.08;letter-spacing:-.028em;font-weight:700;margin:0 0 24px;
}
h1 .ac{color:var(--ac)}
.sub{font-size:clamp(16px,2vw,20px);line-height:1.62;color:var(--fg2);max-width:720px;margin:0 auto}
.meta{margin-top:28px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:980px;padding:8px 16px;font-size:13px;color:var(--fg3)}
.pill b{color:var(--fg);font-weight:600}
.btn{background:var(--ac);color:#fff;border-radius:980px;padding:9px 20px;font-size:13.5px;font-weight:600}

.thumb .play{

  background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.45));
  opacity:0;transition:.25s
}
.thumb:hover .play{opacity:1}
.thumb .play span{
  background:rgba(255,255,255,.95);color:#111;border-radius:980px;padding:11px 22px;
  font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)
}
.cap{text-align:center;font-size:12.5px;color:var(--fg3);margin-top:12px}

/* ---------- toc ---------- */
.toc{max-width:940px;margin:56px auto 0;padding:0 24px}
.toc h3{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:0 0 14px;font-weight:600}
.toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.toc a{display:flex;gap:11px;align-items:baseline;padding:12px 15px;border:1px solid var(--line);border-radius:13px;

.toc a:hover{text-decoration:none;border-color:var(--ac);color:var(--fg)}
.toc .n{color:var(--ac);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}

main{max-width:860px;margin:0 auto;padding:0 24px 120px}
.sec{margin-top:88px;scroll-margin-top:70px}
.sec-head{display:flex;align-items:baseline;gap:14px;padding-bottom:16px;margin-bottom:34px;border-bottom:1px solid var(--line)}
.sec-n{font-size:12px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.sec-t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;

.sec-time{font-size:12.5px;color:var(--fg3);font-variant-numeric:tabular-nums;flex:none}

.turn{display:flex;gap:14px;margin:0 0 26px}
.turn.a{flex-direction:row-reverse}
.av{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;margin-top:2px;

.av img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.turn.a .body{align-items:flex-end}
.who{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.turn.a .who{flex-direction:row-reverse}
.who b{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.turn.q .who b{color:var(--fg2)}
.turn.a .who b{color:var(--fg)}
.ts{font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;

.bub{border-radius:16px;padding:16px 19px;font-size:16.5px;line-height:1.78;letter-spacing:-.003em;

.turn.q .bub{background:var(--qbg);border:1px solid var(--qbd);color:var(--fg2);font-size:16px;
  border-top-left-radius:5px}
.turn.a .bub{background:var(--abg);border:1px solid var(--abd);color:var(--fg);
  box-shadow:0 1px 2px rgba(0,0,0,.03);border-top-right-radius:5px}
.bub p{margin:0 0 13px}
.bub p:last-child{margin:0}
.bub strong{color:var(--ac);font-weight:600}
html[data-theme="dark"] .bub strong{color:var(--ac)}
.bub em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--ac) 20%,transparent) 0);
  padding:0 2px;font-weight:500}
.bub code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.87em;
  background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.turn.beat{justify-content:center;margin:8px 0 26px}
.turn.beat .av{display:none}
.turn.beat .body{align-items:center;flex:none}
.turn.beat .who{display:none}
.turn.beat .bub{background:transparent;border:0;padding:2px 0;color:var(--fg3);font-size:13.5px;font-style:italic;max-width:none}

.term{

  border-radius:16px;overflow:hidden;
}
.term>summary{
  list-style:none;cursor:pointer;padding:15px 20px;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;user-select:none;transition:background .15s;
}
.term>summary::-webkit-details-marker{display:none}
.term>summary:hover{background:color-mix(in srgb,var(--tbd) 22%,transparent)}
.term-tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tac);
  border:1px solid var(--tbd);border-radius:980px;padding:3px 9px;flex:none}
.term>summary b{font-size:16px;letter-spacing:-.015em}
.term>summary .kr{font-size:13px;color:var(--fg3);flex:1;min-width:0}
.term .chev{flex:none;color:var(--tac);font-size:12px;transition:transform .2s;margin-left:auto}
.term[open] .chev{transform:rotate(180deg)}
.term-b{font-size:15px;line-height:1.75;color:var(--fg2);padding:2px 20px 19px;
  border-top:1px solid color-mix(in srgb,var(--tbd) 60%,transparent);margin-top:0;padding-top:16px}
.term-b p{margin:0 0 11px}
.term-b p:last-child{margin:0}
.term-b strong{color:var(--fg);font-weight:600}
.term-b code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.87em;
  background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--tbd);border-radius:6px;padding:1px 6px}
.term-src{margin-top:12px;font-size:12px;color:var(--fg3)}

/* ---------- outro ---------- */
.outro{max-width:860px;margin:96px auto 0;padding:44px 24px;border-top:1px solid var(--line);text-align:center}
.outro p{color:var(--fg3);font-size:13.5px;line-height:1.7;margin:0 0 8px}

@media(max-width:640px){
  .term{margin-left:0}
