들어진 저품질 결과물", "en": "low-effort, low-quality output"}, "body": {"ko": "원래 ‘음식 찌꺼기·꿀꿀이죽’이라는 뜻인데, 요즘은 **AI가 대량으로 찍어 낸 성의 없고 질 낮은 결과물**을 부르는 말로 널리 쓰입니다. 코드에서는 ‘돌아가긴 하지만 엉성하고, 고치기 어렵고, 나쁜 패턴을 퍼뜨리는 코드’를 뜻해요.\n\n발표 제목 ‘All Code Is Slop (Except Mine)’은 **“남의 코드는 다 슬롭이고 내 코드만 예외”라는 개발자들의 흔한 편견을 비튼 농담**입니다. 결론에서 그 괄호가 ‘(except yours)’로 바뀌는 것도 눈여겨보세요 (17:05).", "en": "Literally ‘pig swill’; now the common word for **low-effort, mass-produced AI output**. In code: it runs, but it's sloppy, hard to change, and spreads bad patterns. The title jokes about every engineer's bias that everyone else's code is slop except their own."}}, {"type": "shot", "t": 29, "cap": {"ko": "타이틀 슬라이드 ‘all code is slop’. 발표자 표기는 ‘poteto (aka lauren tan) · Grok Bot @ SpaceXSI’입니다.", "en": "Title slide ‘all code is slop’ — ‘poteto (aka lauren tan), Grok Bot @ SpaceXSI’."}, "img": "images/shot-01.jpg"}, {"type": "say", "sp": "lauren", "t": 31, "text": {"ko": "저도 그래요. 그런데 오늘 저는 여러분께 **그 슬롭을 금으로 바꿀 수 있다**는 걸 설득해 보려고 해요.", "en": "Well, I have too. But today I'm going to convince you that **you can turn that slop into gold**."}, "e": 42}, {"type": "shot", "t": 41, "cap": {"ko": "‘OUR BLESSED CRAFT vs THEIR BARBAROUS SLOP’ — 우리 쪽 에이전트·프롬프트·4,000줄 PR은 ‘영광스럽고’, 상대 쪽은 ‘사악하다’고 부르는 이중잣대를 풍자한 그림입니다.", "en": "‘Our blessed craft vs their barbarous slop’ — a cartoon mocking the double standard."}, "img": "images/shot-02.jpg"}, {"type": "say", "sp": "lauren", "t": 42, "text": {"ko": "그래서 지난달에 제가 좀 미친 짓을 했는데요, **프로덕션에 PR을 3,000개 내보냈어요.**", "en": "And so I did something crazy last month: **I shipped 3,000 pull requests to production.**"}, "e": 48}, {"type": "say", "sp": "lauren", "t": 48, "text": {"ko": "에이전트가 등장하기 전에는 우리가 **양(volume)**에 크게 신경 쓰지 않았어요. 극소수의 예외적인 사람들만 빼고요. 제 예전 회사에서는 그런 사람들을 **‘코딩 머신’**이라고 불렀어요.", "en": "Now, before agents, we never really cared about volume — except for the outliers. At my previous company we called these people **coding machines**."}, "e": 58}, {"type": "shot", "t": 53, "cap": {"ko": "‘i shipped 3,000 PRs to prod last month’ — 월별 PR 수가 3월 68개에서 10월 3,129개로 늘어난 그래프(누적 10,932개).", "en": "Monthly PRs grow from 68 in March to 3,129 in October (10,932 total)."}, "img": "images/shot-03.jpg"}, {"type": "term", "term": "PR (Pull Request)", "kr": {"ko": "풀 리퀘스트 — 코드 변경을 합쳐 달라는 요청", "en": "a request to merge a code change"}, "body": {"ko": "개발자가 고친 코드를 **팀의 본 코드에 합쳐(merge) 달라고 올리는 변경 묶음**입니다. 보통 동료가 리뷰하고 승인해야 합쳐지죠.\n\n한 사람이 한 달에 PR 3,000개면 **하루 100개꼴**입니다. 사람이 직접 짜고 리뷰해서는 불가능한 양이라, 이 숫자 자체가 ‘에이전트가 대부분을 쓰고 스스로 검증한다’는 뜻이에요.", "en": "A bundle of code changes submitted to be **merged into the main codebase**, usually after review. 3,000 a month is ~100 a day — impossible by hand, which is the point."}}, {"type": "say", "sp": "lauren", "t": 58, "text": {"ko": "예를 들면 **Bret Taylor** 같은 사람이요. 주말 하루 만에 **Google Maps 전체를 다시 짰다**는 걸로 유명하죠. 말도 안 되게 생산적인 엔지니어예요.", "en": "People like **Bret Taylor**, who famously rewrote all of Google Maps in a weekend. Just an insanely productive engineer."}, "e": 66}, {"type": "term", "term": "Bret Taylor", "kr": {"ko": "브렛 테일러 — 전설적인 ‘코딩 머신’의 대명사", "en": "the archetypal ‘coding machine’"}, "body": {"ko": "Google Maps 공동 창시자로, **주말 동안 Google Maps를 통째로 다시 작성했다**는 일화로 유명한 엔지니어입니다. 이후 Facebook CTO, Salesforce 공동 CEO, OpenAI 이사회 의장 등을 지냈어요.\n\n발표자는 이 일화를 꺼내 **“예전에는 이런 생산성이 극소수 천재의 몫이었지만, 이제는 에이전트 덕에 누구나 가능하다”**는 대비를 만듭니다.", "en": "Co-creator of Google Maps, famous for rewriting it over a weekend; later Facebook CTO and Salesforce co-CEO. Used here as the archetype of the rare super-productive engineer — now anyone can be one."}}, {"type": "shot", "t": 65, "cap": {"ko": "‘quality & quantity — everyone can be a coding machine’. 하단: ‘the new meta is shipping fast without compromising on quality’.", "en": "‘Quality & quantity: everyone can be a coding machine.’"}, "img": "images/shot-04.jpg"}, {"type": "say", "sp": "lauren", "t": 66, "text": {"ko": "그런데 에이전트 덕분에 이제는 **누구나 코딩 머신이 될 수 있어요.**", "en": "And with agents, **anyone can now be a coding machine**."}, "e": 69}, {"type": "say", "sp": "lauren", "t": 69, "text": {"ko": "제 주장은 이거예요. 소프트웨어 엔지니어의 일, 말하자면 **엔지니어라는 게임의 새로운 ‘메타’는 생산성을 엄청나게 늘리면서도 코드 품질을 유지하거나 오히려 더 높이는 방법을 찾아내는 것**이에요.", "en": "My thesis is that the job of the software engineer — **the meta of being a software engineer — is figuring out how to maintain or even improve the quality of your code while massively increasing your productivity.**"}, "e": 83}, {"type": "term", "term": "Meta", "kr": {"ko": "메타 — 지금 가장 잘 통하는 전략", "en": "the currently dominant strategy"}, "body": {"ko": "게임 용어에서 온 말로, **‘지금 이 판에서 가장 효과적인 전략·조합’**을 뜻합니다(‘Most Effective Tactics Available’이라는 풀이로도 알려져 있어요).\n\n발표자는 ‘에이전트 시대 엔지니어의 메타 = 빠르게 내보내면서 품질은 타협하지 않기’라고 정의합니다.", "en": "Gaming slang for the strategy that works best right now. Her claim: the new meta is shipping fast without compromising quality."}}, {"type": "say", "sp": "lauren", "t": 83, "text": {"ko": "거기에 도달하는 방법을 어떤 사람들은 **‘소프트웨어 팩토리’**라고 부르길 좋아하는데요, 저는 단순하게 생각해요. **결국 다 ‘신뢰(trust)’의 문제**라고요.", "en": "To get there, some people like to call this a **software factory**. But I like to keep it simple, and I think of it as **all about trust**."}, "e": 92}, {"type": "shot", "t": 89, "cap": {"ko": "신뢰 곡선 — 가로축은 함께 쓰는 에이전트 수(1 → 1~5 → … → 수천), 세로축은 필요한 신뢰. 에이전트가 많아질수록 더 큰 신뢰가 있어야 ‘frontier’에 닿습니다.", "en": "Trust curve: the more agents you run (1 → thousands), the more trust you need to reach the frontier."}, "img": "images/shot-05.jpg"}, {"type": "say", "sp": "lauren", "t": 92, "text": {"ko": "**맹목적인 신뢰가 아니라**, 에이전트가 일하는 **환경에 투자해서 에이전트가 옳은 일을 할 거라고 믿을 수 있게 만드는 것**이요.", "en": "**Not blind trust**, but **investing in your agent's environment so you can trust that your agents are going to do the right thing.**"}, "e": 100}, {"type": "say", "sp": "lauren", "t": 100, "text": {"ko": "물론 거기까지 가려면 노력이 꽤 들어요. 저는 **PR을 수천 개, 그중 상당수는 자는 동안에 내보낼 수 있는 수준**에 오기까지 **6개월**이 걸렸어요. 하지만 분명히 가능하고, 여러분은 저보다 훨씬 짧게 걸릴 거예요.", "en": "Now, it takes quite a lot of effort to get there. It took me **six months** to get to a point where I could ship **thousands of pull requests, a lot of them in my sleep**. But it's certainly possible, and it will take you much less time than it did me."}, "e": 116}, {"type": "shot", "t": 113, "cap": {"ko": "‘help agents write good code’ — 낮은 신뢰(에이전트가 슬롭을 쓰고 사람이 검증) → 높은 신뢰(에이전트가 좋은 코드를 쓰고 에이전트가 검증). 대부분은 왼쪽 단계에 머물러 있다고 적혀 있습니다.", "en": "Low trust (agent writes slop, human verifies) → high trust (agent writes good code, agent verifies)."}, "img": "images/shot-06.jpg"}, {"type": "say", "sp": "lauren", "t": 116, "text": {"ko": "그럼 **신뢰가 낮은 상태에서 높은 상태로 어떻게 옮겨 가는지**부터 이야기해 볼게요.", "en": "So let's start by talking about **how we move from a low-trust environment to a high-trust one**."}, "e": 123}, {"type": "section", "t": 123, "title": {"ko": "포테토 피라미드 — 에이전트 환경의 어디에 투자할까", "en": "The Poteto pyramid — where to invest in the agent's environment"}, "lead": {"ko": "발표 전체의 뼈대가 되는 **역피라미드 프레임워크**를 소개합니다. 위쪽(코드베이스·정적 분석)일수록 **결정론적이고 싸며 강력**하고, 아래쪽(프롬프트 문장·사람 리뷰)일수록 **판단에 의존하고 비쌉니다.** 이후 발표는 이 층을 위에서부터 하나씩 내려가며 실제 사례를 보여 줍니다.", "en": "Introduces the **inverted pyramid** that structures the talk: the top layers (codebase, static analysis) are **deterministic, cheap and powerful**; the bottom layers (prose, human review) rely on judgment and cost more. The rest of the talk walks down the layers."}}, {"type": "say", "sp": "lauren", "t": 123, "text": {"ko": "이 **역피라미드**가 제가 에이전트 환경의 어디에 시간을 써야 할지 생각하는 방식이에요. 맨 위 두 층은 **결정론적(deterministic)**이에요. 즉 코드 자체를 쓰는 거죠.", "en": "So this **inverse pyramid** is how I think about where to spend time on your agent's environment. The first two layers are **deterministic** — using your code itself."}, "e": 134}, {"type": "shot", "t": 125, "cap": {"ko": "‘how do i trust my agents more? — the poteto pyramid’. 위에서부터 codebase → static analysis → verification → prose → human review, 왼쪽 화살표는 아래로 갈수록 커지는 비용(cost).", "en": "The poteto pyramid: codebase → static analysis → verification → prose → human review; cost grows downward."}, "img": "images/shot-07.jpg"}, {"type": "term", "term": "Deterministic", "kr": {"ko": "결정론적 — 같은 입력이면 항상 같은 결과", "en": "same input, same result, every time"}, "body": {"ko": "**매번 똑같이, 예외 없이 작동하는 장치**를 말합니다. 린트 규칙이나 타입 검사는 규칙을 어기면 100% 잡아냅니다.\n\n반대로 AI에게 ‘이렇게 하지 마’라고 문장으로 부탁하는 것은 **확률적**이라 지켜질 때도, 무시될 때도 있어요. 발표자가 계속 강조하는 핵심이 바로 **“부탁하지 말고, 강제하라”**입니다.", "en": "A mechanism that behaves the same way every time — a lint rule or type check always catches a violation. Asking an AI in prose is probabilistic. Her core message: don't ask, enforce."}}, {"type": "say", "sp": "lauren", "t": 134, "text": {"ko": "예를 들면 **좋은 API 설계, 아키텍처, 리팩터링**이 있고, 또 **린트 규칙, 타입 시스템, 컴파일러**, 그리고 여러 종류의 테스트가 있어요. 이 두 층을 함께 쓰면 **에이전트가 할 수 있는 일을 제한하고, 기본적으로 옳은 일을 하도록 강제**할 수 있어요.", "en": "So things like **good API design, architecture, refactoring**, or using **lint rules, type systems, compilers**, or different kinds of testing. And you can use both of these layers together to **constrain what agents can do and force them to do the right thing by default.**"}, "e": 152}, {"type": "term", "term": "Lint rule / Static analysis", "kr": {"ko": "린트 규칙·정적 분석 — 실행 전에 코드를 검사하는 자동 규칙", "en": "automatic checks on code before it runs"}, "body": {"ko": "**정적 분석**은 프로그램을 실행하지 않고 코드만 읽어서 문제를 찾는 기법이고, **린트(lint)**는 그중 ‘이런 코드 패턴은 금지’ 같은 규칙을 검사하는 도구(예: ESLint)입니다. **타입 시스템·컴파일러**도 같은 층에 속해요.\n\n규칙을 어긴 코드는 아예 통과하지 못하니, **에이전트가 실수해도 기계가 바로 막아 줍니다.** 사람이 리뷰에서 일일이 찾을 필요가 없어지는 거죠.", "en": "Static analysis inspects code without running it; a linter (e.g. ESLint) enforces ‘this pattern is banned’ rules. Type systems and compilers belong here too. Violations simply don't pass — no human needs to catch them."}}, {"type": "say", "sp": "lauren", "t": 152, "text": {"ko": "**검증(verification)**은 런타임 검증과 형식 검증 둘 다, 그 위에 덧대기 좋은 도구예요. 버그를 찾고, 시스템에서 **항상 참이어야 하는 성질과 불변 조건**을 확인하고, **에이전트가 여러분의 목표와 의도를 제대로 이해했는지**도 확인할 수 있게 해 주죠.", "en": "**Verification**, both runtime and formal, are great tools to layer on to find bugs and check **properties and the invariants** in your system that you want to hold true, and also help you check **whether or not the agent understood your goals and your intent.**"}, "e": 168}, {"type": "term", "term": "Invariant", "kr": {"ko": "불변 조건 — 언제나 참이어야 하는 규칙", "en": "a rule that must always hold"}, "body": {"ko": "시스템이 어떤 상태에 있든 **절대 깨지면 안 되는 성질**입니다. 예: ‘잔액은 음수가 될 수 없다’, ‘알림은 한 기기에 두 번 뜨지 않는다’.\n\n검증 도구는 이런 성질이 정말 지켜지는지 자동으로 확인해 줍니다. 뒤에서 나오는 TLA+·Lean이 대표적인 예예요 (10:54).", "en": "A property that must never break in any state (e.g. ‘a notification never shows twice on one device’). Verification tools check these automatically."}}, {"type": "say", "sp": "lauren", "t": 168, "text": {"ko": "그리고 마지막으로 **약간의 산문(prose)**을 덧대요. **규칙(rules), 스킬(skills), AGENTS.md** 같은, **판단이 필요한 것들**이요.", "en": "And then finally, you want to layer on **a little bit of prose** — things like **rules, skills, AGENTS.md**, things that **require judgment**."}, "e": 179}, {"type": "term", "term": "AGENTS.md / Rules / Skills", "kr": {"ko": "에이전트에게 주는 문장형 지침", "en": "prose instructions for agents"}, "body": {"ko": "**AGENTS.md**는 저장소 루트에 두는 마크다운 파일로, 코딩 에이전트에게 ‘이 프로젝트에서는 이렇게 일해라’를 알려 주는 일종의 **에이전트용 README**입니다. **Rules**는 비슷한 지침 모음, **Skills**는 특정 작업 절차를 묶어 재사용하는 지침 패키지예요.\n\n유용하지만 **문장이라서 에이전트가 무시하거나 과하게 해석할 수 있습니다.** 그래서 피라미드 아래쪽, ‘최소한으로만’ 쓰는 층에 놓여 있어요.", "en": "AGENTS.md is a repo-level markdown ‘README for agents’; rules and skills are similar instruction packs. Useful, but prose can be ignored or over-applied — hence near the bottom of the pyramid."}}, {"type": "section", "t": 179, "title": {"ko": "코드베이스는 정원이다 — ‘유기적 아키텍처’", "en": "Your codebase is a garden — ‘organic architecture’"}, "lead": {"ko": "피라미드의 첫 층, **코드베이스**를 다룹니다. 에이전트는 코드베이스를 보고 따라 하기 때문에 **코드 자체가 가장 큰 입력이자 기억**이라는 점, 그리고 그래서 엔지니어의 일이 **‘정원 가꾸기’**처럼 바뀌고 있다는 비유를 제시합니다.", "en": "The first layer: the **codebase**. Agents copy what they see, so code is their biggest input and memory — which turns engineering into something like **gardening**."}}, {"type": "say", "sp": "lauren", "t": 179, "text": {"ko": "그럼 코드베이스부터 시작해 볼게요. 에이전트는 **입력을 바탕으로 출력을 만들어요.** 그러니 입력의 품질이 정말 중요하고, 마침 **코드베이스가 가장 큰 입력 중 하나**예요.", "en": "But let's start with your codebase. Agents generate their outputs based on their inputs. So **the quality of the input really matters**, and it just so happens that **your codebase is one of the largest inputs.**"}, "e": 192}, {"type": "say", "sp": "lauren", "t": 192, "text": {"ko": "그래서 에이전트를 바로잡을 때마다, **규칙 파일이나 AGENTS.md에 한 줄을 더 보태는 대신 그걸 어떻게 결정론적인 검사로 만들 수 있을지** 생각해 보세요. 코드로 되어 있으면 **훨씬 재현 가능하고, 더 믿을 수 있거든요.**", "en": "So whenever you're correcting your agent, **think about how you can make that a deterministic check instead of adding another line to your rules or your AGENTS.md**, because it's far more reproducible when it's in code, and it lets you trust it more."}, "e": 207}, {"type": "shot", "t": 197, "cap": {"ko": "‘code is memory’ — 피라미드 위에 겹쳐진 문구. 코드베이스 자체가 에이전트에게는 가장 강력한 ‘기억’이라는 뜻입니다.", "en": "‘Code is memory’ — the codebase is the agent's strongest memory."}, "img": "images/shot-08.jpg"}, {"type": "say", "sp": "lauren", "t": 207, "text": {"ko": "제가 즐겨 쓰는 비유는 **코드베이스가 일종의 정원**이라는 거예요. 예전엔 코드가 PR 몇 개씩 들어왔죠. **2024년엔 출근해서 동료들이 쓴 PR 세 개를 리뷰**하던 기억이 나요. 그런데 **지금은 그 숫자가 300개쯤** 돼요.", "en": "The analogy I like to use is that **your codebase is kind of like a garden**. Code used to arrive a few pull requests at a time. I remember going into work in **2024 and reviewing the three pull requests** my colleagues wrote. And today, that number is **more like 300**."}, "e": 227}, {"type": "say", "sp": "lauren", "t": 227, "text": {"ko": "이제는 **모든 엔지니어가 수백, 수천 개 에이전트로 이뤄진 팀**이에요. 코드가 너무 빨리 들어와서 **거의 끊김 없는 흐름**처럼 느껴지고, 마치 **살아 있는 유기체**처럼 느껴져요.", "en": "So every engineer is now **a team of hundreds or even thousands of agents**, and code is arriving so rapidly that it almost feels like **a continuous stream** — it almost feels organic, **like a living thing**."}, "e": 243}, {"type": "say", "sp": "lauren", "t": 243, "text": {"ko": "이 비유에서 **코드베이스, 여러분이 거는 제약, 세우는 가드레일**은 **에이전트가 쓰는 새 코드가 그 주위로 자라나는 콘크리트 기초**예요. 이 그림 속 건물처럼요. 그러니 여러 면에서 **소프트웨어 엔지니어의 일은 정원 가꾸기처럼 바뀌고 있어요.**", "en": "And in this analogy, **your codebase, the constraints you impose, the guardrails you put up, are the concrete foundations that the new code your agents write grows around** — just like the building in this picture. So in many ways, **the job of being a software engineer is becoming like gardening.**"}, "e": 264}, {"type": "shot", "t": 245, "cap": {"ko": "‘Organic Architecture’ — 나무와 덩굴이 콘크리트 건물을 감싸며 자라는 그림. 건물(코드베이스의 제약·가드레일)이 뼈대가 되고, 식물(에이전트가 쓴 새 코드)이 그 주위로 자랍니다.", "en": "‘Organic Architecture’: plants (new agent code) grow around a concrete building (your constraints)."}, "img": "images/shot-09.jpg"}, {"type": "say", "sp": "lauren", "t": 264, "text": {"ko": "코드가 에이전트의 가장 큰 입력이라는 건, **우회책, 안티패턴, 폐기된 코드, 기술 부채**가 무엇이든 **다음 에이전트가 그대로 베낄 가능성이 높다**는 뜻이에요. 코드베이스에서 그게 **‘확립된 패턴’처럼 보이니까요.**", "en": "Because code is the biggest input for agents, it means that **any workarounds, anti-patterns, deprecated code, tech debt** is now likely to be **just copied by the next agent**, since it looks like **the established pattern in your codebase.**"}, "e": 279}, {"type": "shot", "t": 269, "cap": {"ko": "‘each copy makes the next copy more likely’ — 우회책 하나(one workaround)가 뿌리를 뻗어 잡초처럼 번지며 ‘패턴(the pattern)’이 되는 그림.", "en": "‘Each copy makes the next copy more likely’ — one workaround spreads like weeds into ‘the pattern’."}, "img": "images/shot-10.jpg"}, {"type": "term", "term": "Anti-pattern / Tech debt", "kr": {"ko": "안티패턴·기술 부채", "en": "bad patterns and deferred cleanup"}, "body": {"ko": "**안티패턴**은 ‘흔히 쓰이지만 나쁜 결과를 낳는 코드 습관’, **기술 부채**는 ‘당장 편하려고 미뤄 둔 정리 작업’이 쌓인 것입니다.\n\n사람은 ‘이건 예외적인 땜질이야’라고 알지만, **에이전트는 코드베이스에 있는 것을 ‘이 프로젝트의 정답’으로 받아들여 복제**합니다. 그래서 하나의 나쁜 사례가 잡초처럼 번져요.", "en": "Anti-patterns are common-but-harmful habits; tech debt is deferred cleanup. Humans know a hack is a hack — agents treat whatever exists as the house style and copy it."}}, {"type": "say", "sp": "lauren", "t": 279, "text": {"ko": "**정원에 잡초나 해충이 자라다가, 정신 차려 보면 사방에 퍼져 있는 것**과 같아요. 그래서 **코드베이스를 최대한 깨끗하게** 유지해서 **에이전트가 늘 좋은 것만 베끼게** 해야 해요.", "en": "It's like **you have some weeds or pests growing in your garden, and then they spread everywhere before you know it.** So you want to **make your codebase as pristine as possible**, so that **agents are always copying the good stuff.**"}, "e": 298}, {"type": "shot", "t": 293, "cap": {"ko": "‘yes, you should read the code sometimes’ — 에이전트에게 ‘이 코드 설명해 줘’라고 하면서 함께 코드를 읽는 그림. 사람이 가끔은 직접 코드를 읽어야 정원을 가꿀 수 있다는 메시지입니다.", "en": "‘Yes, you should read the code sometimes.’"}, "img": "images/shot-11.jpg"}, {"type": "section", "t": 298, "title": {"ko": "실전 사례 ① Dune — 뉘앙스는 금지하고, 구조로 맥락을 준다", "en": "Real example ① Dune — ban nuance, encode context in structure"}, "lead": {"ko": "‘좋은 코드베이스’가 구체적으로 무엇인지 보여 주는 구간입니다. Grok Bot 팀이 만든 프레임워크 **Dune**을 예로, **잘 쓰기 어려운 API는 아예 금지**하고 **디렉터리 구조와 import 금지 규칙으로 맥락을 강제**하는 두 가지 패턴을 소개합니다.", "en": "Shows what a good codebase looks like in practice: in **Dune**, Grok Bot's framework, APIs that need nuance are **banned outright**, and **directory structure plus import bans** encode context."}}, {"type": "say", "sp": "lauren", "t": 298, "text": {"ko": "좋아요, 실제 사례를 볼게요. **Dune**은 이 **유기적 아키텍처** 아이디어를 구현하려고 Grok Bot용으로 만든 클라이언트 프레임워크예요. 기술적으로 아주 흥미로운 건 아니에요. **Electron 앱을 위한 Next.js** 같은 거라고 생각하시면 돼요.", "en": "All right, let's look at some real examples. **Dune** is a client framework that we created for Grok Bot to implement this idea of **organic architecture**. It's not really that interesting technically — you can think of Dune as kind of like **Next.js for Electron apps**."}, "e": 315}, {"type": "shot", "t": 305, "cap": {"ko": "‘dune: a framework for agents’ — app framework(내비게이션·렌더링·IPC) + 세 가지 제약: one folder per feature, strict import bans, no comments in code.", "en": "‘Dune: a framework for agents’ — app framework + one folder per feature, strict import bans, no comments."}, "img": "images/shot-12.jpg"}, {"type": "term", "term": "Electron / Next.js", "kr": {"ko": "일렉트론·넥스트JS", "en": "desktop-app runtime / web framework"}, "body": {"ko": "**Electron**은 웹 기술(HTML·JavaScript)로 Windows·Mac 데스크톱 앱을 만드는 런타임입니다. VS Code, Slack, Cursor 등이 Electron 앱이에요. **Next.js**는 React 기반 웹앱의 구조와 관례를 정해 주는 인기 프레임워크고요.\n\n‘Electron 앱을 위한 Next.js’라는 말은 Dune이 **데스크톱 앱 개발의 정해진 틀과 관례**를 제공한다는 뜻입니다.", "en": "Electron builds desktop apps with web tech (VS Code, Slack and Cursor use it). Next.js is a popular React framework with strong conventions. So Dune = conventions and structure for desktop apps."}}, {"type": "say", "sp": "lauren", "t": 315, "text": {"ko": "Dune에서 흥미로운 부분은 **제약과 린트 규칙이 아주 많다**는 거예요. 저희가 데스크톱 앱을 만들면서 배운 **교훈들을 거기에 코드로 새겨 넣었어요.** 그런 교훈 하나가 **‘잘 쓰려면 뉘앙스가 필요한 것은 슬롭으로 이어지기 쉽다’**는 거예요.", "en": "But the interesting part of Dune is that it has **a lot of constraints and lint rules** where we've **encoded a lot of the lessons we've learned building desktop applications.** And one such lesson is that **anything that requires nuance to use well often leads to slop.**"}, "e": 333}, {"type": "shot", "t": 329, "cap": {"ko": "‘nuance tends to lead to slop — just design better APIs’.", "en": "‘Nuance tends to lead to slop — just design better APIs.’"}, "img": "images/shot-13.jpg"}, {"type": "say", "sp": "lauren", "t": 333, "text": {"ko": "대표적인 예가 React의 **useEffect**예요. 쓸 데가 있긴 한데 **자주 잘못 쓰여요.** **useEffect 쓰려면 박사 학위가 필요하다**는 농담도 있죠. 다시 말해 **잘 쓰려면 뉘앙스가 정말 많이 필요하고, 에이전트는 그걸 잘 못 써요.**", "en": "Your classic example is **useEffect in React**, right? It has its use cases, but it's often misused. Some people joke that **you need a PhD to use useEffect.** In other words, it really requires a lot of nuance to use well — and **agents are not good at using it.**"}, "e": 352}, {"type": "term", "term": "useEffect (React)", "kr": {"ko": "React의 부수 효과 훅", "en": "React's side-effect hook"}, "body": {"ko": "React 컴포넌트에서 **화면 그리기 외의 작업(데이터 불러오기, 타이머, 구독 등)을 언제 실행할지** 지정하는 기능입니다. 언제 다시 실행되는지, 언제 정리되는지 규칙이 미묘해서 **무한 반복·중복 실행 같은 버그가 잘 생깁니다.**\n\n발표자의 해법은 ‘더 잘 쓰라고 가르치기’가 아니라 **‘제품 코드에서는 아예 금지하고, 꼭 필요한 곳은 프레임워크 API 안에만 둔다’**입니다.", "en": "Runs side effects (fetching, timers, subscriptions) in React components; its re-run and cleanup rules are subtle, causing loops and duplicates. Her fix: ban it in product code, keep it inside framework APIs."}}, {"type": "say", "sp": "lauren", "t": 352, "text": {"ko": "그래서 저희 해법은 **제품 코드에서는 그냥 금지**하는 거였어요. **Dune API 내부의 일부 지점에서만** 허용돼요. 그 결과 이 문제는 **범주째로 제거됐고, 코드 리뷰에서 다시는 잡을 필요가 없어졌어요.**", "en": "So our solution has been to **just ban it in product code**; it's really only allowed in some places inside of Dune APIs. And effectively, this problem has now been **categorically eliminated, and we never need to catch it during code review again.**"}, "e": 370}, {"type": "say", "sp": "lauren", "t": 370, "text": {"ko": "또 하나 흥미로운 패턴은 **디렉터리 구조를 통한 맥락 전달**이에요. **Cursor**(Electron 앱이에요)에서 본 안티패턴 하나가, 에이전트가 **메인 스레드 코드를 렌더러 스레드로 import**해서 **긴 작업(long task)과 버벅임(jank)**을 일으키는 거였어요.", "en": "Another interesting pattern we use is **context through directory structure.** One anti-pattern we saw with **Cursor**, which is an Electron app, is that agents would often **import main-thread code into the renderer thread**, which would cause **long tasks and jank.**"}, "e": 388}, {"type": "term", "term": "Main / Renderer process", "kr": {"ko": "메인·렌더러 프로세스", "en": "Electron's two worlds"}, "body": {"ko": "Electron 앱은 **운영체제 기능을 다루는 메인(main)**과 **화면을 그리는 렌더러(renderer)**로 나뉩니다. 렌더러에 무거운 메인 쪽 코드가 섞이면 화면 처리가 막혀 **긴 작업(long task)**이 생기고, 사용자는 **버벅임(jank)**을 느낍니다.\n\nGrok Bot은 최상위 폴더를 `electron-renderer/`와 `electron-main/`으로 나누고, **둘 사이 import를 의존성 그래프 분석기와 린트로 금지**했어요. 폴더 구조 자체가 에이전트에게 ‘여기서 저걸 쓰면 안 돼’라는 맥락이 됩니다.", "en": "Electron splits into a main process (OS work) and a renderer (UI). Heavy main code in the renderer blocks the UI — long tasks and jank. Grok Bot splits top-level folders and bans imports across them."}}, {"type": "shot", "t": 377, "cap": {"ko": "‘directory structure is a form of context’ — Dune의 electron-renderer/(features, client, primitives)와 electron-main/(startup, notifications, update) 사이 직접 import는 ✕, 공유 타입만 shared/를 통해 허용. 아래는 개인 프로젝트 tibo.dog의 예.", "en": "‘Directory structure is a form of context’ — renderer ✕ main, only shared types cross via shared/."}, "img": "images/shot-14.jpg"}, {"type": "say", "sp": "lauren", "t": 388, "text": {"ko": "그래서 Grok Bot과 Dune 앱들에서는 이걸 **아주 아주 관례적으로** 만들었어요. 최상위 디렉터리 두 개를 말 그대로 **`electron-renderer`와 `electron-main`**이라고 이름 짓고, 그 둘 사이의 import는 **의존성 그래프 분석기와 린트 규칙으로 금지**돼요.", "en": "So in Grok Bot and in Dune apps, we've made this very, very conventional. We have two top-level directories literally called **electron-renderer and electron-main**, and **imports between them are banned by our dependency-graph analyzer and some lint rules.**"}, "e": 406}, {"type": "say", "sp": "lauren", "t": 406, "text": {"ko": "다시 말하지만 이건 **설정하기 간단한 린트 규칙**이에요. 그래도 **코드 리뷰 때 검토하고 신경 써야 할 일이 하나 줄어든다**는 뜻이죠.", "en": "And again, these are **simple lint rules to set up**, but it means **one less thing we need to review and think about during code review.**"}, "e": 416}, {"type": "section", "t": 416, "title": {"ko": "실전 사례 ② 마크다운과 주석이라는 함정", "en": "Real example ② The trap of markdown and comments"}, "lead": {"ko": "에이전트가 남기는 **문서·주석·규칙 파일**이 오히려 슬롭을 정당화하는 통로가 된다는 의외의 교훈입니다. Cursor에서 타이머 ‘땜질’이 주석과 함께 183개로 번진 사례, 그리고 Grok Bot이 **주석을 99% 금지**하고 **‘교정할 때마다 결정론적 검사로 바꾼다’**는 원칙에 이른 과정을 보여 줍니다.", "en": "A surprising lesson: agent-written **docs, comments and rule files** become a way to justify slop. The Cursor timer hack spread to 183 copies with justifying comments; Grok Bot now **bans 99% of comments** and turns **every correction into a deterministic check.**"}}, {"type": "say", "sp": "lauren", "t": 416, "text": {"ko": "그리고 제가 본 또 하나 의외의 현상은 **에이전트가 마크다운을 쓰는 방식**이에요. 문서, 코드 주석, 규칙이나 스킬 같은 것들이요. 에이전트는 이걸 **옳은 일을 하지 않은 것에 대한 변명을 적어 두는 곳**으로 써요.", "en": "And then one more surprising thing I've seen is **agents using Markdown** — documentation, code comments, rules or skills — and they use this as **a place to write down their justifications for not doing the right thing.**"}, "e": 432}, {"type": "shot", "t": 425, "cap": {"ko": "‘stop agents from writing unsolicited markdown’ — ‘I made it up(제가 지어냈어요)’라는 에이전트와 ‘Source?(출처는?)’라고 묻는 발표자 캐릭터.", "en": "‘Stop agents from writing unsolicited markdown’ — ‘I made it up.’ ‘Source?’"}, "img": "images/shot-15.jpg"}, {"type": "say", "sp": "lauren", "t": 432, "text": {"ko": "아니면 이런 거 보신 적 있을지 모르겠는데, **여러분이 한 작은 지적에 과하게 반응**해서 그걸 **두 번 다시 깨면 안 되는 절대 규칙처럼** 취급하기도 해요.", "en": "Or — I don't know if you've ever seen this — they'll **over-rotate on some small correction you made**, and treat it like **a hard rule that can never be broken ever again.**"}, "e": 442}, {"type": "say", "sp": "lauren", "t": 442, "text": {"ko": "Cursor에서 나온 예를 하나 더 볼게요. 에이전트들이 **명령형 타이머**를 정말 좋아했어요. `setTimeout`, `requestAnimationFrame`, `requestIdleCallback` 같은 거요.", "en": "Here's another example from Cursor. Agents really loved using **imperative timers** — things like **setTimeout, requestAnimationFrame, requestIdleCallback.**"}, "e": 452}, {"type": "shot", "t": 449, "cap": {"ko": "‘quick fixes considered harmful’ — 9월 9일 깜빡임을 고친 한 줄짜리 setTimeout(에이전트: ‘it would be a larger change’) → 10월 3일 공유 모듈로 복사 → 10월 17일 타이머 183개.", "en": "‘Quick fixes considered harmful’: one setTimeout on Sep 9 → copied into a shared module → 183 timers by Oct 17."}, "img": "images/shot-16.jpg"}, {"type": "say", "sp": "lauren", "t": 452, "text": {"ko": "에이전트들은 이걸 **임시방편(quick fix)**으로 썼는데, 사실은 **VS Code의 명령형 스타일과 React의 선언형 스타일 사이의 아키텍처 충돌을 덮어 가리고** 있었던 거예요. 결국 저희의 **아키텍처 선택이 클라이언트 성능과 에이전트 성능을 둘 다 훨씬 나쁘게** 만든 셈이죠.", "en": "And they were using these as **quick fixes** because they were really **patching over an architecture clash between VS Code's imperative style and React's declarative style.** So **our choice of architecture actually made both the client and the agent performance much worse.**"}, "e": 471}, {"type": "term", "term": "Imperative vs Declarative", "kr": {"ko": "명령형 vs 선언형", "en": "how vs what"}, "body": {"ko": "**명령형**은 ‘이 순서대로 이렇게 해라’를 하나하나 지시하는 방식(VS Code 내부 코드 스타일), **선언형**은 ‘화면은 이런 상태여야 한다’만 적고 실행은 프레임워크에 맡기는 방식(React)입니다.\n\n둘을 섞으면 타이밍이 어긋나는 문제가 생기는데, 에이전트는 근본 원인을 고치는 대신 **‘조금 있다가 실행해’라는 타이머로 땜질**했습니다. 증상은 사라지지만 문제는 그대로 남고 퍼지죠.", "en": "Imperative = step-by-step instructions (VS Code's internals); declarative = describe the desired state and let the framework do it (React). Mixing them causes timing issues — agents patched them with ‘run this later’ timers."}}, {"type": "say", "sp": "lauren", "t": 471, "text": {"ko": "JavaScript 성능 작업을 해 보셨다면 아실 텐데, **타이머가 엄청나게 생성되고 파괴되면 메이저 가비지 컬렉션이 많이 일어나고, 그게 렉과 버벅임**을 일으켜요.", "en": "If you've ever done performance work in JavaScript, you'll know that when you have **tons of timers being rapidly created and destroyed, it causes a lot of major garbage collection, which causes a lot of lag and jank.**"}, "e": 483}, {"type": "term", "term": "Garbage collection (GC)", "kr": {"ko": "가비지 컬렉션 — 안 쓰는 메모리 자동 청소", "en": "automatic memory cleanup"}, "body": {"ko": "JavaScript는 더 이상 쓰지 않는 메모리를 엔진이 자동으로 청소합니다. 이 청소 중 큰 것(major GC)이 돌면 **잠깐 앱이 멈춘 것처럼** 느껴질 수 있어요.\n\n짧게 쓰고 버리는 타이머 객체가 수없이 생기면 청소가 자주 일어나 **화면이 뚝뚝 끊기는 현상**으로 이어집니다.", "en": "The JS engine frees unused memory automatically; big (major) collections can briefly freeze the app. Tons of short-lived timers trigger them often — hence jank."}}, {"type": "say", "sp": "lauren", "t": 483, "text": {"ko": "그런데 **최악은 에이전트들이 코드 주석을 잔뜩 써 놨다**는 거예요. 여기 빨간색으로 보이는 것처럼, **이 임시방편이 왜 정당한지 설명하는** 주석을요. 그러다 정신 차려 보니 **타이머가 사방에 퍼져 있었고, 앱 성능은 정말 나빠졌죠.**", "en": "But the worst part is that **agents wrote a lot of code comments** — like you can see in red here — **explaining why this quick fix was justified.** And before you know it, **we had timers spreading everywhere and the performance of the app really suffered.**"}, "e": 500}, {"type": "say", "sp": "lauren", "t": 500, "text": {"ko": "그래서 Grok Bot에서는 교훈을 얻고 **주석의 99%를 그냥 금지**하기로 했어요. 주석은 **쉽게 낡거든요.** 사람들은 어차피 **주석 슬롭을 읽지도 않고요.** 게다가 주석은 에이전트에게 **‘어려우니까 옳은 일을 안 해도 된다’고 정당화할 탈출구**를 줘요.", "en": "Now in Grok Bot, we learned our lesson there, and we decided to **just ban 99% of comments**, because **they go stale easily.** Humans just really don't bother reading the comment slop anyway. And again, it gives an agent **an escape hatch to justify not doing the right thing because it's hard.**"}, "e": 521}, {"type": "shot", "t": 509, "cap": {"ko": "‘comments are liabilities’ — 코드 주석 수가 7월 31일 65,824개에서 오늘 1,227개로. 하단에 pstack의 /no-comments 스킬 안내(github.com/cursor/plugins).", "en": "‘Comments are liabilities’: 65,824 comments (Jul 31) → 1,227 today. See /no-comments in pstack."}, "img": "images/shot-17.jpg"}, {"type": "say", "sp": "lauren", "t": 521, "text": {"ko": "그리고 주석의 가장 나쁜 점은 **강제할 수 없다**는 거예요. ‘다음 에이전트한테 이건 하지 말라고 일러 둬야지’ 하는 선의처럼 보여도, **결국 믿을 수 있는 무언가가 되지 못해요.**", "en": "And the worst part about comments, though, is that **they're not enforceable.** So what seems well-intentioned — like, I'm going to tell the next agent not to do something — **never ends up being anything you can actually trust.**"}, "e": 534}, {"type": "say", "sp": "lauren", "t": 534, "text": {"ko": "그래서 Grok Bot과 Dune에는 이제 **에이전트에게 우회하지 말고 근본 원인, 진짜 문제를 고치라고 알려 주는, 친절하고 도움이 되는 에러 메시지를 가진 린트 규칙**이 있어요.", "en": "So in Grok Bot and in Dune, we now have **lint rules that give good, very helpful error messages telling the agent to fix the root cause — the real problem — rather than just patch around it.**"}, "e": 550}, {"type": "say", "sp": "lauren", "t": 550, "text": {"ko": "저희의 일반 원칙은 이거예요. **에이전트를 바로잡을 때마다 그게 결정론적 검사 하나가 되거나**, 아니면 **더 나은 API 설계와 아키텍처로 그 문제를 코드에서 범주째 없앨 방법**을 고민해요.", "en": "So our general principle is that **every time we correct our agents, it turns into one of these deterministic checks**, or we think about **how to categorically eliminate that problem in the code through better API design, through better architecture.**"}, "e": 563}, {"type": "shot", "t": 557, "cap": {"ko": "‘whenever you correct your agent — lint against it or categorically eliminate the problem’. 7월 9개에서 11월 169개까지 계단식으로 늘어난 린트 규칙 수.", "en": "Custom lint rules climb from 9 (Jul) to 169 (Nov): lint against it, or eliminate it."}, "img": "images/shot-18.jpg"}, {"type": "say", "sp": "lauren", "t": 563, "text": {"ko": "이걸 충분히 반복하면 **코드 리뷰에서 살펴볼 게 점점 줄어드는** 걸 알게 돼요. 그리고 어느 순간 **더 이상 리뷰할 게 없다**는 걸 깨닫게 되죠. 그러면 **에이전트가 자기 PR 대부분을 스스로 머지하게** 둘 수 있어요.", "en": "And if you do this enough times, you'll find that **you just have fewer things to look out for in code review.** At some point you'll realize **there's nothing left to review**, and **you can just let agents merge most of their own pull requests.**"}, "e": 580}, {"type": "section", "t": 580, "title": {"ko": "검증이 가장 중요한 단계 — 런타임·형식·속성 기반 검증", "en": "Verification is the most important step — runtime, formal, property-based"}, "lead": {"ko": "피라미드의 세 번째 층, **검증**입니다. 이제 코드 리뷰는 코드를 한 줄씩 읽는 일이 아니라 **영상·스크린샷·다이어그램 같은 ‘검증 산출물’을 보는 일**로 바뀌었다고 말합니다. 에이전트가 앱을 직접 돌려 보는 **런타임 검증**, TLA+·Lean을 쓰는 **형식 검증**, UI **속성 기반 테스트**까지 구체적인 도구를 소개합니다.", "en": "The third layer: **verification.** Code review has shrunk into looking at **verification artifacts** (videos, screenshots, diagrams). She covers **runtime verification**, **formal verification** with TLA+ and Lean, and **property-based UI testing.**"}}, {"type": "say", "sp": "lauren", "t": 580, "text": {"ko": "좋아요, 다음으로 넘어가서, **검증(verification)**도 에이전트를 더 **자율적으로** 만들고 그들의 작업에 대한 **확신과 신뢰를 높이는** 데 정말 큰 역할을 해요.", "en": "All right, moving on — **verification** is also a really big part of how we make our agents **more autonomous**, and also increase our **confidence and trust** in their work."}, "e": 590}, {"type": "shot", "t": 581, "cap": {"ko": "‘verification is the most important step’ — 피라미드 위에 크게 겹쳐진 문구.", "en": "‘Verification is the most important step.’"}, "img": "images/shot-19.jpg"}, {"type": "say", "sp": "lauren", "t": 590, "text": {"ko": "저희 코드 리뷰 과정은 이제 **검증 산출물을 보는 일로 확 줄어들었어요.** **영상, 스크린샷, 다이어그램, 형식 검증** 같은 것들이요.", "en": "And our code review process has now really **shrunk into looking at verification artifacts instead** — things like **videos, screenshots, diagrams, formal verification.**"}, "e": 602}, {"type": "say", "sp": "lauren", "t": 602, "text": {"ko": "가장 기본적인 예는 **런타임 검증**인데요, 거창하게 들리지만 그냥 **에이전트에게 코드를 직접 실행해 보고**, 사람 개발자도 쓰는 디버깅 도구, 예컨대 **Chrome DevTools Protocol** 같은 걸 쓸 수 있게 해 주는 거예요.", "en": "The most basic example of this is **runtime verification**, which is just a fancy way of saying **giving your agent a way to run the code for itself** and use the debugging tools human developers use as well, like the **Chrome DevTools Protocol.**"}, "e": 616}, {"type": "term", "term": "Runtime verification", "kr": {"ko": "런타임 검증 — 실제로 실행해서 확인하기", "en": "checking by actually running it"}, "body": {"ko": "코드를 **실제로 실행해서 기대대로 동작하는지 확인**하는 방식입니다. 에이전트가 앱을 띄우고, 클릭하고, 화면을 캡처해 ‘제가 고친 버튼이 정말 동작합니다’라는 **증거(영상·스크린샷)**를 남기게 하는 거죠.\n\n**Chrome DevTools Protocol(CDP)**은 크롬(그리고 Electron) 브라우저를 프로그램으로 원격 조종·검사하는 표준 인터페이스라, 에이전트가 사람 개발자처럼 디버깅할 수 있게 해 줍니다.", "en": "Run the code and confirm it behaves as expected — the agent launches the app, clicks around and records evidence. The Chrome DevTools Protocol lets programs drive and inspect Chrome/Electron like a developer would."}}, {"type": "say", "sp": "lauren", "t": 616, "text": {"ko": "저희 런타임 검증 스킬에는 **‘피처 맵(feature map)’**이라는 게 있어요. 기본적으로 **사용자 관점에서 본, 앱에 있는 모든 기능의 사이트맵** 같은 거예요. 이게 있으면 여러분이 ‘왼쪽 사이드바에 있는 그거’라고 해도 **에이전트가 추측할 필요가 없어요. 공유된 어휘**가 생기는 거죠.", "en": "In our runtime verification skills, we have this thing we call a **feature map.** That's basically **a site map of all the features available in your application from the user's point of view.** So with this, agents don't need to guess when you say ‘the thingy in the left sidebar’ — **it gives you shared vocabulary.**"}, "e": 637}, {"type": "say", "sp": "lauren", "t": 637, "text": {"ko": "그리고 이 스킬 안에서 **커스텀 CLI**도 활용해요. 그러면 에이전트가 **매번 같은 CLI와 드라이버를 재사용**할 수 있어서, **토큰 사용량이 줄고 그 자체를 테스트할 수도** 있어요.", "en": "And we also make use of **custom CLIs inside these skills**, so that agents can **reuse the CLI and the driver every time**, which **cuts down on token usage and is also testable.**"}, "e": 650}, {"type": "term", "term": "Token", "kr": {"ko": "토큰 — AI가 읽고 쓰는 글자 단위이자 비용 단위", "en": "the unit AI models read, write and bill by"}, "body": {"ko": "언어 모델은 글을 **토큰**이라는 조각(대략 단어의 일부) 단위로 처리하고, **사용한 토큰 수만큼 비용과 시간**이 듭니다.\n\n에이전트가 매번 앱 조작 방법을 처음부터 궁리하면 토큰이 많이 들지만, 잘 만든 CLI를 호출하게 하면 **짧은 명령 한 줄로 끝나** 비용이 줄어들고 결과도 일정해집니다.", "en": "Models process text in tokens and you pay per token. A reusable CLI turns a long improvised procedure into a one-line command — cheaper and more consistent."}}, {"type": "shot", "t": 641, "cap": {"ko": "‘runtime verification’ — feature map(어떤 기능이 있고 → 사용자가 어떻게 도달하고 → 무엇이 동작을 증명하는가) + CLI(`app aria-click`, `app snapshot`, `app screenshot`로 실제 앱 조종) = ‘agent checks its own work’.", "en": "Runtime verification: feature map + a CLI that drives the real app = the agent checks its own work."}, "img": "images/shot-20.jpg"}, {"type": "say", "sp": "lauren", "t": 650, "text": {"ko": "그리고 최근에는 **형식 검증(formal verification)**도 보기 시작했어요. 지금은 **TLA+**로 여러 기기·플랫폼에 걸친 **알림 같은 주요 사용자 흐름을 모델 체킹**하고, 특정 알고리즘을 증명하는 데 **Lean**도 써요.", "en": "And then recently we've also started looking at **formal verification.** We now use **TLA+** to do some **model checking of major user flows, such as notifications across multiple devices and platforms.** We use **Lean** as well for proving certain algorithms."}, "e": 666}, {"type": "shot", "t": 653, "cap": {"ko": "‘formal verification’ — TLA+(상태 기계를 모델링해 규칙이 지켜지는지 확인)와 Lean(코드에 대한 증명을 작성해 모든 논리 단계를 검사). 하단: pstack의 /create-formal-verification-skill.", "en": "Formal verification: TLA+ models state machines; Lean writes proofs about code."}, "img": "images/shot-21.jpg"}, {"type": "term", "term": "Formal verification (TLA+ · Lean)", "kr": {"ko": "형식 검증 — 수학적으로 ‘항상 맞음’을 증명", "en": "mathematically proving correctness"}, "body": {"ko": "테스트는 ‘시험해 본 경우’만 확인하지만, **형식 검증은 가능한 모든 경우에 대해 성질이 지켜지는지 수학적으로 확인**합니다.\n\n**TLA+**는 시스템을 상태 기계로 모델링하고 **모든 상태 조합을 자동 탐색(모델 체킹)**해 규칙 위반을 찾는 언어입니다(예: 여러 기기에 알림이 중복으로 뜨는 경우). **Lean**은 증명을 코드처럼 작성하면 **컴퓨터가 모든 논리 단계를 검사**해 주는 증명 보조기예요.\n\n예전엔 너무 어렵고 비싸서 일부 전문가만 썼지만, **에이전트가 작성 비용을 크게 낮춰 주면서** 실무에 들어오고 있다는 게 발표의 요지입니다.", "en": "Tests check the cases you tried; formal verification checks all of them. TLA+ models a system as a state machine and explores every state; Lean is a proof assistant that machine-checks every step. Agents make these affordable."}}, {"type": "say", "sp": "lauren", "t": 666, "text": {"ko": "예를 들어 저희가 직접 만든 **커스텀 가상화 라이브러리**가 있는데, 거기서 Lean으로 **깜빡임이나 떨림 같은 문제가 없는지** 확인해요.", "en": "For example, we wrote our own **custom virtualization library**, and we use Lean there to check that **we don't have flickering or jittering problems.**"}, "e": 676}, {"type": "term", "term": "Virtualization (list)", "kr": {"ko": "가상화 리스트 — 보이는 부분만 그리기", "en": "rendering only what's visible"}, "body": {"ko": "여기서 ‘가상화’는 서버 가상화가 아니라 **긴 목록(채팅 메시지 수천 개 등)에서 화면에 보이는 항목만 실제로 그리는 UI 기법**입니다. 스크롤 위치에 따라 항목을 바꿔 끼우기 때문에 계산이 조금만 어긋나도 **깜빡임·떨림**이 생기기 쉬워요. 그래서 수학적 증명이 유용합니다.", "en": "Not server virtualization — a UI technique that renders only visible rows of a long list. Small miscalculations cause flicker and jitter, so proofs help."}}, {"type": "say", "sp": "lauren", "t": 676, "text": {"ko": "이 접근은 전체적으로 아직 실험 중이에요. 하지만 **아주 유망해 보여요.** 형식 검증으로 **이미 버그를 꽤 찾았거든요.** 그래도 **만능 해결책은 절대 아니고**, 에이전트 환경의 **또 하나의 도구, 또 하나의 층**으로 다루고 있어요.", "en": "We're still experimenting with this approach overall. It seems **very promising** — we've **already found quite a few bugs with formal verification.** But it's certainly **not a silver bullet**, and we're treating it as **another tool, another layer** in our agents' environment."}, "e": 695}, {"type": "say", "sp": "lauren", "t": 695, "text": {"ko": "그리고 이건 아주 빠른 영상인데요, 저희가 막 보기 시작한 또 다른 건 **UI를 위한 속성 기반 테스트**예요. **Bombadil**이라는 라이브러리를 쓰는데, 이것도 벌써 **UI 버그를 몇 개 잡아 줬어요.**", "en": "And then — this is a very fast video — another thing we just started looking at is **property-based testing for UIs** as well. We use this library called **Bombadil**, and this has also **caught a few UI bugs for us already.**"}, "e": 712}, {"type": "shot", "t": 701, "cap": {"ko": "‘ui property based testing’ — Bombadil(github.com/antithesishq/bombadil)이 채팅 UI에 무작위 입력을 빠르게 쏟아 넣는 화면.", "en": "UI property-based testing with Bombadil hammering the chat UI with random input."}, "img": "images/shot-22.jpg"}, {"type": "term", "term": "Property-based testing", "kr": {"ko": "속성 기반 테스트 — 규칙만 정하고 입력은 기계가 무작위로", "en": "state the rule, let the machine generate inputs"}, "body": {"ko": "일반 테스트는 ‘이 입력이면 이 결과’를 사람이 하나씩 적지만, 속성 기반 테스트는 **‘어떤 입력이든 이 성질은 지켜져야 한다’**만 정하고 **입력은 도구가 무작위로 대량 생성**합니다. 사람이 미처 생각 못 한 엣지 케이스를 찾아 주죠.\n\n**Bombadil**은 Antithesis가 공개한 UI용 도구로, 화면을 무작위로 조작하며 규칙 위반을 찾습니다.", "en": "Instead of hand-written examples, you state a property that must hold for any input and the tool generates many random inputs. Bombadil (from Antithesis) does this for UIs."}}, {"type": "section", "t": 712, "title": {"ko": "검증의 황금기 — 토큰의 70%가 검증으로 간다", "en": "The golden age of verification — 70% of tokens go to verifying"}, "lead": {"ko": "검증의 중요성을 다른 엔지니어의 경험으로 뒷받침하는 구간입니다. 6개월 전 ‘에이전트를 못 믿겠다’던 사람이 지금은 **토큰의 70%를 검증에 쓴다**는 사례를 들고, 예전엔 비싸서 못 하던 **좋은 테스트 기법들이 에이전트 덕분에 경제성을 얻었다**는 결론으로 이어집니다.", "en": "Backs up verification with another engineer's story: six months ago she couldn't trust her agents; now **70% of her tokens go to verification.** Agents make long-known but expensive testing techniques economical."}}, {"type": "say", "sp": "lauren", "t": 712, "text": {"ko": "좋아요, 시야를 넓혀 보면요. 제가 **Cindy**의 트윗을 봤는데, **6개월 전** 그녀는 **머지된 미묘한 버그들 때문에 에이전트를 믿을 수 없다**고 얘기하고 있었어요.", "en": "Okay, so zooming out: I saw this tweet from **Cindy**, and **six months ago** she was talking about **not being able to trust her agents because of subtle bugs that were getting merged.**"}, "e": 725}, {"type": "shot", "t": 713, "cap": {"ko": "Cindy Sridharan(@copyconstruct)의 5월 15일 트윗 — ‘이번 주에만 AI가 만든 PR 여러 개가 미묘한 버그를 품은 채 머지돼서 고치는 데 며칠이 더 걸렸다. 고치는 데 든 노력을 생각하면 속도가 오른 게 아니다.’", "en": "Cindy Sridharan, May 15: AI PRs with subtle bugs got merged and took days to fix."}, "img": "images/shot-23.jpg"}, {"type": "say", "sp": "lauren", "t": 725, "text": {"ko": "그녀가 에이전트를 믿지 못했던 이유, **빠져 있던 건 바로 검증 과정**이었어요. 그리고 6개월이 지난 지금, 그녀는 **매일 쓰는 토큰의 70%가 검증에 들어간다**고 해요. 제가 보는 것과도 맞아요. **제 토큰 사용량도 대부분 검증에** 쓰이거든요.", "en": "And really, what was missing for her in being able to trust her agents was **the verification process.** And now, six months later, she says that **70% of her daily tokens go into verification.** And I'd say that tracks with what I see as well — **most of my token usage goes to verification.**"}, "e": 742}, {"type": "shot", "t": 737, "cap": {"ko": "Cindy의 11월 5일 트윗 — ‘6개월 전 내 설정에 빠져 있던 건 검증 과정이었다. 지금은 하루 토큰의 70%를 패치 검증에, 20~30%만 생성에 쓴다.’", "en": "Cindy, Nov 5: ‘70% of my daily token spend goes into verifying patches, only ~20–30% into creating them.’"}, "img": "images/shot-24.jpg"}, {"type": "say", "sp": "lauren", "t": 742, "text": {"ko": "그녀의 과정을 자세히 보면, **여기 있는 것 중 새롭거나 참신한 기법은 하나도 없어요.** 그냥 **좋은 소프트웨어 엔지니어링 도구들**이에요. 다만 예전에는 **이해하고, 작성하고, 유지하기가 어려워서 비용이 너무 커서** 못 쓰던 것들이죠.", "en": "And if you really look closely at her process, **none of these things are new or novel techniques we've never had before.** These are just **good software engineering tools**, but ones that might have been **prohibitively expensive to use before**, as they were hard to understand, write or maintain."}, "e": 760}, {"type": "shot", "t": 749, "cap": {"ko": "Cindy의 기법 지도 — PRE-PRODUCTION(단위·기능·퍼즈·속성 기반·형식 검증·뮤테이션·계약 테스트 등)부터 TESTING IN PRODUCTION의 DEPLOY·RELEASE·POST RELEASE(카나리·트래픽 셰이핑·피처 플래그·카오스 테스트·모니터링 등)까지.", "en": "Cindy's map of techniques from pre-production tests to testing in production."}, "img": "images/shot-25.jpg"}, {"type": "say", "sp": "lauren", "t": 760, "text": {"ko": "하지만 **에이전트가 이 비용을 극적으로 낮춰 줘요.** 정말로 우리는 **소프트웨어 테스트와 검증의 황금기**에 들어서고 있어요. 에이전트 덕분에 **예전에는 경제성이 없던 수준까지 모든 걸 테스트할 수 있으니까요.**", "en": "But **agents drastically cut this cost down.** And really, we are entering **a golden age of software testing and verification**, because agents let us **test everything to a much greater degree than used to be economical.**"}, "e": 775}, {"type": "say", "sp": "lauren", "t": 775, "text": {"ko": "그리고 형식 검증은 **제품이 어떻게 동작해야 하는지 더 잘 추론**하게 해 주고, **에이전트가 여러분의 의도와 목표를 정말 이해했는지**도 확인하게 해 줘요.", "en": "And then formal verification can also help you **better reason about how your product should work, and whether your agents really understand your intent and goals.**"}, "e": 782}, {"type": "say", "sp": "lauren", "t": 782, "text": {"ko": "그래서 제 플러그인 **pstack(포테토 스택)**에 **statechart**라는 새 스킬을 만들었어요. **사용자 관점에서 상태 기계를 시각화**해 주는데, 저희가 제공하는 **영상·스크린샷과 나란히 놓고 리뷰하기가 훨씬 쉬워요.** 정말 좋더라고요.", "en": "I made this new skill called **statechart** in my plugin **pstack — potato stack —** which helps you **visualize state machines from the user's point of view.** I find this much easier to review **alongside the videos and screenshots** we provide. So that's been great."}, "e": 801}, {"type": "shot", "t": 785, "cap": {"ko": "‘/statechart’ — github.com/cursor/plugins/tree/main/pstack. 배경에 사용자 흐름 상태 기계 다이어그램이 보입니다.", "en": "‘/statechart’ in pstack (github.com/cursor/plugins)."}, "img": "images/shot-26.jpg"}, {"type": "term", "term": "State machine / Statechart", "kr": {"ko": "상태 기계·상태 차트", "en": "states and the transitions between them"}, "body": {"ko": "앱이 가질 수 있는 **상태(예: 로그아웃·로딩 중·채팅 중)**와 **상태가 바뀌는 조건**을 그림으로 정리한 것입니다. 상태 차트는 이를 계층·병렬까지 표현하는 확장판이에요.\n\n수백 줄 코드 변경을 읽는 것보다 **‘사용자가 이렇게 하면 이 상태로 간다’는 그림**을 보는 게 훨씬 빠르게 의도를 확인할 수 있어서, 리뷰 산출물로 쓴다는 이야기입니다.", "en": "A diagram of an app's states and the conditions that move between them; statecharts add hierarchy and parallelism. Reviewing the diagram is faster than reading hundreds of changed lines."}}, {"type": "term", "term": "pstack", "kr": {"ko": "포테토 스택 — 발표자의 공개 스킬 플러그인", "en": "the speaker's public skills plugin"}, "body": {"ko": "발표자가 공개한 에이전트용 스킬 묶음으로, 슬라이드에 github.com/cursor/plugins의 `pstack`으로 안내됩니다. 발표 중 언급된 **/no-comments, /create-verification-skill, /create-formal-verification-skill, /statechart** 같은 스킬이 들어 있어요.", "en": "The speaker's public skills plugin (github.com/cursor/plugins → pstack), with /no-comments, /create-verification-skill, /create-formal-verification-skill and /statechart."}}, {"type": "shot", "t": 797, "cap": {"ko": "‘ok so what’ — 로켓을 탄 포테토 캐릭터. 이제 결과를 보여 주겠다는 전환 슬라이드입니다.", "en": "‘Ok so what’ — transition to the results."}, "img": "images/shot-27.jpg"}, {"type": "section", "t": 801, "title": {"ko": "약속의 땅 — Grok Bot 팀이 얻은 것", "en": "The promised land — what the Grok Bot team got"}, "lead": {"ko": "지금까지의 투자가 **실제 숫자로 어떤 결과를 냈는지** 보여 주는 증거 구간입니다. 한 달 PR 11,000개, 하루 한 번 꼴의 안정 릴리스, 227명의 기여자 — 그런데도 **되돌린 PR 비율은 0.5% 수준으로 오히려 낮아졌고 앱 성능은 더 좋아졌다**는 점이 핵심입니다. ‘속도와 품질은 맞바꿔야 한다’는 통념에 대한 반박이죠.", "en": "The evidence: 11,000 PRs a month, a stable release about once a day, 227 contributors — yet **the revert rate fell to ~0.5% and app performance improved.** A rebuttal to the idea that speed costs quality."}}, {"type": "say", "sp": "lauren", "t": 801, "text": {"ko": "플래시백 죄송해요. 좋아요, 이제 **약속의 땅**이 어떤 모습인지 볼게요. 이 모든 투자에 대한 대가로 **무엇을 얻느냐**는 거죠.", "en": "Sorry for the flashback. Okay, now let's look at **what the promised land looks like.** What do you get in return for all of this investment?"}, "e": 812}, {"type": "say", "sp": "lauren", "t": 812, "text": {"ko": "Grok Bot 팀의 속도는 **이륙해서 빠르게 올라가고 있어요.** 지난달 저희 팀은 **프로덕션에 PR을 무려 11,000개** 내보냈는데, 정말 말도 안 되는 숫자예요.", "en": "So on the Grok Bot team, our velocity is **taking off and rapidly increasing.** And last month, our team shipped **a ridiculous 11,000 pull requests to production**, which is a wild number."}, "e": 825}, {"type": "shot", "t": 821, "cap": {"ko": "‘grok bot team merged 11k PRs in oct’ — 6월 809 → 7월 1,784 → 8월 4,203 → 9월 5,648 → 10월 10,926(누적 23,390).", "en": "Grok Bot team PRs: 809 (Jun) → 10,926 (Oct), 23,390 total."}, "img": "images/shot-28.jpg"}, {"type": "say", "sp": "lauren", "t": 825, "text": {"ko": "클라이언트 **릴리스 속도도 빨라졌어요.** 이제 **거의 하루에 한 번 새 안정 버전**을 내요.", "en": "And our pace of releasing the client has also increased — **we cut a new stable version about once a day.**"}, "e": 834}, {"type": "shot", "t": 833, "cap": {"ko": "‘desktop app releases a month’ — 8월(출시 후) 9회 → 9월 19회 → 10월 15회. 릴리스 사이 중간 시간은 44시간 → 25시간 → 28시간.", "en": "Desktop releases per month: 9 → 19 → 15; median time between releases 44h → 25h → 28h."}, "img": "images/shot-29.jpg"}, {"type": "say", "sp": "lauren", "t": 834, "text": {"ko": "핵심 팀도 훨씬 많이 내보내고 있고, **맥락이 많지 않은 가벼운 ‘지나가다 기여하는’ 사람들**도 훨씬 많아졌는데, 그들도 기여를 해요. **10월에는 PR을 하나 이상 낸 사람이 약 227명**이었어요.", "en": "And then the core team is also shipping much more, and we also have **a lot more casual or drive-by contributors** who don't always have a lot of context, but they're also contributing. **In October, about 227 people contributed at least one pull request.**"}, "e": 855}, {"type": "shot", "t": 845, "cap": {"ko": "‘everyone is more productive’ — 월별 기여자 수 15 → 48 → 95 → 163 → 229명, PR 1,000개 이상(core)부터 1개(drive-by)까지 구간별로 쌓은 막대.", "en": "‘Everyone is more productive’: contributors per month 15 → 229, from core to drive-by."}, "img": "images/shot-30.jpg"}, {"type": "say", "sp": "lauren", "t": 855, "text": {"ko": "이렇게 속도가 빨라지면 이런 생각이 드실 수 있어요. **‘이거 혼돈 아니야? 슬롭 덩어리가 되는 거 아니야?’** 그런데 실제로는 **되돌려지는(revert) PR의 비율이 상대적으로 오히려 낮아졌고, 약 0.5%에서 안정적**이에요.", "en": "So with this velocity accelerating, you might be thinking, **isn't this going to be chaos? Isn't this going to be a bunch of slop?** But actually, **the share of PRs that get reverted has gotten lower on a relative basis, and is steady at about half a percent.**"}, "e": 870}, {"type": "shot", "t": 857, "cap": {"ko": "‘revert rate’ — 커밋 중 되돌려진 비율 6월 0.98% → 7월 0.61% → 8월 0.47% → 9월 0.48% → 10월 0.47%.", "en": "Revert rate: 0.98% (Jun) → 0.47% (Oct)."}, "img": "images/shot-31.jpg"}, {"type": "term", "term": "Revert rate", "kr": {"ko": "리버트 비율 — 되돌린 변경의 비율", "en": "share of changes rolled back"}, "body": {"ko": "배포한 변경이 문제를 일으켜 **원래대로 되돌린(revert) 비율**입니다. 품질을 보여 주는 대표 지표예요.\n\nPR 수가 10배 넘게 늘었는데 이 비율이 **0.98%에서 0.47%로 절반** 가까이 떨어졌다는 건, 생산량이 늘어도 **‘슬롭이 늘지 않았다’는 정량적 증거**라는 게 발표자의 주장입니다.", "en": "The share of shipped changes rolled back because they caused problems. PR volume grew 10x+ while it halved (0.98% → 0.47%) — evidence that more output didn't mean more slop."}}, {"type": "say", "sp": "lauren", "t": 870, "text": {"ko": "그런데 이 출시 속도와 PR 양에서 정말 흥미로운 건, **Grok Bot의 성능이 그냥 유지된 게 아니라 출시 때보다 여러 면에서 좋아졌다**는 거예요. **시작, 타이핑, 새 채팅 열기, 채팅 전환** — 전부 빨라졌어요.", "en": "But I think the really interesting thing about this shipping pace and this volume of pull requests is that **the performance of Grok Bot has not just stayed stable, but improved on multiple dimensions compared to when we launched.** Startup, typing, opening new chats, switching chats — **all of this has gotten faster.**"}, "e": 891}, {"type": "shot", "t": 881, "cap": {"ko": "‘velocity without compromise’ — 출시(aug) 대비 현재(now): 콜드 스타트 −34%, 짧은 채팅 타이핑 중간값 −26%, 긴 채팅 p90 −65%, 짧은 채팅 전환 −44% 등. 하단: ‘there is a ceiling, but electron apps can be decently fast (Rust 재작성도 고민 중)’.", "en": "‘Velocity without compromise’: cold launch −34%, long-chat typing p90 −65%, chat switching −44%, etc."}, "img": "images/shot-32.jpg"}, {"type": "say", "sp": "lauren", "t": 891, "text": {"ko": "그리고 기억하세요, Grok Bot은 **아직은 Electron 앱**이에요. 그러니 **한계가 있긴 하죠.** 그래도 이미 **다른 많은 에이전트 UI보다 훨씬 빨라요.** 이 정도 속도로, 이렇게 많은 사람이 기여하는 Electron 앱치고는 **꽤 괜찮다**고 생각해요.", "en": "And keep in mind, Grok Bot is **still an Electron app for now**, so **there is a ceiling**, right? But it's already **much faster than many other agent UIs out there.** And for an Electron app with this high velocity and this many people contributing, **I'd say that's pretty good.**"}, "e": 911}, {"type": "section", "t": 911, "title": {"ko": "결론 — 나쁜 루프를 자동화하지 마라", "en": "Conclusion — don't automate a bad loop"}, "lead": {"ko": "발표의 실천적 결론입니다. ‘소프트웨어 팩토리’부터 만들려 하지 말고 **먼저 내부 루프(코드베이스·정적 분석·검증)를 좋게 만들라**고 당부합니다. 슬롭을 만드는 루프를 자동화하면 **슬롭과 토큰 비용만 늘어날 뿐**이고, 기반이 갖춰지면 그 위에 Grok Bot 같은 **외부 루프**로 공장을 쉽게 올릴 수 있다는 메시지로 마무리합니다.", "en": "The practical takeaway: before building a software factory, **fix the inner loop** (codebase, static analysis, verification). Automating a sloppy loop only multiplies slop and token cost; with solid foundations, an **outer loop** like Grok Bot makes the factory easy."}}, {"type": "say", "sp": "lauren", "t": 911, "text": {"ko": "그러니 **소프트웨어 팩토리를 만들고 할 수 있는 모든 걸 자동화하기 전에**, 에이전트를 바로잡을 때마다 **먼저 코드베이스를 개선하는 방식으로** 해 보세요.", "en": "So before you jump into **building out a software factory and automating everything you can**, whenever you correct your agent, **try and do it by improving your codebase first.**"}, "e": 921}, {"type": "say", "sp": "lauren", "t": 921, "text": {"ko": "**린트 규칙부터 시작해서 안티패턴이 새로 생기는 걸 막고**, 그다음 **예전 패턴들도 정리**하세요. 그리고 **검증 체계를 정말 탄탄하게** 만드세요. 이런 작업 상당수는 **어차피 자동화의 전제 조건**이에요.", "en": "Start with **a lint rule to prevent new occurrences of anti-patterns, and then clean up the old patterns** as well. And then **make sure your verification story is really strong.** A lot of this work is **a prerequisite to automation anyway.**"}, "e": 936}, {"type": "say", "sp": "lauren", "t": 936, "text": {"ko": "**내부 코딩 루프가 슬롭을 만든다면, 그 루프를 자동화해 봐야 슬롭만 더 생겨요.** 그러면 문제에 **토큰을 점점 더 많이 쏟아부어야** 하는데, 다들 알다시피 그건 **아주 비싸죠.**", "en": "And **if your inner coding loop produces slop, then automating that loop just produces more slop**, and you need to **throw more and more tokens at the problem**, which we all know is **very expensive.**"}, "e": 949}, {"type": "shot", "t": 941, "cap": {"ko": "‘should i build a software factory*?’ — *즉 코드 작성·출시·배포를 자동화해야 할까?", "en": "‘Should I build a software factory?’ (i.e. automate writing, shipping and deploying code?)"}, "img": "images/shot-33.jpg"}, {"type": "say", "sp": "lauren", "t": 949, "text": {"ko": "**코드베이스, 정적 분석, 런타임·형식 검증**에 이런 투자를 해 두면, 이 **기반 위에서 많은 것이 가능해진다**는 걸 알게 될 거예요. 그리고 그 위에 **여러분만의 팩토리를 정말 쉽게 세울 수 있어요.**", "en": "And once you make these investments into your codebase, static analysis, runtime and formal verification, you'll start to find that **many things become possible with these foundations**, and that **you can really easily build your own factory on top of them.**"}, "e": 967}, {"type": "shot", "t": 965, "cap": {"ko": "‘don't automate a bad loop’ — 낮은 신뢰(대부분 여기 머묾) → 높은 신뢰(포테토 피라미드 이후) → ‘factory’(신뢰가 규모를 가능하게 함, 자동 트리거). 하단: ‘improve your loop before automating!’", "en": "‘Don't automate a bad loop’: low trust → high trust → factory (automated trigger). Improve the loop before automating."}, "img": "images/shot-34.jpg"}, {"type": "term", "term": "Inner loop / Outer loop", "kr": {"ko": "내부 루프·외부 루프", "en": "the coding loop vs the automation around it"}, "body": {"ko": "**내부 루프**는 ‘에이전트가 코드를 쓰고 → 검증하고 → 문제를 찾아 고치는’ 한 작업 단위의 반복입니다. **외부 루프**는 그 내부 루프를 **언제, 누가, 무엇을 계기로 돌릴지**를 자동화하는 바깥 체계예요(슬라이드 예: X 피드백, Linear 티켓 생성, Slack 메시지, cron 일정, Datadog·Sentry 알림).\n\n발표의 결론은 **외부 루프(팩토리)는 내부 루프가 믿을 만해진 뒤에야 가치가 있다**는 것입니다.", "en": "The inner loop: agent writes → verifies → fixes. The outer loop decides when and why to run it (X feedback, Linear tickets, Slack messages, cron, Datadog/Sentry alerts). An outer loop only pays off once the inner loop is trustworthy."}}, {"type": "say", "sp": "lauren", "t": 967, "text": {"ko": "준비가 되면, **Grok Bot이 그 외부 루프를 만드는 좋은 방법**이에요. **커넥터가 아주 많고**, Cursor 클라우드 에이전트를 실행하는 **루틴**, 그리고 **수백, 수천 개 에이전트를 오케스트레이션**하게 해 주는 **프로젝트** 기능이 있어요.", "en": "And when you're ready, **Grok Bot is a great way to build that outer loop.** We have **tons of connectors, routines** that can kick off Cursor cloud agents, and **projects** which let you **orchestrate hundreds or even thousands of agents.**"}, "e": 981}, {"type": "shot", "t": 977, "cap": {"ko": "‘grok bot as your outer loop’ — 왼쪽 트리거(feedback on X, Linear 티켓, Slack 메시지, cron, Datadog/Sentry 알림, etc.)가 팀 공용 Grok Bot을 통해 ‘에이전트가 좋은 코드를 쓰고 에이전트가 검증하는’ 내부 루프를 돌립니다. xai/bot.", "en": "Grok Bot as the outer loop: triggers → shared team Grok Bot → inner loop (agent writes good code, agent verifies)."}, "img": "images/shot-35.jpg"}, {"type": "say", "sp": "lauren", "t": 981, "text": {"ko": "간단한 예를 들면, 이제 저희가 **새 릴리스를 낼 때마다 Grok Bot이 자동으로 새 Cursor 프로젝트를 띄워서** 애플리케이션 전체, 빌드 전체를 **퍼징(fuzzing)**해요. **실제 사용자처럼 앱을 돌리고 써 보면서 버그를 찾아요.**", "en": "As a quick example: whenever we cut a new release now, **Grok Bot automatically spins up a new Cursor project for us that will fuzz the entire application, the entire build**, and it will **find bugs by running the app and using it like a real user.**"}, "e": 995}, {"type": "say", "sp": "lauren", "t": 995, "text": {"ko": "그다음 **찾은 버그마다 수정 PR을 열고, 자동으로 머지**해요. 미친 소리처럼 들리겠지만요. 그게 가능한 이유는 **저희 코드베이스가 충분히 좋아서 PR이 기본적으로 좋게 나오는 편**이고, 저희가 넣는 **제품 코드 대부분은 더 이상 깊은 사람 리뷰가 필요 없기** 때문이에요.", "en": "And then it's going to **open fix PRs for each of those bugs it finds, and it's going to auto-merge them**, as crazy as that sounds. And that's because **our codebase is good enough that pull requests tend to just be good by default**, and **most product code we land no longer requires deep human review.**"}, "e": 1016}, {"type": "shot", "t": 997, "cap": {"ko": "Grok Bot 스레드 — sandcastle 에이전트가 안정 버전 Linux .deb를 퍼징한 결과: 중복 2쌍을 합쳐 59개 버그, 신규 3개(높음 0·중간 2·낮음 1), 기존 47개. 버그마다 스레드 답글로 정리됩니다.", "en": "Grok Bot thread: fuzzing the stable Linux build found 59 distinct bugs — 3 new, 47 pre-existing — each in its own reply."}, "img": "images/shot-36.jpg"}, {"type": "term", "term": "Fuzzing", "kr": {"ko": "퍼징 — 무작위 입력을 퍼부어 버그 찾기", "en": "throwing random input to find bugs"}, "body": {"ko": "프로그램에 **예상치 못한 무작위 입력과 조작을 대량으로 퍼부어** 충돌이나 이상 동작을 찾는 테스트 기법입니다. 여기서는 에이전트가 **실제 사용자처럼 앱을 마구 써 보며** 버그를 찾고, 찾은 버그마다 **수정 PR까지 열고 자동 머지**합니다.", "en": "Hammer a program with random inputs and actions to find crashes. Here agents use the app like real users, then open fix PRs and auto-merge them."}}, {"type": "say", "sp": "lauren", "t": 1016, "text": {"ko": "그러니 **탄탄한 기반과 좋은 유기적 아키텍처**가 있으면, **슬롭을 금으로 바꿀 수 있고**, **품질을 타협하지 않으면서 빠른 속도로** 내보낼 수 있어요.", "en": "So when you have **solid foundations and good organic architecture**, you can **turn slop into gold**, and you can **ship with high velocity without compromising on quality.**"}, "e": 1029}, {"type": "shot", "t": 1025, "cap": {"ko": "마지막 슬라이드 ‘all code is slop (except yours)’ — 제목의 ‘(Except Mine)’이 ‘여러분의 코드는 예외’로 바뀌었습니다.", "en": "Closing slide: ‘all code is slop (except yours)’."}, "img": "images/shot-37.jpg"}, {"type": "say", "sp": "lauren", "t": 1029, "text": {"ko": "제 이름은 **포테토**, **로런**이라고도 해요. 제 발표를 들어 주셔서 다시 한번 감사합니다.", "en": "My name is **Poteto**, also known as **Lauren**. Thanks again for listening to my talk."}, "e": 1037}, {"type": "beat", "t": 1034, "text": {"ko": "박수와 함께 발표가 끝나고 AI Engineer Code Summit 엔딩 화면이 나옵니다.", "en": "Applause; the AI Engineer Code Summit end card appears."}}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
let LANG = D.defaultLang || 'ko';
let FILTER = null;
const UI = {
  ko:{watch:'YouTube에서 보기', play:'▶  영상 열기', toc:'키노트의 흐름', cast:'등장인물',
      casthint:'얼굴을 누르면 그 사람의 발언만 모아 볼 수 있어요. 파란 점은 Microsoft 소속입니다. 본문에서 Microsoft 발표자는 왼쪽, 고객·파트너사는 오른쪽 말풍선으로 표시됩니다.',
      first:'첫 등장', turns:'발언', all:'전체 보기', only:'님의 발언만 보는 중',
      cap:'썸네일이나 각 발언의 타임코드를 누르면 해당 지점의 영상이 열립니다.',
      gl:'용어 사전', glhint:'본문 중간의 노란 상자를 모은 목록입니다. 누르면 해당 위치로 이동해 펼쳐집니다.',
      lead:'이 구간의 의도', o1:'이 페이지는 키노트 영상의 모든 발언을 시간 순서대로 화자별로 옮기고, 어려운 용어에는 설명 상자를 덧붙인 학습용 정리본입니다.',
      o2:'자동 자막을 바탕으로 화면을 대조해 다듬은 의역이며, 정확한 표현과 수치는 원본 영상을 확인하세요.'},
  en:{watch:'Watch on YouTube', play:'▶  Open the video', toc:'How the keynote flows', cast:'Cast',
      casthint:'Click a face to see only that person\'s lines. A blue dot marks Microsoft speakers. In the body, Microsoft speakers are on the left, customers and partners on the right.',
      first:'first at', turns:'lines', all:'Show all', only:' — showing only these lines',
      cap:'Click the thumbnail, or any timecode, to open the video at that moment.',
      gl:'Glossary', glhint:'All the yellow explainer boxes in one list. Click to jump to one and open it.',
      lead:'What this part is for', o1:'A study companion that follows every line of the keynote, speaker by speaker, and annotates the jargon.',
      o2:'Built from auto-captions cross-checked against the screen; paraphrased for clarity — check the video for exact wording and numbers.'}
};
if(D.ui){for(const k in D.ui) Object.assign(UI[k]||(UI[k]={}),D.ui[k]);}
function T(o){ if(o==null) return ''; return (typeof o==='string')?o:(o[LANG]??o.ko??o.en??''); }
function mmss(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');}
function yt(t){return D.watchUrl+'&t='+t+'s';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\((\d{1,3}):(\d{2})\)/g,(m,a,b)=>{const sec=parseInt(a,10)*60+parseInt(b,10);
    return '(<a href="'+yt(sec)+'" target="_blank" rel="noopener">'+a+':'+b+'</a>)';});
  return s.split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
const tsA = t => '<a class="ts" href="'+yt(t)+'" target="_blank" rel="noopener">'+mmss(t)+'</a>';

function stats(){
  const st={};
  for(const b of D.blocks){ if(b.type==='say'){ const s=st[b.sp]||(st[b.sp]={n:0,first:b.t}); s.n++; if(b.t<s.first) s.first=b.t; } }
  return st;
}
const ST = stats();

function render(){
  document.documentElement.lang = LANG;
  const u = UI[LANG]||UI.ko;
  document.title = T(D.title).replace(/<[^>]+>/g,'');
  kicker.textContent = T(D.kicker); eyebrow.textContent = T(D.kicker);
  h1.innerHTML = T(D.title); sub.textContent = T(D.subtitle);
  const nSay = D.blocks.filter(b=>b.type==='say').length, nSp = Object.keys(ST).filter(k=>k!=='narrator').length;
  pill.innerHTML = '<b>'+D.durationLabel+'</b> · '+nSp+(LANG==='ko'?'명 · ':' speakers · ')+nSay+(LANG==='ko'?' 발언':' lines');
  watch.textContent=u.watch; watch.href=D.watchUrl; thumblink.href=D.watchUrl; thumbimg.src=D.thumb;
  playtxt.textContent=u.play; cap.textContent=u.cap; toch.textContent=u.toc; casth.textContent=u.cast; casthint.textContent=u.casthint;
  glh.textContent=u.gl; glhint.textContent=u.glhint; outro1.textContent=u.o1; outro2.textContent=u.o2; fclr.textContent=u.all;

  // cast (order by first appearance)
  cast.innerHTML='';
  Object.keys(D.speakers).filter(k=>ST[k] && k!=='narrator').sort((a,b)=>ST[a].first-ST[b].first).forEach(k=>{
    const sp=D.speakers[k]; const b=document.createElement('button');
    b.className='cc'+(sp.ms?' ms':'')+(FILTER===k?' on':'');
    b.innerHTML=(sp.img?'<img src="'+sp.img+'" alt="">':'<span class="ini">'+(sp.initial||'')+'</span>')
      +'<div><div class="nm">'+T(sp.name)+'</div><div class="rl">'+T(sp.role)+'</div><div class="ct">'+u.first+' '+mmss(ST[k].first)+' · '+ST[k].n+' '+u.turns+'</div></div>';
    b.onclick=()=>setFilter(FILTER===k?null:k);
    cast.appendChild(b);
  });

  // toc
  let html='', sn=0, cur='';
  for(const b of D.blocks){
    if(b.type==='part'){ if(cur) html+='</ol>'; html+='<div class="part-t">'+T(b.kicker)+' · '+T(b.title)+'</div><ol>'; cur='x'; }
    if(b.type==='section'){ sn++; if(!cur){html+='<ol>';cur='x';}
      html+='<li><a href="#s'+sn+'"><span class="n">'+String(sn).padStart(2,'0')+'</span><span>'+T(b.title)+'</span><span class="tm">'+mmss(b.t)+'</span></a></li>'; }
  }
  tocl.innerHTML = html+'</ol>';

  // body
  html=''; sn=0; let open=false, pn=0, tn=0; const gl=[];
  for(const b of D.blocks){
    if(b.type==='part'){
      if(open){html+='</section>';open=false;} pn++;
      html+='<div class="part" id="p'+pn+'"><div class="pk">'+T(b.kicker)+'</div><h2>'+T(b.title)+'</h2><p>'+T(b.text)+'</p></div>';
    } else if(b.type==='section'){
      if(open) html+='</section>'; sn++; open=true;
      html+='<section class="sec" id="s'+sn+'" data-t="'+b.t+'"><div class="sec-head"><span class="sec-n">'+String(sn).padStart(2,'0')+'</span><h2 class="sec-t">'+T(b.title)+'</h2><span class="sec-time">'+tsA(b.t)+'</span></div>'
          +(b.lead?'<div class="lead"><b class="lt">'+u.lead+'</b>'+rich(T(b.lead)).replace(/<\/?p>/g,' ')+'</div>':'');
    } else if(b.type==='say'){
      const sp=D.speakers[b.sp]||{name:{ko:b.sp,en:b.sp}}; const who=T(sp.name);
      const side = b.sp==='narrator'?'n':(sp.side||'l');
      const av = sp.img?'<img src="'+sp.img+'" alt="'+who+'">':(sp.initial||'');
      html+='<div class="turn cue '+side+'" data-t="'+b.t+'" data-e="'+(b.e||'')+'" data-sp="'+b.sp+'"><div class="av">'+av+'</div><div class="body"><div class="who"><b>'+who+'</b><i>'+T(sp.short||sp.role)+'</i>'+(b.t!=null?tsA(b.t):'')+'</div><div class="bub">'+rich(T(b.text))+'<i class="pg"></i></div></div></div>';
    } else if(b.type==='beat'){
      html+='<div class="beat cue" data-t="'+b.t+'">'+(b.t!=null?tsA(b.t):'')+esc(T(b.text))+'</div>';
    } else if(b.type==='shot'){
      html+='<figure class="shot cue" data-t="'+b.t+'"><a class="im" href="'+yt(b.t)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+b.img+'" alt=""></a><figcaption>'+tsA(b.t)+'<span>'+esc(T(b.cap))+'</span></figcaption></figure>';
    } else if(b.type==='term'){
      tn++; gl.push([tn,b]);
      html+='<details class="term" id="g'+tn+'"><summary><span class="term-tag">'+(LANG==='ko'?'용어':'TERM')+'</span><b>'+esc(b.term)+'</b>'+(b.kr?'<span class="kr">'+esc(T(b.kr))+'</span>':'')+'<span class="chev">▼</span></summary><div class="term-b">'+rich(T(b.body))+'</div></details>';
    }
  }
  if(open) html+='</section>';
  main.innerHTML = html;
  document.getElementById('gl').innerHTML = gl.slice().sort((a,b)=>a[1].term.localeCompare(b[1].term)).map(([n,b])=>'<a href="#g'+n+'" data-g="'+n+'"><b>'+esc(b.term)+'</b>'+esc(T(b.kr))+'</a>').join('');
  document.querySelectorAll('#gl a').forEach(a=>a.onclick=()=>{const d=document.getElementById('g'+a.dataset.g); if(d) d.open=true;});
  applyFilter();
  if(window.__syncUI) window.__syncUI();
}

function setFilter(k){ FILTER=k; render(); if(k) document.getElementById('fbar').scrollIntoView({behavior:'smooth',block:'start'}); }
function applyFilter(){
  const on=!!FILTER; document.body.classList.toggle('filt',on); fbar.classList.toggle('on',on);
  document.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
  if(!on) return;
  const sp=D.speakers[FILTER]; fimg.src=sp.img||''; ftxt.textContent=T(sp.name)+(LANG==='ko'?UI.ko.only:UI.en.only);
  document.querySelectorAll('.turn[data-sp="'+FILTER+'"]').forEach(t=>{t.classList.add('hit'); const s=t.closest('.sec'); if(s) s.classList.add('hit');});
  let curPart=null;
  document.querySelectorAll('#main > *').forEach(el=>{ if(el.classList.contains('part')) curPart=el; else if(el.classList.contains('hit') && curPart) curPart.classList.add('hit'); });
}
fclr.onclick=()=>setFilter(null);

(D.langs||[['ko','한국어'],['en','English']]).forEach(([c,l])=>{
  const b=document.createElement('button'); b.textContent=l; b.dataset.c=c;
  b.onclick=()=>{LANG=c;[...langseg.children].forEach(x=>x.classList.toggle('on',x.dataset.c===c));render();};
  if(c===LANG) b.classList.add('on'); langseg.appendChild(b);
});
const saved = localStorage.getItem('y2h-theme');
if(saved) document.documentElement.dataset.theme = saved;
else if(matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.dataset.theme='dark';
themebtn.onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('y2h-theme',n);};
render();
</script>
<script>
/* ===== video ↔ transcript sync ===== */
(function(){
  const $ = s => document.querySelector(s);
  let player=null, ready=false, playing=false, follow=true, lastUser=0, CUES=[], SECS=[], curCue=null, curSec=null, curCap=-1, DUR=D.duration||0;
  const SU = {
    ko:{follow:'자동 따라가기', resume:'현재 위치로 ↓', hint:'영상을 재생하면 오른쪽 대본이 말하는 위치를 따라 움직입니다. 말풍선이나 타임코드를 누르면 그 지점부터 재생돼요. 스크롤하면 잠시 따라가기를 멈추고, ‘현재 위치로’를 누르면 다시 이어집니다.',
        err:'YouTube 플레이어를 불러오지 못했어요. 로컬 파일(file://)로 열면 YouTube 정책상 재생이 막힐 수 있으니 웹 서버(https)에서 열어 주세요.', wait:'재생 버튼을 누르면 대본이 함께 움직입니다.'},
    en:{follow:'Auto-follow', resume:'Back to now ↓', hint:'Play the video and the transcript follows along. Click any bubble or timecode to jump there. Scrolling pauses auto-follow; press ‘Back to now’ to resume.',
        err:'Could not load the YouTube player. Opening the file directly (file://) can be blocked by YouTube — serve it over https.', wait:'Press play and the transcript moves with the speaker.'}
  };
  const su = () => SU[LANG]||SU.ko;

  function collect(){
    CUES=[...document.querySelectorAll('#main .cue[data-t]')].filter(e=>e.getClientRects().length).map(e=>({el:e,t:+e.dataset.t,e:+(e.dataset.e||0),say:e.classList.contains('turn')}));
    CUES.sort((a,b)=>a.t-b.t);
    SECS=[...document.querySelectorAll('#main .sec[data-t]')].map(e=>({el:e,t:+e.dataset.t,id:e.id}));
    curCue=null; curSec=null;
  }
  window.__syncCollect = collect;

  function fmt(t){t=Math.max(0,Math.floor(t));const m=Math.floor(t/60),s=t%60;return m+':'+String(s).padStart(2,'0');}

  function buildBar(){
    const pr=$('#plprog'); pr.innerHTML='<i></i>';
    if(DUR) D.blocks.filter(b=>b.type==='section').forEach(b=>{const m=document.createElement('b');m.style.left=(b.t/DUR*100)+'%';pr.appendChild(m);});
    pr.onclick=e=>{ if(!ready) return; const r=pr.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*DUR); };
  }

  function seek(t, play=true){
    if(!ready) return false;
    player.seekTo(Math.max(0,t),true); if(play) player.playVideo();
    lastUser=0; follow=true; $('#flw').classList.add('on'); $('#resume').classList.remove('on');
    tick(t,true); return true;
  }
  window.__seek = seek;

  function scrollToCue(el, instant){
    const r=el.getBoundingClientRect(); const vh=window.innerHeight;
    let top=0; const sp=$('.sync-player'); if(getComputedStyle(sp).position==='sticky' && window.innerWidth<=1000) top=sp.getBoundingClientRect().bottom;
    const vis=vh-top, off=r.top-top;
    if(!instant && off>vis*0.08 && off+Math.min(r.height,vis*0.5)<vis*0.75) return;
    const y=window.scrollY+off-vis*0.22;
    window.scrollTo({top:y,behavior:(instant||Math.abs(off)>vh*2)?'auto':'smooth'});
  }

  function setLive(cue){
    const ko=$('#liveko');
    if(cue && cue.say){ const b=cue.el.querySelector('.bub'); ko.innerHTML = LANG==='ko'? b.innerHTML.replace(/<i class="pg"[^>]*><\/i>/,'') : ''; ko.style.display = LANG==='ko'?'':'none'; }
  }

  function setCap(t){
    const C=D.caps||[]; let i=-1, lo=0, hi=C.length-1;
    while(lo<=hi){const m=(lo+hi)>>1; if(C[m].t<=t){i=m;lo=m+1;} else hi=m-1;}
    const en=$('#liveen');
    if(i!==curCap){
      curCap=i;
      en.innerHTML = i<0? '<span>'+su().wait+'</span>' : C[i].w.map(w=>'<span data-t="'+w[0]+'">'+w[1].replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>').join(' ');
    }
    if(i>=0) en.querySelectorAll('span').forEach((s,k,all)=>{const st=+s.dataset.t, nx=all[k+1]?+all[k+1].dataset.t:C[i].e; s.classList.toggle('sp',st<=t); s.classList.toggle('now',st<=t&&t<nx);});
  }

  function tick(t, force){
    if(!CUES.length) collect();
    // active cue = last cue with t<=now
    let c=null; for(const x of CUES){ if(x.t<=t+0.15) c=x; else break; }
    if(c!==curCue){
      if(curCue) curCue.el.classList.remove('active');
      CUES.forEach(x=>x.el.classList.toggle('played', x.say && c && x.t<c.t));
      curCue=c; if(c){ c.el.classList.add('active'); setLive(c.say?c:CUES.filter(x=>x.say&&x.t<=t).pop()); }
      if(c && follow && (force || Date.now()-lastUser>4000)) scrollToCue(c.el, force);
    } else if(c && follow && playing && Date.now()-lastUser>4000) scrollToCue(c.el,false);
    if(c && c.say){ const e=c.e||t+10; const p=Math.min(1,Math.max(0,(t-c.t)/(e-c.t))); const pg=c.el.querySelector('.pg'); if(pg) pg.style.width=(p*100)+'%'; }
    // section + toc
    let s=null; for(const x of SECS){ if(x.t<=t+0.15) s=x; }
    if(s!==curSec){ if(curSec) curSec.el.classList.remove('active'); curSec=s; document.querySelectorAll('.toc a.now').forEach(a=>a.classList.remove('now'));
      if(s){ s.el.classList.add('active'); const a=document.querySelector('.toc a[href="#'+s.id+'"]'); if(a) a.classList.add('now'); $('#livesec').textContent=s.el.querySelector('.sec-t').textContent; } }
    setCap(t);
    $('#pltm').textContent=fmt(t)+' / '+fmt(DUR);
    const bar=$('#plprog i'); if(bar && DUR) bar.style.width=(t/DUR*100)+'%';
  }

  let loop=null;
  function startLoop(){ stopLoop(); loop=setInterval(()=>{ if(ready) tick(player.getCurrentTime()); },200); }
  function stopLoop(){ if(loop) clearInterval(loop); loop=null; }

  function create(){
    player=new YT.Player('ytp',{videoId:D.videoId,playerVars:{playsinline:1,cc_load_policy:0,iv_load_policy:3,rel:0,modestbranding:1,enablejsapi:1,origin:location.origin&&location.origin!=='null'?location.origin:undefined},
      events:{
        onReady:()=>{ ready=true; DUR=player.getDuration()||DUR; try{player.unloadModule('captions');}catch(e){} buildBar(); collect();
          const m=location.hash.match(/t=(\d+)/); if(m){ seek(+m[1],false); } else tick(0); },
        onStateChange:e=>{ playing = e.data===YT.PlayerState.PLAYING; $('#live').classList.toggle('playing',playing);
          if(playing){ if(!window.__ccOff){ try{player.unloadModule('captions');player.unloadModule('cc');}catch(_){} window.__ccOff=1; } startLoop(); } else { stopLoop(); tick(player.getCurrentTime()); } },
        onError:e=>{ $('#plhint').textContent=su().err+' ('+e.data+')'; }
      }});
  }

  // user interaction
  ['wheel','touchmove'].forEach(ev=>window.addEventListener(ev,()=>{ lastUser=Date.now(); if(playing&&follow) $('#resume').classList.add('on'); },{passive:true}));
  window.addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key) && e.target===document.body){ lastUser=Date.now(); } });
  document.addEventListener('click',e=>{
    const a=e.target.closest('a.ts, a.im');
    if(a){ const m=a.href.match(/[?&]t=(\d+)/); if(m && ready){ e.preventDefault(); seek(+m[1]); } return; }
    const bub=e.target.closest('.turn.cue .bub');
    if(bub && !window.getSelection().toString()){ const t=+bub.closest('.turn').dataset.t; if(ready) seek(t); }
  });

  function ui(){
    $('#flw').textContent=su().follow; $('#resume').textContent=su().resume; $('#plhint').textContent=su().hint;
    const sp=D.speakers[Object.keys(D.speakers)[0]]; $('#liveimg').src=sp.img||''; $('#livenm').textContent=T(sp.name);
    curCap=-2; if(ready) tick(player.getCurrentTime()); else setCap(-1);
  }
  window.__syncUI = ()=>{ collect(); ui(); };

  $('#flw').onclick=()=>{ follow=!follow; $('#flw').classList.toggle('on',follow); if(follow&&curCue) scrollToCue(curCue.el,true); $('#resume').classList.remove('on'); };
  $('#resume').onclick=()=>{ lastUser=0; follow=true; $('#flw').classList.add('on'); $('#resume').classList.remove('on'); if(curCue) scrollToCue(curCue.el,true); };
  document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ if(!ready) return; player.setPlaybackRate(+b.dataset.rate); document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b)); });

  ui();
  if(window.YT && YT.Player) create(); else {
    window.onYouTubeIframeAPIReady=create;
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.onerror=()=>{$('#plhint').textContent=su().err;}; document.head.appendChild(s);
  }
})();



</script>
