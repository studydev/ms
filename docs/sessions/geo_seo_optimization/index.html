해 관심이 덜한 영역이었습니다. 다만 **GEO로 넘어오면서 관심이 많이 생기고 있으며**, 그는 **플레이어들이 더 많이 생기고, 많은 공부를 통해 이 산업 자체가 확장되기를** 바란다고 말합니다. 진행자도 **\"GEO는 곧 메인스트림이 되지 않을까, 아니 이미 메인스트림으로 자리 잡았다고 본다\"** 며 마무리합니다. 이 영상 전체를 한 문장으로 요약하면 이렇습니다 — **GEO는 새로운 마법이 아니라, 제대로 된 SEO 위에 \"AI가 우리를 어떻게 읽고 인용하는가\"라는 측정 축을 하나 더 얹는 일입니다.**", "en": "In his closing message Lee names the market reality: **Korea lags noticeably behind other markets on SEO and GEO**, and the field has drawn less attention than other marketing disciplines. But **interest is rising as GEO arrives**, and he hopes **more players enter and the industry expands through serious study**. The host signs off saying **\"GEO will soon be mainstream — actually, I think it already is.\"** The whole episode compresses to one sentence: **GEO isn't new magic; it's proper SEO plus one more measurement axis — how AI reads and cites you.**"}, "script": {"ko": "\"SEO와 GEO가 한국 시장이 해외 대비 확실히 좀 많이 뒤쳐져 있긴 합니다. 이제 GEO가 넘어오면서 관심이 많이 생기고 있는 것 같습니다. 많이 공부해 보시고 많이 관심 가져 주시면 좋을 것 같습니다.\"", "en": "\"Korea is clearly behind other markets on SEO and GEO. Interest is growing now that GEO has arrived — I hope people study it and pay attention.\""}}]};

const STR = {
  ko:{start:"스크롤하여 시작", transcript:"스크립트", of:"중", watch:"YouTube에서 보기", made:"영상 스크립트 기반 학습 콘텐츠"},
  en:{start:"Scroll to begin", transcript:"Transcript", of:"of", watch:"Watch on YouTube", made:"Learning content built from the video transcript"},
};
let LANG = DATA.defaultLang || (DATA.langs[0] && DATA.langs[0][0]) || "ko";

function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hms(label){const p=label.split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];}
// escape -> (optional <span class="ac">) -> **bold** -> (mm:ss) deep links -> newlines
function fmt(text, allowSpan){
  let h=esc(text);
  if(allowSpan){
    h=h.replace(/&lt;span class="ac"&gt;/g,'<span class="ac">').replace(/&lt;\/span&gt;/g,'</span>');
  }
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/\((\d{1,2}:\d{2}(?::\d{2})?)\)/g,(m,t)=>{
    const sec=hms(t);
    return `<a class="ts" href="${DATA.watchUrl}&t=${sec}s" target="_blank" rel="noopener">(${t})</a>`;
  });
  h=h.replace(/\n{2,}/g,'</p><p class="desc">').replace(/\n/g,'<br>');
  return h;
}
function pick(field){ // field is {ko:..,en:..} -> current lang, fallback to any
  if(field==null) return "";
  if(typeof field==="string") return field;
  return field[LANG] || field[DATA.defaultLang] || Object.values(field)[0] || "";
}
function t(k){return (STR[LANG]||STR.ko)[k] || STR.ko[k];}

function render(){
  document.documentElement.setAttribute("lang", LANG);
  document.getElementById("brand").innerHTML = esc(DATA.kicker||"");
  document.getElementById("heroKicker").textContent = DATA.kicker||"";
  document.getElementById("heroTitle").innerHTML = fmt(pick(DATA.title), true).replace(/<\/?p[^>]*>/g,"");
  document.getElementById("heroSub").textContent = pick(DATA.subtitle);
  document.getElementById("scrollHint").textContent = t("start");

  const chips=[];
  if(DATA.durationLabel) chips.push(`<span class="chip"><b>${esc(DATA.durationLabel)}</b> · ${DATA.shots.length} shots</span>`);
  else chips.push(`<span class="chip"><b>${DATA.shots.length}</b> shots</span>`);
  chips.push(`<a class="watch" href="${DATA.watchUrl}" target="_blank" rel="noopener">▶ ${esc(t("watch"))}</a>`);
  document.getElementById("heroChips").innerHTML = chips.join("");

  const feed=document.getElementById("feed");
  feed.innerHTML = DATA.shots.map((s,i)=>{
    const n=String(i+1).padStart(2,"0");
    const total=String(DATA.shots.length).padStart(2,"0");
    const sec = s.t!=null ? s.t : (s.tLabel?hms(s.tLabel):0);
    const tsLink = `${DATA.watchUrl}&t=${sec}s`;
    const scriptTxt = pick(s.script);
    const scriptBlock = scriptTxt ? `<div class="script"><span class="lbl">${esc(t("transcript"))}</span><p>${fmt(scriptTxt)}</p></div>` : "";
    return `<section class="panel" data-i="${i}">
      <div class="wrap">
        <div class="eyebrow"><span>${n}</span><span class="of">/ ${total}</span>
          ${s.tLabel?`<a class="ts-pill" href="${tsLink}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.6l4 2.3-1 1.7L11 13V6h2z"/></svg>${esc(s.tLabel)}</a>`:""}
        </div>
        <figure class="shot"><img src="${esc(s.img)}" alt="${esc(pick(s.title))}" loading="lazy"></figure>
        <div class="cap">
          <h2>${fmt(pick(s.title), true).replace(/<\/?p[^>]*>/g,"")}</h2>
          <p class="desc">${fmt(pick(s.desc))}</p>
          ${scriptBlock}
        </div>
      </div>
    </section>`;
  }).join("");

  document.getElementById("footer").innerHTML =
    `<b>${esc(DATA.kicker||"")}</b><br>${esc(t("made"))} · <a href="${DATA.watchUrl}" target="_blank" rel="noopener">${esc(DATA.watchUrl)}</a>`;

  // language pill active state
  document.querySelectorAll("#langPills button").forEach(b=>b.classList.toggle("active", b.dataset.lang===LANG));
  observePanels();
}

function observePanels(){
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:0.08});
  document.querySelectorAll(".panel").forEach(p=>io.observe(p));
}

// build language pills
(function buildLangs(){
  const wrap=document.getElementById("langPills");
  (DATA.langs||[["ko","한국어"],["en","English"]]).forEach(([code,label])=>{
    const b=document.createElement("button");
    b.dataset.lang=code;b.textContent=label;
    b.addEventListener("click",()=>{LANG=code;render();});
    wrap.appendChild(b);
  });
})();

const prog=document.getElementById("progress");
function onScroll(){const h=document.documentElement;prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+"%";}
document.addEventListener("scroll",onScroll,{passive:true});
document.getElementById("themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme");document.documentElement.setAttribute("data-theme",c==="dark"?"light":"dark");});

render();onScroll();
</script>
</body>
</html>
