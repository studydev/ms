lled in, along with information across my work systems as well as my business systems, like financial health and pipeline performance.\n\nSo here, for example, I see from Dynamics 365 Sales that my team is at **73% of their goal**. In order to hit our goal we need about **3x pipeline coverage**. We're only at **2.2**."}}, {"type": "shot", "t": 3730, "cap": {"ko": "Copilot ‘Today’ 화면의 ‘Your team’s quarter’ 카드 — 4억 달러 목표 중 73% 달성(2억 9,200만 달러), 파이프라인 갭 커버리지 2.2X, 남은 갭 1억 800만 달러. 아래 ‘Suggested work’에 ‘New private markets fund – New pipeline for this quarter’ 작업이 제안되어 있습니다.", "en": "Copilot Today's 'Your team's quarter' card: 73% of the $400M target closed or committed ($292M), 2.2X pipeline gap coverage, $108M gap — with 'New private markets fund – New pipeline for this quarter' suggested below."}, "img": "images/shot-21.jpg"}, {"type": "term", "term": "Pipeline Coverage", "kr": {"ko": "파이프라인 커버리지 — 남은 목표 대비 진행 중인 영업 기회의 배수", "en": "Pipeline coverage — open opportunities as a multiple of the remaining target"}, "body": {"ko": "영업 파이프라인은 아직 성사되지 않았지만 진행 중인 영업 기회(딜)의 총합입니다. 파이프라인 커버리지는 이 금액이 남은 목표 금액의 몇 배인지를 나타냅니다.\n\n모든 딜이 성사되지는 않으므로, 보통 남은 목표의 3배 정도 파이프라인이 있어야 목표 달성이 안정적이라고 봅니다. 그물을 넉넉히 쳐야 원하는 만큼 고기를 잡을 수 있는 것과 같습니다.\n\n이 시연에서 팀은 3배가 필요한데 2.2배라서, Copilot이 그 ‘갭’을 찾아내고 새 파이프라인을 만드는 작업을 제안합니다.", "en": "Pipeline = open deals not yet won; coverage = pipeline ÷ remaining target. Since many deals fail, ~3x is a common healthy level. Here the team needs 3x but has 2.2x, so Copilot flags the gap and proposes a pipeline-building play."}}, {"type": "say", "sp": "nirja", "t": 3736, "text": {"ko": "Copilot이 이 갭을 짚어 내고 추천을 해 줍니다. Cowork로 좀 더 깊이 들어가 보겠습니다.\n\nCowork는 Dynamics 365 Sales와 Service 플러그인, 그리고 고객 정보를 가로질러 정보를 끌어와 **커밋(투자 확약) 가능성이 가장 높은 상위 고객**들을 찾아냅니다. 잠재 커밋 규모가 **1억 1,000만 달러**입니다. 게다가 상위 고객들은 이사회 결정을 앞두고 있어서 **12월까지 커밋할 수도** 있습니다(자막 일부 불명확).", "en": "Copilot spots this gap and recommends an action. I'm going to dive into this a bit deeper with Cowork.\n\nCowork will pull in information across the Dynamics 365 Sales and Service plug-ins and client information to identify **the top clients that are most likely to commit**: **$110 million** of potential commitment. More than that, the top clients have board decisions coming and **could commit by December** (caption partly unclear)."}}, {"type": "say", "sp": "nirja", "t": 3772, "text": {"ko": "이 인사이트를 행동으로 바꾸고 싶으니 다시 Cowork로 넘어가겠습니다. Cowork에게 **고객별 패키지**를 만들어 달라고 하겠습니다. BlackRock 지식 베이스의 표준 자료, **개인화된 이메일**, 그리고 **뉴욕에서의 미팅 초대**를 담아서요.\n\n각 패키지는 해당 고객의 **관계 매니저에게 보내 검토**받게 하려고 합니다. Cowork는 Dynamics 365에서 정보를 끌어와 각 고객 담당 관계 매니저에게 전달합니다. 더 중요한 건, **관계 매니저의 승인 없이는 아무것도 나가지 않는다**는 점입니다. 저도 승인 여부를 회신할 수 있고요. 실제로 어떻게 되는지 보시죠. 넘기겠습니다.", "en": "So I want to turn this insight into action, so I'm going to jump back over to Cowork. I'm going to ask Cowork to help build **a package for each client**, with standard information from BlackRock's knowledge base, **a personalized email** and **an invitation to meet in New York**.\n\nI want to send each package to the client's **relationship manager to review**. It will pull this information from Dynamics 365 to route it to the specific client relationship manager. More than that, **nothing goes out without that relationship manager's approval**. I can write back with my approval as well. To see this in action, I'm going to hand it over."}}, {"type": "say", "sp": "efe", "t": 3825, "text": {"ko": "고마워요, Nirja. 저는 Nirja 팀의 **관계 매니저**입니다.\n\nCopilot이 Nirja의 요청을 제 화면 맨 위로 끌어올려 놨네요. 고객들에게 보낼 **개인화된 이메일 세 통**과 함께요. 그 아래에는 오늘 할 수 있는 추천 작업들도 보입니다. ‘작업 시작(Start task)’을 누르면 Cowork가 제가 보낼 이메일 세 통을 만들기 시작합니다.\n\nDynamics 365의 고객 활동과 이력 덕분에, 저희가 **실제로 나눴던 대화를 바탕으로** 개인화된 이메일을 볼 수 있습니다. 제 고객 중 두 분이 저희 사모펀드 전문가가 머무는 시기에 뉴욕에 있을 예정이라, 그의 **실제 가용 시간에 맞춘 미팅 시간**이 제안돼 있습니다. 한 번에 **모두 보내기**를 누르겠습니다.", "en": "Thank you, Nirja. I'm a **relationship manager** on Nirja's team.\n\nCopilot has pulled Nirja's request right to the top of my view, with **three personalized emails** to send out to my clients. Below, I can also see recommended actions I can take today. I'm going to hit Start task, and Cowork is going to begin building out those three emails for me to send.\n\nWith Dynamics 365 client activity and history, I'm able to see personalized emails **based upon conversations we've actually had**. Two of my clients are going to be in New York when our private funds specialist will be there, with **meeting times based upon his actual availability**. I'm going to hit **send all** at once."}}, {"type": "say", "sp": "efe", "t": 3889, "text": {"ko": "이건 계속 챙기기에 일이 꽤 많습니다. 그래서 모든 걸 놓치지 않도록 **Autopilot에게 일을 맡기겠습니다.** 제 대신 일하면서 저에게 계속 업데이트해 줄 겁니다.\n\nAutopilot에게 제 펀드레이징 아웃리치, 고객 뉴스, 서비스 케이스를 추적해 달라고 하겠습니다. **고객이 일주일 안에 답이 없으면, 제가 검토·승인할 후속 메일 초안**을 써 달라고요. 추가로 매주 회사 차원의 뉴스도 받아 보고 싶습니다.\n\nAutopilot이 **루틴 두 개**를 만들었습니다. 첫째는 Dynamics, Outlook, Teams를 살피는 **매일 점검**, 그리고 **월요일 아침 인텔 브리핑**입니다. 그리고 가드레일은 명확합니다. **제 승인 없이는 어떤 것도 고객에게 나가지 않습니다.**", "en": "Now, this is a lot of work to stay on top of, so to help me keep track of everything, I'm going to **put Autopilot to work**. It will work on my behalf, keeping me updated.\n\nHere I'm going to ask Autopilot to help me track my fundraising outreach, client news and service cases. **If a client doesn't respond within a week, I want it to draft a follow-up for me to review and approve.** Additionally, I want to get a weekly view of firm-level news.\n\nAutopilot has created **the two routines**: first, the **daily check**, where Autopilot will look across Dynamics, Outlook and Teams, and we have that **Monday morning intel brief**. And the guardrail is clear: **nothing goes out to my clients without my approval**."}}, {"type": "say", "sp": "efe", "t": 3942, "text": {"ko": "Autopilot은 **IT가 이미 마련해 둔 통제 범위 안에서** 작동합니다. 여기 오른쪽으로 가 보면 지금 돌아가는 모든 루틴이 보이는데, 방금 함께 만든 두 개도 있습니다. 저는 언제든 Autopilot이 저 대신 수행하는 **작업을 볼 수 있습니다.**\n\n일이 어떻게 진행되고 있는지 보러 다시 Nirja Trivedi에게 넘기겠습니다.", "en": "Autopilot is operating **within the supported controls that IT has already put into place**. And if we come out here and navigate to the right, I can see all of the routines I currently have running, including the two we just created together. At any point **I have visibility into the actions** Autopilot is performing on my behalf.\n\nLet's turn it back to Nirja Trivedi to see how things are going."}}, {"type": "say", "sp": "nirja", "t": 3974, "text": {"ko": "좋네요, 고마워요, Efe. 자, **2주 정도** 지났으니 팀의 진척 상황을 확인해 보겠습니다. 단 2주 만에 **73%에서 81%까지** 올라왔네요. 이번 플레이로 **5,900만 달러의 신규 파이프라인**도 생겼습니다.\n\n보시다시피 Copilot이 제 **비즈니스 프로세스의 정문(front door)**이 됩니다. 고객 지식은 이제 팀 전체가 활용할 수 있는 인텔리전스가 됐고, Dynamics 365 플러그인 덕분에 그게 제 업무 흐름 안에 바로 있습니다. 그래서 탄력을 유지하며 **분기를 강하게 마무리**할 수 있습니다. Judson, 다시 넘길게요.", "en": "This is great, thanks, Efe. All right, it's been about **two weeks**, so let's check in on the progress of my team. I can see in just two weeks we're up **from 73% all the way to 81%**. We also have **$59 million of new pipeline** generated from this play.\n\nSo you can see here that Copilot becomes **the front door to my business processes**. Client knowledge is now intelligence my whole team can work on, and with Dynamics 365 plug-ins it's directly in the flow of my work, so I keep the momentum to have **a strong close to the quarter**. Back to you, Judson."}}, {"type": "shot", "t": 3985, "cap": {"ko": "2주 뒤의 Today 화면 — 목표 대비 81% 달성(On track), 파이프라인 커버리지 2.6X, 최근 30일 신규 파이프라인 7,900만 달러, 그리고 ‘$59M of new Q4 pipeline, more than half your original gap’ 카드. 시연 전후 성과를 숫자로 보여 줍니다.", "en": "Today two weeks later: 81% of target (On track), 2.6X pipeline coverage, $79M new pipeline in the last 30 days, and a card reading '$59M of new Q4 pipeline, more than half your original gap'."}, "img": "images/shot-22.jpg"}, {"type": "say", "sp": "judson", "t": 4017, "text": {"ko": "고마워요, Nirja, Efe. 잘하셨어요.", "en": "Thank you, Nirja and Efe. Well done."}}, {"type": "section", "t": 4021, "title": {"ko": "Salesforce와의 세 가지 발표, Copilotforce", "en": "Three announcements with Salesforce: Copilotforce"}, "lead": {"ko": "플러그인 이야기가 Microsoft 제품(Dynamics)에만 해당하지 않는다는 걸 보여 주는 깜짝 파트입니다. Judson이 Salesforce와의 공동 발표 세 가지(Copilot용 Sales 플러그인, Teams 속 Sales Cloud, Fabric과 Data 360의 제로 카피 통합)를 공개하고, Microsoft 출신인 Salesforce의 Rohan Kumar가 ‘AI가 곧 인터페이스’라는 비전과 함께 이를 ‘Copilotforce’로 소개합니다.", "en": "A surprise showing plug-ins aren't limited to Microsoft's own apps. Judson announces three Salesforce innovations (Sales plug-in for Copilot, Sales Cloud in Teams, Data 360 + Fabric zero-copy), and ex-Microsoft Salesforce executive Rohan Kumar frames them as 'Copilotforce' with the vision of AI as the interface."}}, {"type": "say", "sp": "judson", "t": 4021, "text": {"ko": "이렇게 Microsoft Copilot은 다시 말해 **인간의 야망을 위한 플랫폼**이고, 플러그인은 이런 경험을 여러분의 직원들에게 연결해 줍니다. 저희가 방금 데모를 저희 자산, 즉 Dynamics와 잘 맞물리는 Copilot으로 보여 드릴 거라는 건 예상하셨을 겁니다. 그런데 예상 못 하셨을 수도 있는 건, **저희가 Salesforce와도 똑같은 일을 하고 있다**는 겁니다.\n\n오늘 Salesforce와 함께 **세 가지 주요 신제품 혁신**을 발표합니다. Copilot용 새 **Sales 플러그인**, **Teams 속 Salesforce Sales Cloud**, 그리고 **Fabric과 Data 360의 제로 카피 통합**입니다.\n\n이에 대해 더 이야기해 주실, Salesforce의 사장 겸 최고 플랫폼·엔지니어링 책임자 Rohan Kumar를 무대로 모시겠습니다.", "en": "So Microsoft Copilot, again, is **a platform for human ambition**, and plug-ins enable you to wire in these experiences for your people. Now, you would have expected us to have played that demo with our own assets — Copilot working well with Dynamics. What you might not have expected: **we're doing this same thing with Salesforce**.\n\nWe're announcing **three major new product innovations** in conjunction with Salesforce today: the new **Sales plug-in for Copilot**, **Salesforce Sales Cloud in Teams**, and the integration of **Data 360 in Fabric with zero copy**.\n\nTo share more about that, please welcome to the stage Salesforce's President and Chief Platform and Engineering Officer, Rohan Kumar."}}, {"type": "shot", "t": 4060, "cap": {"ko": "‘Announcing Copilotforce’ 슬라이드 — Salesforce plugin for Copilot, Salesforce Sales Cloud in Teams, Salesforce Data 360 + Fabric 세 가지 발표가 한 화면에 정리돼 있습니다.", "en": "The 'Announcing Copilotforce' slide listing the three announcements: Salesforce plugin for Copilot, Salesforce Sales Cloud in Teams, and Salesforce Data 360 + Fabric."}, "img": "images/shot-23.jpg"}, {"type": "term", "term": "Zero-copy", "kr": {"ko": "제로 카피 — 데이터를 복사·이동하지 않고 제자리에서 함께 쓰는 방식", "en": "Zero-copy — using data in place without copying or moving it"}, "body": {"ko": "보통 두 시스템의 데이터를 합쳐 분석하려면 한쪽 데이터를 다른 쪽으로 복사(ETL)해야 합니다. 그러면 사본이 늘고, 최신성이 떨어지고, 보안 관리 지점도 늘어납니다.\n\n제로 카피는 데이터를 원래 위치에 둔 채, 다른 시스템이 마치 자기 데이터처럼 바로 읽을 수 있게 연결하는 방식입니다. 서류를 복사해 건네는 대신, 같은 원본 폴더를 함께 열람하는 것과 비슷합니다.\n\n이번 발표는 Salesforce의 고객 데이터(Data 360)를 Microsoft Fabric에서 복사 없이 활용할 수 있게 한다는 것으로, 두 회사 데이터를 AI가 함께 쓰기 위한 기반입니다.", "en": "Zero-copy lets one system read another's data in place instead of copying it via ETL — fewer copies, fresher data, fewer security exposures. Here, Salesforce Data 360 becomes usable in Microsoft Fabric without duplication."}}, {"type": "beat", "t": 4077, "text": {"ko": "(박수, Rohan Kumar 등장 — Judson과 인사)", "en": "(Applause; Rohan Kumar walks on and greets Judson)"}}, {"type": "say", "sp": "judson", "t": 4077, "text": {"ko": "Ignite 무대에 다시 오신 걸 환영합니다.", "en": "Welcome back to the Ignite stage."}}, {"type": "say", "sp": "rohan", "t": 4082, "text": {"ko": "고마워요, Judson. 여러분, 좋은 아침입니다. Microsoft에서 **거의 28년**을 정말 멋지게 보낸 뒤, 이제 Salesforce를 대표해 다시 Microsoft Ignite에 서게 되어 정말 기쁩니다. 함께 엔터프라이즈 AI를 만들어 가는 자리에서요.\n\n컴퓨팅의 토대가 바뀌고 있다는 건 분명합니다. 지금까지는 **사람이 소프트웨어에 적응**해야 했습니다. 애플리케이션을 탐색하고, 시스템을 옮겨 다니고, 자기 일을 조각조각 이어 붙여야 했죠. 그런데 지금 저희가 보고 있는 건 본질적으로 **AI가 미래의 인터페이스**가 되는 것입니다. 애플리케이션은 ‘기능(capability)’이 되고, 기업 사용자는 소프트웨어를 헤매는 대신 **원하는 사업 성과에 집중**하게 되는 거죠.", "en": "Thank you, Judson. Good morning, everyone. After nearly **28 amazing years at Microsoft**, it's wonderful to be back at Microsoft Ignite, now representing Salesforce, as we come together to shape enterprise AI.\n\nIt's clear that the foundations of computing are changing. **People have had to adapt to software**: navigating applications, moving through systems and piecing together their work. And what we're seeing, essentially, is the ability for **AI to become the interface of the future** — applications becoming capabilities, and enterprise users spending their time **focused on the business outcomes they're trying to achieve** instead of navigating software."}}, {"type": "say", "sp": "rohan", "t": 4131, "text": {"ko": "이게 바로 저희가 올해 초 Dreamforce에서 도달한 지점입니다. **Salesforce의 힘을 여러분이 일하기로 선택한 곳 어디든 더 가까이** 가져가는 것. 그리고 그곳이 바로 **Microsoft 365**입니다.\n\nSalesforce에는 비즈니스에 대한 이해와 워크플로가 있고, Microsoft 365는 여러분의 직원들이 협업하고 일을 해내는 곳입니다. **둘이 함께 일하지 않을 이유가 없죠.**", "en": "This is exactly where we landed at Dreamforce earlier this year: bringing **the power of Salesforce closer to wherever you choose to work**. And that place is **Microsoft 365**.\n\nSalesforce has the business understanding and workflows; Microsoft 365 is where your people collaborate and get their work done. **Why should they not work together?**"}}, {"type": "say", "sp": "rohan", "t": 4160, "text": {"ko": "Judson이 말씀하신 것처럼, 저희는 **Copilotforce**를 소개하게 되어 정말 기쁩니다. **Salesforce의 가장 좋은 것을 Microsoft 365 Copilot과 Microsoft Teams 안으로** 가져옵니다. 이건 단지 데이터의 문제가 아니라 **고객 맥락**의 문제이고, Salesforce의 보안과 권한을 그대로 유지하며 **행동까지 취할 수 있는** 능력입니다.\n\nAI에게 고객에 대한 ‘다음 최선의 행동이 뭐냐’고 묻는 데서 그치지 않고, Copilotforce로 그걸 **실제로 실행**할 수 있습니다. 이것이 지능적이고 개방된 **에이전틱 엔터프라이즈로 가는 길**입니다(자막 일부 불명확).\n\n그리고 저희는 Salesforce와 Microsoft **양사의 파트너인 Accenture**와 함께하게 되어 매우 기쁩니다. 이걸 함께 만들어 가면서, Accenture가 자사 영업 조직 전반에 이를 배포하고 있다는 게 정말 반갑습니다.", "en": "As Judson mentioned, we're so excited to introduce **Copilotforce**. We're bringing **the best of Salesforce into Microsoft 365 Copilot and Microsoft Teams**. With this, it's not just about the data — it's the **customer context**, and the ability to **take action**, all with Salesforce security and permissions.\n\nInstead of asking AI what's the next best action with the customer, you can **get it executed** using Copilotforce. This is the path to the agentic enterprise: intelligent, open (caption partly unclear).\n\nAnd we're thrilled to partner with **Accenture, a partner to both Salesforce and Microsoft**, as we bring this together. We're thrilled they're deploying it across their sales teams."}}, {"type": "term", "term": "Copilotforce", "kr": {"ko": "Copilotforce — Salesforce를 Microsoft 365 Copilot·Teams 안으로 가져오는 공동 제품군", "en": "Copilotforce — Salesforce brought into Microsoft 365 Copilot and Teams"}, "body": {"ko": "Copilotforce는 이 키노트에서 처음 공개된 Microsoft·Salesforce 공동 발표의 이름입니다. 키노트 설명에 따르면 Copilot용 Salesforce 플러그인, Teams 속 Salesforce Sales Cloud, Fabric과 Salesforce Data 360의 제로 카피 통합으로 구성됩니다.\n\n핵심은 영업 담당자가 Salesforce 화면으로 따로 들어가지 않고, Copilot과 Teams 안에서 고객 맥락을 보고, Salesforce의 보안·권한을 유지한 채 데이터 업데이트 같은 행동까지 한다는 점입니다.\n\n오랜 경쟁사였던 두 회사가 ‘AI가 인터페이스’라는 같은 방향으로 손잡았다는 점에서 상징성이 큽니다.", "en": "New in this keynote: per the announcement, Copilotforce = Salesforce plug-in for Copilot + Sales Cloud in Teams + Data 360/Fabric zero-copy, letting sellers see customer context and act on Salesforce from inside Copilot and Teams with Salesforce security and permissions intact."}}, {"type": "section", "t": 4219, "title": {"ko": "Accenture의 Copilotforce 실전 시연", "en": "Accenture puts Copilotforce to work"}, "lead": {"ko": "방금 발표한 Copilotforce가 실제 영업 현장에서 어떻게 쓰이는지 보여 주는 마무리 시연입니다. 설계 파트너로 참여한 Accenture의 CIO Tony Leraris가 영업 담당자 ‘Priya’의 하루(RFP 대응, 딜 룸 생성, Teams에서 Salesforce 업데이트)와 매니저의 파이프라인 리뷰를 보여 줍니다. ‘Copilot·Teams·Salesforce가 하나로’라는 메시지를 확인하는 부분입니다.", "en": "A closing demo of Copilotforce in real selling. Accenture CIO Tony Leraris, a design partner, walks through seller 'Priya' (RFP response, deal room, Salesforce updates from Teams) and her manager's pipeline review — Copilot, Teams and Salesforce working as one."}}, {"type": "say", "sp": "judson", "t": 4219, "text": {"ko": "고마워요, Rohan. Accenture가 자사 환경에서 이게 어떤지 공유해 주게 되어 정말 기대됩니다. Tony Leraris를 맞아 주십시오.", "en": "Thanks, Rohan. We're really excited to have Accenture share what this is like in their environment. Please welcome Tony Leraris."}}, {"type": "say", "sp": "tony", "t": 4232, "text": {"ko": "고마워요, Judson. Accenture에서는 모두가 Teams에서 일합니다. **80만 명이 넘는** 직원이 Teams에서 만나고, 협업하고, 점점 더 Copilot을 써서 매일 성과를 냅니다. 이제 Copilotforce로 저희 영업 담당자들은 **이미 쓰고 있는 도구 안에 고객 맥락이 바로 들어가** 있게 됩니다. Accenture는 **설계 파트너**로서 이걸 함께 만들었습니다. 어떤 모습인지 보여 드리겠습니다.", "en": "Thank you, Judson. At Accenture we all work in Teams. **More than 800,000 of our people** meet, collaborate and increasingly use Copilot to deliver impact every day. Now, with Copilotforce, our sellers will have **customer context built right into the tools they're already working with**. Accenture is a **design partner** — we helped build it. Let me show you what that looks like."}}, {"type": "say", "sp": "tony", "t": 4259, "text": {"ko": "여기 저희 영업 담당자 중 한 명인 **Priya**가 있습니다. Priya는 그날의 영업 우선순위를 챙기는 데 Cowork를 활용합니다. Copilot이 그녀의 **Salesforce 파이프라인 전체**를, 열려 있는 기회부터 각 고객사의 최신 활동까지 훑어보고, 잠깐 사이에 브리핑해 줍니다.\n\n첫 번째는 그녀가 챙겨야 할 **새 RFP**입니다. 탭 한 번으로 Cowork에게 이 수주 활동 전체를 맡깁니다. Salesforce에 기회(opportunity) 등록, Teams 채널, 클로즈 플랜, 그리고 모두의 일정에 싱크 미팅까지. **첫날부터 이미 정리가 끝났죠.**", "en": "Here's **Priya**, one of our sellers. She relies on Cowork to track her sales priorities for the day. Copilot reads over her **entire Salesforce pipeline**, from open opportunities to the latest customer activity on each account, and within moments briefs her.\n\nFirst up: **a new RFP** that needs her attention. With a quick tap, she uses Cowork to tackle the whole pursuit: the opportunity in Salesforce, a Teams channel, a close plan, and a sync on everybody's calendar. **Day one, we're already organized.**"}}, {"type": "term", "term": "RFP", "kr": {"ko": "RFP — 고객이 공급사들에게 보내는 제안요청서", "en": "RFP — Request for Proposal"}, "body": {"ko": "RFP(Request for Proposal, 제안요청서)는 고객사가 프로젝트나 서비스를 맡길 업체를 고르기 위해 요구사항을 정리해 여러 공급사에 보내는 문서입니다. 받은 쪽은 기한 안에 제안서를 써서 경쟁해야 합니다.\n\n입찰 공고를 받고 팀을 꾸려 제안서를 준비하는 과정과 같아서, 초기에 담당자 배정, 일정, 전략(클로즈 플랜)을 빨리 세우는 게 중요합니다.\n\n이 시연에서는 RFP가 들어오자 Cowork가 Salesforce 기회 등록, Teams 채널(딜 룸), 클로즈 플랜, 일정까지 한 번에 세팅해 ‘첫날부터 정리된’ 상태를 만듭니다.", "en": "An RFP is a client's document inviting vendors to submit competing proposals. Speed in organizing the pursuit matters; here Cowork sets up the Salesforce opportunity, Teams deal room, close plan and meetings in one go."}}, {"type": "say", "sp": "tony", "t": 4303, "text": {"ko": "여기서 팀은 RFP와 클로즈 플랜이 준비된 상태로 **고객 기회에 대한 공통 기반**을 갖습니다. Teams 채팅으로 넘어가 보죠. Priya가 팀에 **최종 후보(쇼트리스트)에 올랐다**고 공유합니다.\n\n그녀는 Copilot에게 Salesforce를 업데이트해 달라고 합니다. **Salesforce 플러그인**을 써서 Copilot은 이메일, 채팅, 회의 전반의 인사이트를 끌어와 Salesforce로 보낼 **업데이트 다섯 건**을 제안합니다. 클릭 한 번이면 **Salesforce가 최신 상태**가 됩니다.", "en": "Here, the team is grounded on **the customer opportunity**, with the RFP and the close plan ready to go. Let's hop over to the Teams chat. Priya shares with the team that **they made it to the shortlist**.\n\nShe asks Copilot to update Salesforce. Using the **Salesforce plug-in**, it can pull insights across emails, chats and meetings, and proposes **five updates** to send to Salesforce. One click, and **Salesforce is current**."}}, {"type": "shot", "t": 4340, "cap": {"ko": "Teams의 ‘Kestrel deal team’ 채팅에서 Copilot(Atlas, Priya의 Autopilot)이 Salesforce에 반영할 추천 업데이트 5건(단계 변경, 의사결정자 추가, 다음 단계, 예측 카테고리, 금액 $2.4M→$2.8M)을 제안한 화면입니다. Teams 안에서 Salesforce를 바로 갱신하는 Copilotforce의 핵심 장면입니다.", "en": "In the Teams 'Kestrel deal team' chat, Copilot (Atlas, Priya's Autopilot) proposes five Salesforce updates — stage, decision-maker contact, next step, forecast category, amount $2.4M→$2.8M — updating Salesforce without leaving Teams."}, "img": "images/shot-24.jpg"}, {"type": "say", "sp": "tony", "t": 4343, "text": {"ko": "그리고 이건 영업 담당자만을 위한 게 아닙니다. 일주일 뒤, Priya의 매니저가 Copilot을 열어 팀의 업데이트가 **예측(forecast)**을 어떻게 움직였는지 봅니다. **파이프라인 리뷰 스킬**을 써서요. Copilot에서 쓸 수 있는 30여 개의 Salesforce 스킬과(자막 불명확) 이메일·채팅의 맥락을 결합해, 그녀가 맡은 **지역의 현황을 즉시 스냅샷**으로 보여 줍니다. **가장 큰 위험 딜 두 건**과 추천 다음 단계가 보이죠.\n\n그녀는 해당 기회의 어카운트 매니저에게 Teams로 연락합니다(자막 일부 불명확).", "en": "Now, this isn't just for sellers. A week later, Priya's manager opens Copilot to see how her team's updates have moved **forecast**, using the **pipeline review skill**. It combines more than 30 Salesforce skills available in Copilot (caption unclear) with context from email and chat to give an **instant snapshot of her region**. You can see **the two biggest deals at risk**, with the recommended next steps.\n\nShe pings the account manager in Teams about the opportunity in Salesforce (caption partly unclear)."}}, {"type": "say", "sp": "tony", "t": 4383, "text": {"ko": "이것이 업무의 흐름입니다. **Copilot, Teams, Salesforce가 하나로** 움직이는 거죠. Copilotforce로 저희 직원들은 **고객과 더 많은 시간**을 보내게 될 겁니다. 그리고 저희는 모든 회사가 똑같이 할 수 있도록 도울 수 있습니다.", "en": "That's the flow of work: **Copilot, Teams and Salesforce working as one**. With Copilotforce, our people will spend **more time with clients**. And we can help every company do the same."}}, {"type": "part", "t": 4401, "kicker": {"ko": "PART 3 · INTELLIGENCE", "en": "PART 3 · INTELLIGENCE"}, "title": {"ko": "빌려 쓰는 지능이 아닌, 우리 회사의 IQ", "en": "Not artificial intelligence — yours"}, "text": {"ko": "두 번째 축은 ‘지능’입니다. 회사의 맥락과 지식을 쌓아 소유하는 Microsoft IQ, 에이전트를 만들고 계속 개선하는 Foundry, Microsoft 자체 모델(MAI), 그리고 고객 CEO와의 대담까지 ‘지능은 안에서부터 복리로 쌓여야 한다’는 주장을 펼칩니다.", "en": "The second pillar is intelligence: Microsoft IQ to own your context, Foundry to build and keep improving agents, Microsoft's own MAI models, and a CEO conversation — all arguing that intelligence must compound from within."}}, {"type": "section", "t": 4401, "title": {"ko": "두 번째 자산 '인텔리전스'와 Unilever IQ", "en": "The second asset, Intelligence, and Unilever IQ"}, "lead": {"ko": "Judson이 프런티어 전환의 두 번째 '오래가는 자산'으로 인텔리전스, 즉 AI가 아닌 '우리 회사만의 지능'을 꺼내 듭니다. 그 개념을 Unilever가 실제 판촉 청구(trade claim) 업무에서 어떻게 쓰는지 라이브 데모로 보여 주는 대목입니다. 에이전트가 숫자를 찾아내고, 사람의 판단이 다시 회사의 지식으로 쌓이는 흐름에 주목하세요.", "en": "Judson introduces the second durable asset of frontier transformation: intelligence — not artificial, but your own. Unilever then shows it live in its trade-claims process. Watch how the agent finds discrepancies and how human judgment is captured back into the company's knowledge."}}, {"type": "say", "sp": "tony", "t": 4401, "text": {"ko": "Judson, 다시 넘기겠습니다.", "en": "Judson, back to you."}}, {"type": "say", "sp": "judson", "t": 4402, "text": {"ko": "고마워요, Tony.", "en": "Thanks, Tony."}}, {"type": "beat", "t": 4404, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "say", "sp": "judson", "t": 4406, "text": {"ko": "**인텔리전스는 프런티어 전환 여정에서 우리 모두가 구축해야 할 두 번째 '오래가는 자산'**입니다. 인공 지능이 아니라, **여러분 자신의 지능**입니다. 우리 모두는 조직 내부의 자산을 만들고, 지키고, 끊임없이 개선해서 지능이 안에서부터 복리로 쌓이게 해야 합니다.\n\n작년에 우리는 Work IQ, Foundry IQ, Fabric IQ를 출시했습니다. 이 인텔리전스 플랫폼의 기본 구성 요소를 여러분께 제공하기 위해서였죠. 지난 1년 동안 정말 많은 고객이 이 같은 개념을 도입하는 것을 보며 매우 기뻤습니다.", "en": "**Intelligence is the second durable asset that we all need to build on the frontier transformation journey** — not artificial, **yours**. We all need to build, retain and continuously improve the assets inside our organizations so intelligence compounds from within.\n\nLast year we launched Work IQ, Foundry IQ and Fabric IQ to provide you the fundamental building blocks for this intelligence platform. Over the last year we've been thrilled to see so many customers adopt this same concept."}}, {"type": "term", "term": "Work IQ / Foundry IQ / Fabric IQ", "kr": {"ko": "회사 지식을 에이전트에게 공급하는 세 가지 'IQ' 계층", "en": "Three 'IQ' layers that feed company knowledge to agents"}, "body": {"ko": "Microsoft가 작년(Ignite 2025)에 내놓은 세 가지 'IQ'입니다. **Work IQ**는 Teams 채팅·메일·문서처럼 사람들이 일하며 남긴 협업 데이터를, **Fabric IQ**는 매출·재고 같은 정형 비즈니스 데이터와 그 지표 정의(시맨틱)를, **Foundry IQ**는 매뉴얼·계약서 같은 문서를 모아 만든 지식 베이스를 에이전트가 쓸 수 있게 해 줍니다.\n\n비유하자면 신입 직원에게 '사내 메신저 기록', '회사 숫자 장부', '사내 규정집'을 한꺼번에 열어 주는 셈입니다. 권한은 그대로 유지돼, 볼 수 있는 사람(에이전트)만 봅니다.\n\n이 키노트에서는 이 셋이 Unilever 데모의 재료가 되고, 곧이어 이들을 하나로 묶는 **Microsoft IQ**가 발표됩니다.", "en": "Launched last year: Work IQ exposes collaboration data (chats, mail, documents), Fabric IQ exposes business data and its metric definitions, and Foundry IQ builds knowledge bases from documents — all with permissions intact. They power the Unilever demo and are unified by Microsoft IQ announced next."}}, {"type": "say", "sp": "judson", "t": 4445, "text": {"ko": "이 개념 전체를 생생하게 보여 드리기 위해 Unilever를 소개하겠습니다. Unilever IQ에 대해 이야기해 줄 **Unilever의 Deepalok Roy Chowdhury**를 맞아 주십시오.", "en": "We want to bring this whole concept to life for you by showing you Unilever. Please welcome Deepalok Roy Chowdhury from Unilever to talk to you about Unilever IQ."}}, {"type": "beat", "t": 4458, "text": {"ko": "(Deepalok Roy Chowdhury가 마트 진열대 세트가 꾸며진 데모 무대에 등장, 손에는 Dove 제품)", "en": "(Deepalok Roy Chowdhury appears on a demo set dressed as store shelves, holding a Dove product)"}}, {"type": "say", "sp": "deepalok", "t": 4461, "text": {"ko": "고맙습니다, Judson. 매일 **37억 명의 소비자**가 Unilever 제품을 사용합니다. 그 결과 1년에 **2,000만 건의 주문과 500만 건의 청구(claim)**가 생깁니다.\n\n이런 규모에서는 우리만의 인텔리전스, 즉 **Unilever IQ**가 필요합니다. 우리 사람들이 어떻게 일하는지, 우리 사업이 어떻게 돌아가는지, 그리고 고객을 위해 어떻게 가치를 만들어 내는지 말이죠. 우리가 만들어 온 걸 보여 주시겠어요?", "en": "Thank you, Judson. Every day, **3.7 billion consumers** use a Unilever product, and that generates **20 million orders and 5 million claims a year**.\n\nAt that scale we need intelligence that's ours — **Unilever IQ**: how our people operate, how our business runs and how we generate value for our customers. Do you want to showcase what we've been building?"}}, {"type": "say", "sp": "sharoon", "t": 4497, "text": {"ko": "고맙습니다.", "en": "Thank you."}}, {"type": "term", "term": "Trade Claim", "kr": {"ko": "판촉 청구 — 유통사가 제조사에 판촉비·할인분을 청구하는 것", "en": "A retailer's claim to a manufacturer for promotion costs or discounts"}, "body": {"ko": "소비재 회사는 마트 같은 유통사와 '이 기간에 이 제품을 개당 얼마에 할인 판매하면 그 차액을 보전해 준다' 같은 판촉 계약을 맺습니다. 유통사는 나중에 판매량과 단가를 근거로 제조사에 돈을 청구하는데, 이것이 trade claim입니다.\n\n문제는 건수가 엄청나게 많고(Unilever는 연 500만 건), 계약 단가·판촉 기간·실제 판매(POS) 수량과 하나하나 대조해야 한다는 점입니다. 사람이 다 보기 어려워 과다 청구가 그냥 지나가기 쉽습니다.\n\n이 데모에서 에이전트는 계약 단가와 청구 단가의 차이를 찾아내 수천 달러의 손실을 막아 줍니다.", "en": "Retailers bill manufacturers for agreed promotions based on units and rates. Volumes are huge, so over-claims slip through; in the demo the agent cross-checks contracts, claims and POS data."}}, {"type": "say", "sp": "sharoon", "t": 4499, "text": {"ko": "이게 그 에이전트입니다. **우리 팀이 일하는 곳(Teams)에서 함께 일합니다.** 보시다시피 이미 혼자서 **14건의 청구를 처리했고**, 이제 저에게 도움을 요청하고 있네요. 자세히 보죠.\n\n첫 번째 줄을 보면 고객사가 우리에게 청구를 하고 있는데, 불일치가 보입니다. **2,000달러 넘게 초과 청구됐습니다.**", "en": "Here's the agent. **It works where our team works.** You can see it has already **processed 14 claims on its own**, and now it's asking me for help. Let's take a closer look.\n\nLooking at the first line, you can see that the customer is billing us; however, we notice a discrepancy — **more than $2,000 over**."}}, {"type": "say", "sp": "deepalok", "t": 4523, "text": {"ko": "한 줄에서 **2,000달러**요? 우리가 들여다보는 수백만 줄 가운데서 이걸 사람이 잡아냈을 것 같지는 않네요. 에이전트가 이걸 바로 찾아내려고 뭔가 마법을 부렸겠죠. 어떻게 한 건가요?", "en": "**$2,000 on one line?** I don't think a human would have picked that up out of the millions of lines we look at. I'm sure the agent did some magic to get this going spontaneously. How did it do that?"}}, {"type": "say", "sp": "sharoon", "t": 4544, "text": {"ko": "좋은 질문입니다. 에이전트는 **Foundry IQ에서 딜 시트(계약서)를 보고, 그걸 청구 파일과 맞춰 본 다음, Fabric IQ 데이터와도 대조했습니다.**\n\n제가 이 청구 건을 맡고 있다면, '전에도 이런 일이 있었나?'를 알고 싶겠죠. 그래서 보시면 에이전트가 제 과거 청구들을 전부 훑어서 **똑같은 패턴의 비슷한 청구 4건**을 찾아냅니다. 더 흥미로운 건, **Work IQ를 살펴 그 결정을 내린 사람들까지 찾아냈다**는 점입니다. 이게 바로 실제로 작동하는 Unilever IQ입니다.\n\n그럼 Unilever가 이 높은 단가를 지불해야 할까요?", "en": "Great question. **It looked at the deal sheet from Foundry IQ, matched it with the claim file, and matched it with Fabric IQ.**\n\nIf I'm working on this claim, I'm trying to understand: has this happened before? So now you can see that the agent goes through all of my past claims and finds **four similar claims with the exact same pattern**. But even more interesting, **it looked at Work IQ to find the people behind those decisions**. And that is Unilever IQ in action.\n\nShould Unilever pay this high rate?"}}, {"type": "shot", "t": 4550, "cap": {"ko": "에이전트의 검증 단계 화면. Silkwell Intensive Care 725ml 라인에서 청구 단가 $1.50과 계약 단가 $1.20이 맞지 않아 $2,154.90이 무효로 표시되고, 근거로 Deal sheet·Claim file·Fabric IQ 데이터가 연결돼 있습니다.", "en": "The agent's validation steps: on the Silkwell Intensive Care 725ml line, the claimed $1.50 vs. contract $1.20 rate mismatch flags $2,154.90 as invalid, linked to the deal sheet, claim file and Fabric IQ data."}, "img": "images/shot-25.jpg"}, {"type": "say", "sp": "deepalok", "t": 4586, "text": {"ko": "사람들을 불러서 에이전트와 사람이 협업하게 해 보죠. 이 거래처의 어카운트 리드인 **Jordan**을 불러서 뭐라고 하는지 봅시다.", "en": "Let's bring in some people and have the agent and the people work collaboratively. Let's call up **Jordan**, who's the account lead for the account, and see what he has to say."}}, {"type": "say", "sp": "sharoon", "t": 4602, "text": {"ko": "바로 그겁니다. Jordan이 이미 여기에 답을 했네요. **일회성 조정으로 정산하자**고 권하고 있습니다. 여기서 제가 오버라이드(예외 승인)를 적용할 수 있고요.\n\n가장 좋은 점은 **Jordan의 판단이 채팅 스레드에만 머물지 않았다**는 겁니다. 다음에 같은 일이 생기면 에이전트가 어떻게 처리해야 할지 알고, 감사(audit)에도 도움이 됩니다.\n\n마지막으로, 아직 남아 있는 4개 항목에 대해서는 에이전트가 Unilever IQ의 이 모든 맥락을 활용해 서한 초안을 작성합니다. **이 청구 한 건에서만 거의 12,000달러의 가치를 지켜 낸 것**입니다.", "en": "Exactly. Jordan has already responded here; he's recommending to **settle this as a one-time adjustment**. I can apply the override here.\n\nThe best part: **Jordan's judgment didn't just stay in the chat thread.** The next time it comes up, the agent knows how to handle it, and it also helps with auditing.\n\nFinally, for the four items that are still pending, the agent drafts a letter leveraging all of this context from Unilever IQ. **That's nearly $12,000 protected in value on this claim alone.**"}}, {"type": "say", "sp": "deepalok", "t": 4643, "text": {"ko": "청구 한 건에 **12,000달러**라니요. 이런 불일치를 찾아낸다면 다른 청구들에서 아낄 수백만 달러를 생각해 보세요. 정말 잘했어요.", "en": "**$12,000 on one claim.** Think about the millions we save on the other claims if we find such discrepancies. Great job."}}, {"type": "say", "sp": "sharoon", "t": 4653, "text": {"ko": "맞습니다. 이 모든 것이 결국 Unilever IQ로 돌아옵니다. **우리 팀이 내리는 모든 결정이 여기에 더해집니다.** 청구 한 건 한 건이 (Unilever IQ를) 더 똑똑하게 만듭니다(자막 불명확). Judson, 다시 넘기겠습니다.", "en": "That's right. All of this comes back to Unilever IQ. **Every decision our team makes is added here.** Every claim makes it (smarter) (caption unclear). Back to you, Judson."}}, {"type": "section", "t": 4658, "title": {"ko": "Microsoft IQ 발표 — 기업 컨텍스트 관리 시스템", "en": "Launching Microsoft IQ — the enterprise context management system"}, "lead": {"ko": "Unilever 사례를 받아 Judson이 신제품 Microsoft IQ를 발표하고, Azure 총괄 Arun Ulag가 그 구성을 설명합니다. 흩어진 협업·업무·문서·웹 데이터를 한곳에 모아 모든 에이전트가 같은 맥락으로 일하게 한다는 것이 핵심입니다. '그 지능은 Microsoft가 아니라 고객의 것'이라는 메시지에 주목하세요.", "en": "Building on Unilever, Judson launches Microsoft IQ and Arun Ulag explains its layers: bringing collaboration, business, document and web context into one place so every agent works from the same context — and that this IQ stays the customer's."}}, {"type": "say", "sp": "judson", "t": 4666, "text": {"ko": "고마워요, 아주 잘했습니다.", "en": "Thank you, well done."}}, {"type": "beat", "t": 4668, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "say", "sp": "judson", "t": 4670, "text": {"ko": "그래서 오늘 우리는 한 걸음 더 나아가 **Microsoft IQ를 출시합니다.** 이것은 여러분의 **엔터프라이즈 컨텍스트 관리 시스템**으로, Copilot과 여러분의 에이전트 전반에서 쓸 수 있는 **오래가는 비즈니스 플러그인**을 만들 수 있게 해 줍니다.\n\n스택의 모든 계층에서 **개방적이고, 다양한 모델을 지원합니다.**", "en": "So we're taking this a step further today by **launching Microsoft IQ**. It's your **enterprise context management system** that enables you to create these **durable business plug-ins** that you can use with Copilot and your agentic estate.\n\nIt's **open and model-diverse** at every layer of the stack."}}, {"type": "shot", "t": 4680, "cap": {"ko": "'Your IQ' 슬라이드. Microsoft IQ를 맨 위에 두고 GitHub·Foundry·Fabric·Azure가 함께 쌓이며, 하단에 Open / Model diverse / Heterogeneous 세 원칙이 적혀 있습니다.", "en": "'Your IQ' slide: Microsoft IQ on top of GitHub, Foundry, Fabric and Azure, with the principles Open / Model diverse / Heterogeneous."}, "img": "images/shot-26.jpg"}, {"type": "say", "sp": "judson", "t": 4699, "text": {"ko": "Azure 담당 EVP, **Arun Ulag**를 무대로 맞아 주십시오.", "en": "Please welcome to the stage EVP of Azure, **Arun Ulag**."}}, {"type": "beat", "t": 4701, "text": {"ko": "(Arun Ulag 등장)", "en": "(Arun Ulag walks on)"}}, {"type": "say", "sp": "arun", "t": 4703, "text": {"ko": "고맙습니다. 좋습니다, 고마워요, Judson. Unilever가 만든 것, 그리고 여기 계신 모든 회사가 만들 수 있는 것은 **여러분의 비즈니스가 어떻게 돌아가는지 이해하는 에이전트**입니다.\n\nMicrosoft IQ는 **조직 전체의 모든 컨텍스트를 한곳에 모아**, 모든 에이전트가 이를 일관되게 사용할 수 있게 해 주는 플랫폼입니다. 여기에는 모든 협업 데이터 — 사람과 사람, 사람과 에이전트 사이의 협업 — 가 포함되고, 모든 비즈니스 데이터, 비정형 데이터, 웹 데이터도 포함됩니다.", "en": "Thank you. All right, thank you, Judson. What Unilever built, and what every company here can build, is **agents that understand how your business works**.\n\nMicrosoft IQ is the platform that allows you to **bring together all of the context across your entire organization into a single place** so that it can be used consistently across all your agents. This includes all your collaboration data, both human-to-human and human-to-agent; it includes all your business data, unstructured data, data from the web."}}, {"type": "say", "sp": "arun", "t": 4741, "text": {"ko": "시작하기는 정말 쉽습니다. **이미 구성 요소를 갖고 계시기 때문**입니다. 모든 Microsoft IQ 고객에게 **Work IQ**는 협업 데이터를 제공합니다. Teams 채팅, 이메일, 문서, 스프레드시트 등 훨씬 더 많은 것들이죠. Work IQ를 통해 **각 에이전트는 자신이 봐야 할 것만 볼 수 있습니다.**\n\n**Fabric IQ**는 여러분이 이미 정의해 둔 모든 지표를, 역시 권한을 그대로 유지한 채 에이전트가 쓸 수 있게 합니다. Azure뿐 아니라 **AWS, Snowflake** 등에서도 가져오기 때문에, 시맨틱을 또 다른 플랫폼에서 다시 만들 필요 없이 바로 쓸 수 있습니다.", "en": "It's really easy to get started, **because you already have the building blocks**. For every Microsoft IQ customer, **Work IQ** makes your collaboration data available — your Teams chats, your email, your documents, your spreadsheets and so much more. With Work IQ, **every agent can see only what they're supposed to see**.\n\n**Fabric IQ** makes all of the metrics that you have already defined available to your agents, again with all of the permissions intact — not just from Azure, but from **AWS, Snowflake** and so much more — so it's ready to go without having to rebuild your semantics in yet another platform."}}, {"type": "term", "term": "Semantic Model", "kr": {"ko": "'매출', '마진' 같은 업무 지표의 공식 정의를 담은 데이터 계층", "en": "A layer holding official definitions of business metrics"}, "body": {"ko": "같은 '매출'이라도 부서마다 계산법이 다르면 숫자가 엇갈립니다. 시맨틱 모델(시맨틱 계층)은 '매출 = 무엇을 어떻게 더한 값'처럼 회사가 합의한 지표 정의와 테이블 간 관계를 정리해 둔 것입니다.\n\nArun이 말한 'Fabric IQ가 이미 정의한 지표를 가져온다'는 것은, 에이전트가 숫자를 제멋대로 계산하지 않고 회사의 공식 정의를 그대로 쓴다는 뜻입니다. AWS나 Snowflake에 있는 정의도 다시 만들 필요가 없다는 점이 강조됐습니다.", "en": "Agreed definitions of metrics and relationships. Fabric IQ lets agents reuse these definitions (even from AWS or Snowflake) instead of computing numbers ad hoc."}}, {"type": "say", "sp": "arun", "t": 4794, "text": {"ko": "**Foundry IQ**로는 조직이 아는 모든 것을 모은 **지식 베이스**를 만들 수 있습니다. 기술 매뉴얼, 사례 연구 등을 에이전트가 이용할 수 있게 되죠. 인터넷의 콘텐츠나 규제 가이드라인은 **Web IQ**가 처리합니다.\n\n**350개 이상의 커넥터**로 비즈니스 컨텍스트 전체를 하나의 통합 플랫폼에 가져올 수 있습니다. 그리고 일이 일어나는 곳 어디서나 작동합니다. 에이전트를 위한 Foundry에서도, 그리고 완전히 개방돼 있기 때문에 **ChatGPT나 Claude 같은 어시스턴트에서도** 작동합니다.", "en": "With **Foundry IQ** you can build **knowledge bases** that bring together everything your organization knows — technical manuals, case studies and beyond — accessible to agents. Content from the internet, regulatory guidelines: **Web IQ** can take care of that.\n\nWith **350-plus connectors**, you can bring your entire business context into one unified platform. It works wherever work happens: in Foundry for your agents, and, because it's completely open, **in assistants like ChatGPT and Claude** as well."}}, {"type": "term", "term": "Connector", "kr": {"ko": "외부 시스템의 데이터를 끌어오는 '어댑터'", "en": "An adapter that pulls data from another system"}, "body": {"ko": "커넥터는 SAP, Salesforce, ServiceNow 같은 다른 회사 시스템이나 저장소에 연결해 데이터를 가져오는 표준 연결 부품입니다. 전기 플러그 어댑터처럼, 시스템마다 다른 '콘센트 모양'을 맞춰 줍니다.\n\nMicrosoft IQ가 350개 이상의 커넥터를 갖췄다는 것은, Microsoft 제품 밖에 있는 회사 데이터까지 한 플랫폼의 맥락으로 끌어올 수 있다는 뜻입니다.", "en": "Standard links into other systems (SAP, Salesforce, etc.). 350+ connectors let Microsoft IQ pull context from outside Microsoft products."}}, {"type": "say", "sp": "arun", "t": 4835, "text": {"ko": "이 컨텍스트는 **여러분의 지적 재산**입니다. 여러분의 IQ입니다. Microsoft의 목표는 **여러분의 IQ가 여러분의 것으로 남도록** 하고, 그 혜택이 Microsoft도, 모델 회사도, 그리고 분명히 여러분의 경쟁사도 아닌 **여러분에게 쌓이는 방식으로 복리처럼 불어나게** 하는 것입니다.\n\n이제 Microsoft IQ가 실제로 작동하는 데모를 보여 드리겠습니다. Copilot에서 매끄럽게 사용하는 모습입니다.", "en": "This context is **your intellectual property**. It's your IQ. Our goal at Microsoft is to ensure that **your IQ stays yours** and it compounds in a way where **the benefits accrue to you** — not to Microsoft, not to the model companies and definitely not to your competitors.\n\nWe're going to show you a demo of Microsoft IQ in action, using it seamlessly in Copilot."}}, {"type": "section", "t": 4874, "title": {"ko": "Microsoft IQ 데모 — 회사 지식을 '플러그인'으로", "en": "Microsoft IQ demo — company knowledge as a plug-in"}, "lead": {"ko": "Eren Orbey가 Microsoft IQ의 실제 화면을 보여 줍니다. 전사 규정 → 법무 → 계약 → 청구팀으로 이어지는 지식의 계층 구조, 소스별 사용 지침, 권한과 IT 인증을 거쳐 '거버넌스가 적용된 플러그인'으로 발행되는 과정이 핵심입니다. 마지막에 분석가가 Copilot에 질문하면 그 맥락이 어떻게 쓰이는지 확인하세요.", "en": "Eren Orbey walks through Microsoft IQ: a hierarchy of knowledge from company-wide to legal, contracts and the claims team; per-source instructions; permissions and IT certification; and publishing as a governed plug-in that Copilot then uses to answer an analyst."}}, {"type": "beat", "t": 4876, "text": {"ko": "(Eren Orbey가 데모 데스크에서 시작)", "en": "(Eren Orbey starts at the demo desk)"}}, {"type": "say", "sp": "eren", "t": 4878, "text": {"ko": "고마워요, Arun. Microsoft IQ는 기업이 그 컨텍스트를 관리하도록 돕는 플랫폼입니다. 우리 지식은 예전엔 여러 시스템에 흩어져 있었는데, 이제는 **완전히 새로운 인터페이스에서 우리의 IQ로 통합되고 체계화**돼 있습니다. 이것들은 Microsoft의 구성 요소로 우리가 만들어 낸 비즈니스 프로세스입니다.\n\n그럼 판촉 청구(trade claims) 프로세스를 보겠습니다. 이건 **전사적으로 적용되는 법무·컴플라이언스 기준** 아래에 있습니다. 법무팀은 특정 스킬과 문서를 검증해 두었고, 이것들이 에이전트를 이런 소스로 안내합니다. 법무 안에는 계약 가이드라인이 있고, 특히 상업 계약에 대한 가이드라인이 있죠. 우리는 그 계층 구조로부터 **자동으로 상속**을 받고, 모든 것이 아래로 흘러내린 다음, 청구팀이 자기 팀 전용 에이전트 스킬을 더할 수 있습니다.", "en": "Thank you, Arun. Microsoft IQ is the platform that helps the enterprise manage that context. Our knowledge used to be scattered across different systems, and now it's **consolidated and codified here in a brand-new interface as our IQ**. These are business processes that we've minted with building blocks from Microsoft.\n\nSo let's take a look at that trade claims process. It sits under **legal and compliance standards that are applied company-wide**. The legal team has vetted certain skills and documents that point agents to sources like these, and within legal we have guidelines for contracts, and specifically for commercial contracts. We **automatically inherit** from that hierarchy, everything flows through, and then our claims team can add their own agent skills."}}, {"type": "shot", "t": 4920, "cap": {"ko": "Microsoft IQ의 'Legal and Compliance' 비즈니스 플러그인 화면(Certified 표시). 왼쪽 트리에 Contracts → Commercial Contracts → Trade Claims 계층이 보이고, 계약 서명 권한 같은 스킬·문서가 목록으로 정리돼 있습니다.", "en": "Microsoft IQ's certified 'Legal and Compliance' business plug-in, with the Contracts → Commercial Contracts → Trade Claims hierarchy on the left and skills/documents such as contract signature authority listed."}, "img": "images/shot-27.jpg"}, {"type": "term", "term": "Agent Skill", "kr": {"ko": "에이전트가 특정 업무를 처리하는 방법을 적어 둔 재사용 가능한 '업무 요령'", "en": "A reusable 'how-to' that tells an agent how to do a task"}, "body": {"ko": "스킬(skill)은 '계약 예외 승인은 누가 할 수 있는지 확인하는 법'처럼, 특정 작업을 할 때 어떤 자료를 보고 어떤 순서로 처리할지 적어 둔 지침 묶음입니다. 신입에게 주는 업무 매뉴얼 한 장과 비슷합니다.\n\n데모에서는 법무팀이 검증한 스킬이 상위 계층에 있고, 청구팀은 이를 상속받아 자기 팀 스킬을 덧붙입니다. 그래서 회사 규칙은 한 번 정해 두면 아래 팀들이 자동으로 따르게 됩니다.", "en": "A packaged set of instructions for a specific task. In the demo, legal-vetted skills are inherited down the hierarchy and the claims team adds its own."}}, {"type": "say", "sp": "eren", "t": 4944, "text": {"ko": "이 스킬들은 우리 조직에서 정의된 책임과 맞물려 동기화됩니다. 실시간 팀 스레드도 끌어왔고, **Foundry IQ는 에이전트형 검색(agentic retrieval)을 위해 파일을 색인**하며, (Fabric IQ는) 여러 클라우드와 개방형 포맷에 걸친 분석 데이터를 가져옵니다(자막 일부 불명확).\n\n여기 있는 모든 소스에는 **에이전트에게 언제, 어떻게 써야 하는지 알려 주는 지침**을 붙일 수 있습니다. 에이전트는 **필요한 것만 불러오고 그 이상은 불러오지 않아, 그만큼 토큰을 아낍니다.**", "en": "These skills sync up with the responsibilities defined in our organization, and we pulled in the live team threads. **Foundry IQ indexes files for agentic retrieval**, and (Fabric IQ) brings in analytical data from across clouds and open formats (caption partly unclear).\n\nEvery source here can be customized with **instructions telling agents when and how to use it**. They **load only what they need and no more, saving tokens** along the way."}}, {"type": "term", "term": "Token", "kr": {"ko": "AI가 글을 읽고 쓰는 단위이자 비용 단위", "en": "The unit AI models read/write in — and pay for"}, "body": {"ko": "토큰은 AI 모델이 텍스트를 쪼개 처리하는 조각으로, 대략 영어 단어의 3/4 정도 크기입니다. 모델 사용료는 보통 입력·출력 토큰 수로 매겨집니다.\n\n에이전트에게 모든 문서를 통째로 넘기면 토큰이 많이 들어 느리고 비쌉니다. Eren이 말한 '필요한 것만 불러와 토큰을 아낀다'는 것은 소스마다 사용 지침을 달아 꼭 필요한 자료만 읽게 한다는 뜻입니다. 뒤 Alaska 데모에서도 지침이 길어지자 토큰 비용이 늘어나는 문제가 나옵니다.", "en": "Chunks of text models process and bill by. Loading only needed sources saves tokens — a theme that returns in the Alaska demo when long instructions raise costs."}}, {"type": "say", "sp": "eren", "t": 4981, "text": {"ko": "엔터프라이즈 안팎의 자산을 가져와 이걸 쉽게 발전시킬 수 있고, 물론 경험을 더 발전시키도록 도와주는 **Copilot 경험**도 있습니다.\n\n**우리 팀의 선택된 이해관계자만** 이것을 보고 편집할 수 있습니다. 최상위 수준에서는 이 컨텍스트를 **IT가 에이전트를 위한 '정답(ground truth)'의 출처로 인증**할 수 있습니다. 여기 보시는 것처럼요. 이 모든 것을 합치면, **오래가고 상호운용 가능하며 거버넌스가 적용된 플러그인**으로 발행할 수 있습니다.", "en": "I can easily evolve this by bringing in assets from our enterprise and beyond, and of course there's a **Copilot experience** to help me evolve it further.\n\n**Only select stakeholders on our team** can view and edit them. At the top level, this context can be **certified by IT as a source of ground truth for agents**, as we see here. Putting it all together, it can be published as a **durable, interoperable, governed plug-in**."}}, {"type": "term", "term": "Ground Truth", "kr": {"ko": "AI가 기준으로 삼아야 할 '공식 정답' 자료", "en": "The authoritative reference data AI should rely on"}, "body": {"ko": "그라운드 트루스는 '이게 공식적으로 맞는 답'이라고 회사가 인정한 기준 자료입니다. 여러 문서가 서로 다른 말을 할 때 에이전트가 무엇을 믿어야 할지 정해 줍니다.\n\n데모에서는 IT가 특정 컨텍스트를 'Certified(인증됨)'로 표시해, 에이전트가 이를 신뢰할 수 있는 기준으로 쓰게 합니다. 거버넌스(누가 만들고 고치고 승인하는지 관리)의 핵심 장치입니다.", "en": "Reference data the company certifies as correct. In the demo IT marks context as Certified so agents treat it as trusted."}}, {"type": "say", "sp": "eren", "t": 5022, "text": {"ko": "이게 청구 분석가에게 가장 본질적인 차원에서 무슨 의미인지 보시죠. 제가 Copilot에게 **'왜 한 유통사의 청구가 높아 보이느냐'**고 물으면, 우리의 IQ가 Copilot을 이런 **신뢰할 수 있는 소스로 곧장 이끕니다.** 받은 응답은 우리 데이터와 계약에 비춰 **맞지 않는 청구 항목들을 차트로 정리**해 줍니다.\n\n우리 프로세스에 따라 다음 단계를 제시하고, **사람의 판단이 필요한 부분은 Copilot이 우리 컨텍스트에 지정된 승인자에게 보낼 이메일 초안**을 작성합니다. Microsoft IQ가 있으면 모든 에이전트와 모든 분석가가 우리가 정의한 같은 프로세스를 따르며, 사내 전문성에 근거한 답을 얻습니다.\n\nHappy Ignite, 여러분.", "en": "Here's what that means at the most essential level for a claims analyst. When I ask Copilot **why one retailer's claim looks high**, our IQ **steers it straight to trusted sources like these**. The response we get **charts the charges that don't match up** according to our data and our contracts.\n\nIt lays out next steps based on our process, and **for anything that needs human judgment, Copilot drafts an email to the approver specified by our context**. With Microsoft IQ, every agent and every analyst can follow the same process that we defined, getting answers grounded in in-house expertise.\n\nHappy Ignite, folks."}}, {"type": "shot", "t": 5045, "cap": {"ko": "Copilot의 답변 화면: 'Northwind 청구 중 $5,690.30은 지불할 의무가 없다'는 결론과 함께 항목별 초과 청구 차트, 그리고 누가 승인해야 하는지(Daniella Booker 등)가 정리돼 있습니다.", "en": "Copilot's answer: '$5,690.30 of Northwind's claim isn't owed', with a per-charge overbilling chart and who signs off (e.g., Daniella Booker)."}, "img": "images/shot-28.jpg"}, {"type": "section", "t": 5071, "title": {"ko": "Jay Parikh — 에이전트를 운영하고 계속 개선하는 플랫폼", "en": "Jay Parikh — a platform to run agents and keep improving them"}, "lead": {"ko": "CoreAI 총괄 Jay Parikh가 '에이전트를 만드는 것'보다 '수천 개를 운영하고 매일 더 좋게 만드는 것'이 진짜 과제라고 짚습니다. GitHub·Fabric·Foundry로 이어지는 플랫폼, 11,000개 이상의 모델과 모델 라우터, 그리고 에이전트를 개선하는 세 가지 방법을 소개하며 Alaska Airlines 데모로 넘어가는 다리 역할을 합니다.", "en": "Jay Parikh argues the real challenge is running thousands of agents and improving them daily. He presents GitHub, Fabric and Foundry, 11,000+ models, the model router, and three ways agents improve — setting up the Alaska Airlines demo."}}, {"type": "say", "sp": "jay", "t": 5071, "text": {"ko": "고마워요, Eren.", "en": "Thanks, Eren."}}, {"type": "beat", "t": 5073, "text": {"ko": "(박수 속에 Jay Parikh 등장)", "en": "(Jay Parikh walks on to applause)"}}, {"type": "say", "sp": "jay", "t": 5076, "text": {"ko": "자, 어떤 CIO에게든 에이전트에 대해 물어보면, 프로덕션 에이전트에는 **ID, 인증, 샌드박싱, 데이터 접근, 모니터링** 같은 것들이 필요하고 목록은 계속 이어집니다. **대부분의 에이전트가 멈춰 서는 곳이 바로 여기**입니다.\n\n그러니 질문은 에이전트를 어떻게 만드느냐가 아니라, **어떻게 수천 개를 만들고 운영하고, 신뢰하고, 매일 더 좋게 만드느냐**입니다. 우리는 여러분이 그렇게 할 수 있도록 기반을 만들었습니다.", "en": "Now, if you ask any CIO about agents: a production agent needs things like **identity, authentication, sandboxing, access to data, monitoring**, and the list goes on — and **that's where most agents stall**.\n\nSo the question isn't how to build an agent; it's **how to build and run thousands of them, trust them, and make them better every day**. We built a foundation to help you do that."}}, {"type": "term", "term": "Sandboxing", "kr": {"ko": "에이전트를 격리된 '모래상자' 안에서만 실행하는 안전장치", "en": "Running an agent in an isolated environment"}, "body": {"ko": "샌드박스는 프로그램이 정해진 울타리 밖의 시스템이나 데이터를 건드리지 못하게 격리된 실행 환경입니다. 아이들이 모래상자 안에서만 노는 것에 빗댄 말입니다.\n\n에이전트는 스스로 코드를 실행하거나 시스템을 조작할 수 있기 때문에, 실수나 공격이 있어도 피해가 번지지 않도록 샌드박스가 필요합니다. Jay는 이것이 ID·인증·모니터링과 함께 '데모용 에이전트'와 '실제 운영 에이전트'를 가르는 요건이라고 말합니다.", "en": "An isolated execution environment that limits what an agent can touch. One of the production requirements (with identity, auth, monitoring) where most agents stall."}}, {"type": "say", "sp": "jay", "t": 5113, "text": {"ko": "포괄적인 엔드투엔드 플랫폼입니다. **GitHub는 만드는 곳, Fabric은 데이터가 정리되는 곳, Foundry는 에이전트가 프로덕션에서 돌아가며 계속 좋아지는 곳**입니다.\n\n오늘은 모델과 모델 선택에서 시작하겠습니다. Foundry에는 OpenAI, Anthropic, Meta, 그리고 우리 자체 모델을 포함해 **11,000개가 넘는 모델**이 있습니다. 중요한 건 숫자가 아니라, **한곳에서 모델을 평가하고, 더 좋은 모델이 나오면 에이전트를 다시 만들 필요 없이 바꿀 수 있다**는 점입니다.", "en": "A comprehensive end-to-end platform: **GitHub is where you build, Fabric is where your data is organized, and Foundry is where your agents run in production and keep getting better**.\n\nToday, let's start with models and model choice. Foundry has **more than 11,000 models**, including OpenAI, Anthropic, Meta and our own models. The number isn't the important point; it's **having one place to evaluate them and switch when a better one comes along, without having to rebuild your agents**."}}, {"type": "shot", "t": 5140, "cap": {"ko": "'11,000+ Foundry models' 슬라이드. 여러 모델 회사 로고가 원형으로 둘러싸고 있어, Foundry가 특정 모델에 묶이지 않는 '모델 선택' 플랫폼임을 보여 줍니다.", "en": "The '11,000+ Foundry models' slide, ringed by model-provider logos — Foundry as a model-choice platform."}, "img": "images/shot-29.jpg"}, {"type": "say", "sp": "jay", "t": 5151, "text": {"ko": "**모델 라우터**를 쓰면 하나만 고를 필요도 없습니다. 간단한 요청은 작고 빠른 모델로, 복잡한 요청은 프런티어 모델로 갑니다. 우리 데이터에 따르면 이렇게 하면 모든 요청을 프런티어 모델로 보내는 것보다 **최대 65% 저렴합니다.** 출력의 품질과 그 출력을 얻는 비용 사이에서 적절한 균형을 잡을 수 있게 해 줍니다.", "en": "With our **model router** you don't have to pick just one: simple requests go to small, fast models; complex ones go to the frontier. Our data shows that this is **up to 65% cheaper** than sending everything to a frontier model. This allows you to strike the right balance between the quality of the output and the cost of getting to that output."}}, {"type": "term", "term": "Model Router", "kr": {"ko": "요청 난이도에 따라 알맞은 AI 모델로 자동 배분하는 '교통정리' 기능", "en": "Automatically routes each request to a fitting model"}, "body": {"ko": "모든 질문을 가장 비싸고 똑똑한 모델(프런티어 모델)에 보내면 품질은 좋지만 비용이 큽니다. 모델 라우터는 요청을 보고 쉬운 것은 작고 싼 모델에, 어려운 것은 큰 모델에 자동으로 보냅니다. 병원 접수처가 증상에 따라 일반의·전문의로 나눠 보내는 것과 비슷합니다.\n\nJay는 Microsoft 데이터 기준으로 이 방식이 전부 프런티어 모델로 보낼 때보다 최대 65% 저렴하다고 밝혔습니다.", "en": "Sends simple requests to small models and hard ones to frontier models. Microsoft cites up to 65% lower cost than using a frontier model for everything."}}, {"type": "say", "sp": "jay", "t": 5178, "text": {"ko": "다음 큰 질문은 이겁니다. 에이전트를 가동하고 나면 **시간이 지나며 어떻게 개선하느냐?** 결국 여러분의 비즈니스는 멈춰 있지 않습니다. 여러분은 늘 열심히 비즈니스를 개선하고 있고, 에이전트도 똑같이 해야 합니다. Foundry는 **세 가지 방법**으로 이를 돕습니다.\n\n첫째, Foundry의 에이전트는 **쓸수록 더 좋아집니다.** 피드백이 시스템으로 들어가 **지속적인 학습 루프**를 만듭니다. 둘째, **Foundry가 에이전트를 더 좋게 만들 방법을 찾습니다.** 시스템이 개선안을 찾아 테스트하고, 각 개선안이 품질·속도·비용을 어떻게 맞바꾸는지 보여 주면, 무엇을 배포할지는 여러분이 결정합니다. 마지막으로, 점진적으로 개선할 수 있는 여러 다른 기능이 있는데, **여러분의 데이터로 자체 모델을 학습시키는 것**까지 가능합니다. 그리고 이렇게 학습된 지능은 모두 **오직 여러분에게만 남습니다.**", "en": "The next big question is: once I have my agents up and running, **how do I improve them over time?** After all, your business isn't static; you're working hard to improve it all the time, and your agents should be doing the same. Foundry helps you do that in **three ways**.\n\nFirst, agents on Foundry **get better the more you use them** — feedback goes into the system, creating a **continuous learning loop**. Second, **Foundry looks for ways to make your agents better**: the system finds and tests improvements, shows you how each one trades off quality, speed and cost, and you get to decide which ships. Finally, a range of other capabilities allow you to improve progressively, **all the way to training your own model using your own data** — and all of this learned intelligence **stays with you and only you**."}}, {"type": "say", "sp": "jay", "t": 5250, "text": {"ko": "**Alaska Airlines**가 바로 이런 루프를 돌리고 있고, 그들이 만든 것을 보여 주러 이 자리에 와 있습니다. 세 가지를 눈여겨보세요. 첫째, 그들이 '더 좋다'를 어떻게 정의하는지. 둘째, 최적화가 그들을 얼마나 멀리 데려가는지. (셋째 항목은 자막 누락)\n\nAlaska Airlines의 **Charu Jain**, 그리고 Microsoft의 **Seth Juarez**를 맞아 주십시오.", "en": "**Alaska Airlines** runs this kind of loop, and they're here with us to show us what they've built. Three things to watch: first, how they define better; second, how far optimization takes them. (third item missing from caption)\n\nPlease welcome **Charu Jain** from Alaska Airlines and **Seth Juarez** from Microsoft."}}, {"type": "section", "t": 5273, "title": {"ko": "Alaska Airlines — 정비 코드 에이전트를 측정·최적화·학습하기", "en": "Alaska Airlines — measuring, optimizing and training a maintenance-code agent"}, "lead": {"ko": "Jay가 말한 '개선 루프'를 Alaska Airlines의 실제 정비 업무로 보여 주는 데모입니다. 정비 기록에 ATA 코드를 붙이는 에이전트를 루브릭으로 채점하고, Foundry optimizer로 정확도를 올리지만 비용이 늘어나는 문제를, 자체 모델 학습(fine-tuning)으로 정확도와 비용을 동시에 잡는 과정이 핵심입니다. 끝까지 '최종 결정은 정비사'라는 원칙도 함께 강조됩니다.", "en": "A live example of Jay's improvement loop: an agent assigns ATA codes to maintenance write-ups, is graded with a rubric, gets more accurate but costlier with the Foundry optimizer, and then a trained model delivers both accuracy and low cost — with engineers always making the final call."}}, {"type": "beat", "t": 5271, "text": {"ko": "(Charu Jain과 Seth Juarez 등장. 배경에 Alaska Airlines 항공기 영상)", "en": "(Charu Jain and Seth Juarez walk on; an Alaska Airlines aircraft fills the screen)"}}, {"type": "say", "sp": "charu", "t": 5273, "text": {"ko": "고마워요, Jay. 항공사는 **시간을 다루는 사업**을 합니다. 믿을 수 있고 정시에 운항하는 것이 우리가 여러분의 신뢰를 얻고 놀라운 여행 경험을 전하는 방법이죠. 우리의 혁신은 고객에게서 출발합니다. 여러분의 여정 곳곳에서 불편한 지점들을 찾아 해결하려 노력합니다.\n\n그래서 시애틀 이웃인 Microsoft와 함께, **운영 현장에 가장 가까운 사람들의 손에 강력한 도구를 쥐여 주고** 있습니다. 지금 보실 내용은 일상 정비에서 시작합니다.", "en": "Thanks, Jay. Airlines are **in the business of time**. Being reliable and running on schedule is how we earn your trust and deliver a remarkable travel experience. Our approach to innovation starts with the guest: we look for pain points across your journey and work to solve them.\n\nSo we're working with our Seattle neighbors at Microsoft to **put powerful tools in the hands of the people who are closest to our operation**. What you're about to see starts with routine maintenance."}}, {"type": "say", "sp": "charu", "t": 5309, "text": {"ko": "모든 정비 보고서에는 **ATA 코드**가 붙고, 이 코드로 전체 기단에 걸친 작업을 추적합니다. 코드가 정밀하고 일관될수록 패턴을 보기 쉽고, 문제가 출발 직전에 드러나기 전에 **미리 대응할 수 있는 이슈를 찾아내기**가 쉬워집니다.\n\n정말 멋진 작업이에요. 빨리 보고 싶네요.", "en": "Every maintenance report gets an **ATA code** that helps us track the work across our fleet. The more precise and consistent that coding is, the easier it is to see patterns and **identify issues we may be able to address proactively**, rather than them showing up closer to departure.\n\nThis is great work. I'm excited to see it."}}, {"type": "term", "term": "ATA Code", "kr": {"ko": "항공기 부위·시스템별로 정비 기록을 분류하는 국제 표준 번호", "en": "Standard numbering that classifies aircraft maintenance by system"}, "body": {"ko": "ATA 코드는 미국 항공운송협회(Air Transport Association)가 만든 'ATA 100' 체계에서 온 번호로, 항공기를 시스템별로 장(chapter)·절(section)로 나눕니다. 예를 들어 32장은 랜딩기어이고, 32-40은 그 안의 '바퀴와 브레이크'입니다.\n\n정비사가 쓴 자유 서술형 기록에 정확한 코드를 붙여 두면, 어떤 부품에서 문제가 반복되는지 기단 전체로 분석할 수 있습니다. 데모에서 에이전트는 '32-00(랜딩기어 일반)'보다 더 정밀한 '32-40'을 제안합니다.", "en": "From the ATA 100 scheme: chapters/sections by aircraft system (e.g., 32 = landing gear, 32-40 = wheels and brakes). Precise codes enable fleet-wide pattern analysis."}}, {"type": "say", "sp": "seth", "t": 5341, "text": {"ko": "이 시나리오를 듣고 저는 **합성 데이터**를 잔뜩 만들었습니다. ATA는 Air Transport Association(항공운송협회)의 약자인데, 모든 코드가 장(chapter)과 절로 나뉘어(자막 불명확) 하나하나에 대응됩니다. 정말 많아요. 꽤 복잡합니다.", "en": "When I heard about this scenario, I generated a whole bunch of **synthetic data**. ATA stands for Air Transport Association, and they have chapters and verses (caption unclear) for every single code that maps to every single — there are a lot of them. It's fairly complex."}}, {"type": "say", "sp": "charu", "t": 5363, "text": {"ko": "시스템을 보죠.", "en": "Let's see the system."}}, {"type": "say", "sp": "seth", "t": 5364, "text": {"ko": "이게 정비 신뢰성 소프트웨어입니다. 일반 점검 중에 **3번 브레이크가 마모 한계에 가깝다**는 걸 발견했고요—", "en": "This is the maintenance reliability software. During a general inspection, they identified the **number three brake is near** its wear limits —"}}, {"type": "say", "sp": "charu", "t": 5376, "text": {"ko": "그건 일상 정비죠.", "en": "That's routine maintenance."}}, {"type": "say", "sp": "seth", "t": 5378, "text": {"ko": "그렇습니다. 그런데 문제는 이겁니다. 엔지니어가 로그북에 적은 코드도 기술적으로는 맞습니다. 랜딩기어의 일부니까요. 하지만 **32-40이 조금 더 정밀한 코드**로 밝혀졌습니다.", "en": "Absolutely. Here's the thing: the engineer coded it in the logbook technically correct — part of the landing gear — but **32-40 turns out to be a little bit more precise**."}}, {"type": "shot", "t": 5385, "cap": {"ko": "Alaska의 'Write-up triage queue' 화면 확대. 3번 브레이크 기록의 현재 코드는 32-00(Landing Gear), 에이전트 제안은 32-40(Wheels and Brakes)이며 'Section differs'로 표시됩니다(합성 데이터).", "en": "Zoom on Alaska's write-up triage queue: the #3 brake write-up is coded 32-00 (Landing Gear); the agent proposes 32-40 (Wheels and Brakes), flagged 'Section differs' (synthetic data)."}, "img": "images/shot-30.jpg"}, {"type": "say", "sp": "charu", "t": 5392, "text": {"ko": "이런 정밀한 코드가 우리가 더 나은 결정을 내리는 데 도움이 될 거예요.", "en": "These precise codes will help us make better decisions."}}, {"type": "say", "sp": "seth", "t": 5397, "text": {"ko": "100%입니다. 들어오는 게 텍스트니까, 텍스트를 보고 ATA 코드를 알아낼 수 있는 **에이전트형 소프트웨어**를 만들 수 있겠다 싶었죠. 가장 중요한 건 **항상 엔지니어가 책임자**라는 겁니다. 엔지니어가 이걸 보고 맞는지 아닌지 확인합니다.\n\nMicrosoft Foundry는 여러분의 에이전트를 만들고 학습시키는 곳입니다. 보시면 **Alaska ATA 에이전트**가 바로 여기 있습니다. 우리가 만든 에이전트죠. 이게 어떻게 작동하는지 알아야 합니다.", "en": "100%. Since it's text coming in, maybe we can make some **agentic software** to look at the text and see if it could figure out the ATA code. The most important thing is **the engineer is always in charge**: they look at this and confirm whether or not it's correct.\n\nMicrosoft Foundry is your place to build and train your particular agents. What you'll see is the **Alaska ATA agent** is right there — there you go, it's an agent that we built. We need to know how it's working."}}, {"type": "say", "sp": "seth", "t": 5437, "text": {"ko": "에이전트 내부를 들여다볼 수 있게 해 주는 **트레이스(trace)**라는 게 있습니다. 트레이스 하나를 열어 두었는데, 여기 보이시죠. 이 에이전트의 **실행 전체**를 볼 수 있습니다. **Alaska IQ**를 가져오는 단계도 포함해서요. Alaska IQ에는 이 ATA 코드들과 나중에 이야기할 몇 가지가 더 들어 있습니다.", "en": "There's something called **traces** that enables us to see inside these agents. I have a trace open — you can see it right here. You can see the **entire run** of this particular agent, including getting your **Alaska IQ**, which includes these ATA codes plus some other stuff that we'll talk about later."}}, {"type": "term", "term": "Trace", "kr": {"ko": "에이전트가 한 번 일할 때 거친 모든 단계를 기록한 '블랙박스'", "en": "A step-by-step record of an agent run"}, "body": {"ko": "트레이스는 에이전트가 요청을 받은 순간부터 어떤 자료를 불러오고, 어떤 도구를 호출하고, 어떤 답을 냈는지까지 한 번의 실행을 단계별로 남긴 기록입니다. 비행기의 블랙박스나 택배 배송 조회와 비슷합니다.\n\n에이전트가 틀렸을 때 '어디서 잘못됐는지'를 찾고, 비용과 시간을 어디에 썼는지 확인하는 데 쓰입니다. Jay가 말한 '운영하며 계속 개선한다'의 출발점입니다.", "en": "A record of every step in one agent run — sources loaded, tools called, outputs — used to debug and measure agents."}}, {"type": "say", "sp": "charu", "t": 5458, "text": {"ko": "그래서 Seth, 모델이 항공 정비 코드를 이해하는 게 얼마나 어려웠나요?", "en": "So, Seth, how hard was it for the model to understand airline maintenance codes?"}}, {"type": "say", "sp": "seth", "t": 5468, "text": {"ko": "우리가 한 일은 이 에이전트를 채점하는 **루브릭**을 만든 겁니다. 루브릭이 보는 세 가지를 보여 드릴게요. 첫 번째는 **정확한 ATA 코드**로, 아주 중요합니다. 또 Alaska IQ의 일부로 **사내 고유 코드(house codes)**가 있는데, 이건 여러분이 일하는 방식에 아주 중요하죠. 그래서 이걸 돌려 봤습니다. 결과 보실래요?", "en": "What we did is we created a **rubric** that grades this agent. Let me show you three things that it takes. Notice the first one, **correct ATA code**, is super important. You also have, as part of your Alaska IQ, your **internal house codes**, which are super important for the way you do stuff. So we ran this. Do you want to see the results?"}}, {"type": "term", "term": "Rubric Evaluation", "kr": {"ko": "채점표로 AI 답변의 품질을 점수화하는 평가 방식", "en": "Scoring AI outputs against a grading rubric"}, "body": {"ko": "루브릭은 '정답 코드를 맞히면 5점, 장(chapter)만 맞으면 1점'처럼 항목별 채점 기준을 정한 표입니다. 이를 이용해 수백 건의 테스트 데이터에 대한 에이전트의 답을 자동으로 채점(eval)합니다.\n\nJay가 '그들이 더 좋다를 어떻게 정의하는지 보라'고 한 것이 바로 이 부분입니다. 기준이 있어야 최적화나 학습 후에 정말 나아졌는지 숫자로 비교할 수 있습니다.", "en": "A scoring guide applied automatically to many test cases. It is how Alaska 'defines better', so improvements can be measured."}}, {"type": "say", "sp": "charu", "t": 5498, "text": {"ko": "보고 싶어요.", "en": "I do."}}, {"type": "say", "sp": "seth", "t": 5500, "text": {"ko": "**생각했던 것만큼 좋지는 않네요.** 더 정확하게 만들려면 에이전트의 자산, 즉 **지침(instructions)이나 도구 설명** 같은 것을 개선할 수 있습니다(자막 일부 불명확). 첫 번째 것부터 해 보죠.\n\nFoundry 안에는 **Foundry optimizer**라는 게 있습니다. 에이전트를 살펴보고 **시스템 프롬프트와 도구 설명을 고쳐서** 실제로 더 나은 것을 내놓습니다. 보시면 많은 걸 바꿨죠. **정확도가 훨씬 좋아졌습니다.** 우리는 프런티어 모델을 쓰고 있었고요.", "en": "**This is not as good as I thought it could be.** To make it more accurate, we can improve the assets of the agent, like **your instructions or our tool descriptions** (caption partly unclear). Let's do the first thing first.\n\nInside of Foundry we have something called the **Foundry optimizer**, and what it does is it looks at your agent and goes through **fixing the system prompt and the tool descriptions** to give us an actual, better one. Notice it changed a lot of stuff. **It's getting way better accuracy.** We were using the frontier model."}}, {"type": "shot", "t": 5540, "cap": {"ko": "Foundry optimizer 실행 결과. 기준(baseline) 0.669에서 최적 후보 candidate_8이 0.829로 올라간 점수 비교가 보입니다.", "en": "Foundry optimizer run: the best candidate (candidate_8) scores 0.829 vs. a 0.669 baseline."}, "img": "images/shot-31.jpg"}, {"type": "term", "term": "System Prompt", "kr": {"ko": "에이전트에게 미리 주는 기본 업무 지시서", "en": "The standing instructions given to an agent"}, "body": {"ko": "시스템 프롬프트는 사용자의 질문과 별도로, 에이전트가 매번 먼저 읽는 '역할과 규칙' 설명입니다. 도구 설명(tool description)은 에이전트가 쓸 수 있는 도구가 무엇을 하는지 알려 주는 문구입니다.\n\n데모의 Foundry optimizer는 이 문구들을 자동으로 고치고 시험해 점수가 오르는 버전을 찾습니다. 다만 지시서가 33단어에서 716단어로 길어지면서, 매번 읽는 토큰이 늘어 비용이 올라가는 부작용이 생깁니다.", "en": "Instructions the agent reads every time. The optimizer rewrote them for accuracy, but they grew from 33 to 716 words, raising token cost."}}, {"type": "say", "sp": "seth", "t": 5547, "text": {"ko": "솔직히 털어놓아야겠네요. 자, **안전벨트 매세요.**", "en": "I have to come clean. Okay, **buckle your seat belts**."}}, {"type": "say", "sp": "charu", "t": 5553, "text": {"ko": "잠깐만요, Seth. 그건 너무—", "en": "Hold on, Seth. That's way —"}}, {"type": "say", "sp": "seth", "t": 5557, "text": {"ko": "제 해명은 이렇습니다. 지침을 미리 불러오느라 **토큰을 훨씬 많이 쓰게 되면서, 입력·출력 토큰 비용이 올라갔습니다.** 그런데 이건 실제로 고칠 수 있습니다. **모델을 학습시켜** 더 많이 알게 하는 거죠.\n\n제가 이런 걸 볼 때 쓰는 팁이 하나 있는데, **지침에 내용이 많이 들어가 있다면, 그걸 모델의 가중치(weights)에 학습시킬 수 있다는 신호**일 수 있습니다.", "en": "Here's my explanation: it turns out because we're **using so many more tokens preloading the instructions, the input and output token costs went up**. We can actually fix that, or **train the model** to know more.\n\nOne of the things that I do when I'm looking at this — a hint: **if you have a lot of stuff in your instructions, that could be an indication you can train it into the model, to have those in the weights**."}}, {"type": "beat", "t": 5560, "text": {"ko": "(화면: 비교 카드 'ATA classifier: accuracy and cost' — Build 87%·월 $92 vs. Optimize 94%·월 $370, '~4x the cost')", "en": "(Screen: comparison card 'ATA classifier: accuracy and cost' — Build 87%, $92 vs. Optimize 94%, $370, '~4x the cost')"}}, {"type": "term", "term": "Fine-tuning / RFT", "kr": {"ko": "자사 데이터로 모델을 추가 학습시켜 지식을 '몸에 배게' 하는 것", "en": "Further training a model on your own data"}, "body": {"ko": "파인튜닝은 이미 만들어진 AI 모델을 우리 회사 데이터로 한 번 더 학습시켜, 매번 긴 지시서를 읽지 않아도 업무 규칙을 '가중치(모델 내부 숫자)'에 기억하게 하는 방법입니다. 매번 매뉴얼을 펼쳐 보는 신입과, 이미 업무가 몸에 익은 숙련자의 차이에 비유할 수 있습니다.\n\n데모 화면의 학습 방식은 'Reinforcement'(강화 미세조정, RFT)로, 정답에 가까울수록 보상을 주며 모델을 다듬습니다. 화면상 기반 모델은 MAI-Code-2-Flash였고, 결과적으로 작은 모델이 더 정확하면서 훨씬 싸졌습니다. Jay가 말한 '학습된 지능은 고객에게만 남는다'와 연결되는 대목입니다.", "en": "Training a model further on your data so rules live in its weights instead of long prompts. The demo used reinforcement fine-tuning (RFT) on MAI-Code-2-Flash, yielding higher accuracy at far lower cost."}}, {"type": "say", "sp": "seth", "t": 5585, "text": {"ko": "그래서 학습 작업을 돌렸습니다. 모니터 화면을 보시면, 진행되면서 수치가 올라가는 차트가 보입니다. 이 모델로 우리가 해낸 결과, 준비되셨나요? **ATA 코드 정확 일치 97%, 루브릭 93%**입니다. 그리고 더 좋아집니다. 모두 한 번 더 안전벨트 매세요.", "en": "We did a training job. If you look at the monitor, as it goes up you'll see a chart that actually shows the things increasing. And are you ready for what we were able to do with this model? **97% on the ATA code exact match, and 93% on the rubric** — and it gets better. Everyone buckle your seat belts one more time."}}, {"type": "say", "sp": "charu", "t": 5618, "text": {"ko": "좋네요, 환상적이에요.", "en": "Nice, that's fantastic."}}, {"type": "beat", "t": 5620, "text": {"ko": "(화면: 비교 카드 완성 — Build 87%·1K건당 $92 / Optimize 94%·$370(약 4배) / Train(MAI-Code-2-Flash RFT 미세조정 모델) 97%·$2(227배 저렴). 월 200만 건 기준으로는 $184,500 / $740,400 / $3,260, '98% 더 효율적, 정확도 +10포인트')", "en": "(Screen: full card — Build 87%, $92 per 1K / Optimize 94%, $370 (~4x) / Train (fine-tuned MAI-Code-2-Flash, RFT) 97%, $2 (227x lower). At 2M write-ups a month: $184,500 / $740,400 / $3,260; '98% more efficient, +10 points more accurate')"}}, {"type": "say", "sp": "charu", "t": 5618, "text": {"ko": "좋네요, 환상적이에요.", "en": "Nice, that's fantastic."}}, {"type": "say", "sp": "seth", "t": 5620, "text": {"ko": "이건 박수 쳐 줘야죠. 이걸 하면 할수록 효율이 더 좋아집니다. 기분이 어떠세요?", "en": "We should clap for this. The more that we do this, the more, you know, efficiency we get. How are you feeling about this?"}}, {"type": "beat", "t": 5628, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "shot", "t": 5630, "cap": {"ko": "최종 요약 카드 'ATA classifier: accuracy and cost'. 기본(Build) 87%·1K건당 $92, 최적화(Optimize) 94%·$370, 학습(Train) 97%·$2. 월 200만 건 기준 비용 $184,500 → $3,260으로, '98% 더 효율적이고 정확도는 10포인트 높다'는 결론입니다.", "en": "Final summary card: Build 87% at $92 per 1K, Optimize 94% at $370, Train 97% at $2. At 2M write-ups/month, $184,500 drops to $3,260 — '98% more efficient, +10 points more accurate'."}, "img": "images/shot-32.jpg"}, {"type": "say", "sp": "charu", "t": 5633, "text": {"ko": "정말 좋아요.", "en": "I'm feeling really good."}}, {"type": "say", "sp": "seth", "t": 5635, "text": {"ko": "놀랍죠. 실제로 해냈어요. 꽤 멋집니다.", "en": "It's amazing. We actually made it work. It's pretty cool."}}, {"type": "say", "sp": "charu", "t": 5638, "text": {"ko": "Seth, 제가 이 작업에서 정말 좋아하는 점은 **운영 현장에 가까운 사람들에게서 시작했다**는 거예요. 그들이 해결할 수 있는 문제를 발견했고, 이제는 스스로 해결책을 만들 도구를 갖게 됐죠.\n\n**사람은 언제나 중심에 있습니다. AI가 추천하고, 결정은 우리 정비 엔지니어가 내립니다.** 이것이 우리가 기술로 직원들에게 힘을 실어 주는 방식이고, Alaska Airlines가 열어 가는 혁신입니다.", "en": "Seth, what I love about this is it **started with people close to the operation**. They saw a problem they could solve; now they have the tools to build the solution themselves.\n\n**People always remain at the center: AI makes the recommendation, our maintenance engineers make the decision.** That's how we're using technology to empower our people, and that's the innovation we're unlocking at Alaska Airlines."}}, {"type": "say", "sp": "seth", "t": 5669, "text": {"ko": "Alaska Airlines에 아는 분 있으세요? **티타늄에서 골드로** 올라갈 방법이 있을까요?", "en": "Do you know people at Alaska Airlines? Is there a way to get **from titanium to gold**?"}}, {"type": "beat", "t": 5679, "text": {"ko": "(웃음 — Seth가 자신의 마일리지 등급을 올려 달라는 농담)", "en": "(Laughter — Seth jokingly asks for a frequent-flyer status upgrade)"}}, {"type": "say", "sp": "charu", "t": 5680, "text": {"ko": "더 많이 타셔야 할 것 같네요.", "en": "I think you'll have to fly more."}}, {"type": "say", "sp": "seth", "t": 5683, "text": {"ko": "한 번 더 안전벨트 매시죠. 넘기겠습니다.", "en": "Let's buckle up one more time. Over to you."}}, {"type": "beat", "t": 5688, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "say", "sp": "jay", "t": 5693, "text": {"ko": "고마워요, Seth. 멋진 데모였습니다.", "en": "Thanks, Seth, great demo."}}, {"type": "section", "t": 5698, "title": {"ko": "MAI 자체 모델 — 프런티어 성능을 감당 가능한 가격에", "en": "MAI's own models — frontier capability at a price you can scale"}, "lead": {"ko": "인텔리전스(Intelligence) 파트의 마지막 순서로, Microsoft AI(MAI) CEO 무스타파 술레이만이 Microsoft가 직접 만든 모델 제품군을 소개합니다. 핵심 메시지는 '토큰 비용이 폭증하는 지금, 일상 업무에는 프런티어 가격을 낼 필요가 없다'는 가격 대비 성능, 그리고 '가중치(weights)까지 고객이 통제하는 모델'입니다. 코딩·의사결정·보안·이미지·의료 음성 모델별로 화면에 뜨는 비교 수치에 주목하며 들으면 됩니다.", "en": "The last part of the Intelligence pillar: Mustafa Suleyman, CEO of Microsoft AI (MAI), presents Microsoft's own family of models. The core message is price-performance — with token spend exploding, you shouldn't pay frontier prices for everyday work — and models whose weights you control. Listen for the comparison numbers for each model: coding, decision, cyber, image and medical speech."}}, {"type": "say", "sp": "mustafa", "t": 5698, "text": {"ko": "MAI에서 저희의 미션은 여러분께 세계 최고의 모델을 만들어 드리고, 모든 개발자와 조직이 **역량의 최전선(frontier)**에서 일할 수 있게 하는 것입니다. 모든 CIO와 CFO에게서 거듭 듣는 이야기는, 지금 **토큰 지출이 천정부지로 치솟고 있다**는 것입니다. 그리고 프런티어 가격으로는 계산이 맞지 않습니다.\n\n그래서 저희의 약속은 여러분이 에이전트를 진짜로 확장할 수 있도록 업계 최고의 **가격 대비 성능**을 드리는 것입니다. 또 여러분이 진정으로 '내 것'이라고 느낄 수 있는 모델, 즉 가중치(weights)를 직접 통제할 수 있는 모델을 원하신다는 것도 알고 있습니다.", "en": "Our mission at MAI is to build you the very best models in the world and keep every developer and organization operating right at the **absolute frontier of capability**. What I hear time and again from every CIO and CFO is that right now **token spend is going through the roof**. And at frontier prices the math isn't sustainable.\n\nSo our commitment is to give you the very best **price performance** out there so that you can really scale your agents. We also know that you want models that feel truly yours, where you get to control the weights."}}, {"type": "term", "term": "Price-performance & token spend", "kr": {"ko": "가격 대비 성능과 토큰 비용", "en": "Price-performance and token spend"}, "body": {"ko": "AI 모델은 글자 조각인 '토큰' 단위로 요금을 받습니다. 질문(입력)과 답변(출력)이 길수록, 그리고 에이전트가 여러 단계를 스스로 돌수록 토큰이 많이 쓰입니다.\n\n에이전트를 수천~수만 개 돌리면 토큰 비용이 기하급수적으로 늘어납니다. 그래서 '같은 일을 얼마나 싸게 해내느냐(가격 대비 성능)'가 기업 AI 확산의 핵심 변수가 됐습니다.\n\n이 키노트에서 MAI는 '최고 성능 모델의 거의 같은 품질을 몇 분의 1 가격에' 제공한다는 점을 계속 강조합니다.", "en": "Models are billed per token (chunks of text). Agents that run many steps consume huge numbers of tokens, so cost per task — price-performance — has become the key variable for scaling enterprise AI. MAI's pitch throughout is near-frontier quality at a fraction of the price."}}, {"type": "say", "sp": "mustafa", "t": 5735, "text": {"ko": "저희는 품질과 가격을 **함께 최적화**합니다. 그리고 이것을 계속 반복합니다. 출시하고, 배우고, 개선하고, 다시 반복합니다.\n\n코딩을 예로 들어 보겠습니다. [MAI Code 2는] 일상적인 기업 코딩 작업을 겨냥한 널리 쓰이는 벤치마크 4개의 평균으로, [GPT-6.1 Sol 대비] **98%의 성능을 단 40%의 비용**으로 제공합니다. [Opus 5.5와 비교하면 96%의 성능을] 무려 **5%의 비용**으로 냅니다. (자막 일부 누락 — 괄호 안은 화면 슬라이드 기준)", "en": "We co-optimize quality and price together. We keep doing it over and over. We ship, we learn, we improve, we repeat.\n\nTake coding for example: [MAI Code 2,] averaged over four widely used benchmarks that target everyday enterprise coding tasks, gives you **98% of the performance [of GPT-6.1 Sol] at just 40% of the cost**. [Against Opus 5.5, it's 96% of the performance at] an incredible **5% of the cost**. (caption partly missing — bracketed parts from the on-screen slide)"}}, {"type": "shot", "t": 5774, "cap": {"ko": "MAI Code 2 비교 슬라이드: GPT 6.1 Sol 대비 성능 98%·가격 40%, Opus 5.5 대비 성능 96%·가격 5%. MAI가 내세우는 '가격 대비 성능'을 한눈에 보여줍니다.", "en": "MAI Code 2 vs. GPT 6.1 Sol (98% performance, 40% price) and Opus 5.5 (96% performance, 5% price) — the price-performance claim in one frame."}, "img": "images/shot-33.jpg"}, {"type": "say", "sp": "mustafa", "t": 5774, "text": {"ko": "Code [2] Flash도 마찬가지입니다. 이런 일상 작업에서 GPT-6 Luna, Haiku 5.5와 같은 성능을 내면서, 가격은 각각 **65%와 20%**에 불과합니다.\n\n그런데 에이전트는 점점 더 '결정'을 내려야 하고, 특히 속도와 비용이 중요한 곳에서 그렇습니다. 그래서 **Decision 1.1**은 여러분의 애플리케이션 안에 바로 **모델 라우팅**을 제공합니다. Decision 지수(decision index)에서 Google과 OpenAI를 앞섭니다.", "en": "Same goes for Code [2] Flash: it matches GPT-6 Luna and Haiku 5.5 on these everyday tasks at just **65% and 20% of the price** respectively.\n\nBut agents are increasingly needed to make decisions, especially where speed and cost are critical. So **Decision 1.1** provides **model routing** right into your applications. On the decision index it beats Google and OpenAI."}}, {"type": "term", "term": "Model routing", "kr": {"ko": "모델 라우팅 — 요청마다 알맞은 모델로 보내기", "en": "Model routing"}, "body": {"ko": "모델 라우팅은 들어온 요청을 보고 '이건 작고 싼 모델로 충분하다', '이건 큰 모델이 필요하다'를 판단해 알맞은 모델로 보내 주는 기능입니다. 콜센터에서 문의 내용을 보고 담당 부서로 연결해 주는 교환원과 비슷합니다.\n\n키노트 설명에 따르면 Decision 1.1은 빠르고 효율적인 '앱 내 의사결정' 모델로, 이런 라우팅 기능을 애플리케이션 안에 직접 넣어 줍니다. 속도와 비용이 중요한 결정을 에이전트가 빠르게 내리게 하는 것이 목적입니다.", "en": "Model routing sends each request to the right model — small and cheap when that's enough, large when needed — like a switchboard operator. Per the keynote, Decision 1.1 is a fast, efficient in-app decision model that brings this routing directly into applications."}}, {"type": "say", "sp": "mustafa", "t": 5801, "text": {"ko": "여기서 꼭 말씀드려야 할 점이 있습니다. 저희는 이 모델들을 고객들이 **매일 하는 코딩 작업**(기능 개발, 버그 수정, 리팩터링, 코드 리뷰, 마이그레이션)에 우선순위를 두고 만들었습니다. 그래서 더 어려운 문제나 아주 긴 호흡의 에이전트 작업에는 **아직 일부러 맞추지 않았습니다**. 저희는 여러분의 비용을 들여 그런 틈새 영역을 쫓지 않겠습니다.\n\n[그렇지 않으면] 여러분은 그 능력에 대한 값을 모든 작업마다, **평범한 버그 수정 하나에도** 치르게 됩니다. 프런티어 가격은 여러분에게 정말 중요한 일에만 쓰십시오. (자막 불명확)", "en": "Now it's super important to say: we built these models to prioritize **the coding work that our customers do every single day**, so they're **explicitly not yet tuned** for the harder problems and very long-horizon agentic work. We won't chase those niche prospects at your expense.\n\n[Otherwise] you pay for that capability on every task, **even for a routine bug fix**. Keep [paying] that frontier price [for] what's important to you. (caption unclear)"}}, {"type": "term", "term": "Long-horizon agentic work", "kr": {"ko": "긴 호흡의 에이전트 작업", "en": "Long-horizon agentic work"}, "body": {"ko": "에이전트가 몇 시간~며칠에 걸쳐 수십·수백 단계를 스스로 계획하고 실행해야 하는 작업을 말합니다. 대형 연구 과제나 큰 시스템을 처음부터 만드는 일 같은 것입니다.\n\n이런 작업은 최상위(프런티어) 모델이 필요하고 그만큼 비쌉니다. 무스타파는 MAI Code 모델이 이런 영역이 아니라 매일 반복되는 코딩에 맞춰져 있다고 선을 긋습니다. 슬라이드 문구 그대로 '버그 하나 고칠 때마다 프런티어 과학 비용을 낼 필요는 없다'는 것입니다.", "en": "Tasks where an agent plans and executes many steps over hours or days. They need (expensive) frontier models. Mustafa explicitly positions MAI Code for everyday coding instead: \"You shouldn't pay for frontier science on every bug fix.\""}}, {"type": "say", "sp": "mustafa", "t": 5849, "text": {"ko": "AT&T의 맞춤 버전[MAI Code 2 Flash 기반]은 5G 관련 작업에서 [GPT-]6.1보다 더 좋은 성능을 내면서도 무려 **50배 더 저렴**했습니다. (자막 일부 불명확)", "en": "AT&T's custom version [of MAI Code 2 Flash] outperformed [GPT-]6.1 for 5G while being a whopping **50x cheaper**. (caption partly unclear)"}}, {"type": "say", "sp": "mustafa", "t": 5858, "text": {"ko": "사이버 보안에서도 같은 이야기입니다. 지난 몇 달은 우리 모두에게 **경종이자 경고 사격**이었다고 생각합니다. 우리는 공격과 익스플로잇이 그 어느 때보다 싸고 쉬워진, 완전히 새로운 현실에 직면해 있습니다. 그렇기 때문에 **에이전트 보안, 정렬(alignment), 격리(containment)**가 2027년과 그 이후에 우리가 반드시 제대로 해내야 할 가장 중요한 일이 될 것입니다.\n\n**MAI Cyber 2 Flash**가 저희의 답입니다. 엔드투엔드로, [GPT-6 Astra 대비] **작업당 비용 2% 미만**입니다. 정말 놀랍습니다.", "en": "Now it's the same story in cybersecurity. The last few months have really been, I think, **a wake-up call and a warning shot** for all of us. We're facing a completely new reality, where these attacks and exploits are cheaper and easier than ever before, and that means **agent security, alignment and containment** are going to be the most important things that we need to get right in 2027 and beyond.\n\n**MAI Cyber 2 Flash** is our response. End to end, at **less than 2% of the cost per task** [vs. GPT-6 Astra]. Truly remarkable."}}, {"type": "beat", "t": 5899, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "say", "sp": "mustafa", "t": 5900, "text": {"ko": "이것이 바로 수십 년간 쌓아온 Microsoft의 **독점 데이터**와 세계적 수준의 보안 전문성의 힘입니다. 덕분에 놀라운 가격으로 올바른 수정 방법을 추천하는 모델을 드릴 수 있습니다.", "en": "You know, that's the power of Microsoft's decades of **proprietary data** and world-class security expertise, enabling us to bring you a model that recommends the right fixes at an incredible price."}}, {"type": "say", "sp": "mustafa", "t": 5919, "text": {"ko": "멀티모달에서도 똑같이 빠르게 움직이고 있습니다. **MAI Image 2.7**은 [Artificial Analysis 이미지 편집 순위에서] **세계 1위 이미지 편집 모델**이며, 경쟁 제품의 **5분의 1 비용**입니다. Adobe, Sports Illustrated[, manus] 같은 고객들은 반응이 빠른 편집과 함께 최상급 품질을 얻고 있습니다.\n\n[MAI Transcribe 2는] 세계에서 가장 빠르고 가장 정확합니다. 의료는 아마 모든 AI 활용 분야 중 가장 중요하고, 가장 복잡하며, 위험 부담이 큰 분야일 겁니다. 그래서 MAI[Transcribe 2]는 Dragon에서 **한 달 1,000만 건의 환자 진료**에 배포되었고, **오류율을 절반으로** 줄였습니다. (자막 일부 불명확 — 괄호 안은 화면 기준)", "en": "We're moving just as fast in multimodal. **MAI Image 2.7** is the **world's number one image editing model** [on Artificial Analysis Image Editing] at **a fifth of the cost** of the competition. Customers like Adobe and Sports Illustrated[, manus] get super quality with responsive edits.\n\n[MAI Transcribe 2 is] the fastest and most accurate in the world. Medicine is probably the most important, most complex and high-stakes of any of the AI applications, so MAI [Transcribe 2] has been deployed to **10 million Dragon patient encounters a month** while **halving the error rate**. (caption partly unclear — bracketed parts from screen)"}}, {"type": "shot", "t": 5964, "cap": {"ko": "MAI Transcribe 2 슬라이드: 월 1,000만 건의 환자 진료, 오류 50% 감소. 의료 음성 기록(Dragon)에 실제로 적용된 성과입니다.", "en": "MAI Transcribe 2: 10M patient encounters a month, 50% reduction in errors — real deployment in Dragon medical dictation."}, "img": "images/shot-34.jpg"}, {"type": "term", "term": "Dragon (medical speech)", "kr": {"ko": "Dragon — 의료용 음성 인식·기록 솔루션", "en": "Dragon medical speech"}, "body": {"ko": "Dragon은 Microsoft(Nuance)의 의료용 음성 인식 제품 계열로, 의사가 진료하며 말한 내용을 자동으로 받아 적어 진료 기록을 만들어 줍니다.\n\n의료 기록은 작은 받아쓰기 오류도 환자 안전에 영향을 줄 수 있어 정확도가 매우 중요합니다. 키노트 설명에 따르면 MAI의 음성 모델(MAI Transcribe 2)이 이 Dragon에서 매달 1,000만 건의 진료에 쓰이며 오류를 절반으로 줄였습니다.", "en": "Dragon is Microsoft/Nuance's medical speech product line that turns doctor–patient conversations into clinical notes. Per the keynote, MAI Transcribe 2 now powers 10M encounters a month in Dragon and halved errors."}}, {"type": "say", "sp": "mustafa", "t": 5966, "text": {"ko": "저드슨이 가장 잘 말했습니다. 이번 플랫폼 전환에서 여러분의 IP, 즉 여러분이 수년간 모아 온, 여러분 회사를 지금의 회사로 만든 상업 데이터, 그것이 바로 **여러분의 IQ**입니다. 리더들에게서 거듭 들었습니다. **아무도 자기 IQ를 남의 모델에 쏟아붓고 싶어 하지 않습니다.**\n\n그리고 [출처를 알 수 없는] 오픈 모델 위에 구축한다면, 그 모델이 어디서 왔는지, 여러분의 가장 소중한 IP와 데이터 위에서 어떻게 동작할지 정말 믿을 수 있겠습니까. (자막 불명확)", "en": "Judson said it the best: in this platform shift, your IP — the years of commercial data that you assembled, that makes your company what it is — that's **your IQ**. I have heard it again and again from leaders: **no one wants to pour their IQ into somebody else's model.**\n\nAnd if you build on open [models], [can] you really trust where they've come from and how they behave on your most valuable IP and data? (caption unclear)"}}, {"type": "say", "sp": "mustafa", "t": 6001, "text": {"ko": "저희는 그 목소리를 들었습니다. 그래서 [Alaska Airlines,] DocuSign, Rakuten[, Woven by Toyota] 같은 **맞춤형 모델(custom models)**부터 시작했습니다. 여러분의 특정한 필요에 맞는 작업에서 더 빠르고 더 뛰어난 모델들입니다. 그리고 오늘 저희는 큰 걸음을 내딛습니다.\n\n**여러분이 통제하는 모델(Models under your control)**입니다. 프런티어 모델을 가져와, 원한다면 여러분의 독점 데이터로 맞춤화하고, 누가 접근할지도 여러분이 통제합니다. 여러분의 데이터는 **온전히 여러분의 것**으로 남습니다. 저희는 Frontier Company를 통해 여러분과 함께 그 모델을 여러분의 제품과 에이전트 안에 심어 드리겠습니다.", "en": "We heard you. We started with **custom models** — [Alaska Airlines,] DocuSign, Rakuten[, Woven by Toyota] — faster and better at the tasks that meet your specific needs. Today we're taking a big step forward.\n\n**Models under your control**: you take a frontier model, customize it using your proprietary data if you want, and you control who has access to it. Your data **stays entirely yours**. We'll work with you through Frontier Company to embed it in your own products and agents."}}, {"type": "shot", "t": 6036, "cap": {"ko": "'Licensed Weights — Models under your control' 슬라이드: 고객의 에이전트·제품, 고객의 Azure 환경, 고객의 독점 데이터 위에 프런티어 MAI 모델을 올리는 구조입니다.", "en": "\"Licensed Weights — Models under your control\": a frontier MAI model inside your agents and products, your Azure environment, with your proprietary data."}, "img": "images/shot-35.jpg"}, {"type": "term", "term": "Licensed weights (Models under your control)", "kr": {"ko": "라이선스 가중치 — 고객이 통제하는 모델", "en": "Licensed weights"}, "body": {"ko": "모델의 '가중치(weights)'는 AI가 학습으로 얻은 지식이 숫자로 저장된 본체입니다. 보통 API로 빌려 쓰는 모델은 가중치가 공급사 서버에 있어 고객이 손댈 수 없습니다.\n\n키노트 설명에 따르면 'Models under your control(Licensed Weights)'은 프런티어 MAI 모델을 고객의 Azure 환경 안에 두고, 원하면 고객 독점 데이터로 맞춤화하며, 접근 권한도 고객이 정하는 방식입니다. 남의 집에 세 들어 사는 대신 내 집을 갖는 것에 비유할 수 있습니다.\n\n이 키노트의 '여러분의 IQ는 여러분의 것' 메시지를 모델 차원에서 구현한 발표입니다.", "en": "Weights are the learned 'body' of a model. Per the keynote, Models under your control (Licensed Weights) put a frontier MAI model in your own Azure environment, optionally customized with your data, with you controlling access — the model-level version of 'your IQ stays yours.'"}}, {"type": "say", "sp": "mustafa", "t": 6047, "text": {"ko": "정리하면, 탁월한 가격 대비 성능을 갖춘 세계적 수준의 모델 제품군입니다. 세계 최고의 이미지 편집 모델, [작업당] **2%의 비용**[으로 동작하는 사이버 모델], 그리고 여러분이 진짜로 확장할 수 있는 가격의 세계적 수준 일상 코딩 모델까지요. (자막 일부 불명확)\n\n결정적으로, 이 모든 것이 **여러분의 IQ, 여러분의 에이전트**와 함께, 모두 여러분의 통제 아래 있습니다. 이것이 여러분이 신뢰할 수 있는 회사가 만든, **여러분이 신뢰할 수 있는 프런티어 인텔리전스**입니다. 저드슨, 넘기겠습니다.", "en": "So that's a family of world-class models with exceptional price performance: the world's best image editing model, [a cyber model] at **2% of the cost**, and world-class everyday coding models at a price you can truly scale. (caption partly unclear)\n\nCrucially, all of it with **your IQ, your agents**, all under your control. This is **frontier intelligence that you can trust**
