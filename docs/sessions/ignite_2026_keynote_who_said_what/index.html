<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsoft Ignite 2026 오프닝 키노트 · 화자별 정리</title>
<meta name="description" content="Microsoft Ignite 2026 오프닝 키노트의 흐름을 27명의 발언자별로 정리했습니다. Satya Nadella부터 BNY CIO까지, 약 2시간 26분의 발언과 용어 설명을 한국어·영어로 제공합니다.">
<link rel="stylesheet" href="../../css/site.css">
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f7; --bg3:#fbfbfd;
  --fg:#1d1d1f; --fg2:#424245; --fg3:#6e6e73;
  --ac:#0066cc; --ac2:#0071e3;
  --line:rgba(0,0,0,.09);
  --lbg:#ffffff; --lbd:rgba(0,0,0,.09);
  --rbg:#f0f4f9; --rbd:#d6e3f2;
  --tbg:#fffaf0; --tbd:#f0dfb8; --tac:#9a6a00;
  --shadow:0 18px 50px rgba(0,0,0,.10);
}
html[data-theme="dark"]{
  --bg:#000000; --bg2:#0b0b0d; --bg3:#111114;
  --fg:#f5f5f7; --fg2:#c8c8cd; --fg3:#8e8e93;
  --ac:#4da3ff; --ac2:#4da3ff;
  --line:rgba(255,255,255,.12);
  --lbg:#141416; --lbd:rgba(255,255,255,.09);
  --rbg:#121a24; --rbd:#20344a;
  --tbg:#1c1708; --tbd:#463a19; --tac:#e3b757;
  --shadow:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}

.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}
.kicker{font-size:12.5px;color:var(--fg3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--bg2);border-radius:980px;padding:3px}
.seg button{border:0;background:transparent;color:var(--fg3);font:inherit;font-size:12.5px;padding:5px 13px;border-radius:980px;cursor:pointer;transition:.18s}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.icobtn{border:1px solid var(--line);background:transparent;color:var(--fg2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center}

.hero{max-width:900px;margin:0 auto;padding:74px 24px 30px;text-align:center}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:20px}
h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Apple SD Gothic Neo",sans-serif;
  font-size:clamp(34px,5.6vw,60px);line-height:1.1;letter-spacing:-.028em;font-weight:700;margin:0 0 24px}
h1 .ac{color:var(--ac)}
.sub{font-size:clamp(16px,2vw,19px);line-height:1.66;color:var(--fg2);max-width:740px;margin:0 auto}
.meta{margin-top:28px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:980px;padding:8px 16px;font-size:13px;color:var(--fg3)}
.pill b{color:var(--fg);font-weight:600}
.btn{background:var(--ac);color:#fff;border-radius:980px;padding:9px 20px;font-size:13.5px;font-weight:600}
.btn:hover{text-decoration:none;opacity:.9}

.thumbwrap{max-width:940px;margin:16px auto 0;padding:0 24px}
.thumb{position:relative;display:block;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);line-height:0}
.thumb img{width:100%;height:auto;display:block}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.45));opacity:0;transition:.25s}
.thumb:hover .play{opacity:1}
.thumb .play span{background:rgba(255,255,255,.95);color:#111;border-radius:980px;padding:11px 22px;font-size:14px;font-weight:600}
.cap{text-align:center;font-size:12.5px;color:var(--fg3);margin-top:12px}

/* ---------- blocks: headings for nav areas ---------- */
.blk{max-width:1040px;margin:64px auto 0;padding:0 24px}
.blk>h3{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:0 0 6px;font-weight:600}
.blk>p.hint{font-size:13.5px;color:var(--fg3);margin:0 0 16px;line-height:1.6}

/* ---------- cast ---------- */
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:10px}
.cc{display:flex;gap:11px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;
  background:var(--bg3);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.18s}
.cc:hover{border-color:var(--ac)}
.cc.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 30%,transparent)}
.cc img,.cc .ini{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg3)}
.cc .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cc .rl{font-size:11.5px;color:var(--fg3);line-height:1.35;margin-top:2px}
.cc .ct{font-size:11px;color:var(--ac);margin-top:3px;font-variant-numeric:tabular-nums}
.cc.ms .nm::after{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--ac);margin-left:6px;vertical-align:1px}
.filterbar{display:none;position:sticky;top:55px;z-index:40;max-width:860px;margin:18px auto 0;padding:10px 16px;border-radius:14px;
  background:color-mix(in srgb,var(--ac) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);
  font-size:14px;align-items:center;gap:10px}
.filterbar.on{display:flex}
.filterbar img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.filterbar span{flex:1}
.filterbar button{border:0;background:var(--ac);color:#fff;border-radius:980px;padding:6px 14px;font:inherit;font-size:12.5px;cursor:pointer}

/* ---------- toc ---------- */
.part-t{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ac);margin:22px 0 8px;text-transform:uppercase}
.part-t:first-child{margin-top:4px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.toc a{display:flex;gap:11px;align-items:baseline;padding:11px 14px;border:1px solid var(--line);border-radius:13px;color:var(--fg2);font-size:14px;background:var(--bg3);transition:.18s;line-height:1.45}
.toc a:hover{text-decoration:none;border-color:var(--ac);color:var(--fg)}
.toc .n{color:var(--ac);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.toc .tm{margin-left:auto;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;flex:none;padding-left:8px}

/* ---------- main ---------- */
main{max-width:860px;margin:0 auto;padding:0 24px 120px}
.part{margin-top:110px;padding:44px 0 6px;text-align:center;border-top:1px solid var(--line);scroll-margin-top:60px}
.part .pk{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--ac);text-transform:uppercase}
.part h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;font-size:clamp(28px,4.4vw,44px);letter-spacing:-.025em;margin:12px 0 14px;line-height:1.15}
.part p{color:var(--fg2);font-size:16.5px;line-height:1.7;max-width:680px;margin:0 auto}
.sec{margin-top:80px;scroll-margin-top:70px}
.sec-head{display:flex;align-items:baseline;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sec-n{font-size:12px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.sec-t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;font-size:clamp(21px,3vw,28px);letter-spacing:-.02em;font-weight:700;margin:0;flex:1;line-height:1.3}
.sec-time{flex:none}
.lead{margin:18px 0 34px;padding:14px 18px;border-left:3px solid var(--ac);background:var(--bg2);border-radius:0 12px 12px 0;
  font-size:15px;line-height:1.75;color:var(--fg2)}
.lead b.lt{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:4px}
.lead strong{color:var(--fg)}

.turn{display:flex;gap:14px;margin:0 0 24px}
.turn.r{flex-direction:row-reverse}
.av{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;margin-top:2px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg3);border:1px solid var(--line);background:var(--bg2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.turn.r .body{align-items:flex-end}
.who{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.turn.r .who{flex-direction:row-reverse}
.who b{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.who i{font-style:normal;font-size:11.5px;color:var(--fg3)}
.ts{font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:980px;padding:1px 8px}
a.ts:hover{border-color:var(--ac);color:var(--ac);text-decoration:none}
.bub{border-radius:16px;padding:16px 19px;font-size:16.3px;line-height:1.78;letter-spacing:-.003em;max-width:92%;text-align:left}
.turn.l .bub{background:var(--lbg);border:1px solid var(--lbd);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.03);border-top-left-radius:5px}
.turn.r .bub{background:var(--rbg);border:1px solid var(--rbd);color:var(--fg);border-top-right-radius:5px}
.turn.n .bub{background:transparent;border:1px dashed var(--line);color:var(--fg2);font-style:italic}
.bub p{margin:0 0 12px}
.bub p:last-child{margin:0}
.bub strong{color:var(--ac);font-weight:600}
.bub code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.87em;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.beat{text-align:center;color:var(--fg3);font-size:13.5px;font-style:italic;margin:6px auto 24px;max-width:640px;line-height:1.6}
.beat a.ts{font-style:normal;margin-right:6px}

figure.shot{margin:30px 0 32px}
figure.shot a.im{display:block;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);line-height:0;border:1px solid var(--line)}
figure.shot img{width:100%;height:auto;display:block}
figure.shot figcaption{font-size:13.5px;color:var(--fg3);line-height:1.65;margin-top:10px;display:flex;gap:9px;align-items:baseline}
figure.shot figcaption span{flex:1}

.term{margin:6px auto 30px;max-width:94%;background:var(--tbg);border:1px solid var(--tbd);border-radius:16px;overflow:hidden}
.term>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;user-select:none}
.term>summary::-webkit-details-marker{display:none}
.term>summary:hover{background:color-mix(in srgb,var(--tbd) 22%,transparent)}
.term-tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tac);border:1px solid var(--tbd);border-radius:980px;padding:3px 9px;flex:none}
.term>summary b{font-size:15.5px;letter-spacing:-.015em}
.term>summary .kr{font-size:13px;color:var(--fg3);flex:1;min-width:0}
.term .chev{flex:none;color:var(--tac);font-size:12px;transition:transform .2s;margin-left:auto}
.term[open] .chev{transform:rotate(180deg)}
.term-b{font-size:15px;line-height:1.75;color:var(--fg2);padding:16px 20px 18px;border-top:1px solid color-mix(in srgb,var(--tbd) 60%,transparent)}
.term-b p{margin:0 0 11px}
.term-b p:last-child{margin:0}
.term-b strong{color:var(--fg);font-weight:600}

.gl{columns:2 300px;column-gap:24px}
.gl a{display:block;break-inside:avoid;font-size:13.5px;color:var(--fg2);padding:6px 0;border-bottom:1px solid var(--line)}
.gl a b{color:var(--fg);font-weight:600;margin-right:6px}

body.filt .turn:not(.hit), body.filt .beat, body.filt figure.shot, body.filt details.term, body.filt .lead{display:none}
body.filt .sec:not(.hit), body.filt .part:not(.hit){display:none}

.outro{max-width:860px;margin:96px auto 0;padding:44px 24px;border-top:1px solid var(--line);text-align:center}
.outro p{color:var(--fg3);font-size:13.5px;line-height:1.7;margin:0 0 8px}
@media(max-width:640px){.turn{gap:10px}.av{width:34px;height:34px}.bub{font-size:15.5px;padding:14px 16px;max-width:100%}}
</style>

 Microsoft Security"}, "short": {"ko": "Microsoft Security 사장", "en": "President, Microsoft Security"}, "side": "l", "ms": true, "img": "images/people/ales.png"}, "david": {"name": {"ko": "David Weston", "en": "David Weston"}, "role": {"ko": "Microsoft 에이전틱 보안 CVP", "en": "CVP, Agentic Security, Microsoft"}, "short": {"ko": "Agentic Security CVP", "en": "CVP, Agentic Security"}, "side": "l", "ms": true, "img": "images/people/david.png"}, "leighann": {"name": {"ko": "Leigh-Ann Russell", "en": "Leigh-Ann Russell"}, "role": {"ko": "BNY CIO", "en": "CIO, BNY"}, "short": {"ko": "BNY CIO", "en": "BNY CIO"}, "side": "r", "ms": false, "img": "images/people/leighann.png"}}, "blocks": [{"type": "part", "t": 0, "kicker": {"ko": "PART 1 · VISION", "en": "PART 1 · VISION"}, "title": {"ko": "Satya Nadella가 그린 큰 그림", "en": "Satya Nadella's big picture"}, "text": {"ko": "Microsoft CEO가 이번 Ignite 전체를 관통하는 질문과 세 가지 축(사람·지능·신뢰), 그리고 그것을 떠받치는 제품·모델·인프라 스택을 한 번에 훑습니다. 이후 모든 발표는 이 지도 위의 한 칸을 자세히 보여 주는 구조입니다.", "en": "Microsoft's CEO lays out the question behind the whole week, the three pillars (people, intelligence, trust) and the product, model and infrastructure stack beneath them. Everything after this zooms into one square of this map."}}, {"type": "section", "t": 0, "title": {"ko": "오프닝 영상: ‘프런티어 생태계’로의 초대", "en": "Opening video: an invitation to the ‘frontier ecosystem’"}, "lead": {"ko": "키노트는 짧은 브랜드 영상으로 시작합니다. 이번 Ignite 전체를 관통하는 키워드인 ‘프런티어 생태계(frontier ecosystem)’, ‘자기 지능의 소유’, ‘지속적 개선’, ‘신뢰’를 먼저 제시하므로, 이후 사티아의 발표가 이 단어들을 어떻게 구체적인 제품으로 풀어내는지 염두에 두고 들으면 좋습니다.", "en": "The keynote opens with a short brand film. It plants the keywords for the whole event — ‘frontier ecosystem’, owning your intelligence, continuous improvement, and trust — so listen for how Satya turns each of these into concrete products."}}, {"type": "beat", "t": 0, "text": {"ko": "(Ignite 로고 애니메이션 후, 샌프란시스코 Chase Center 생중계 화면으로 전환. 무대의 대형 스크린들에 전 세계 고객 현장 영상이 흐름 — 배달 라이더, 야외 관측 장비, Tomorrow.io(미국), Teach for America(미국) 등)", "en": "(After the Ignite logo animation, the feed cuts live to the Chase Center in San Francisco. The stage screens show customer scenes from around the world — a delivery rider, field sensing equipment, Tomorrow.io (USA), Teach for America (USA), and more.)"}}, {"type": "say", "sp": "narrator", "t": 18, "text": {"ko": "우리는 그 어느 때와도 다른 순간에 서 있습니다. 이것은 어떤 하나의 제품, 회사, 기술보다 더 큰 일입니다. **AI의 혜택이 우리 모두에게 닿도록** 하는 일입니다. 그래서 우리는 프런티어 생태계를 만들고 있습니다. 여러분이 **자신의 지능을 소유하고**, 중요한 성과를 지속적으로 개선하며, 결코 멈추지 않는 세상에서 여러분의 우위를 가속하는 생태계입니다.", "en": "We are in a moment unlike any other. It is bigger than any one product, company, or technology. It is about **ensuring the benefits of AI reach us all**. That's why we are building a frontier ecosystem — one where you **own your intelligence**, continuously improve the outcomes that matter, and accelerate your advantage in a world that never stops moving."}}, {"type": "say", "sp": "narrator", "t": 39, "text": {"ko": "이것이 바로 인간의 야망을 증폭하는 기술을 만드는 방법입니다. 그리고 **신뢰에 뿌리내린 지능**을 실제 세상의 임팩트로 바꾸는 방법입니다. 더 많은 사람이 만들고, 더 많은 사람이 혁신하고, 더 많은 사람이 함께 미래를 그려 갑니다.\n\nMicrosoft Ignite에 오신 것을 환영합니다.", "en": "This is how we create technology that amplifies human ambition, and turn **intelligence, grounded in trust**, into real-world impact. More people building, more people innovating, more people shaping the future together.\n\nWelcome to Microsoft Ignite."}}, {"type": "beat", "t": 70, "text": {"ko": "(사티아 나델라가 원형 무대로 걸어 나오고 관객 박수)", "en": "(Satya Nadella walks out onto the round stage to applause.)"}}, {"type": "section", "t": 78, "title": {"ko": "인사와 이번 주의 두 가지 질문, 그리고 지난주 장애에 대한 사과", "en": "Greeting, the week’s two questions, and last week’s outage"}, "lead": {"ko": "사티아는 이번 Ignite가 답하려는 두 질문 — 기하급수적으로 커지는 AI 역량을 어떻게 활용할 것인가, 그리고 그 결과(부작용)를 감당할 조직 역량을 어떻게 키울 것인가 — 를 먼저 제시합니다. 이어 지난주 서비스 장애를 언급하며 인프라의 회복력(resilience)에 대한 책임을 인정하고 IT 담당자들에게 감사를 전합니다. 화려한 발표 전에 ‘신뢰’부터 다지는 대목입니다.", "en": "Satya frames the week around two questions: how to capitalize on exponentially growing AI capability, and how to build the organizational capability to handle its consequences. He then acknowledges last week’s outage, owns the resilience problem, and thanks IT pros — establishing trust before the announcements."}}, {"type": "say", "sp": "satya", "t": 78, "text": {"ko": "좋습니다! 좋은 아침입니다. 좋은 아침이에요. 다시 이곳 Ignite에 돌아오게 되어 정말 기쁩니다. 환영합니다. 이번 주 내내 여러분을 위해 멋진 프로그램을 준비했습니다. 먼저 이번 주에 우리가 함께 풀어 갈 내용을 짚으며 시작하고 싶습니다.\n\n이번 주는 두 가지에 관한 것입니다. 첫째, **기하급수적으로 성장하고 있는 이 모든 새로운 역량을 어떻게 활용할 것인가**. 둘째, 기하급수적으로 성장하는 이 역량이 낳는 **결과에 대처할 수 있는 역량을 우리 조직 안에 어떻게 구축할 것인가**입니다.", "en": "Alright! Good morning. Good morning, it is fantastic to be back here at Ignite, and welcome. We have a fantastic show lined up for you for the rest of the week, and I want to kick it off by highlighting what we are going to unpack throughout the week.\n\nThis week is about two things. First, **how do we capitalize on all this new capability that is growing exponentially?** And second, **how do we build the capability inside of our organizations to deal with the consequences** of all this capability that is growing exponentially?"}}, {"type": "say", "sp": "satya", "t": 124, "text": {"ko": "지난주는 어떤 의미에서 디지털 인프라가 세상의 **‘다이얼 톤’으로서 얼마나 중요한지** 다시 일깨워 준 일이었습니다. 여러분이 저희 서비스에 보내 주시는 신뢰를 잘 알고 있고, 그 책임을 무겁게 받아들입니다. 그런 맥락에서, 저희에게 해야 할 일이 남아 있다는 것을 압니다. 여러분이, 그리고 세상이 믿고 의지할 수 있는 회복력을 제공하기 위해서요. 저희는 **배우고 지속적으로 개선하겠다**고 약속드립니다.", "en": "So, last week in some sense was really a reminder of **how critical the digital infrastructure is as the dial tone for the world**. We know the trust you place in our services, and we take that responsibility seriously. And in that context, I know we have work to do to provide that resilience that you can count on, that the world can count on, and we are **committed to ensure that we learn and we continuously improve**."}}, {"type": "term", "term": "Dial tone", "kr": {"ko": "다이얼 톤 — ‘당연히 늘 켜져 있어야 하는’ 기본 인프라의 비유", "en": "Dial tone — a metaphor for infrastructure that must simply always be on"}, "body": {"ko": "다이얼 톤은 예전 유선전화 수화기를 들면 들리던 ‘뚜—’ 소리입니다. 이 소리가 들린다는 것은 전화망이 살아 있다는 뜻이었고, 사람들은 이를 의식조차 하지 않을 만큼 당연하게 여겼습니다.\n\n사티아는 클라우드와 디지털 인프라가 이제 그런 존재가 되었다고 말합니다. 평소엔 아무도 신경 쓰지 않지만, 끊기는 순간 전 세계 업무가 멈추는 기반 시설이라는 뜻입니다.\n\n이 키노트에서는 지난주 발생한 서비스 장애를 인정하며 꺼낸 표현으로, ‘AI 이야기를 하기 전에 먼저 기본 인프라의 신뢰성과 회복력부터 책임지겠다’는 메시지입니다.", "en": "The dial tone was the hum you heard when you picked up a landline — a sign the network was alive, so taken for granted no one noticed it. Satya uses it to say cloud infrastructure is now that basic: invisible until it fails. He raises it while acknowledging last week’s outage, promising resilience before talking AI."}}, {"type": "say", "sp": "satya", "t": 162, "text": {"ko": "그리고 또 감사를 전하고 싶습니다. 아니, 그 이상으로, 여러분 각자가 조직 안에서 시스템이 늘 **회복력 있게 유지되도록** 해 주시는 그 노고를 꼭 인정하고 싶습니다. 정말로, 여러분이 조직과 생태계 전체를 위해 해 주시는 모든 일에 **진심으로 깊이 감사드립니다**.", "en": "And I also want to recognize — but more than that, I want to recognize the hard work that each of you do inside of your organizations to ensure that, continuously, [your systems are] **resilient**. So really, **a big thank you from the bottom of my heart** for all you do for your organization and the entire ecosystem."}}, {"type": "section", "t": 196, "title": {"ko": "미션과 세 개의 기둥: 인간 중심, 지능, 신뢰", "en": "The mission and three pillars: human at the center, intelligence, trust"}, "lead": {"ko": "사티아는 Microsoft의 미션을 출발점으로 삼아, AI 시대의 ‘프런티어 생태계’를 떠받칠 세 개의 기둥을 제시합니다. 이 세 기둥(인간의 야망·조직이 소유하는 지능·신뢰)이 이후 발표되는 Copilot, Microsoft IQ/Foundry, 보안 제품들의 설계 원칙이 되므로, 키노트 전체의 ‘목차’ 역할을 하는 대목입니다.", "en": "Starting from Microsoft’s mission, Satya lays out three pillars for the AI-era ‘frontier ecosystem’: human ambition, intelligence owned by each organization, and trust. These pillars serve as the table of contents for the rest of the keynote — Copilot, Microsoft IQ/Foundry, and security."}}, {"type": "say", "sp": "satya", "t": 196, "text": {"ko": "저는 언제나 저희 미션에서 출발하는 것이 중심을 잡는 데 도움이 된다고 생각합니다. 그 미션은 **지구상의 모든 개인과 모든 조직이 더 많은 것을 성취하도록 돕는 것**입니다. 그리고 오늘날의 세상에서 그것은 단 한 가지를 의미합니다. 바로 우리가 함께 어떻게 그 **프런티어 생태계**를 구축하느냐입니다.\n\n우리는 이 모든 기술적 진보를 실제 성과로, 사람들과 우리가 만드는 조직, 그리고 사회 전체를 위한 새로운 지렛대로 바꿔 낼 수 있어야 합니다. 그것이 목표입니다. 그리고 저희에게 그것은 세 가지로 귀결됩니다. 첫째, 모든 것의 중심에 인간을 두는 것. 그리고 여러분 조직의 지능과 학습에 대한 소유권을 여러분이 갖도록 하는 것. 그리고 신뢰입니다.", "en": "You know, I always find it grounding and helpful to always start with our mission, which is **to empower every person and every organization on the planet to achieve more**. And in today’s world, that means one singular thing, which is: how do we collectively build out that **frontier ecosystem**?\n\nWe need to be able to parlay all of these technological advances into real outcomes — new points of leverage for people, the organizations that we build, as well as society at large. That is the goal. And for us, that comes down to three things. One, keeping the human at the center of it all; ensuring that you have ownership over your organization’s intelligence and learning; and trust."}}, {"type": "beat", "t": 235, "text": {"ko": "(스크린: ‘Building the frontier ecosystem’ — Human ambition / Intelligence / Trust 세 칸)", "en": "(Screen: ‘Building the frontier ecosystem’ — Human ambition / Intelligence / Trust.)"}}, {"type": "say", "sp": "satya", "t": 244, "text": {"ko": "인간의 야망이라는 흐름 속에 AI를 녹여 넣는 것, 이것이 아마도 우리 앞에 놓인 **가장 큰 설계 과제**일 것입니다. 어떻게 해야 할까요? 개인의 역할, 조직, 시스템, 제품이 모두 **인간의 의도와 야망과 주체성을 증폭하도록** 설계되어, 앞으로 그것이 꽃피울 수 있게 하려면 어떻게 해야 할까요?", "en": "You know, AI in the flow of human ambition is perhaps **the biggest design challenge** we have in front of us. How do you do that? How do you make sure that individual roles, organizations, systems and products are all being designed to **amplify human intent and ambition and agency**, so that it can flourish going forward?"}}, {"type": "say", "sp": "satya", "t": 279, "text": {"ko": "그리고 우리는 이 변화가 어느 정도 펼쳐지는 모습을 보고 있습니다. 예를 들어 오늘날 소프트웨어 엔지니어링 팀을 보면, 개발자들은 단지 코드를 작성하거나 PR을 처리하는 데 그치지 않고, 코드를 둘러싸고 **지렛대를 제공하는 시스템**을 만들고 있습니다. 소프트웨어 엔지니어링이 소프트웨어 산출물을 만드는 일에서, 그 산출물을 만들어 내는 **소프트웨어 공장을 만드는 일**로 확장되고 있다고 생각하시면 됩니다.", "en": "And we are seeing this change, in some sense, unfold when you look at software engineering teams today. As an example, developers are not just writing code or doing PRs, but they are building **the systems around code that give you leverage**. You can think of software engineering scaling from building software artifacts to **building software factories** that build those artifacts."}}, {"type": "term", "term": "Software factory", "kr": {"ko": "소프트웨어 공장 — 코드를 직접 쓰는 대신 ‘코드를 만들어 내는 시스템’을 만드는 것", "en": "Software factory — building the system that produces code, not just the code"}, "body": {"ko": "전통적으로 개발자는 코드 한 줄 한 줄을 직접 작성했습니다. ‘소프트웨어 공장’은 AI 에이전트, 자동화된 테스트·리뷰·배포 파이프라인 등을 조합해, 코드를 대량으로 만들어 내는 생산 라인 자체를 설계하는 방식을 비유한 말입니다.\n\n장인이 물건을 하나씩 만들다가, 그 물건을 찍어 내는 공장을 설계하는 사람으로 역할이 바뀌는 것과 비슷합니다. PR(Pull Request)은 변경한 코드를 팀에 검토 요청하는 단위입니다.\n\n이 키노트에서 사티아는 이를 ‘지렛대(leverage) 지점의 이동’의 대표 사례로 들며, 같은 변화가 영업·재무·법무 등 모든 직무로 번질 것이라고 말합니다.", "en": "Instead of writing every line, engineers design the production line — agents plus automated test/review/deploy — that produces the code. Satya uses it as the prime example of a shift in the point of leverage that every function will go through."}}, {"type": "say", "sp": "satya", "t": 300, "text": {"ko": "하지만 여기서 중요한 것은, 인간의 의도, 판단, 경험, 기술, 전문성이 여전히 매우 중요하다는 점을 기억하는 것입니다. 이것은 대부분 **지렛대 지점의 변화**에 관한 이야기입니다. 여러분이 예전에 하던 일은 바뀌지만, 여러분의 전문성은 중요하고, 기술도 중요하고, 장인 정신도 중요합니다.\n\n이것은 소프트웨어 팀에만 해당하는 움직임이 아닙니다. **모든 직무가** 자신의 업무, 워크플로, 업무 산출물 전반에서 비슷한 변화를 겪게 될 것입니다.", "en": "The important thing here, though, is to remember still that human intent, that judgment, that experience, skills, expertise all very much matter. It is mostly about **the change in the point of leverage**. What you did before changes, but your expertise matters, your skill matters, your craft matters.\n\nThis is not just a movement in software teams; **every function** will go through a similar change across their work, their workflow and their work artifacts."}}, {"type": "say", "sp": "satya", "t": 339, "text": {"ko": "두 번째 기둥은 지능입니다. AI 시대의 핵심 질문은, **개별 기업이 어떻게 자신의 학습과 지식을 지속적으로 쌓고 소유하느냐**입니다. 경제가 경제로 남으려면, 즉 많은 기업이 존재하고 번성하려면, 지능은 정의상 **널리 분산되어야** 합니다. 그렇지 않으면 몇 개의 모델로 붕괴해 버릴 것입니다.", "en": "The second pillar is intelligence. In the age of AI, the key question is **how do individual firms continuously build and own their learning and knowledge?** For an economy to remain an economy, where many firms exist and thrive, intelligence by definition needs to be **broadly distributed**, or it’ll just collapse into a couple of models."}}, {"type": "say", "sp": "satya", "t": 366, "text": {"ko": "그리고 세 번째 기둥은 신뢰입니다. 지금은 흥미로운 시기입니다. 스케일링은 계속 효과를 내고 있고, 규모를 키울 때마다 새로운 창발적 역량이 나타납니다. 그런데도 우리는 **정렬(alignment)은 여전히 손에 잡히지 않고**, 이 모델들에 대한 기계적 이해도 손에 잡히지 않는 상황에 놓여 있습니다. 그렇다면 질문은, 이 강력한 기술을 도대체 어떻게 신뢰할 수 있느냐는 것입니다.\n\n그리고 현실은, 정의상 신뢰할 수 없다는 것입니다. 다시 말해, **지능의 공급과 그 지능에 대한 권한을 분리하는 것**이 아키텍처상의 필수 조건이 됩니다. 그래서 저희의 목표는 이 세 가지 아키텍처 필수 조건을 해결하는 스택을 만드는 것입니다.", "en": "And the third pillar is trust. I mean, it is an interesting time: scaling [laws] continue to work; we have these emergent capabilities from each scale-up. And yet we find ourselves in a place where **alignment is elusive**, mechanistic understanding of these models is elusive. So the question is, how can you even trust all this powerful technology?\n\nAnd the reality is, by definition you can’t. In other words, it becomes an architectural imperative to **separate the supply of intelligence from the authority over it**. So our goal is to build a stack that addresses these three architectural imperatives."}}, {"type": "term", "term": "Alignment & mechanistic interpretability", "kr": {"ko": "정렬과 기계적 해석 가능성 — AI가 ‘의도대로’ 움직이는지, ‘왜’ 그렇게 움직이는지 아는 문제", "en": "Alignment & mechanistic interpretability"}, "body": {"ko": "정렬(alignment)은 AI가 사람이 원하는 목표와 가치에 맞게 행동하도록 만드는 문제입니다. 기계적 해석 가능성(mechanistic interpretability)은 모델 내부에서 실제로 어떤 계산이 일어나 답이 나오는지 ‘뜯어보고 이해하는’ 연구입니다. 둘 다 아직 완전히 풀리지 않았습니다.\n\n비유하자면, 매우 유능하지만 속마음을 알 수 없는 신입 직원과 같습니다. 그래서 회사는 그 직원을 ‘믿는’ 대신 권한·결재·감사 체계를 따로 둡니다.\n\n이 키노트에서 사티아가 말하는 ‘지능의 공급과 그에 대한 권한의 분리’가 바로 이 발상입니다. 모델을 믿을 수 없으니, 무엇을 할 수 있는지(권한)는 별도의 시스템이 통제해야 한다는 것이고, 이는 뒤에 나오는 보안·거버넌스 발표의 근거가 됩니다.", "en": "Alignment means making AI pursue the goals we intend; mechanistic interpretability means understanding what actually happens inside a model. Neither is solved. Like a brilliant but opaque new hire, you don’t just trust it — you separate its capability from its authority via permissions and controls, which is the basis for the later security announcements."}}, {"type": "section", "t": 421, "title": {"ko": "Copilot, 일을 위한 새 운영체제", "en": "Copilot, the new operating system for work"}, "lead": {"ko": "첫 번째 기둥(인간 중심)을 구현하는 제품으로 Copilot을 소개하는 대목입니다. 사티아는 Copilot을 ‘일을 위한 새 운영체제’로 규정하고 Home·Code·Autopilot과 그 밑의 Work IQ를 설명한 뒤 정식 출시를 발표합니다. 이어 직무별 플러그인(Dynamics 365, Salesforce)과 GitHub의 두 신규 기능(Copilot Projects, Copilot Fusion)까지, ‘모든 업무가 Copilot 위에서 돌아간다’는 그림을 완성합니다.", "en": "This part presents Copilot as the product embodying the first pillar. Satya calls it the new OS for work, walks through Home, Code, Autopilot and the Work IQ underneath, and announces broad availability — then adds role-based plug-ins (Dynamics 365, Salesforce) and two GitHub launches (Copilot Projects, Copilot Fusion)."}}, {"type": "beat", "t": 421, "text": {"ko": "(스크린: Copilot 로고, 이어 ‘New OS for work’)", "en": "(Screen: the Copilot logo, then ‘New OS for work’.)"}}, {"type": "say", "sp": "satya", "t": 421, "text": {"ko": "자, 첫 번째부터 시작해 보겠습니다. Copilot입니다. **Copilot은 일을 위한 새로운 운영체제**입니다. Copilot은 사람과 컴퓨터가 상호작용하는 모든 폼 팩터를 — 채팅이든, Cowork이든, Code든, Autopilot이든 — 하나의 경험으로 묶습니다.\n\n또한 지금까지 따로 다뤄 온 서로 다른 범주들, 즉 지식 업무, 코딩, 비즈니스 프로세스 애플리케이션도 하나로 묶습니다. **앱은 Copilot의 플러그인일 뿐입니다.** 그래서 저희는 Office 전체를, 그 풍부한 기능 전부를 Copilot 안에 넣었습니다.", "en": "So, let’s start with the first one: Copilot. **Copilot is the new operating system for work.** It brings together all of the form factors of human-computer interaction — whether it is chat or Cowork or Code or Autopilot — all into one experience.\n\nIt also brings together the disparate categories that we have had — knowledge work, coding, business process applications. **Apps are just plug-ins to Copilot.** That is why we brought all of Office, all of its richness, built into Copilot."}}, {"type": "beat", "t": 455, "text": {"ko": "(스크린: 세 개의 원 — ‘Every form factor’(Home·Code·Autopilot·Office), ‘Every task’(빠른 질문·위임된 작업·장시간 실행되는 비즈니스 프로세스 작업), ‘Every model’, 가운데 Cloud↔Local)", "en": "(Screen: three circles — ‘Every form factor’ (Home, Code, Autopilot, Office), ‘Every task’ (quick questions, delegated tasks, long-running business process jobs), ‘Every model’, with Cloud↔Local at the center.)"}}, {"type": "say", "sp": "satya", "t": 458, "text": {"ko": "그리고 그 바탕에는 여러분이 가진 어떤 작업이든 해낼 수 있도록 **알맞은 지능을 알맞은 맥락과 알맞은 폼 팩터에 연결해 주는 모델 시스템**이 있습니다. Home은 빠른 답이 필요할 때든, 복잡한 다단계 작업을 끝까지 해내고 싶을 때든 하나의 시작점을 제공합니다.\n\n그리고 Code는 조직의 모든 개인에게 **무한한 SaaS 공장**을 가져다줍니다. 애플리케이션, 대시보드 등 많은 것을 만들 수 있고, 이 모든 것을 **여러분의 테넌트 안에서 안전하게 호스팅하고 관리**할 수 있습니다.", "en": "And underlying this is **a model system that matches the right intelligence to the right context and the right form factor** to accomplish any task that you may have. Home gives you one place to start, whether you need a quick answer or you want to really complete a complex multistep task.\n\nAnd Code brings **an infinite SaaS factory** to every individual in the organization. You can build your applications, dashboards and much more, and all of this can be **hosted and managed securely inside your tenant**."}}, {"type": "term", "term": "Tenant", "kr": {"ko": "테넌트 — 클라우드 안에서 우리 회사만 쓰는 전용 공간", "en": "Tenant — your organization’s own isolated space in the cloud"}, "body": {"ko": "테넌트(tenant)는 ‘세입자’라는 뜻으로, Microsoft 365나 Azure 같은 클라우드에서 한 회사(조직)에 할당된 독립된 공간을 말합니다. 같은 건물(클라우드)을 여러 회사가 쓰지만, 각자의 호실(테넌트)은 잠겨 있고 데이터·사용자·보안 정책이 분리됩니다.\n\n이 키노트에서 ‘테넌트 안에서 호스팅·관리된다’는 말은, Copilot Code로 직원이 만든 앱이 외부 서비스가 아니라 회사의 보안·규정 통제 안에 머문다는 뜻입니다. 누구나 앱을 만들게 하면서도 IT가 관리권을 잃지 않는다는 점을 강조하는 표현입니다.", "en": "A tenant is your organization’s isolated space in a shared cloud — its own users, data and policies. Saying apps built with Code are hosted inside your tenant means they stay under corporate security and compliance control."}}, {"type": "say", "sp": "satya", "t": 496, "text": {"ko": "그리고 **Autopilot은 여러분의 일을 계속 진척시키는 자율 에이전트**입니다. 24시간 7일 내내, 여러분과 동료들이 오늘날 협업하는 모든 곳에서 계속 일합니다. 사실상 **팀원이 한 명 더 생기는 것**입니다.\n\n이 모든 것의 바탕에는 매우 강력한 데이터베이스인 **Work IQ**가 있습니다. 이것을 아마 여러분이 가진 가장 중요한 데이터 자산이라고 생각하셔도 됩니다. Work IQ는 사람들, 그들과 다른 사람들의 관계, 여러분의 이메일, 채팅, 프로젝트 등 일의 짜임새를 이루는 것들을 깊이 이해하고 있습니다.", "en": "And **Autopilot is an autonomous agent that keeps moving your work** forward. 24 by 7, it continues to work in all the places where you and your teammates collaborate today — you essentially have **an additional teammate**.\n\nUnderlying all of this is this very powerful database, **Work IQ**. You can think of this as perhaps the most important data asset you have. It has a deep understanding of the people, their relationships to other people, your emails, your chats, projects — the things that make up the fabric of work."}}, {"type": "term", "term": "Autopilot", "kr": {"ko": "Autopilot — 사람 대신 24시간 일을 이어 가는 Copilot의 자율 에이전트", "en": "Autopilot — Copilot’s always-on autonomous agent"}, "body": {"ko": "에이전트(agent)는 질문에 답만 하는 챗봇과 달리, 목표를 받으면 스스로 여러 단계를 계획하고 도구를 써서 실제 작업을 수행하는 AI입니다.\n\n키노트 설명에 따르면 Autopilot은 Copilot 안의 자율 에이전트로, 여러분과 팀원이 협업하는 곳(문서, 채팅 등)에서 24시간 일을 계속 진척시키는 ‘추가 팀원’ 역할을 합니다. 뒤의 Copilot Workspaces 영상에서는 ‘Evo (Priya’s Autopilot)’처럼 사람마다 자기 Autopilot을 두고 이름을 불러 일을 맡기는 모습이 나옵니다.\n\n이 키노트에서 중요한 이유: Copilot이 ‘묻고 답하는 도구’에서 ‘일을 위임받아 계속 처리하는 동료’로 바뀌었다는 것을 상징하는 기능입니다.", "en": "An agent plans and executes multi-step work with tools, rather than just answering. Per the keynote, Autopilot is Copilot’s autonomous agent that keeps work moving 24/7 wherever your team collaborates — effectively an extra teammate (e.g., ‘Evo (Priya’s Autopilot)’ in the Workspaces video)."}}, {"type": "term", "term": "Work IQ", "kr": {"ko": "Work IQ — 사람·관계·메일·채팅·프로젝트를 이해하는 ‘업무 맥락’ 데이터 계층", "en": "Work IQ — the work-context layer behind Copilot"}, "body": {"ko": "키노트 설명에 따르면 Work IQ는 Copilot 밑에 깔린 강력한 데이터베이스로, 조직의 사람들과 그 관계, 이메일, 채팅, 프로젝트 등 ‘일의 짜임새(fabric of work)’를 깊이 이해합니다. 사티아는 이를 ‘아마도 여러분이 가진 가장 중요한 데이터 자산’이라고 표현합니다.\n\n쉽게 말해, 유능한 비서가 ‘누가 누구와 어떤 일을 하고 있고, 관련 문서가 어디 있는지’를 머릿속에 지도처럼 갖고 있는 것과 같습니다. AI가 같은 질문에도 우리 회사 맥락에 맞는 답을 하게 만드는 재료입니다.\n\n뒤에서 Work IQ는 Fabric IQ, Web IQ 등과 함께 ‘Microsoft IQ’라는 더 큰 플랫폼의 일부로 다시 등장합니다.", "en": "Per the keynote, Work IQ is the database underneath Copilot that understands people, relationships, email, chats and projects — ‘perhaps the most important data asset you have.’ It reappears later as part of the broader Microsoft IQ platform."}}, {"type": "beat", "t": 512, "text": {"ko": "(스크린: 별빛처럼 흩어진 점들이 모여 ‘Work IQ’ 글자를 이룸)", "en": "(Screen: a field of points converges into the words ‘Work IQ’.)"}}, {"type": "say", "sp": "satya", "t": 539, "text": {"ko": "그리고 오늘, 제가 방금 말씀드린 **이 모든 것을 여러분 조직 안에서 폭넓게 사용하실 수 있게 되었음**을 발표하게 되어 매우 기쁩니다.", "en": "And today we are thrilled to announce that **all of this that I just talked about is broadly available** to you to use inside your organizations."}}, {"type": "beat", "t": 553, "text": {"ko": "(박수. 화면 안내: ‘Learn more about Copilot — aka.ms/MicrosoftIgnite26Blog’)", "en": "(Applause. On-screen: ‘Learn more about Copilot — aka.ms/MicrosoftIgnite26Blog’.)"}}, {"type": "say", "sp": "satya", "t": 563, "text": {"ko": "그리고 저희는 더 나아가고 있습니다. Copilot을 **특정 직무로 확장**하고 있습니다. 즉 여러분이 영업, 법무, 재무, 서비스 분야에 있다면, 모든 비즈니스 애플리케이션에 대한 스킬, 커넥터, 플러그인을 정리해서 Copilot의 여러 화면에서 바로 이용할 수 있게 하는 것입니다. 여기에는 서드파티 시스템도 포함됩니다.\n\n실제로 오늘 저희는 **Dynamics 365용 비즈니스 플러그인**을 발표합니다. Dynamics만이 아닙니다. **Salesforce와 협력해 Salesforce를 Copilot으로** 가져오게 되어 무척 기쁩니다.", "en": "So, we are going further. We are **extending Copilot to specific roles**. That means if you are in sales, legal, finance, service, we are organizing the skills, the connectors, the plug-ins to all of the business applications so you can access them from the Copilot surface areas. This includes third-party systems.\n\nIn fact, we are announcing today **business plug-ins for Dynamics 365**. And it is not just Dynamics: we are excited to **partner with Salesforce to bring Salesforce to Copilot**."}}, {"type": "shot", "t": 575, "cap": {"ko": "‘New skills, connectors, and plugins’ 발표 슬라이드 — Sales·Legal·Finance·Service 네 직무. Copilot을 직무별 업무 도구로 확장한다는 선언입니다.", "en": "The ‘New skills, connectors, and plugins’ announcement slide — Sales, Legal, Finance, Service. Copilot is being extended into role-specific work."}, "img": "images/shot-01.jpg"}, {"type": "term", "term": "Skills, connectors & plug-ins", "kr": {"ko": "스킬·커넥터·플러그인 — AI가 회사 시스템을 ‘읽고 쓰게’ 해 주는 연결 부품", "en": "Skills, connectors & plug-ins"}, "body": {"ko": "커넥터(connector)는 Copilot이 외부 시스템(예: CRM, ERP, 문서 저장소)의 데이터에 접근하도록 이어 주는 연결선입니다. 플러그인(plug-in)은 그 시스템에서 실제 동작(조회, 수정, 생성)을 할 수 있게 해 주는 확장 기능이고, 스킬(skill)은 특정 업무를 처리하는 방법을 묶어 둔 작업 지침·능력 단위입니다.\n\n스마트폰에 앱을 깔아 기능을 늘리는 것과 비슷합니다.\n\n이 키노트에서 중요한 이유: 사티아가 말한 ‘앱은 Copilot의 플러그인일 뿐’이라는 비전의 실제 구현 수단입니다. Dynamics 365와 Salesforce 같은 업무 시스템을 Copilot 화면에서 바로 다루게 함으로써, 직원이 여러 앱을 오가지 않고 Copilot 하나에서 일하게 만들겠다는 것입니다.", "en": "Connectors let Copilot reach data in other systems; plug-ins let it take actions there; skills package how to do a specific job. They are how ‘apps are just plug-ins to Copilot’ becomes real — e.g., Dynamics 365 and Salesforce used directly from Copilot."}}, {"type": "beat", "t": 592, "text": {"ko": "(박수. 스크린: ‘Copilotforce’ — Salesforce plugin for Copilot, Salesforce Sales Cloud in Teams, Salesforce Data 360 + Fabric)", "en": "(Applause. Screen: ‘Copilotforce’ — Salesforce plugin for Copilot, Salesforce Sales Cloud in Teams, Salesforce Data 360 + Fabric.)"}}, {"type": "say", "sp": "satya", "t": 598, "text": {"ko": "이 부분은 Judson에게서 훨씬 더 많이 듣게 되실 겁니다. 그리고 우리에게는 **몰입해서 하는 작업을 위한 인체공학**도 필요합니다. Excel을 쓰는 분석가든, PowerPoint를 쓰는 디자이너든, Discovery를 쓰는 과학자든, Dragon을 쓰는 의사나 간호사든, GitHub를 쓰는 소프트웨어 개발자든 말입니다.", "en": "And you will hear a lot more from Judson. And we need **the ergonomics for heads-down work**, whether you are an analyst in Excel, a designer in PowerPoint, a scientist using Discovery, a doctor or nurse using Dragon, or a software developer in GitHub."}}, {"type": "say", "sp": "satya", "t": 631, "text": {"ko": "GitHub 이야기가 나온 김에, 저희는 두 가지 새 프로젝트를 발표합니다. 첫째(화면: GitHub Copilot Projects)는 목표를 정의하고 하나 이상의 저장소(repo)를 연결하면, Copilot이 그 목표를 향해 작업과 일을 조율하게 해 줍니다. 정말 마법 같습니다.\n\n둘째, 저희는 **GitHub Copilot Fusion**을 만들고 있습니다. 여러 모델을 오케스트레이션해서 **훨씬 낮은 비용으로 프런티어 수준의 결과**를 냅니다. 실제로 바로 오늘, Copilot Fusion이 Terminal-Bench에서 **1위 코딩 에이전트**로 선정되었습니다. 5점 앞서면서도 비용은 절반도 안 됩니다. 정말 신나는 일입니다.", "en": "Speaking of GitHub, we are announcing two new projects. [First, GitHub Copilot Projects:] it lets you define a goal and connect one or more repos, and have Copilot coordinate tasks and work all towards that goal. It is very magical.\n\nSecond, we are creating **GitHub Copilot Fusion**. It orchestrates multiple models to deliver **frontier-level results at a significantly lower cost**. In fact, just today, Copilot Fusion was ranked as **the number one coding agent on Terminal-Bench**, scoring five points over [the next], at less than half the cost. It is exciting to see that."}}, {"type": "shot", "t": 668, "cap": {"ko": "GitHub Copilot Fusion 차트 — Artificial Analysis 코딩 에이전트 지수(세로) 대 작업당 평균 API 비용(가로). Copilot Fusion(max)이 Claude Code·Codex 등보다 높은 점수를 더 낮은 비용으로 기록해 ‘가장 매력적인 영역’ 쪽에 놓여 있습니다.", "en": "GitHub Copilot Fusion chart — Artificial Analysis coding-agent index vs. average API cost per task. Copilot Fusion (max) sits toward the ‘most attractive quadrant’: higher score at lower cost than Claude Code, Codex and others."}, "img": "images/shot-02.jpg"}, {"type": "term", "term": "Terminal-Bench", "kr": {"ko": "Terminal-Bench — AI 코딩 에이전트가 터미널에서 실제 작업을 해내는지 재는 벤치마크", "en": "Terminal-Bench — a benchmark for agents doing real work in a terminal"}, "body": {"ko": "벤치마크(benchmark)는 AI 성능을 같은 조건에서 비교하기 위한 표준 시험지입니다. Terminal-Bench는 AI 에이전트에게 명령줄(터미널) 환경에서 소프트웨어 설치, 빌드, 디버깅 같은 실제 개발 작업을 시키고 성공률을 재는 공개 벤치마크입니다. 화면에는 ‘Terminal-Bench 4.1’로 표시되었습니다.\n\n여기에 쓰인 Copilot Fusion은 키노트 설명에 따르면 여러 모델을 조합(오케스트레이션)해 작업을 처리합니다. 비싼 모델 하나에 모든 일을 맡기는 대신, 일의 성격에 따라 모델을 나눠 쓰는 방식입니다.\n\n이 키노트에서 중요한 이유: ‘가장 좋은 단일 모델’보다 ‘모델 조합 + 시스템 설계’가 더 높은 점수를 더 싸게 낼 수 있다는 근거로 제시되며, 뒤에 나오는 ‘멀티모델 시스템’ 주장과 연결됩니다.", "en": "A benchmark is a standard test for comparing AI systems. Terminal-Bench (shown as 4.1 on screen) measures whether coding agents can complete real tasks in a command-line environment. Copilot Fusion topping it — by orchestrating multiple models — supports the keynote’s ‘multi-model system’ thesis."}}, {"type": "section", "t": 680, "title": {"ko": "멀티플레이어 Copilot: Copilot Workspaces", "en": "Multiplayer Copilot: Copilot Workspaces"}, "lead": {"ko": "지금까지의 Copilot이 ‘한 사람과 AI’의 1인용 도구였다면, 이 대목은 사람·에이전트·동료가 같은 맥락을 공유하며 함께 일하는 ‘멀티플레이어’ 형태로의 전환을 보여 줍니다. 짧은 소개 영상으로 Copilot Workspaces를 시연한 뒤, 사티아는 이것이 결국 ‘조직 지능(organizational intelligence)’으로 이어진다고 말하며 다음 주제인 Microsoft IQ로 다리를 놓습니다.", "en": "If Copilot so far was single-player (one person plus AI), this part shows the shift to multiplayer — people, their agents and colleagues sharing context. After a short Copilot Workspaces video, Satya ties it to ‘organizational intelligence’, bridging to Microsoft IQ."}}, {"type": "say", "sp": "satya", "t": 680, "text": {"ko": "그리고 물론 저희는 그 이상으로 나아가고 있습니다. 지금까지 Copilot을 떠올리면, 그것은 **1인용(싱글 플레이어) 세계**에 관한 것이었습니다. 코딩 루프나 에이전트 루프 안에 있는 사람들 말이죠. 이제 진정한 **멀티플레이어 폼 팩터**의 시대가 왔습니다. 사람들과 그들의 에이전트, 그리고 다른 사람들이 공유된 맥락을 가지고 공동의 목표를 향해 나아가는 것입니다. 이것이 **Copilot Workspaces**입니다. 함께 보시죠.", "en": "And of course, we are going beyond that as well. Up until now, when you think about Copilot, it has been about **the single-player world** — the people in the coding loops or agent loops. And the time has come for a true **multiplayer form factor**, where people, their agents and other people are driving towards a common goal with shared context. This is **Copilot Workspaces**. Let’s take a look."}}, {"type": "beat", "t": 723, "text": {"ko": "(영상 재생 — 음악만 흐르고 내레이션 없음. ‘Copilot’ 타이틀 후 ‘Introducing Workspaces’ 문구, 이어 사람 아바타들 ‘and’ 에이전트 아바타들이 나란히 등장)", "en": "(Video plays — music only, no narration. A ‘Copilot’ title, then ‘Introducing Workspaces’, then human avatars ‘and’ agent avatars side by side.)"}}, {"type": "shot", "t": 728, "cap": {"ko": "영상 첫 화면 ‘Introducing Workspaces’. Copilot의 멀티플레이어 협업 공간을 처음 공개하는 장면입니다.", "en": "The video’s title card, ‘Introducing Workspaces’ — the first reveal of Copilot’s multiplayer collaboration space."}, "img": "images/shot-03.jpg"}, {"type": "beat", "t": 736, "text": {"ko": "(영상: ‘Time to rally the team’ 홈 화면 — Copilot이 업무 기반으로 ‘Q4 Enterprise Renewals’, ‘Vendor Contract Review’ 워크스페이스를 제안하고, 기존 ‘Weekly Pipeline Sync’, ‘Key Account Strategy’, ‘FY27 Sales Kickoff Planning’ 목록이 보임. 새 워크스페이스에 ‘Sales Team’을 검색해 사람들과 ‘Evo (Priya’s Autopilot)’ 같은 에이전트를 함께 초대하고, ‘Transcript: Finance Sync.docx’, ‘Q4_Finance_Forecast.pptx’ 등 파일을 추가 — ‘Copilot이 이름과 설명을 보고 관련 콘텐츠를 알아서 추가’)", "en": "(Video: a ‘Time to rally the team’ home screen — Copilot suggests workspaces like ‘Q4 Enterprise Renewals’ and ‘Vendor Contract Review’ alongside existing ones such as ‘Weekly Pipeline Sync’, ‘Key Account Strategy’, ‘FY27 Sales Kickoff Planning’. A new workspace invites the ‘Sales Team’ — people plus agents like ‘Evo (Priya’s Autopilot)’ — and adds files such as ‘Transcript: Finance Sync.docx’ and ‘Q4_Finance_Forecast.pptx’; Copilot uses the name and description to add related content.)"}}, {"type": "beat", "t": 750, "text": {"ko": "(영상: ‘Create and edit together’ — ‘Monthly Business Review’ 워크스페이스에서 Marcus·Priya·Lena·Mona의 커서가 동시에 움직이고, ‘12월 비즈니스 리뷰 문서 초안 작성’ 작업이 시작됨. 이어 PowerPoint ‘Business Review’ 덱과 ‘Product Roadmap Progress’ 차트 슬라이드를 사람과 에이전트가 함께 편집하며 오른쪽에 댓글이 쌓임)", "en": "(Video: ‘Create and edit together’ — in a ‘Monthly Business Review’ workspace, cursors for Marcus, Priya, Lena and Mona move at once and a ‘Draft the December Business Review document’ task starts. The PowerPoint ‘Business Review’ deck and a ‘Product Roadmap Progress’ chart are co-edited by people and agents, with comments accumulating on the side.)"}}, {"type": "beat", "t": 776, "text": {"ko": "(영상: 에이전트가 ‘Locating documents…’ 진행 → ‘Stay connected in Teams’ — ‘@Evo (Priya’s Autopilot) share it in our Leadership chat’ 요청에 Evo가 Teams ‘Leadership Team’ 채팅에 덱을 공유하고, ‘@Kit (Marcus’s Autopilot) set up a meeting for this’ 요청에 Kit이 ‘Syncing with calendars…’로 회의 일정을 잡기 시작)", "en": "(Video: an agent shows ‘Locating documents…’ → ‘Stay connected in Teams’ — asked ‘@Evo (Priya’s Autopilot) share it in our Leadership chat’, Evo posts the deck in the Teams ‘Leadership Team’ chat; asked ‘@Kit (Marcus’s Autopilot) set up a meeting for this’, Kit starts ‘Syncing with calendars…’.)"}}, {"type": "beat", "t": 794, "text": {"ko": "(영상 종료, 화면이 다시 무대의 사티아로)", "en": "(Video ends; back to Satya on stage.)"}}, {"type": "say", "sp": "satya", "t": 794, "text": {"ko": "정말, 정말 기대됩니다. 제가 이걸 써 본 지 몇 주밖에 안 됐는데도 **제 업무 습관이 정말 바뀌었습니다.** 마치 채팅이 처음 등장해서 모든 일을 시작하는 장소가 되었던 것처럼요. 저는 오늘 **Workspaces도 그와 매우 비슷해질 것**이라고 생각합니다.", "en": "I’m really, really excited. You know, even in the few weeks I’ve been using it, **it has really changed my working habits** — just like when chat showed up and it became the place where you started all your work. I think **Workspaces today are going to be very similar**."}}, {"type": "term", "term": "Copilot Workspaces", "kr": {"ko": "Copilot Workspaces — 사람과 각자의 에이전트가 같은 맥락을 공유하며 일하는 공동 작업 공간", "en": "Copilot Workspaces — a shared space for people and their agents"}, "body": {"ko": "키노트 설명에 따르면 Copilot Workspaces는 Copilot의 ‘멀티플레이어’ 형태로, 사람들과 그들의 에이전트, 그리고 다른 사람들이 공유된 맥락(파일, 회의, 채팅 등)을 가지고 공동의 목표를 향해 함께 일하는 공간입니다.\n\n영상에서는 워크스페이스를 만들면 동료와 함께 각자의 Autopilot(예: Evo, Kit)도 초대하고, 문서를 함께 편집하며, 에이전트에게 ‘Teams 채팅에 공유해 줘’, ‘회의를 잡아 줘’ 같은 일을 이름을 불러 맡기는 모습이 나옵니다.\n\n이 키노트에서 중요한 이유: AI가 개인 비서에서 ‘팀의 일원’으로 바뀌는 전환점이며, 사티아는 이것이 조직 전체의 지식을 묶는 ‘조직 지능’으로 이어진다고 설명합니다.", "en": "Per the keynote, Workspaces is Copilot’s multiplayer form: people, their agents and colleagues work toward a common goal with shared context. In the video, teammates invite each other’s Autopilots (Evo, Kit), co-edit documents, and delegate tasks like sharing in Teams or scheduling meetings."}}, {"type": "say", "sp": "satya", "t": 812, "text": {"ko": "그런데 방금 보신 것은 결국 **조직 지능(organizational intelligence)**을 가리키고 있습니다. 저희가 그 데이터베이스, 즉 Work IQ를 구축하며 해 온 모든 작업이 빛을 발하는 것이죠. 클라우드는 클라이언트 소프트웨어에서 벗어나 조직 데이터를 매우 풍부하게 표현할 수 있게 해 주었고, 그것이 깊은 협업을 가능하게 했습니다.\n\n즉 클라우드는 단순한 클라이언트 소프트웨어를 넘어, 협업을 가능하게 한 **클라우드 데이터 중력**에 관한 것이었습니다. 그리고 이제 AI는 여러분이 클라우드에 가진 그 데이터를 가져와 **지능과 연결**할 수 있게 해 주고 있습니다.", "en": "What you just saw, though, points to essentially **organizational intelligence** — all the work we have done building out that database, Work IQ, lights up. The cloud enabled us to move [from] client software to having this very rich representation of organizational data, enabling deep collaboration.\n\nSo the cloud was about moving from just client software to essentially this **cloud data gravity** that allowed that collaboration. And now AI is allowing us to take that data that you have in the cloud and **connect it to intelligence**."}}, {"type": "beat", "t": 815, "text": {"ko": "(스크린: Copilot 로고 아래 ‘Organizational intelligence’)", "en": "(Screen: ‘Organizational intelligence’ under the Copilot logo.)"}}, {"type": "term", "term": "Data gravity", "kr": {"ko": "데이터 중력 — 데이터가 쌓인 곳으로 앱과 서비스가 끌려오는 현상", "en": "Data gravity"}, "body": {"ko": "데이터 중력(data gravity)은 데이터가 한곳에 많이 쌓일수록, 그 데이터를 쓰는 애플리케이션·서비스·사람이 그쪽으로 끌려오는 현상을 행성의 중력에 빗댄 말입니다. 대용량 데이터는 옮기기 어렵기 때문에, 오히려 일이 데이터가 있는 곳으로 모입니다.\n\n사티아의 논리는 이렇습니다. PC 시절엔 파일이 각자의 컴퓨터에 흩어져 있었지만, 클라우드가 조직의 데이터를 한곳에 모으면서 공동 편집 같은 협업이 가능해졌습니다. 이제 AI가 그 모인 데이터에 지능을 연결하는 단계라는 것입니다.\n\n이 키노트에서 중요한 이유: 바로 다음에 소개되는 Microsoft IQ가 ‘클라우드에 모인 데이터 + 지능’이라는 이 흐름의 다음 단계로 제시됩니다.", "en": "Data gravity: as data accumulates in one place, apps and work are pulled toward it. Satya’s arc — cloud gathered organizational data and enabled collaboration; now AI connects that data to intelligence — sets up Microsoft IQ."}}, {"type": "section", "t": 853, "title": {"ko": "Microsoft IQ와 멀티모델 시스템, 그리고 결정 모델", "en": "Microsoft IQ, the multi-model system, and decision models"}, "lead": {"ko": "두 번째 기둥(조직이 소유하는 지능)을 구현하는 플랫폼으로 Microsoft IQ를 소개하는 대목입니다. 사티아는 Copilot 밑에서 쓰던 시스템을 외부에 공개하는 플랫폼이라고 설명하고, Work IQ·Fabric IQ·Web IQ와 수백 개의 커넥터, 그리고 ‘작업마다 최적의 비용으로 지능을 배치하는’ 멀티모델 시스템을 강조합니다. 이어 새로운 모델 범주인 ‘결정 모델’과 Microsoft Decision 1.1 정식 출시, Xbox 데모 화면을 통해 ‘LLM보다 10배 빠르고 200배 싸다’는 수치를 제시합니다.", "en": "This part introduces Microsoft IQ as the platform for the second pillar — intelligence each organization owns. Satya frames it as the system under Copilot, externalized: Work IQ, Fabric IQ, Web IQ, hundreds of connectors, and a multi-model system optimizing cost per task. He then announces decision models and Microsoft Decision 1.1 GA, with an Xbox demo and the ‘10x faster, 200x cheaper than an LLM’ claim."}}, {"type": "say", "sp": "satya", "t": 853, "text": {"ko": "그리고 그것이 바로 저희가 **Microsoft IQ**로 하고 있는 일입니다. IQ의 핵심 아이디어는 모든 조직이 조직 전반에 걸쳐 **자신만의 지능을 구축하고, 유지하고, 지속적으로 개선**하도록 돕는 것입니다. IQ는 여러분의 행동 공간, 즉 여러분의 데이터 자산 전체와 맥락, 여러분이 수년간 만들어 온 모든 IQ, 그리고 멀티모델 시스템으로 얻는 추가적인 지능을 하나로 모읍니다.", "en": "And that is what we are doing with **Microsoft IQ**. The idea behind IQ is to help every organization **build, retain and continuously improve your own intelligence** across the organization. It brings together your action space — that means all of your data estate — the context, all of the IQ that you have created over the years, and the additional intelligence that you have with a multi-model system."}}, {"type": "beat", "t": 870, "text": {"ko": "(스크린: ‘Build, retain, and continuously improve’)", "en": "(Screen: ‘Build, retain, and continuously improve’.)"}}, {"type": "say", "sp": "satya", "t": 892, "text": {"ko": "본질적으로 저희는 Copilot 밑에 만들어 둔 시스템을 가져와, 그것을 **일급(first-class) 플랫폼으로 외부에 공개**하고 있습니다. 여러분 조직의 지능을, 여러분이 계속 소유하고 계속 키워 갈 수 있는 **자산**으로 구현한 플랫폼입니다.\n\n저희는 여러분이 가진 모든 데이터를 하나로 모읍니다. Microsoft 365 밑에 있는 데이터, 즉 Work IQ든, Fabric IQ든, Web IQ를 통한 웹 전반의 데이터든, 그리고 물론 서드파티 맥락까지요.", "en": "Essentially, we are taking the system we built underneath Copilot and we are **externalizing it as a first-class platform** that embodies your organization’s intelligence as **an asset** that you can continuously own and continually build on.\n\nWe are bringing together all of the data you have — whether it is the data underneath Microsoft 365, that is Work IQ; Fabric IQ; the data across the web with Web IQ; and of course third-party context, too."}}, {"type": "shot", "t": 915, "cap": {"ko": "Microsoft IQ 구조도 — ‘Your IQ’ 아래 Work IQ(생산성 워크플로)·Fabric IQ(운영 데이터)·Foundry IQ(비정형 데이터)·Web IQ(실세계 정보)·Third-party IQ(서드파티 시스템)가 비즈니스 플러그인으로 묶이고, 그 밑에 멀티모델 시스템, 바깥에 Copilot·Agent 365와 ‘지속적 개선’ 루프가 돕니다.", "en": "Microsoft IQ architecture — under ‘Your IQ’, Work IQ, Fabric IQ, Foundry IQ, Web IQ and Third-party IQ are bundled as business plug-ins over a multi-model system, feeding Copilot and Agent 365 in a ‘continuous improvement’ loop."}, "img": "images/shot-04.jpg"}, {"type": "term", "term": "Microsoft IQ", "kr": {"ko": "Microsoft IQ — 회사의 데이터·맥락·모델을 묶어 ‘우리 회사만의 지능’으로 만드는 플랫폼", "en": "Microsoft IQ — the platform for an organization’s own intelligence"}, "body": {"ko": "키노트 설명에 따르면 Microsoft IQ는 Microsoft가 Copilot 밑에서 쓰던 시스템을 외부에 공개한 플랫폼입니다. Microsoft 365 업무 데이터(Work IQ), 운영 데이터(Fabric IQ), 웹 정보(Web IQ), 서드파티 맥락을 한데 묶고, 그 위에 멀티모델 시스템을 얹어 조직의 지능을 ‘계속 소유하고 키워 갈 수 있는 자산’으로 만든다는 개념입니다.\n\n비유하자면, 회사의 모든 기록·관계·업무 노하우를 정리한 ‘회사 두뇌’를 만들어 두고, 사내에서 만드는 모든 AI 에이전트가 그 두뇌를 공유하게 하는 것입니다.\n\n이 키노트에서 중요한 이유: 사티아의 두 번째 기둥(‘지능은 몇 개의 모델로 수렴하지 말고 각 기업이 소유해야 한다’)을 실제 제품으로 구현한 것이 바로 IQ입니다.", "en": "Per the keynote, Microsoft IQ externalizes the system under Copilot as a platform: Work IQ, Fabric IQ, Web IQ and third-party context plus a multi-model system, so an organization’s intelligence becomes an asset it owns and keeps improving — the product form of the second pillar."}}, {"type": "say", "sp": "satya", "t": 927, "text": {"ko": "실제로 Microsoft IQ에는 오늘 발표하는 **수백 개의 새 커넥터**가 함께 제공되어, 여러분이 만드는 에이전트가 **기업의 전체 맥락을 가지고 행동**할 수 있습니다. 그리고 이 모든 것은 결국 조직 전체에서 공유되고 상속될 수 있는 **비즈니스 플러그인**이라는 단순한 형태로 나타납니다.", "en": "In fact, Microsoft IQ comes with **hundreds of new connectors** that we are announcing today, so that the agents you build can **act with full enterprise context**. And all of this manifests simply as **business plug-ins** that can be shared and inherited across the entire organization."}}, {"type": "beat", "t": 935, "text": {"ko": "(스크린: ‘New — 350+ third-party IQ connectors’ — Adobe, Asana, Atlassian, Box, Canva, DocuSign, Dropbox, FactSet, HubSpot, Harvey 등 로고)", "en": "(Screen: ‘New — 350+ third-party IQ connectors’ — logos incl. Adobe, Asana, Atlassian, Box, Canva, DocuSign, Dropbox, FactSet, HubSpot, Harvey.)"}}, {"type": "say", "sp": "satya", "t": 946, "text": {"ko": "그리고 마지막으로 **멀티모델 시스템**이 있습니다. 저희에게 이것은 주어진 작업에 **최적의 경제성으로 지능을 배치**할 수 있도록 하는 것입니다. 그것이 저희가 풀려는 최적화 문제입니다. 그리고 이것은 실제 업무라는 맥락에서, **제품·하네스·도구·모델 시스템을 모두 하나의 최적화로** 튜닝함으로써 저희만이 할 수 있는 일입니다.", "en": "And finally, there is a **multi-model system**. For us, it is about making sure we are able to **map intelligence to a given task with the best economics** — that is the optimization we are trying to solve. And this is something we can uniquely do in the context of real-world tasks, by **tuning the product, the harness, the tools and the model system all as one optimization**."}}, {"type": "beat", "t": 968, "text": {"ko": "(스크린: ‘Optimizing the cost to outcome frontier’)", "en": "(Screen: ‘Optimizing the cost to outcome frontier’.)"}}, {"type": "term", "term": "Multi-model system", "kr": {"ko": "멀티모델 시스템 — 일마다 가장 ‘가성비’ 좋은 모델을 골라 쓰는 구조", "en": "Multi-model system"}, "body": {"ko": "멀티모델 시스템은 하나의 AI 모델에 모든 일을 맡기는 대신, 여러 모델(크고 비싼 모델, 작고 빠른 모델, 특정 업무 전용 모델 등)을 갖춰 두고 작업마다 알맞은 것을 골라 쓰는 방식입니다. 이 선택을 자동으로 해 주는 장치를 흔히 ‘모델 라우터(model router)’라고 부릅니다.\n\n회사에서 간단한 일은 신입에게, 어려운 판단은 전문가에게 맡기는 것과 같습니다. 모든 일을 최고 전문가에게 맡기면 비용이 폭증합니다.\n\n이 키노트에서 중요한 이유: 사티아는 ‘결과 대비 비용(cost to outcome)’을 최적화하는 것이 핵심이라고 말하며, 앞의 Copilot Fusion과 뒤의 Decision 1.1, MAI 모델들이 모두 이 전략의 일부로 소개됩니다.", "en": "Instead of sending everything to one big model, a multi-model system keeps several models and routes each task to the one with the best cost/quality trade-off (a ‘model router’). Satya frames this ‘cost to outcome’ optimization as the thread linking Copilot Fusion, Decision 1.1 and the MAI models."}}, {"type": "say", "sp": "satya", "t": 977, "text": {"ko": "모델 이야기가 나온 김에, 저희는 **결정 모델(decision models)**이라는 새로운 범주의 모델에 매우 기대하고 있습니다. 이 모델들은 지능을 소프트웨어의 핵심 기본 요소로 심을 수 있게 해 주며, 소프트웨어를 만드는 방식에서 빠르게 핵심이 되어 가고 있습니다. 예전에 데이터베이스가 소프트웨어 엔지니어링을 바꿨던 것처럼, 저는 이것도 비슷하다고 생각합니다.\n\n그리고 오늘 **Microsoft Decision 1.1**을 발표하게 되어 매우 기쁩니다. 이제 **정식 출시(GA)**되어 기업 환경에 배포할 준비가 되었습니다.", "en": "Speaking of models, we are very excited about a new class of models called **decision models**. These models allow you to embed intelligence into software as **a core primitive**; they are quickly becoming key to how software is built. In fact, just like databases back in the day changed software engineering, I think this is similar.\n\nAnd today we are thrilled to announce **Microsoft Decision 1.1, which is now generally available** and ready for enterprise deployment."}}, {"type": "beat", "t": 1012, "text": {"ko": "(박수)", "en": "(Applause.)"}}, {"type": "say", "sp": "satya", "t": 1013, "text": {"ko": "여기에 멀티모델 지원을 추가했고, 성능을 개선해 결정은 더 정확하게, 응답은 더 빠르게 만들었습니다. 이미 **4,000곳이 넘는 고객**이 사용했습니다.\n\n실제로 Epic은 환자 경험, 임상 진료, 그리고 백오피스 앱 전반의 의사결정에 이를 사용하고 있습니다. Copilot 시스템 자체도 이를 사용해 사용자를 알맞은 모드, 모델, 추론 노력 수준으로 **밀리초 단위의 정밀도로 라우팅**합니다. 그리고 Xbox 팀은 이를 이용해 수만 건의 자유 형식 피드백을, 여러 게임 출시에 대해 사람들이 무엇을 말하고 있는지로 분류하고 있습니다.", "en": "You know, we added multi-model support to it, and we have improved performance, making decisions more accurate and the responses faster. Already **over 4,000 customers** have used it.\n\nIn fact, Epic is using it to make decisions across patient experience, clinical care, as well as back-office apps. The Copilot system itself uses it to **route users to the right mode, model and effort level with millisecond precision**. And the Xbox team is using it to sort tens of thousands of open-ended pieces of feedback into what people are saying about all the different game launches."}}, {"type": "beat", "t": 1040, "text": {"ko": "(스크린: ‘Microsoft Decision 1.1’ — Artificial Analysis 결정 지수 대 작업당 시간 차트. Decision 1 대비 ‘+6 points, 2.2x faster’)", "en": "(Screen: ‘Microsoft Decision 1.1’ — Artificial Analysis decision index vs. time per task; ‘+6 points, 2.2x faster’ than Decision 1.)"}}, {"type": "term", "term": "Decision model / Microsoft Decision 1.1", "kr": {"ko": "결정 모델 — 분류·판단·라우팅 같은 ‘결정’에 특화된 빠르고 저렴한 모델", "en": "Decision model / Microsoft Decision 1.1"}, "body": {"ko": "키노트 설명에 따르면 결정 모델은 소프트웨어 안에 지능을 ‘핵심 기본 요소’로 심기 위한 새로운 범주의 모델입니다. 사례로 보면 환자 경험·임상·백오피스의 의사결정(Epic), 사용자 요청을 알맞은 모드·모델·노력 수준으로 보내는 라우팅(Copilot), 수만 건의 피드백을 주제별로 분류(Xbox)하는 데 쓰입니다.\n\n긴 글을 생성하는 범용 챗봇이 ‘작가’라면, 결정 모델은 서류를 빠르게 보고 ‘이건 A, 저건 B’로 분류하는 숙련된 심사관에 가깝습니다. 사티아는 이를 예전 데이터베이스가 소프트웨어 개발을 바꾼 것에 비유합니다.\n\n이 키노트에서 중요한 이유: Microsoft Decision 1.1은 이번에 정식 출시(GA)되었고, 4,000곳 이상의 고객이 사용했으며, LLM보다 10배 이상 빠르고 200배 저렴하다고 제시됩니다. ‘결과 대비 비용’ 최적화 전략의 대표 사례입니다.", "en": "Per the keynote, decision models are a new class for embedding intelligence into software as a core primitive — e.g., Epic’s clinical/back-office decisions, Copilot’s routing, Xbox’s feedback classification. Microsoft Decision 1.1 is now GA, used by 4,000+ customers, and claimed 10x+ faster and 200x cheaper than an LLM."}}, {"type": "beat", "t": 1050, "text": {"ko": "(데모 화면: ‘Xbox Research — Player feedback, sorted into themes’. 같은 피드백 분류 작업을 왼쪽 GPT-6 Sol과 오른쪽 Microsoft-Decision-1이 동시에 처리 — 처리 건수가 3 대 71, 21 대 290, 33 대 515로 벌어짐)", "en": "(Demo screen: ‘Xbox Research — Player feedback, sorted into themes’. GPT-6 Sol (left) and Microsoft-Decision-1 (right) run the same task side by side — counts go 3 vs 71, 21 vs 290, 33 vs 515.)"}}, {"type": "say", "sp": "satya", "t": 1055, "text": {"ko": "그리고 재미있는 점이 있습니다. 이것은 LLM을 쓰는 것보다 **10배 이상 빠르고, 200배 저렴**합니다.", "en": "And here’s the fun thing: it is **more than 10x faster and 200 times less expensive** than using an LLM."}}, {"type": "term", "term": "LLM (Large Language Model)", "kr": {"ko": "LLM — 방대한 텍스트로 학습해 글을 이해·생성하는 대형 언어 모델", "en": "LLM (Large Language Model)"}, "body": {"ko": "LLM은 인터넷 규모의 텍스트로 학습해 질문에 답하고, 글을 쓰고, 코드를 만드는 범용 AI 모델입니다. GPT, Claude 같은 모델이 대표적입니다. 무엇이든 할 수 있지만, 그만큼 크고 계산 비용이 많이 듭니다.\n\n‘토큰(token)’은 모델이 글을 처리하는 작은 단위(대략 단어 조각)로, 대부분의 모델 사용료는 처리한 토큰 수에 비례합니다.\n\n이 키노트에서 중요한 이유: 사티아는 분류·판단처럼 정해진 일에는 범용 LLM 대신 전용 결정 모델을 쓰면 훨씬 빠르고 싸다고 강조합니다. ‘모든 일에 가장 큰 모델을 쓰지 말라’는 멀티모델 메시지의 연장입니다.", "en": "An LLM is a general-purpose model trained on huge text corpora (e.g., GPT, Claude) — capable but large and costly; usage is typically billed per token. The keynote’s point: for focused decisions, a specialized decision model beats an LLM on speed and cost."}}, {"type": "beat", "t": 1068, "text": {"ko": "(박수)", "en": "(Applause.)"}}, {"type": "shot", "t": 1070, "cap": {"ko": "Xbox 피드백 분류 데모의 마지막 장면 — Microsoft-Decision-1은 605건을 끝내고 ‘Done’, GPT-6 Sol은 48건째 ‘still sorting…’. ‘LLM보다 10배 이상 빠르다’는 주장을 시각적으로 보여 줍니다.", "en": "End of the Xbox feedback demo — Microsoft-Decision-1 shows ‘Done’ at 605 items while GPT-6 Sol is at 48, ‘still sorting…’, visualizing the ‘10x faster than an LLM’ claim."}, "img": "images/shot-05.jpg"}, {"type": "section", "t": 1071, "title": {"ko": "Foundry의 모델 선택지와 Microsoft 자체 모델(MAI), 그리고 지속 개선 루프", "en": "Models in Foundry, Microsoft’s own MAI models, and the continuous-improvement loop"}, "lead": {"ko": "멀티모델 전략의 ‘공급’ 측면을 보여 주는 대목입니다. 사티아는 Foundry에 GPT-6.2, Claude, Meta 모델을 들여오는 동시에, Microsoft 자체 모델 제품군(MAI)의 성과와 신규 모델(MAI 라이선스 가중치, Code 2/Code 2 Flash, Cyber 2 Flash)을 발표합니다. 마지막으로 관리형 에이전트 하네스와 ‘직접 정한 평가 기준으로 에이전트를 계속 개선하는 루프’를 소개하며 ‘조직 지능이 자산이 된다’는 메시지로 이어 갑니다.", "en": "This part covers the supply side of the multi-model strategy: GPT-6.2, Claude and Meta models arriving in Foundry, plus momentum and new releases for Microsoft’s own MAI family (licensed weights, Code 2/Code 2 Flash, Cyber 2 Flash). It closes with the managed agent harness and a continuous-improvement loop driven by your own evals."}}, {"type": "say", "sp": "satya", "t": 1071, "text": {"ko": "그리고 Foundry에는 물론 인기 있는 폐쇄형·개방형 모델이 모두 있습니다. 실제로 오늘 **GPT-6.2를 Foundry에** 들여오게 되어 매우 기쁩니다. 훌륭한 새 모델입니다. 복잡한 전문 업무를 위한 벤치마크에서 **AI 전문 업무의 기준을 새로 세웠고**, 추정 비용의 절반 이상(자막 불명확)으로 이전 모델을 능가했습니다.\n\n그리고 지난주에는 Claude 5.2도 들여왔고, 오늘은 **Meta의 최신 모델들**도 모두 Foundry에 온다는 것을 발표합니다. 여러분께 훌륭한 모델 선택지가 생기는 것이죠.", "en": "And Foundry, of course, has all of the popular closed and open models. In fact, today we are very excited to bring **GPT-6.2 to Foundry**. It is a great new model; it **sets the bar for professional AI work** on a benchmark for complex professional work. It outperformed its predecessor by more than half the estimated cost (caption unclear).\n\nAnd we also brought Claude 5.2 last week, and today we are also announcing **Meta’s latest models** are all coming to Foundry as well. So a great choice of models for you."}}, {"type": "shot", "t": 1090, "cap": {"ko": "‘General availability — GPT-6.2 series in Foundry’ 슬라이드. GPT-6.2 Astra(가장 까다로운 작업을 위한 프런티어 추론)와 GPT-6.2 Sol(프로덕션 에이전트를 위한 효율적 지능) 두 가지로 제공되며, ‘안전·보안·데이터 상주를 기본 내장한 엔터프라이즈 대응’을 강조합니다.", "en": "‘General availability — GPT-6.2 series in Foundry’: GPT-6.2 Astra (frontier reasoning for the most demanding work) and GPT-6.2 Sol (efficient intelligence for production agents), ‘enterprise ready with safety, security, and data residency built-in’."}, "img": "images/shot-06.jpg"}, {"type": "term", "term": "Microsoft Foundry", "kr": {"ko": "Foundry — 여러 AI 모델을 골라 에이전트를 만들고 운영하는 Microsoft의 개발 플랫폼", "en": "Microsoft Foundry"}, "body": {"ko": "Foundry는 Azure 위에서 AI 애플리케이션과 에이전트를 만들고 배포·운영하는 Microsoft의 플랫폼입니다. OpenAI의 GPT, Anthropic의 Claude, Meta 모델, Microsoft 자체 MAI 모델 등 다양한 폐쇄형·개방형 모델을 한곳에서 골라 쓸 수 있는 ‘모델 백화점’ 역할을 합니다.\n\n폐쇄형 모델은 가중치(내부 파라미터)가 공개되지 않고 API로만 쓰는 모델, 개방형(오픈) 모델은 가중치가 공개되어 직접 내려받아 운영할 수 있는 모델입니다.\n\n이 키노트에서 중요한 이유: 멀티모델 전략의 실제 ‘진열대’이자, 뒤에서 소개되는 관리형 에이전트 하네스와 지속 개선 루프가 돌아가는 곳입니다.", "en": "Foundry is Microsoft’s Azure platform for building, deploying and running AI apps and agents, offering many closed (API-only) and open (downloadable weights) models in one place. It is where the multi-model strategy, the managed harness and the improvement loop live."}}, {"type": "beat", "t": 1110, "text": {"ko": "(스크린: ‘Claude in Foundry’ — Claude Opus 5.5, Sonnet 5.5, Haiku 5.5 등. 이어 ‘Announcing — Bringing Meta’s Muse models to Foundry’: Muse Wonder, Muse Spark 1.3, Muse Ember)", "en": "(Screen: ‘Claude in Foundry’ — Claude Opus 5.5, Sonnet 5.5, Haiku 5.5 and more; then ‘Announcing — Bringing Meta’s Muse models to Foundry’: Muse Wonder, Muse Spark 1.3, Muse Ember.)"}}, {"type": "say", "sp": "satya", "t": 1118, "text": {"ko": "그리고 물론 저희는 **자체 모델 제품군**으로도 프런티어에서 혁신하고 있습니다. 사전 학습 단계에서는 **컴퓨팅 효율적**이고, 배포 단계에서는 **토큰 효율적**인 모델입니다. 저희의 목표는 프런티어 곡선 위에 새로운 점들을 더하는 것이고, 그것은 모든 제품 안에서 여러분에게 중요한 실제 업무 성능에 기반합니다.", "en": "And of course, we are also innovating at the frontier with **our own model family** — one that is both **compute-efficient** when it comes to pre-training and **token-efficient** when it comes to deployment. Our goal is to put additional points on the frontier curve, really informed by the real-world task performance that matters to you inside all the products."}}, {"type": "beat", "t": 1130, "text": {"ko": "(스크린: ‘MAI’ — Code, Decision, Cyber, Image, Transcribe, Custom models 여섯 칸)", "en": "(Screen: ‘MAI’ — Code, Decision, Cyber, Image, Transcribe, Custom models.)"}}, {"type": "term", "term": "Frontier curve (cost–performance frontier)", "kr": {"ko": "프런티어 곡선 — ‘이 비용으로 낼 수 있는 최고 성능’을 이은 선", "en": "Frontier curve (cost–performance frontier)"}, "body": {"ko": "여러 AI 모델을 ‘성능(세로축)’과 ‘비용 또는 속도(가로축)’ 그래프에 점으로 찍으면, 같은 비용에서 가장 성능이 좋은 모델들을 이은 바깥쪽 경계선이 생깁니다. 이것을 프런티어(또는 파레토) 곡선이라고 부릅니다. 이 선보다 바깥에 점을 찍는 모델은 ‘같은 돈으로 더 좋거나, 같은 성능을 더 싸게’ 내는 셈입니다.\n\n이 키노트의 Copilot Fusion·Decision 1.1 차트도 모두 이 형식(점수 대 비용/시간)으로 그려졌습니다.\n\n이 키노트에서 중요한 이유: Microsoft는 MAI 모델로 ‘최고 성능 하나’를 다투기보다 이 곡선 위에 실용적인 새 점(더 싸고 빠른 선택지)을 더하는 것을 목표로 한다고 밝힙니다.", "en": "Plot models by quality vs. cost (or speed); the outer boundary of best-quality-per-cost points is the frontier (Pareto) curve. Microsoft says its MAI models aim to add new points on that curve — better value — rather than just chase the single top score."}}, {"type": "say", "sp": "satya", "t": 1151, "text": {"ko": "그리고 모멘텀도 대단합니다. 출시 이후 **요청 수가 12배** 늘었고(화면: OpenRouter의 MAI Transcribe 2, GitHub Copilot의 Code 1.1 Flash 사용자 300만 명), MAI Cyber는 이제 **Perception 코드 스캐닝 전체 스캔의 40% 이상**을 처리하고 있습니다.\n\n그리고 저희는 더 나아갑니다. **MAI 라이선스 가중치(MAI licensed weights)**를 발표합니다. 신뢰할 수 있는 파트너들이 Microsoft AI 모델의 가중치에 접근할 수 있게 된다는 뜻입니다(이하 일부 자막 불명확). 저희는 모든 이가 자신의 지능을 소유하고, 그로써 이 플랫폼 위에서 자신의 이익을 얻을 수 있도록 필요한 일을 다 하겠다고 약속합니다.", "en": "And with great momentum: **requests are up 12x** since it launched [screen: MAI Transcribe 2 on OpenRouter; Code 1.1 Flash with 3M users in GitHub Copilot], and MAI Cyber now **powers over 40% of the scans across Perception** code scanning.\n\nAnd we are going further. We are announcing **MAI licensed weights**, meaning trusted partners will be gaining access to Microsoft AI model weights (caption partly unclear: ‘with frontier code’). [We are] committed to doing what it takes to ensure that everyone can own their own intelligence and thereby derive their own benefits on this platform."}}, {"type": "shot", "t": 1178, "cap": {"ko": "MAI 모멘텀 슬라이드 — MAI Transcribe 2: OpenRouter 출시 이후 요청 최대 12배, Code 1.1 Flash: GitHub Copilot 사용자 300만 명, Cyber 1.1 Flash: Perception 스캔의 40% 이상 처리.", "en": "MAI momentum slide — MAI Transcribe 2: requests up 12x since launch on OpenRouter; Code 1.1 Flash: 3M users in GitHub Copilot; Cyber 1.1 Flash: powers 40%+ of scans in Perception."}, "img": "images/shot-07.jpg"}, {"type": "beat", "t": 1182, "text": {"ko": "(스크린: Microsoft Decision 1.1(GA), Image 2.7·Image 2.7 Flash(퍼블릭 프리뷰), Realtime 1·Transcribe Dragon(신규) 목록, 이어 ‘Announcing — MAI Licensed Weights: Models under your control’)", "en": "(Screen: Microsoft Decision 1.1 (GA), Image 2.7 and Image 2.7 Flash (public preview), Realtime 1 and Transcribe Dragon (new); then ‘Announcing — MAI Licensed Weights: Models under your control’.)"}}, {"type": "term", "term": "Model weights / MAI licensed weights", "kr": {"ko": "모델 가중치 — AI 모델의 ‘두뇌’에 해당하는 학습된 숫자들", "en": "Model weights / MAI licensed weights"}, "body": {"ko": "모델 가중치(weights)는 AI가 학습을 통해 얻은 수십억 개의 숫자로, 사실상 모델 그 자체입니다. 가중치를 가지고 있으면 모델을 자기 환경에서 직접 돌리고, 자기 데이터로 추가 학습(파인튜닝)할 수도 있습니다.\n\n키노트 설명에 따르면 ‘MAI licensed weights’는 신뢰할 수 있는 파트너가 Microsoft AI(MAI) 모델의 가중치에 접근하도록 라이선스하는 것으로, 슬라이드 문구는 ‘Models under your control(여러분이 통제하는 모델)’입니다.\n\n이 키노트에서 중요한 이유: ‘모든 이가 자신의 지능을 소유해야 한다’는 두 번째 기둥을 모델 차원에서 실천하는 조치로 제시됩니다. API로 빌려 쓰는 것을 넘어, 모델 자체를 손에 쥐게 하겠다는 것입니다.", "en": "Weights are the learned numbers that effectively are the model; holding them lets you run and fine-tune it yourself. Per the keynote, MAI licensed weights give trusted partners access to MAI model weights — ‘models under your control’ — putting the ‘own your intelligence’ pillar into practice."}}, {"type": "say", "sp": "satya", "t": 1200, "text": {"ko": "그리고 오늘 저희는 많은 새 모델도 내놓는데, 특히 두 가지를 강조하고 싶습니다. 먼저 코드입니다. 새로운 플래그십 코딩 모델 제품군, Code 2를 소개합니다. Code 2는 일상적인 기업 업무에서 **비용 대비 성능의 프런티어**에 있습니다. 코드를 프로덕션까지 가져가는 일, 여러 파일에 걸친 구현, 저장소 단위 추론에 뛰어나며, 그것도 일부 비용으로 해냅니다.\n\n그리고 **Code 2 Flash**는 코드 설명, 특정 부분 수정, 빠른 반복 같은 빠르고 대량인 작업을 위해 설계되었습니다. 훨씬 낮은 비용으로 **플래그십에 가까운 품질**을 제공합니다.", "en": "And today we are also launching a lot of new models, and I wanted to highlight two in particular. First, code: we are introducing a new flagship family of coding models, Code 2. Code 2 is at **the frontier of cost-performance for everyday enterprise tasks**. It excels in taking code to production, multi-file implementation, repo reasoning — at a fraction of the cost.\n\nAnd **Code 2 Flash** is designed for fast, high-volume work like code explanations, targeted edits, rapid iterations. And it really brings **near-flagship quality at much lower cost**."}}, {"type": "beat", "t": 1225, "text": {"ko": "(스크린: ‘New — Code 2: Frontier price-performance for everyday enterprise coding’(GitHub Copilot), 이어 ‘Code 2 Flash’)", "en": "(Screen: ‘New — Code 2: Frontier price-performance for everyday enterprise coding’ (GitHub Copilot), then ‘Code 2 Flash’.)"}}, {"type": "say", "sp": "satya", "t": 1252, "text": {"ko": "그리고 사이버 보안에도 같은 접근을 적용하고 있습니다. **Cyber 2 Flash**는 플래시 크기의 모델로, 작업당 비용은 일부에 불과하면서도 **프런티어 모델보다 앞선 성능**을 냅니다.\n\n그리고 코딩에서 그랬던 것처럼, 저희는 모델과 도구와 시스템을 **모두 하나의 시스템으로 공동 설계**하고 있으며, Cyber를 Perception과 통합하고 있습니다.", "en": "And we are taking the same approach with cyber as well. **Cyber 2 Flash** is a flash-sized model that delivers **performance ahead of frontier models** at a fraction of the cost per task.\n\nAnd just as we have done with coding, we are **co-designing the model, the tools and the systems all as one system**, and we are integrating Cyber with Perception."}}, {"type": "beat", "t": 1272, "text": {"ko": "(스크린: ‘New — Cyber 2 Flash: Frontier security intelligence at a fraction of the cost’)", "en": "(Screen: ‘New — Cyber 2 Flash: Frontier security intelligence at a fraction of the cost’.)"}}, {"type": "term", "term": "Flash model & Perception", "kr": {"ko": "Flash 모델 — 작고 빠르고 싼 경량 모델 / Perception — MAI Cyber가 들어간 코드 스캐닝", "en": "Flash model & Perception"}, "body": {"ko": "‘Flash’는 업계에서 같은 제품군 안의 작고 빠르며 저렴한 경량 버전을 부르는 이름입니다. 최상위(플래그십) 모델보다 조금 덜 똑똑할 수 있지만, 대량의 단순·반복 작업을 훨씬 싸고 빠르게 처리합니다.\n\nPerception은 이번 키노트에서 코드 스캐닝(소스 코드의 보안 취약점을 찾아내는 검사)과 함께 언급된 제품입니다. 키노트 설명에 따르면 MAI Cyber 모델이 이미 Perception 코드 스캐닝 전체 스캔의 40% 이상을 처리하고 있고, 새 Cyber 2 Flash도 Perception과 통합됩니다.\n\n이 키노트에서 중요한 이유: 보안처럼 검사량이 막대한 분야에서는 ‘충분히 똑똑하면서 매우 싼’ 모델이 실제 비용을 좌우하므로, 멀티모델 전략의 실용적 사례가 됩니다.", "en": "‘Flash’ denotes a small, fast, cheap variant of a model family — great for high-volume work. Per the keynote, Perception is a code-scanning product where MAI Cyber already handles 40%+ of scans, and Cyber 2 Flash is being integrated with it."}}, {"type": "say", "sp": "satya", "t": 1282, "text": {"ko": "그리고 모델과 여러분의 맥락이 Foundry에 갖춰지면, **관리형 에이전트 하네스**를 이용해 장시간 실행되는 에이전트를 만들고 배포할 수 있습니다. 저희가 Copilot과 GitHub Copilot을 구동하는 데 쓰는 **바로 그 하네스**를 여러분도 쓸 수 있습니다.\n\n그리고 이를 **경험을 통해 학습하는 지속적 개선 루프**에 연결할 수 있습니다. 여러분이 직접 벤치마크와 평가(eval)를 정의하면, Foundry가 여러분의 에이전트를 그 기준에 맞춰 측정하고, 프로덕션에서 보이는 결과를 바탕으로 에이전트와 그 밑의 모델을 개선합니다.", "en": "And once you have the models and your context in Foundry, **a managed agent harness** is available to you to be able to build and deploy these long-running agents. **The same harness we use to power Copilot and GitHub Copilot** is available to you.\n\nAnd you can connect it to **a continuous improvement loop that learns through experience**. You get to define your own benchmarks and evals, and Foundry measures your agents against them and improves the agent and the model underneath it, based on what you see in production."}}, {"type": "shot", "t": 1305, "cap": {"ko": "‘Foundry Hosted Agents — Quality up. Cost down. Every iteration.’ 슬라이드. Evaluate(좋은 결과의 기준 정의) → Optimize(Foundry가 최적 구성 탐색) → Train(모델 학습으로 ROI 확장) → Repeat로 도는 지속 개선 루프를 보여 줍니다.", "en": "‘Foundry Hosted Agents — Quality up. Cost down. Every iteration.’: a continuous-improvement loop of Evaluate (define what good looks like) → Optimize (Foundry finds the best configuration) → Train (extend ROI by training a model) → Repeat."}, "img": "images/shot-08.jpg"}, {"type": "term", "term": "Agent harness", "kr": {"ko": "에이전트 하네스 — 모델을 ‘일하는 에이전트’로 만들어 주는 실행 틀", "en": "Agent harness"}, "body": {"ko": "하네스(harness)는 원래 말에 채우는 마구(馬具)를 뜻합니다. AI에서는 모델을 감싸서 도구 호출, 기억(메모리), 작업 계획, 재시도, 권한·로그 관리 등을 처리해 주는 실행 틀을 말합니다. 같은 모델이라도 하네스가 좋으면 훨씬 길고 복잡한 일을 안정적으로 해냅니다.\n\n엔진(모델)이 아무리 좋아도 차체·변속기·브레이크(하네스)가 있어야 실제로 달릴 수 있는 것과 같습니다.\n\n이 키노트에서 중요한 이유: Microsoft는 Copilot과 GitHub Copilot에 쓰는 하네스를 Foundry에서 ‘관리형’으로 제공한다고 밝힙니다. 기업이 장시간 실행되는 에이전트를 직접 밑바닥부터 만들 필요 없이, 검증된 틀 위에 올릴 수 있다는 뜻입니다.", "en": "A harness wraps a model with tool calling, memory, planning, retries, permissions and logging — the chassis that turns an engine into a car. Microsoft is offering the same harness behind Copilot and GitHub Copilot as a managed service in Foundry for long-running agents."}}, {"type": "term", "term": "Evals (evaluations)", "kr": {"ko": "평가(eval) — 에이전트가 ‘잘했는지’를 자동으로 채점하는 시험 세트", "en": "Evals (evaluations)"}, "body": {"ko": "eval은 AI 모델이나 에이전트의 결과물을 미리 정한 기준으로 채점하는 테스트 묶음입니다. 공개 벤치마크가 ‘전국 모의고사’라면, eval은 우리 회사 업무에 맞춘 ‘사내 시험’입니다. 예: 고객 문의 답변 100건을 놓고 정확성·말투·규정 준수를 채점.\n\n키노트 설명에 따르면 Foundry에서는 고객이 직접 벤치마크와 eval을 정의하면, Foundry가 에이전트를 그 기준으로 측정하고 프로덕션에서 관찰된 결과를 바탕으로 에이전트와 밑의 모델을 개선합니다(슬라이드의 Evaluate → Optimize → Train 루프).\n\n이 키노트에서 중요한 이유: ‘실행할 때마다 배우고 개선되는’ 시스템, 즉 조직 지능이 시간이 갈수록 쌓이는 자산이 되는 메커니즘의 출발점이 바로 eval입니다.", "en": "Evals are test sets that score a model’s or agent’s outputs against criteria you define — a company-specific exam rather than a public benchmark. In Foundry, your evals drive the Evaluate → Optimize → Train loop that improves agents and models from production results."}}, {"type": "say", "sp": "satya", "t": 1316, "text": {"ko": "즉 **모든 실행이 배우고 개선하며 더 나은 결과를 낼 기회**가 된다는 뜻입니다. 저희는 궁극적으로 늘 개선되고, 늘 스스로 완성되어 가는 그런 시스템을 만들고 있습니다. 그것이 바로 **조직의 지능이 자산이 되고**, 더 가치 있게 되는 방식입니다 시간이 지나면서 그것이 여러분의 IQ가 됩니다. 자, 이제 세 번째 기둥으로 넘어가겠습니다. 바로 **신뢰(trust)**에 관한 것입니다.\n\n신뢰는 스택의 모든 계층에서 **관찰 가능성(observability)**을 확보하는 데서 시작합니다. 바로 여기서 Agent 365가 등장합니다. Agent 365는 여러분이 이미 갖고 있는 거버넌스, ID, 보안, 관리 시스템을 기업 전체의 에이전트로 확장해 주는 컨트롤 플레인입니다. 이미 365에는 **1,500만 개의 에이전트**가 있습니다.", "en": "That means **every execution is an opportunity to learn and improve** and deliver a better outcome. We are ultimately creating that always-improving, always self-fulfilling system. That is how **the organization’s intelligence becomes an asset** and more valuable over time and becomes your IQ. So now let's move to the third pillar, which is all about **trust**.\n\nIt starts by making sure you have **observability at every layer of the stack**. That is where Agent 365 comes in. It is the control plane that extends your existing governance, identity, security and management systems to the agents across your enterprise. We already have **15 million agents** in 365."}}, {"type": "section", "t": 1341, "title": {"ko": "세 번째 기둥 '신뢰': Agent 365와 Perception", "en": "Third pillar, Trust: Agent 365 and Perception"}, "lead": {"ko": "Satya가 Copilot(인간의 야망)과 IQ(지능)에 이어 마지막 기둥인 '신뢰'로 넘어가는 대목입니다. 수많은 에이전트를 어떻게 관찰·관리하고, 비용 대비 가치를 어떻게 따지며, 공격으로부터 어떻게 지키는지를 Agent 365, Agent 365 Business Analytics, Perception 세 가지 발표로 묶어 보여 줍니다. 특히 실제 AI 자율 공격을 Defender가 막아낸 사례가 왜 '에이전트형 보안'이 필요한지를 설명하는 핵심 근거입니다.", "en": "After Copilot (human ambition) and IQ (intelligence), Satya moves to the last pillar, trust. He ties together three announcements—Agent 365, Agent 365 Business Analytics and Perception—to show how to observe and govern agents, measure cost against value, and defend against attacks. The real autonomous AI attack stopped by Defender is the key evidence for why agentic security is needed."}}, {"type": "term", "term": "Control plane", "kr": {"ko": "컨트롤 플레인 — 시스템 전체를 지휘·관리하는 '관제탑' 계층", "en": "The management layer that governs a whole system"}, "body": {"ko": "IT에서 컨트롤 플레인은 실제 일을 처리하는 부분(데이터 플레인)과 구분해, 무엇이 어디서 어떻게 돌아가야 하는지를 정하고 감시하는 '관리·통제 계층'을 말합니다. 공항에 비유하면 비행기(실제 작업)가 아니라 관제탑입니다.\n\n이 키노트에서 Agent 365는 '에이전트를 위한 컨트롤 플레인'으로 소개됩니다. 사람 직원에게 쓰던 ID·보안·거버넌스·관리 체계를 그대로 에이전트에도 적용해, 회사 안에 흩어진 수많은 에이전트를 한곳에서 보고 통제하게 해 준다는 뜻입니다.", "en": "The layer that decides and monitors what runs where—like an airport control tower. Agent 365 is pitched as the control plane for agents, extending existing identity, security and governance to them."}}, {"type": "say", "sp": "satya", "t": 1374, "text": {"ko": "그리고 AI가 모든 조직으로 확산될수록, 조직은 AI에 무엇을 지출하는지와 AI가 조직 안에서 만들어 내는 가치 사이에 분명한 선을 그을 수 있어야 합니다. 그래서 오늘 저희는 **Agent 365 Business Analytics**를 발표하게 되어 매우 기쁩니다.\n\n간단히 말해 이것을 **AI 사용을 위한 ERP 시스템**이라고 생각하시면 됩니다. 무엇이 지출을 일으키는지 정확히 볼 수 있고, 그 지출을 비즈니스 가치를 만드는 성과와 연결할 수 있으며, 다양한 시나리오에 걸쳐 ROI를 최적화할 수 있습니다.", "en": "And as AI scales in every organization, it needs a clear line between what it spends and the value AI creates inside the organization. That's why today we are very excited to announce **Agent 365 Business Analytics**.\n\nYou can simply think of this as an **ERP system of AI usage**. You can see exactly what is driving the spend, you can connect the spend to the outcomes that drive business value, and you can optimize the ROI across different scenarios."}}, {"type": "shot", "t": 1395, "cap": {"ko": "Agent 365 Business Analytics 발표 슬라이드. '지출 이해(에이전트·서비스·모델·사용자별 비용)', '비즈니스 가치 창출(업무별 AI 지원 가치 측정)', 'ROI 최적화(비용 시나리오 예측, 가드레일·내부 비용 배분 조정)' 세 가지 기능이 적혀 있습니다.", "en": "Announcement slide for Agent 365 Business Analytics: understand spend, drive business value, optimize ROI (forecast cost scenarios, adjust guardrails and chargebacks)."}, "img": "images/shot-09.jpg"}, {"type": "term", "term": "ERP", "kr": {"ko": "전사적 자원 관리 시스템 — 회사의 돈·자원 흐름을 한곳에서 관리", "en": "Enterprise Resource Planning"}, "body": {"ko": "ERP는 회계, 구매, 재고, 인사 등 회사의 자원과 돈의 흐름을 하나의 시스템에서 기록하고 관리하는 소프트웨어입니다(SAP, Dynamics 365 등). '어디에 얼마를 썼고 무엇을 얻었는지'를 회사 전체 차원에서 보여 줍니다.\n\nSatya가 Agent 365 Business Analytics를 'AI 사용의 ERP'라고 부른 것은, 키노트 설명에 따르면 에이전트·모델·사용자별 AI 비용을 추적하고 이를 업무 성과와 연결해 ROI를 관리하는 도구라는 뜻입니다. AI 비용이 커지면서 CFO가 던질 '그래서 효과가 있나?'라는 질문에 답하려는 것입니다.", "en": "Software that tracks a company's money and resources in one place. Calling Agent 365 Business Analytics an 'ERP of AI usage' means it tracks AI spend and ties it to business outcomes and ROI."}}, {"type": "say", "sp": "satya", "t": 1415, "text": {"ko": "다음으로 말씀드리고 싶은 것은, Copilot부터 IQ, 그리고 Agent 365에 등록된 모든 에이전트까지 여러분이 구축해 둔 환경을 **어떻게 보호할 것인가**입니다. 바로 여기서 저희의 보안 스택인 **Perception**이 등장합니다.\n\n저희는 엔드투엔드 신뢰 플랫폼을 만들고 있습니다. 고객이 AI 배포를 보호하는 것과, AI를 활용해 자신의 보안 태세를 강화하는 것을 모두 돕고 있습니다. 모든 에이전트에 고유한 ID를 부여하는 Agent 365부터, MXC와 클라우드 컨테이너(자막 불명확), 모든 데이터와 정보 흐름을 관리하는 Purview, 그리고 위협을 실시간으로 차단하고 봉쇄하는 Defender까지 말입니다.", "en": "The next thing I want to talk about is how do you take the environment you have set up, from Copilot to IQ to all the agents registered in Agent 365, and **secure them**? That is where **Perception**, our security stack, comes in.\n\nWe are building this end-to-end trust platform. We are helping customers both secure their AI deployments and use AI to strengthen their security posture—from Agent 365, giving every agent a unique identity, to MXC and cloud containers (caption unclear), to Purview governing all the data and information flows, and Defender disrupting and containing threats in real time."}}, {"type": "say", "sp": "satya", "t": 1463, "text": {"ko": "실제로 최근에 이것을 보여 주는 훌륭한 사례가 있었습니다. 한 독립 보안 연구자가 요즘 여기저기 뉴스에 나오는 **자율 AI 공격 프레임워크 ARTEX**를 사용해 Defender로 보호되는 환경을 테스트했습니다. 공격 에이전트는 네트워크 안에서 계속 수평 이동을 시도했지만, Defender의 **자동 공격 차단(automatic attack disruption)**이 에이전트가 공격을 이어 가는 동안에도 탈취된 계정을 계속 봉쇄하고 장치를 격리했습니다.\n\n안타깝게도 이런 공격은 점점 더 에이전트화·자율화되고 있습니다. 그래서 대응의 속도가 중요합니다. 그래서 저희는 Perception을 **완전한 에이전트형 보안 시스템**으로 만들었습니다.", "en": "In fact, we saw a fantastic example of this recently. An independent security researcher used **ARTEX**, which is in the news everywhere, an **autonomous AI attack framework**, to test an environment protected by Defender. The agent kept trying to move laterally ac
