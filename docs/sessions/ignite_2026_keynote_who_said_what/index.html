 Judson talks with Leigh-Ann Russell, CIO of BNY, from one of the most regulated industries: build governance and security in from the start to scale fast, a market-first agent-to-agent negotiated trade, and BNY's experience in the Perception preview — the security story told by a customer."}}, {"type": "say", "sp": "judson", "t": 8193, "text": {"ko": "고마워요, Aleš.", "en": "Thanks, Aleš."}}, {"type": "say", "sp": "judson", "t": 8196, "text": {"ko": "오늘 아침 키노트는 제가 마무리하겠습니다. 조직 전체에서 **가장 어려운 직무 중 하나인 CIO**의 관점을 나누는 것으로 마무리하려고 합니다. Leigh-Ann Russell과 함께하고 있습니다. BNY에서 기술과 엔지니어링을 이끌며 정말 많은 일을 해 오셨는데요, 지금 하고 계신 일에 대해 들려주세요.", "en": "I'm going to close this out this morning, and I'm going to do it by sharing a perspective of **one of the hardest jobs of the entire organization, the CIO**. I'm here with Leigh-Ann Russell. You have done so much leading technology and engineering at BNY. Tell us about the work you're doing."}}, {"type": "beat", "t": 8216, "text": {"ko": "(Judson과 BNY CIO Leigh-Ann Russell이 무대 위 의자에 마주 앉아 대담)", "en": "(Judson and BNY CIO Leigh-Ann Russell seated on stage for a conversation)"}}, {"type": "say", "sp": "leighann", "t": 8222, "text": {"ko": "고도로 규제받는 산업에서 기술을 이끄는 사람으로서, **거버넌스와 보안**은 제가 정말 열정을 갖고 있는 주제예요. BNY에서는 AI 여정과 저희 구축 플랫폼을 포함해 하는 모든 일의 중심에 그걸 둡니다. 저는 **프로젝트의 중심에 처음부터 거버넌스와 보안을 넣으면 그게 빨리 확장하는 방법**이고, 나중에 넣으면 그게 **브레이크**가 되어 속도를 늦춘다고 굳게 믿어요.\n\n저희 팀은 그 원칙을 아주, 아주 멋진 일로 시험해 왔어요. 저희의 **에이전트 협상 프로토콜(agentic negotiation protocol)** 아래에서 Microsoft 에이전트와 BNY 에이전트를 한자리에 모았고, 둘이 함께 **협상을 거쳐 거래를 체결**했어요. **시장 최초**입니다. 이제 이걸 어떻게 확장할지 배워 갈 거예요.", "en": "So, as someone who leads technology in a highly regulated industry, **governance and security** is something that I'm super passionate about. At BNY we put that at the heart of everything we do, including on our AI journey and our build platform. And I firmly believe that **if you build in governance and security at the heart of a project, that's how you scale fast**; if you do it later, it becomes a **brake** and that slows things down.\n\nOur teams have been putting those principles to the test in something very, very cool. Under our **agentic negotiation protocol**, we've brought together a Microsoft agent and the BNY agent, and together they have **executed a negotiated [trade]** — that's **a market first**. [We]'ll learn how to scale that."}}, {"type": "term", "term": "Agentic negotiation protocol", "kr": {"ko": "서로 다른 회사의 AI 에이전트끼리 협상하고 거래하도록 정한 규칙", "en": "Rules for agents from different firms to negotiate and transact"}, "body": {"ko": "키노트 설명에 따르면, BNY는 '에이전트 협상 프로토콜'이라는 틀 안에서 Microsoft 쪽 에이전트와 BNY 쪽 에이전트가 서로 협상해 실제 거래를 체결하게 했고, Leigh-Ann은 이를 '시장 최초'라고 소개합니다.\n\n프로토콜이란 양측이 미리 합의한 대화·거래 규칙입니다. 사람 트레이더 둘이 전화로 가격과 조건을 주고받는 과정을, 정해진 규칙에 따라 양사의 에이전트가 대신하는 그림입니다.\n\n중요한 것은 그다음 질문에 대한 답입니다. 사람과 에이전트의 역할, 권한, 책임 소재를 먼저 정했고, 최종 체결 결정은 사람이 했습니다. 즉 '에이전트끼리 거래'가 통제 없이 이뤄진 게 아니라 거버넌스 안에서 이뤄졌다는 것이 포인트입니다.", "en": "Per the keynote, a framework under which a Microsoft agent and a BNY agent negotiated and executed a trade — called a market first. Roles, permissions and accountability were defined up front, and a human made the final execution decision."}}, {"type": "say", "sp": "judson", "t": 8277, "text": {"ko": "정말 멋지네요. 그럼 이런 환경에서 움직이는 에이전트들을 **관리하고, 통제하고, 보호할 수 있다는 확신**은 어디서 나왔나요?", "en": "Super cool. So what gave you **the confidence that you could manage, govern and secure these agents** operating in this environment?"}}, {"type": "say", "sp": "leighann", "t": 8287, "text": {"ko": "저희 팀들이 함께 그 원칙을 시험했어요. 무엇보다 먼저, 무엇을 만들지 **세부 사항을 정말 치열하게 고민**했어요. 에이전트, 대규모 확장, 규제 산업에서는 이게 정말 중요하거든요. 우선 이렇게 물었어요. **사람의 역할은 무엇인가, 에이전트의 역할은 무엇인가, 이 거래를 통제할 권한은 무엇인가, 그리고 책임은 어디에 있는가?**\n\n실제 시장에 나가기 전에 테스트하고 또 테스트했어요. 실제로 라이브로 갔을 때도 **사람이 루프 위에서(human over the loop)** 전체 과정을 지켜봤고, 거래를 일시 중지하거나 아예 멈출 수 있었어요. 그리고 최종 거래 체결 단계에서는 **사람이 결정**했고, 그렇게 거래가 이뤄졌어요. 이런 원칙들이 저희에게 그런 확신을 줍니다.", "en": "Well, our teams working together put those principles to the test. First of all, they really **sweated the detail** on what they were going to build, and this is really important in agents, scale and regulated industries. First of all they said: **what are the roles of the human, what are the roles of the agent, [what are the] permissions that are going to govern this trade, and what's the accountability — where does the accountability lie?**\n\nThey tested and tested before we went to the live market. Even when we went live, there was a **human over the loop** who looked at the whole process and had the ability to pause or even stop the trade. And when it came to the final trade execution, **a human made the decision**, and that's how the trade took place. And those principles allow us to have that confidence."}}, {"type": "term", "term": "Human over the loop", "kr": {"ko": "AI가 스스로 일하되, 사람이 전체를 지켜보며 언제든 멈출 수 있는 방식", "en": "AI acts autonomously while a human supervises and can intervene"}, "body": {"ko": "AI 감독 방식은 흔히 셋으로 나눕니다. human in the loop(사람이 매 단계 승인), human on/over the loop(AI가 스스로 진행하되 사람이 위에서 지켜보며 개입·중단 가능), human out of the loop(완전 자동)입니다.\n\nBNY의 사례는 '오버 더 루프'입니다. 에이전트끼리 협상은 알아서 하되, 사람이 전 과정을 모니터링하며 일시 중지·중단할 권한을 갖고, 최종 체결 버튼은 사람이 눌렀습니다.\n\n규제 산업에서 에이전트를 실전에 쓰려면 '속도'와 '통제'를 동시에 확보해야 하는데, 그 균형점을 보여 주는 실제 사례라는 점에서 의미가 있습니다.", "en": "Oversight modes: in the loop (human approves each step), over the loop (AI proceeds, human monitors and can pause/stop), out of the loop (fully autonomous). BNY used 'over the loop', with a human making the final trade decision."}}, {"type": "say", "sp": "judson", "t": 8337, "text": {"ko": "사이버 쪽으로 넘어가 보죠. Perception의 **프라이빗 프리뷰**에 참여해 오셨는데요(자막: 'Project Perception'). **사후 대응에서 선제 대응으로** 바뀌는 게 어땠는지 조금 들려주세요.", "en": "Let's pivot to the cyber side of things. You've been involved in our **private preview** of Perception (caption: 'Project Perception'). Share a little bit about what it's been [like] to go **from reactive to proactive**."}}, {"type": "say", "sp": "leighann", "t": 8357, "text": {"ko": "(공격자들이) AI의 시간으로 움직일 때, 저희 팀도 훌륭한 AI 도구를 갖추고 **사람의 시간이 아니라 AI의 시간으로 일해야** 해요(자막 앞부분 불명확). 저희 팀이 사이버 범죄와 싸울 최고의 도구를 손에 쥘 수 있게 해 준 프리뷰에 참여할 수 있어서 감사하게 생각해요. 이런 도구는 사이버 전문가들에게 무슨 일이 일어나고 있는지 **훌륭한 가시성**을 줘서, 사이버 팀이 방어를 **확실히 통제**할 수 있게 해야 해요.", "en": "When [attackers] go in AI time, our teams have to have great AI tooling and **work in AI time, not human time** (start of caption unclear). We're grateful that we were part of [the] preview that allows our teams to have the best tools at their fingertips to fight cybercrime. These tools have to give our cyber professionals **great visibility** about what's going on, to have our cyber teams **really in control** of the defenses."}}, {"type": "say", "sp": "leighann", "t": 8384, "text": {"ko": "(자막 일부 누락) 그리고 [제] 올해의 단어는 **'일관성(coherence)'**이에요. **의도(Intent)** — 우리가 만드는 것이 의도에 따라 설계됐다는 걸 어떻게 알 수 있을까? **무결성(Integrity).** **인프라(Infrastructure)** — Satya도 얘기했죠. 우리의 구축을 뒷받침할 올바른 인프라를 갖추고 있는가? 그리고 **임팩트(Impact)** — 우리가 하는 모든 일은 임팩트로 나타나야 해요.", "en": "(part of caption missing) Now, the word of the year [for me] is **coherence**. **Intent**: how do we know what we're building is designed by intent? **Integrity.** **Infrastructure** — Satya talked about it: do we have the right infrastructure [to support] our buildout? And **impact**: everything we do has to show up with an impact."}}, {"type": "say", "sp": "judson", "t": 8415, "text": {"ko": "정말 잘 정리해 주셨네요. 고도로 규제되는 산업에서 이 모든 걸 해내야 하는 압박은 엄청날 것 같아요. 그 이야기로 마무리해 주시죠.", "en": "I think you framed [it] super well. The pressures of doing all of this in a highly regulated industry have to be super intense. Bring us together on that."}}, {"type": "say", "sp": "leighann", "t": 8427, "text": {"ko": "결국 이런 **통제 장치**를 갖추는 거예요. 그게 저희가 앞으로 나아갈 자신감을 줘요. BNY처럼 **242년**을 버티려면 혁신의 최전선에 있지 않고서는 불가능해요. 저희는 빠르게 혁신하고 싶지만, **신뢰의 틀 안에서** 그렇게 하고 싶어요.\n\n고객들은 저희가 회복력 있기를 기대하고, 고객과 규제 당국은 저희가 규율을 갖추기를 기대해요. 기술은 그 두 가지를 다 해결할 수 있지만, 반드시 그 틀 안에서 해야 해요. 결국 **신뢰가 곧 프로젝트(trust is the project)**예요.", "en": "It's about having these **controls** — that gives us confidence to move forward. And you don't get to be **242 years old** like BNY is without being at the forefront of innovation. And we want to innovate fast, but we want to do it **within a framework of trust**.\n\nOur clients depend on us to [be] resilient; our clients and our regulators depend on us having discipline. And technology can solve both of those things, but it has to do that within that framework. And at the end of the day, **trust is the project**."}}, {"type": "say", "sp": "judson", "t": 8464, "text": {"ko": "멋집니다. 감사합니다.", "en": "Awesome. Thank you."}}, {"type": "say", "sp": "leighann", "t": 8467, "text": {"ko": "감사합니다.", "en": "Thank you."}}, {"type": "say", "sp": "judson", "t": 8468, "text": {"ko": "감사합니다.", "en": "Thank you."}}, {"type": "beat", "t": 8468, "text": {"ko": "(박수. Leigh-Ann 퇴장, Judson이 무대 중앙으로)", "en": "(Applause. Leigh-Ann exits; Judson moves to center stage)"}}, {"type": "part", "t": 8460, "kicker": {"ko": "EPILOGUE", "en": "EPILOGUE"}, "title": {"ko": "다시, 사람에게로", "en": "Back to people"}, "text": {"ko": "Judson이 세 가지 축을 아이들의 꿈, 지식의 민주화, ‘집에 일꾼을 들이는 순간’의 비유로 정리하며 키노트를 마무리합니다.", "en": "Judson closes by tying the three pillars to kids' dreams, democratized knowledge, and the moment you let a worker into your home."}}, {"type": "section", "t": 8470, "title": {"ko": "클로징 — 인간의 야망, 지능, 그리고 신뢰", "en": "Closing — human ambition, intelligence and trust"}, "lead": {"ko": "Judson이 키노트 전체를 세 가지 '가장 오래가는 자산'(인간의 야망, 지능, 신뢰)으로 묶어 마무리합니다. 아이들의 꿈 포스터 이야기, 집에 작업자를 들이는 비유를 통해 왜 관측 가능성(observability)과 신뢰가 핵심인지 설명하고, '모든 조직이 더 많은 것을 이루도록'이라는 Microsoft의 사명으로 끝맺습니다.", "en": "Judson ties the whole keynote to three durable assets — human ambition, intelligence and trust — via a story about kids' ambition posters and an analogy of inviting a worker into your home, explains why observability is the basis of trust, and ends with Microsoft's mission."}}, {"type": "say", "sp": "judson", "t": 8470, "text": {"ko": "오늘 아침 여러분은 저희가 고객과 함께 **프런티어 생태계**를 어떻게 만들어 가는지 보셨습니다. 또 이 변화에서 가장 오래가는 세 가지 자산이 **인간의 야망, 지능, 그리고 신뢰**라는 것도 보셨습니다. 모든 기술의 물결은 인류에 봉사하기 위해 만들어졌고, 이번 물결도 다르지 않을 겁니다. 무한한 인지 컴퓨팅(infinite cognitive compute)이 있다 해도요(자막 불명확).", "en": "This morning you've seen how we're building **the frontier ecosystem** with our customers. You've also seen how the three most durable assets for this transformation are **human ambition, intelligence and trust**. Every technology wave has been created to serve humanity, and this one will be no different — [even with] infinite cognitive compute (caption unclear)."}}, {"type": "say", "sp": "judson", "t": 8496, "text": {"ko": "최근에 Microsoft 직원들을 위한 행사를 열 기회가 있었는데, 부모들이 자유롭게 즐길 수 있도록 아이들을 위한 파티를 따로 마련했습니다. 입구에 포스터를 세워 두고 아이들에게 **자기의 가장 큰 꿈(야망)**을 적어 달라고 했는데, 정말 영감을 받았습니다.\n\n재밌는 답도 있었어요. '일본에 가고 싶다', '킹코브라를 만져 보고 싶다.' 사실 AI가 맞춤법 정도는 도와줄 수 있겠죠. 하지만 그 너머를 보면 다음 세대의 희망과 꿈이 보입니다. 여기 어디에도 **'프롬프트 엔지니어'라는 말은 없습니다**.", "en": "I had the opportunity to host an event recently for Microsoft employees, and we organized a party for the kids to free up the parents. At the front door we set up these posters, and I asked the kids to write down **their biggest ambition**. I found them to be inspirational.\n\nSome fun answers: I want to go to Japan; I want to touch a king cobra. True, AI might be able to help with the spelling, but if you look beyond that, you see the hopes and dreams of the future generation. **Nowhere on here do you see the words 'prompt engineer.'**"}}, {"type": "shot", "t": 8510, "cap": {"ko": "'What's your biggest ambition?' 슬라이드: 아이들이 손글씨로 꿈을 적은 'AMBITION' 포스터('FOTBALS PILER'처럼 철자가 틀린 축구 선수의 꿈, 'I want to touch a king cobra' 등). AI 시대에도 중심은 사람의 야망이라는 클로징 메시지의 상징입니다.", "en": "'What's your biggest ambition?': the kids' handwritten AMBITION poster (misspelled football-player dreams, 'I want to touch a king cobra') — the symbol of the closing message that human ambition stays at the center."}, "img": "images/shot-48.jpg"}, {"type": "say", "sp": "judson", "t": 8535, "text": {"ko": "그리고 우리 아이들이 **채팅 창 안에서 살고 싶어 하지 않을 것**은 아주 분명합니다. 프런티어 트랜스포메이션은 **인간의 야망을 가능하게 하기 위한 것**입니다. 사람들은 매일 쓰는 캔버스(작업 공간) 안에서 AI가 살아 움직이기를 원합니다. 그래야 자신에게 가장 중요한 일에 더 많은 시간을 쓸 수 있으니까요.", "en": "And it's pretty clear that **our children won't want to live in a chat window**. Frontier transformation is intended to **enable human ambition**. People want to see AI lit up in the canvases they use every day, so they can spend more time [on] what matters most to them."}}, {"type": "say", "sp": "judson", "t": 8554, "text": {"ko": "지능은 정보를 모아 놓은 것도, 그걸로 추론하는 것도 아닙니다. 지능은 그 이상을 뜻합니다. **여러분만의 고유한 아이디어, 여러분 조직만의 고유한 차별성**입니다. 역사적으로 가진 자와 못 가진 자의 격차는 **지식에 대한 접근성**과 맞물려 왔습니다.\n\n(자막 일부 누락) **지능을 민주화**하고 사회의 실제 문제를 풀어야 합니다. 불치병의 치료, 과학과 연구의 진보, 모두를 위한 영양과 번영 말입니다. 지능은 **내부에서부터 복리로 쌓여야** 합니다.\n\n프런티어 생태계는 어느 한 모델의 성공이나, 세계 GDP를 노리는 어느 모델 연구소에 관한 것이 아닙니다. **여러분의 IQ, 여러분 고유의 차별성**이 개방적이고 다양한 모델을 쓰는 방식으로 증폭되어, 그 지속성을 지키면서 여러분의 가장 높은 열망을 이루는 것에 관한 것입니다.", "en": "Intelligence is not the aggregation of information or the inferencing of the same. Intelligence means something more: **your unique ideas, your organization's unique differentiation**. Throughout history, the gap between the haves and have-nots has correlated to **the access of knowledge**.\n\n(part of caption missing) [We can] **democratize intelligence** and solve real problems for society: the cure for the incurable, advances in science and research, nourishment and prosperity for all. Intelligence must **compound from within**.\n\nThe frontier ecosystem is not about the success of any one model, or a model lab seeking the world's GDP. It's about **your IQ, your unique differentiation**, amplified in an open, model-diverse way, achieving your highest aspirations by protecting the durability of the same."}}, {"type": "say", "sp": "judson", "t": 8620, "text": {"ko": "결국 모든 건 **신뢰**로 귀결됩니다. 잠깐 맥락을 완전히 벗어나서 생각해 보죠. 마지막으로 **누군가를 집에 불러 일을 맡겼던 때**를 떠올려 보세요. 처음에 이 사람을 믿을지 결정해야 하는 순간이 있습니다. 그 사람은 여러분의 가장 사적인 공간에 들어오고, 비용도 따릅니다. 여러분은 그 사람이 맡은 일을, **오직 그 일만** 해 주길 원하고, 가치를 확인하고 싶고, 안전하다는 느낌이 필요합니다. 그게 바로 **우리가 AI와 맺어야 하는 합의**입니다.", "en": "In the end, it comes down to **trust**. Take this completely out of context for a minute: consider **the last time you invited someone into your home to do some work**. There's this initial moment where you must decide to trust this person. They're coming into your most personal space, and the associated costs. You want them to perform the job at hand and **only that job**, you want to see value, and you need to feel a sense of security. That's **the kind of agreement we have to have with AI**."}}, {"type": "say", "sp": "judson", "t": 8647, "text": {"ko": "신뢰를 얻는 유일한 방법은 **관측 가능성(observability)**입니다. 여러분의 솔루션 환경에서 AI 기술을 관찰하고, 관리하고, 통제하고, 보호하고, 그 가치를 측정할 수 없다면, **그 AI를 신뢰할 수 없습니다**. 저희는 50년 넘게 엔터프라이즈에서 하는 모든 일에 보안을 녹여 왔고, 그 경험을 AI의 안전한 적용에 쏟고 있습니다.", "en": "The only way to gain trust is through **observability**. If you can't observe, manage, govern, secure and measure the value of the AI technology in [your] solutions environment, you simply **can't trust it**. We have over 50 years of building security into everything we do within the enterprise, and we're applying that to the safe application of AI."}}, {"type": "say", "sp": "judson", "t": 8674, "text": {"ko": "이 자리에 계신 모든 분께는 열정을 쏟는 무언가가 있습니다. 저희는 이번 Ignite에 함께 발표한 고객사 직원들에게 그들의 야망을 물었습니다. **기술에는 야망이 없고, 야망은 사람에게 있기** 때문입니다.", "en": "Everyone in this room has something that they're passionate about, and we asked the employees from the customers presenting with us here at Ignite about their ambitions, because **technology doesn't have ambitions — people do**."}}, {"type": "say", "sp": "judson", "t": 8692, "text": {"ko": "기술이 모든 직무, 모든 워크플로, 모든 산업의 모든 회사를 바꿀 잠재력을 가질 때, 여러분에게는 **신뢰할 수 있는 파트너**가 필요합니다. 앞으로 펼쳐질 변화의 여정에서 **Microsoft가 '방 안의 어른'**이라고 자신 있게 말씀드릴 수 있습니다.\n\n오늘 저희는 프런티어 생태계를 만들기 위한 **종합적인 AI 플랫폼**을 보여 드렸습니다. 저희는 모든 AI 모델이나 모든 에이전트, 모든 GPU에 힘을 주려고 여기 있는 게 아닙니다. 저희는 **지구상의 모든 조직이 더 많은 것을 이룰 수 있도록** 힘을 주기 위해 여기 있습니다. AI는 인류를 위해 땅에 발을 딛고 있어야 한다는 원칙을 굳게 지켜 나갑시다. 감사합니다.", "en": "When technology has the potential to reshape every job, every workflow, every company in every industry, you need **a trusted partner**. I can say confidently that **Microsoft is the adult in the room** relative to the transformation journey that lies ahead.\n\nToday we've shown you **a comprehensive AI platform** for building the frontier ecosystem. We're not here to empower every AI model or every agent or every GPU. We're here to **empower every organization on the planet to achieve more**. Let's stay grounded on the principle that AI needs to stay grounded for humanity. Thank you."}}, {"type": "beat", "t": 8717, "text": {"ko": "(무대 스크린에 고객사 직원들이 손글씨 '야망' 카드를 들고 있는 사진들이 가득 펼쳐짐 — 예: 'My ambition is to make missed growth a thing of the past.')", "en": "(Stage screens fill with photos of customer employees holding handwritten ambition cards, e.g. 'My ambition is to make missed growth a thing of the past.')"}}, {"type": "beat", "t": 8735, "text": {"ko": "(박수 — 키노트 종료)", "en": "(Applause — end of keynote)"}}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
let LANG = D.defaultLang || 'ko';
let FILTER = null;
const UI = {
  ko:{watch:'YouTube에서 보기', play:'▶  영상 열기', toc:'키노트의 흐름', cast:'등장인물',
      casthint:'얼굴을 누르면 그 사람의 발언만 모아 볼 수 있어요. 파란 점은 Microsoft 소속입니다. 본문에서 Microsoft 발표자는 왼쪽, 고객·파트너사는 오른쪽 말풍선으로 표시됩니다.',
      first:'첫 등장', turns:'발언', all:'전체 보기', only:'님의 발언만 보는 중',
      cap:'썸네일이나 각 발언의 타임코드를 누르면 해당 지점의 영상이 열립니다.',
      gl:'용어 사전', glhint:'본문 중간의 노란 상자를 모은 목록입니다. 누르면 해당 위치로 이동해 펼쳐집니다.',
      lead:'이 구간의 의도', o1:'이 페이지는 키노트 영상의 모든 발언을 시간 순서대로 화자별로 옮기고, 어려운 용어에는 설명 상자를 덧붙인 학습용 정리본입니다.',
      o2:'자동 자막을 바탕으로 화면을 대조해 다듬은 의역이며, 정확한 표현과 수치는 원본 영상을 확인하세요.'},
  en:{watch:'Watch on YouTube', play:'▶  Open the video', toc:'How the keynote flows', cast:'Cast',
      casthint:'Click a face to see only that person\'s lines. A blue dot marks Microsoft speakers. In the body, Microsoft speakers are on the left, customers and partners on the right.',
      first:'first at', turns:'lines', all:'Show all', only:' — showing only these lines',
      cap:'Click the thumbnail, or any timecode, to open the video at that moment.',
      gl:'Glossary', glhint:'All the yellow explainer boxes in one list. Click to jump to one and open it.',
      lead:'What this part is for', o1:'A study companion that follows every line of the keynote, speaker by speaker, and annotates the jargon.',
      o2:'Built from auto-captions cross-checked against the screen; paraphrased for clarity — check the video for exact wording and numbers.'}
};
function T(o){ if(o==null) return ''; return (typeof o==='string')?o:(o[LANG]??o.ko??o.en??''); }
function mmss(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');}
function yt(t){return D.watchUrl+'&t='+t+'s';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\((\d{1,3}):(\d{2})\)/g,(m,a,b)=>{const sec=parseInt(a,10)*60+parseInt(b,10);
    return '(<a class="ts" href="'+yt(sec)+'" target="_blank" rel="noopener">'+a+':'+b+'</a>)';});
  return s.split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
const tsA = t => '<a class="ts" href="'+yt(t)+'" target="_blank" rel="noopener">'+mmss(t)+'</a>';

function stats(){
  const st={};
  for(const b of D.blocks){ if(b.type==='say'){ const s=st[b.sp]||(st[b.sp]={n:0,first:b.t}); s.n++; if(b.t<s.first) s.first=b.t; } }
  return st;
}
const ST = stats();

function render(){
  document.documentElement.lang = LANG;
  const u = UI[LANG]||UI.ko;
  document.title = T(D.title).replace(/<[^>]+>/g,'');
  kicker.textContent = T(D.kicker); eyebrow.textContent = T(D.kicker);
  h1.innerHTML = T(D.title); sub.textContent = T(D.subtitle);
  const nSay = D.blocks.filter(b=>b.type==='say').length, nSp = Object.keys(ST).filter(k=>k!=='narrator').length;
  pill.innerHTML = '<b>'+D.durationLabel+'</b> · '+nSp+(LANG==='ko'?'명 · ':' speakers · ')+nSay+(LANG==='ko'?' 발언':' lines');
  watch.textContent=u.watch; watch.href=D.watchUrl; thumblink.href=D.watchUrl; thumbimg.src=D.thumb;
  playtxt.textContent=u.play; cap.textContent=u.cap; toch.textContent=u.toc; casth.textContent=u.cast; casthint.textContent=u.casthint;
  glh.textContent=u.gl; glhint.textContent=u.glhint; outro1.textContent=u.o1; outro2.textContent=u.o2; fclr.textContent=u.all;

  // cast (order by first appearance)
  cast.innerHTML='';
  Object.keys(D.speakers).filter(k=>ST[k] && k!=='narrator').sort((a,b)=>ST[a].first-ST[b].first).forEach(k=>{
    const sp=D.speakers[k]; const b=document.createElement('button');
    b.className='cc'+(sp.ms?' ms':'')+(FILTER===k?' on':'');
    b.innerHTML=(sp.img?'<img src="'+sp.img+'" alt="">':'<span class="ini">'+(sp.initial||'')+'</span>')
      +'<div><div class="nm">'+T(sp.name)+'</div><div class="rl">'+T(sp.role)+'</div><div class="ct">'+u.first+' '+mmss(ST[k].first)+' · '+ST[k].n+' '+u.turns+'</div></div>';
    b.onclick=()=>setFilter(FILTER===k?null:k);
    cast.appendChild(b);
  });

  // toc
  let html='', sn=0, cur='';
  for(const b of D.blocks){
    if(b.type==='part'){ if(cur) html+='</ol>'; html+='<div class="part-t">'+T(b.kicker)+' · '+T(b.title)+'</div><ol>'; cur='x'; }
    if(b.type==='section'){ sn++; if(!cur){html+='<ol>';cur='x';}
      html+='<li><a href="#s'+sn+'"><span class="n">'+String(sn).padStart(2,'0')+'</span><span>'+T(b.title)+'</span><span class="tm">'+mmss(b.t)+'</span></a></li>'; }
  }
  tocl.innerHTML = html+'</ol>';

  // body
  html=''; sn=0; let open=false, pn=0, tn=0; const gl=[];
  for(const b of D.blocks){
    if(b.type==='part'){
      if(open){html+='</section>';open=false;} pn++;
      html+='<div class="part" id="p'+pn+'"><div class="pk">'+T(b.kicker)+'</div><h2>'+T(b.title)+'</h2><p>'+T(b.text)+'</p></div>';
    } else if(b.type==='section'){
      if(open) html+='</section>'; sn++; open=true;
      html+='<section class="sec sync-cue" id="s'+sn+'" data-sync-time="'+b.t+'"><div class="sec-head"><span class="sec-n">'+String(sn).padStart(2,'0')+'</span><h2 class="sec-t">'+T(b.title)+'</h2><span class="sec-time">'+tsA(b.t)+'</span></div>'
          +(b.lead?'<div class="lead"><b class="lt">'+u.lead+'</b>'+rich(T(b.lead)).replace(/<\/?p>/g,' ')+'</div>':'');
    } else if(b.type==='say'){
      const sp=D.speakers[b.sp]||{name:{ko:b.sp,en:b.sp}}; const who=T(sp.name);
      const side = b.sp==='narrator'?'n':(sp.side||'l');
      const av = sp.img?'<img src="'+sp.img+'" alt="'+who+'">':(sp.initial||'');
      html+='<div class="turn '+side+' sync-cue" data-sp="'+b.sp+'"'+(b.t!=null?' data-sync-time="'+b.t+'"':'')+'><div class="av">'+av+'</div><div class="body"><div class="who"><b>'+who+'</b><i>'+T(sp.short||sp.role)+'</i>'+(b.t!=null?tsA(b.t):'')+'</div><div class="bub">'+rich(T(b.text))+'</div></div></div>';
    } else if(b.type==='beat'){
      html+='<div class="beat sync-cue"'+(b.t!=null?' data-sync-time="'+b.t+'"':'')+'>'+(b.t!=null?tsA(b.t):'')+esc(T(b.text))+'</div>';
    } else if(b.type==='shot'){
      html+='<figure class="shot sync-cue" data-sync-time="'+b.t+'"><a class="im" href="'+yt(b.t)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+b.img+'" alt=""></a><figcaption>'+tsA(b.t)+'<span>'+esc(T(b.cap))+'</span></figcaption></figure>';
    } else if(b.type==='term'){
      tn++; gl.push([tn,b]);
      html+='<details class="term" id="g'+tn+'"><summary><span class="term-tag">'+(LANG==='ko'?'용어':'TERM')+'</span><b>'+esc(b.term)+'</b>'+(b.kr?'<span class="kr">'+esc(T(b.kr))+'</span>':'')+'<span class="chev">▼</span></summary><div class="term-b">'+rich(T(b.body))+'</div></details>';
    }
  }
  if(open) html+='</section>';
  main.innerHTML = html;
  document.getElementById('gl').innerHTML = gl.slice().sort((a,b)=>a[1].term.localeCompare(b[1].term)).map(([n,b])=>'<a href="#g'+n+'" data-g="'+n+'"><b>'+esc(b.term)+'</b>'+esc(T(b.kr))+'</a>').join('');
  document.querySelectorAll('#gl a').forEach(a=>a.onclick=()=>{const d=document.getElementById('g'+a.dataset.g); if(d) d.open=true;});
  applyFilter();
}

function setFilter(k){ FILTER=k; render(); if(k) document.getElementById('fbar').scrollIntoView({behavior:'smooth',block:'start'}); }
function applyFilter(){
  const on=!!FILTER; document.body.classList.toggle('filt',on); fbar.classList.toggle('on',on);
  document.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
  if(!on) return;
  const sp=D.speakers[FILTER]; fimg.src=sp.img||''; ftxt.textContent=T(sp.name)+(LANG==='ko'?UI.ko.only:UI.en.only);
  document.querySelectorAll('.turn[data-sp="'+FILTER+'"]').forEach(t=>{t.classList.add('hit'); const s=t.closest('.sec'); if(s) s.classList.add('hit');});
  let curPart=null;
  document.querySelectorAll('#main > *').forEach(el=>{ if(el.classList.contains('part')) curPart=el; else if(el.classList.contains('hit') && curPart) curPart.classList.add('hit'); });
}
fclr.onclick=()=>setFilter(null);

(D.langs||[['ko','한국어'],['en','English']]).forEach(([c,l])=>{
  const b=document.createElement('button'); b.textContent=l; b.dataset.c=c;
  b.onclick=()=>{LANG=c;[...langseg.children].forEach(x=>x.classList.toggle('on',x.dataset.c===c));render();};
  if(c===LANG) b.classList.add('on'); langseg.appendChild(b);
});
const saved = localStorage.getItem('y2h-theme');
if(saved) document.documentElement.dataset.theme = saved;
else if(matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.dataset.theme='dark';
themebtn.onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('y2h-theme',n);};
render();
</script>
