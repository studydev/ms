, from the company that you can trust. Judson, over to you."}}, {"type": "shot", "t": 6072, "cap": {"ko": "마무리 슬라이드 'Frontier Intelligence — Your IQ. Your Agents. Your Weights.': Code·Decision·Cyber·Image·Transcribe·Custom Models·Licensed Weights 7개 제품군을 한 장에 정리했습니다.", "en": "Closing slide \"Frontier Intelligence — Your IQ. Your Agents. Your Weights.\" summarizing Code, Decision, Cyber, Image, Transcribe, Custom Models and Licensed Weights."}, "img": "images/shot-36.jpg"}, {"type": "beat", "t": 6077, "text": {"ko": "(박수 속에 무스타파 퇴장, 저드슨이 무대 한쪽 대담석으로)", "en": "(Applause; Mustafa exits and Judson moves to the fireside chairs)"}}, {"type": "section", "t": 6086, "title": {"ko": "퍼블리시스 그룹 아서 사둔과의 대담 — '죽었어야 할 회사'의 AI 반전", "en": "Fireside with Arthur Sadoun of Publicis Groupe — the AI comeback"}, "lead": {"ko": "저드슨이 '인텔리전스' 파트를 '맨 꼭대기의 시선', 즉 CEO 관점으로 마무리합니다. 생성형 AI 등장 때 '광고 회사는 끝났다'는 말을 들었던 Publicis Groupe가 어떻게 오히려 업계 1위가 됐는지, 그리고 사람 중심 서비스 기업이 AI·Microsoft IQ·변화 관리를 어떻게 바라보는지가 핵심입니다. 마지막의 개인적인 '신뢰' 이야기는 다음 순서인 '신뢰(Trust)' 파트로 자연스럽게 이어지는 연결 고리이기도 합니다.", "en": "Judson closes the Intelligence pillar with \"the view from the top\" — a CEO's perspective. Publicis Groupe was written off when generative AI arrived, yet became No. 1 in its industry. Listen for how a people-first service business thinks about AI, Microsoft IQ and change management. Arthur's closing note on trust also bridges into the next pillar, Trust."}}, {"type": "say", "sp": "judson", "t": 6086, "text": {"ko": "감사합니다. 인텔리전스 세그먼트를 마무리하는 가장 좋은 방법은 맨 위에서 내려다보는 시선을 듣는 것입니다. 정말 맨 꼭대기에서요. 제 소중한 친구, **아서 사둔(Arthur Sadoun)**을 맞이해 주십시오. 환영합니다. 여기 Ignite의 제 '사무실'에 오신 걸 환영해요.\n\n아서, 친구니까 직설적으로 말할게요. 당신은 **여기 있으면 안 되는 사람**이에요. 3년 전, 생성형 AI가 막 등장했을 때 언론을 읽었다면 말이죠. 그런데 아직 여기 있고, 사실 생성형 AI 등장 이전보다 더 잘하고 있어요. 당신이 구축한 플랫폼 덕분에, 인텔리전스를 핵심에 둔다는 개념에 기반해서요.", "en": "Thank you. The best way to round out our intelligence segment is to take the view from the top. The very top. Please join me in welcoming my dear friend, **Arthur Sadoun**. Welcome. Good to have you here in my office here at Ignite.\n\nArthur, I'm going to be blunt since we're friends: **you're not supposed to be here**, if you read the press three years ago at the dawn of generative AI. You're still here — you're actually doing better than you did before the dawn of generative AI — all grounded on this notion of having intelligence at the core, because of the platform you built."}}, {"type": "beat", "t": 6094, "text": {"ko": "(아서 사둔 등장, 두 사람이 대담 의자에 앉음)", "en": "(Arthur Sadoun walks on; the two sit in the fireside chairs)"}}, {"type": "say", "sp": "arthur", "t": 6129, "text": {"ko": "네, **저는 죽었어야 했는데 여기 있네요.** 정말 기쁩니다.\n\n몇 년 전만 해도 모든 AI 전문가들이 '광고는 죽었다'고 말했죠. 누군가 광고 업계에서 일하는 사람의 90%가 2년 뒤면 사라질 거라고 했던 게 기억납니다. 4년이 지난 지금 저희는 **12만 명**까지 늘었습니다.", "en": "Yes, **I should be dead and I'm here.** This is a great pleasure.\n\nA couple of years ago, every AI guru would tell you advertising is dead. I remember someone saying 90% of the people that work in [advertising] would disappear two years later. Four years later we're up to **120,000 people**."}}, {"type": "say", "sp": "arthur", "t": 6157, "text": {"ko": "당시 저희는 쉽지 않은 **세 가지 전략적 베팅**을 했습니다. 첫째, 고객들에게 진짜 힘을 드리기 위해 **아이덴티티(identity)와 기술**에 대대적으로 투자했습니다.\n\n둘째, 이 자리의 모든 분께 중요한 이야기인데요, **사일로를 허물 때**라고 했습니다. 사일로를 허물지 않으면 기술과 AI는 작동하지 않으니까요. '**사일로도 없고, 멍청이(bozo)도 없다**'고요.\n\n마지막으로, 10년 전에 저희는 앞으로 **AI가 주도하게 될 것**이라고 했습니다. 업계의 누구도 그렇게 생각하지 않았죠. 그때 사티아에게서 '우리 함께 뭔가 만들어 보면 어떨까요'라는 메시지를 받았고, 거기서 시작했습니다. 그리고 그다지 좋은 위치가 아니던 저희가 오늘날 **업계 1위**가 되었습니다.", "en": "We made at the time **three strategy bets** that were tough bets. The first is, we invested massively into **identity and technology**, to really have the power for our clients.\n\nSecond, which is important for everyone in this room, is that we said it's time to **break down the silos**, because technology and AI doesn't work if you don't break the silos. **No silos, no bozos.**\n\nLast but not least, ten years ago now we said it would be **led by AI**. No one in our industry thought it was the case. I received a message from Satya — maybe we should build something together — and this is where we started, and we moved from not very well placed to the **number one position in our industry** today."}}, {"type": "term", "term": "Silos", "kr": {"ko": "사일로 — 부서 간 칸막이", "en": "Silos"}, "body": {"ko": "사일로는 곡식 창고처럼 부서나 조직이 각자 자기 데이터와 업무를 따로 쌓아 두고 서로 공유하지 않는 상태를 말합니다.\n\nAI는 회사 전체의 데이터와 맥락을 연결해야 힘을 발휘하는데, 부서마다 칸막이가 있으면 AI가 볼 수 있는 정보가 조각나 버립니다. 아서가 '사일로를 허물지 않으면 AI는 작동하지 않는다'고 말한 이유입니다. 'No silos, no bozos'는 '칸막이도, 협업을 방해하는 사람도 없다'는 그의 경영 구호입니다.", "en": "Silos are departments hoarding their own data and work. AI needs connected, company-wide context, so silos cripple it — hence Arthur's motto \"No silos, no bozos.\""}}, {"type": "say", "sp": "judson", "t": 6221, "text": {"ko": "멋지네요. 일이 실제로 어떻게 바뀌었는지 말씀해 주세요. Publicis 안에서 사람들의 포부(ambition)는 무엇이 달라졌나요?", "en": "Super. Tell us about how the work actually changed. What's different about the ambition of people inside of Publicis?"}}, {"type": "say", "sp": "arthur", "t": 6240, "text": {"ko": "[사람들이 제게] '아서, 진짜 AI 회사가 되려면 움직여야 한다'고 했을 때, 저는 '아니다, 우리는 철저히 **사람**이 전부다'라고 했습니다. 우리는 **서비스 비즈니스**입니다. 네, 우리는 최고의 데이터를 갖고 있고 훌륭한 AI 파트너도 있지만, 우리는 서비스 비즈니스입니다.\n\n오늘 아침 **인간의 포부(human ambition)**에 대해, 그리고 어떻게 사람들을 더 나은 미래로 데려갈지에 대해 들은 이야기가 바로 저희가 있는 지점입니다. 여기 데모가 있는데요, 저희는 **Microsoft IQ**로 IQ를 가져오고, 이것이 저희 업계에서의 인텔리전스를 줍니다. 더 배우고 더 공유할 뿐 아니라 **더 많은 일을 해내게** 해 줍니다. 그게 저희에게 큰 차이를 만듭니다.", "en": "[People told me,] \"Arthur, you have to move to really become an AI company.\" I said no, we're all about **the people**. We are a **service business**. Yes, we have the best data, we have a great AI partner, but we are a service business.\n\nWhen I heard what I heard this morning about **human ambition** and how we make sure we bring people to a better future, this is exactly where we are. We have a demo here: we bring the IQ with **Microsoft IQ**, and this gives us intelligence in our industry — not only to learn and share more, but to **do more**. That makes a big difference for us."}}, {"type": "say", "sp": "judson", "t": 6289, "text": {"ko": "저희는 고객들과 정말 많은 시간을 보냅니다. 파트너십에 대해 말씀해 주세요. 당신에게 어떤 의미인지, 고객들은 우리의 협업에 대해 뭐라고 하는지요.", "en": "We spend a lot of time with customers. Tell us about the partnership — what it means to you, what customers are saying about our work together?"}}, {"type": "say", "sp": "arthur", "t": 6297, "text": {"ko": "음, 오늘날 저희가 데이터와 AI로 하는 일은 그야말로 놀랍습니다. 고객을 더 잘 알 수 있고, **수십억 명의 잠재 고객**을 찾을 수 있고, 그 모든 걸 연결할 수 있습니다. 여기서 좋은 예를 보여주셨는데요, 저희는 [Microsoft와] **데이터 세트를 공동으로 만들기** 시작했고, 그게 저희를 독보적으로 만듭니다.\n\n저희가 매일 맞닥뜨리는 건, 역량을 갖추는 것만으로는 충분하지 않다는 점입니다. 조직에 들여와야 하는 **변화 관리(change management)**의 수준이 정말 엄청납니다. 다시 말하지만, 이 자리의 누구도 언젠가 에이전트나 로봇으로 대체되지는 않을 거라고 생각합니다. 하지만 조직에 적절한 수준의 AI 적응을 들여오지 못한다면 [얘기가 달라지겠죠]. (자막 일부 불명확)", "en": "I mean, what we do with data and AI today is just amazing. We're able to know our client better, we can find **billions of prospects**, we can connect all of it. You showed a great example here: we're starting to **co-create data sets** that make it unique.\n\nThe thing that we're confronting every day: it's not enough to have the capabilities. The level of **change management** you need to bring into the organization is pretty amazing. And again, I don't think anyone in this room is going to be replaced one day by an agent or a robot, but I do think — if we don't bring the right level of AI adaptation into our organization… (caption partly unclear)"}}, {"type": "say", "sp": "arthur", "t": 6360, "text": {"ko": "기본적으로 우리가 함께 훌륭하게 해내고 있는 부분에서, 여러분은 저희를 거기로 데려가 줄 **신뢰할 수 있는 파트너**입니다. 훌륭한 엔지니어링도 있지만, 여러분이 큰 차이를 만든 건 **변화 관리**, 그리고 저희가 끊임없이 개선하도록 보장해 주는 부분입니다.\n\n솔직히 말하면 저희 업계는 좀 [자막 불명확]… 지금 저희가 하는 일을 보면, 프런티어(Frontier), 그게 바로 저희가 고객들을 위해 하려는 일입니다.", "en": "Basically, where we do a great job together, you guys are really **the trusted partner** to get us there. You have great engineering, [but] where you have made a big difference is in the **change management**, and in making sure we continuously improve.\n\nAnd I have to admit, in our industry it's a bit — (caption unclear) — when you look at what we do now, frontier, it's exactly what we're trying to do for our clients."}}, {"type": "term", "term": "Change management", "kr": {"ko": "변화 관리 — 새 방식이 조직에 정착하도록 돕는 일", "en": "Change management"}, "body": {"ko": "새로운 기술이나 일하는 방식을 도입할 때, 사람들이 실제로 받아들이고 습관이 바뀌도록 교육·소통·조직 개편 등을 체계적으로 하는 활동입니다.\n\n좋은 운동 기구를 사도 운동 습관이 안 바뀌면 소용없는 것과 같습니다. 아서는 AI 역량 자체보다 이 변화 관리가 더 어렵고, Microsoft가 기술뿐 아니라 이 부분에서 큰 도움을 줬다고 강조합니다.", "en": "Systematically helping people actually adopt new tools and ways of working — training, communication, reorganization. Arthur says this, more than capability, is the hard part, and where Microsoft helped most."}}, {"type": "say", "sp": "judson", "t": 6395, "text": {"ko": "정말 멋집니다. 이 파트너십과 우리가 함께 해 온 모든 것에 대해 아무리 감사해도 부족합니다. 저희에게 깊은 의미가 있어요.", "en": "That's super. I can't thank you enough for the partnership and everything we've done together. It's deeply meaningful for us."}}, {"type": "say", "sp": "arthur", "t": 6403, "text": {"ko": "그게 왜 그렇게 중요한지로 마무리해 볼게요. 저는 이제 CEO가 된 지 10년이 됐습니다. 힘든 여정이었어요. 일을 맡았을 때 큰 신발(전임자의 큰 업적)을 채워야 했죠. 저는 **암을 이겨냈고**, 우리는 **유럽의 전쟁**을 겪었습니다.\n\n차이를 만드는 건, **사람들의 신뢰**, 훌륭한 고객, 그리고 [IQ를 함께하는] 파트너가 있을 때 **모든 것이 가능해진다**는 점이라고 생각합니다.", "en": "Maybe I close with why it's so important. You know, I've been CEO for ten years now. It's been a tough journey; I had to fill big shoes when I took my job. **I went through cancer.** We went through **the war in Europe**.\n\nI think what's making the difference: when you have **the trust of your people**, great clients, [and a] partner [with] IQ, **everything becomes possible**."}}, {"type": "say", "sp": "judson", "t": 6440, "text": {"ko": "고마워요, 아서. 정말 감사합니다.", "en": "Thank you, Arthur. Really appreciate it."}}, {"type": "beat", "t": 6441, "text": {"ko": "(박수, 아서 퇴장)", "en": "(Applause; Arthur exits)"}}, {"type": "part", "t": 6433, "kicker": {"ko": "PART 4 · TRUST", "en": "PART 4 · TRUST"}, "title": {"ko": "보이고, 관리되고, 지켜지는 AI", "en": "Trust: observe, manage, secure"}, "text": {"ko": "세 번째 축은 ‘신뢰’입니다. 수많은 에이전트를 한곳에서 관찰·관리·비용 통제하는 Agent 365, 공격과 방어가 모두 기계 속도로 바뀐 보안 환경과 Microsoft Perception, 그리고 규제 산업 BNY의 경험을 다룹니다.", "en": "The third pillar is trust: Agent 365 to observe, govern and control the cost of every agent, a security world now moving at machine speed and Microsoft Perception, and lessons from regulated BNY."}}, {"type": "section", "t": 6445, "title": {"ko": "세 번째 기둥 '신뢰' — Agent 365, AI 자산 전체의 관측·통제 플랫폼", "en": "Pillar three, Trust — Agent 365 as the observability platform for all AI"}, "lead": {"ko": "키노트의 마지막 기둥인 '신뢰(Trust)'가 시작됩니다. 저드슨은 AI를 조직에서 믿고 쓰려면 모든 AI 자산을 보고·관리·통제·보호하고 가치를 측정할 수 있어야 한다고 문제를 세우고, 찰스 라마나가 그 답으로 1년 전 발표한 Agent 365를 소개합니다. Microsoft 밖의 플랫폼(AWS, OpenAI, Anthropic 등)까지 한곳에서 관리한다는 점, 그리고 비용 통제 기능에 주목하세요.", "en": "The keynote's final pillar, Trust, begins. Judson frames the problem — to trust AI you must see, manage, govern, secure and get value from every AI asset — and Charles Lamanna answers with Agent 365, announced a year ago. Note that it spans non-Microsoft platforms (AWS, OpenAI, Anthropic…) and its cost controls."}}, {"type": "say", "sp": "judson", "t": 6445, "text": {"ko": "오늘 아침 키노트의 마지막 기둥은 아마도 가장 중요한 것, 바로 **신뢰(trust)**의 기둥입니다. 조직 안에서 신뢰를 가능하게 하려면, 여러분이 배포하는 모든 AI 자산에 대해 **가시성을 확보하고, 관리하고, 통제하고, 보호하고, 비즈니스 가치를 끌어낼 수 있어야** 합니다. 이에 대해 더 이야기해 줄 분, **찰스 라마나(Charles Lamanna)**입니다.", "en": "Our final pillar of this morning's keynote is arguably the most important: the pillar of **trust**. In order to enable trust inside of your organization, you have to have **visibility, manage, govern, secure and get business value** out of all the AI assets you deploy. Here to talk more about that is **Charles Lamanna**."}}, {"type": "shot", "t": 6465, "cap": {"ko": "'Trust' 기둥 슬라이드: Agent 365를 맨 위에 두고 Foundry, Perception, Defender, Entra, Purview가 쌓인 신뢰 스택, 하단에 'Open · Model diverse · Heterogeneous'.", "en": "The Trust stack: Agent 365 on top of Foundry, Perception, Defender, Entra and Purview — \"Open · Model diverse · Heterogeneous.\""}, "img": "images/shot-37.jpg"}, {"type": "beat", "t": 6470, "text": {"ko": "(찰스 라마나 등장)", "en": "(Charles Lamanna walks on)"}}, {"type": "say", "sp": "charles", "t": 6472, "text": {"ko": "고마워요, 저드슨. 여러분 좋은 아침입니다. 아, 이제 오후군요. **일은 이제 AI 위에서 돌아갑니다(Work now runs on AI).** 모든 회사가 AI를 배포하고 있고, 일은 점점 더 AI와 어시스턴트로 이루어지고 있습니다.\n\n하지만 더 많은 도입은 **보안과 거버넌스 위험** 때문에 가로막혀 있습니다. AI 자산 전체를 관리하지 않고는 규모에 도달할 수 없습니다. 비용, 보안, 그리고 에이전트를 관리해야 합니다. 그래서 **1년 전 바로 이곳 Ignite에서 저희는 Agent 365를 발표**했습니다.", "en": "Thanks, Judson. Good morning, everybody — I guess it's afternoon now. **Work now runs on AI.** Every company is deploying AI, and work is increasingly being done with AI and assistants.\n\nBut further adoption is constrained by **security and governance risk**. Without management of your entire AI estate you can't reach scale; you have to manage the cost, the security and the agents. And that's why **one year ago, here at Ignite, we announced Agent 365.**"}}, {"type": "say", "sp": "charles", "t": 6509, "text": {"ko": "Agent 365는 **AI를 위한 관측(observability) 플랫폼**입니다. 에이전트를 한곳에서 중앙 관리하고, 배포와 활성화를 통제하고, 여러분이 만든 각 에이전트의 **비용과 가치를 추적**할 수 있습니다. 또 위험과 컴플라이언스를 타협하지 않고 에이전트와 직원들을 계속 안전하게 지킬 수 있습니다.\n\n그리고 Agent 365는 이 모든 것을 **Microsoft와 비(非)Microsoft 플랫폼 전반**에 걸쳐 합니다. AI 생태계의 주요 파트너들, 즉 **AWS, OpenAI, Anthropic** 같은 플랫폼과 **Databricks, Snowflake, Salesforce** 같은 앱·데이터 백엔드 등을 지원합니다. Agent 365는 여러분의 모든 AI 투자를 관리하는 단 하나의 장소입니다.", "en": "Agent 365 is your **observability platform for AI**. You can manage your agents centrally, in one place, govern their deployment and their enablement, and you can **track the cost and value** of each agent you build. And you're also able to keep your agents and employees safe over time without compromising on risk and compliance.\n\nAnd Agent 365 does all of this **across Microsoft and non-Microsoft platforms**. Agent 365 supports the key partners across the AI ecosystem — platforms like **AWS, OpenAI and Anthropic**, and apps and data back ends like **Databricks, Snowflake, Salesforce** and more. Agent 365 is that one place to manage all of your AI investments."}}, {"type": "term", "term": "Agent 365", "kr": {"ko": "Agent 365 — 회사 안 모든 AI 에이전트의 관제탑", "en": "Agent 365"}, "body": {"ko": "Agent 365는 회사가 쓰는 AI 에이전트를 한곳에 등록하고, 누가 무엇을 하는지 보고, 정책·보안·비용을 통제하는 Microsoft의 관리 플랫폼입니다. 키노트 설명에 따르면 1년 전 Ignite에서 발표됐고, Microsoft뿐 아니라 AWS·OpenAI·Anthropic·Databricks·Snowflake·Salesforce 등 다른 회사 플랫폼의 에이전트까지 관리합니다.\n\n공항 관제탑이 항공사와 상관없이 모든 비행기를 보고 지휘하는 것과 비슷합니다. '신뢰' 기둥의 중심 제품으로, 이어지는 AT&T 데모의 무대이기도 합니다.", "en": "Microsoft's management platform to register, observe and govern (security, policy, cost) every AI agent — across Microsoft and non-Microsoft platforms like AWS, OpenAI, Anthropic, Databricks, Snowflake and Salesforce. Think airport control tower for all airlines."}}, {"type": "term", "term": "Observability", "kr": {"ko": "관측 가능성 — 시스템 속을 들여다보는 능력", "en": "Observability"}, "body": {"ko": "관측 가능성(observability)은 시스템이 지금 무엇을 하고 있는지, 왜 문제가 생겼는지를 로그·지표·추적 정보로 밖에서 파악할 수 있는 능력을 말합니다. 자동차 계기판과 블랙박스를 합친 것에 비유할 수 있습니다.\n\n에이전트가 스스로 판단하고 시스템에 접근하는 시대에는, 각 에이전트가 무엇에 접근하고 얼마를 쓰고 어디서 오류를 내는지 보이지 않으면 믿고 맡길 수 없습니다. 찰스가 Agent 365를 'AI를 위한 관측 플랫폼'이라고 부르는 이유입니다.", "en": "The ability to see what a system is doing and why it fails, via logs, metrics and traces — a car's dashboard plus black box. Without it you can't trust autonomous agents, hence Agent 365 as 'the observability platform for AI.'"}}, {"type": "say", "sp": "charles", "t": 6555, "text": {"ko": "Agent 365는 여러분 자산의 **레지스트리(registry)**, 즉 에이전트, 플러그인, 스킬 등의 목록을 유지함으로써 이를 해냅니다. 그 전부에 걸치는 정책을 만들 수 있고, 레지스트리는 출발점일 뿐입니다.\n\nAgent 365는 **비용에 관한 정책**을 적용합니다. 개인 단위로 작동하는 **한도와 알림**을 설정하고, IT가 각자의 수준에서 예산을 운용할 수 있게 해 줍니다.", "en": "Agent 365 does that by maintaining a **registry** of your assets — things like your agents, plug-ins, skills and more. You can create policies that span all of them, and that registry is just the starting point.\n\nAgent 365 applies **policies around cost**: set **limits and alerts** that act at the individual level, and empower IT to use the budget at their level."}}, {"type": "term", "term": "Agent registry", "kr": {"ko": "에이전트 레지스트리 — 회사 내 AI 자산 대장", "en": "Agent registry"}, "body": {"ko": "레지스트리는 회사 안에 존재하는 모든 에이전트, 플러그인, 스킬, 도구, 모델을 한 장부에 등록해 둔 목록입니다. 회사 자산 관리 대장이나 직원 명부와 같습니다.\n\n무엇이 있는지 모르면 관리도 보호도 할 수 없기 때문에, 찰스는 레지스트리를 '출발점'이라고 부릅니다. 이후 데모에서 AT&T의 레지스트리에는 6만 개가 넘는 에이전트가 등록되어 있습니다.", "en": "A single inventory of all agents, plug-ins, skills, tools and models — like an asset ledger or staff directory. You can't govern what you can't see; AT&T's registry shows 60,000+ agents in the demo."}}, {"type": "say", "sp": "charles", "t": 6591, "text": {"ko": "전 세계 기업들이 이미 Agent 365로 AI를 대규모로 운영하고 있습니다. **5,000만 개가 넘는 에이전트**를 관리하고 있고, AT&T, KPMG 같은 기업들이 모든 산업, 모든 지역에서 쓰고 있습니다.\n\n그럼 실제 모습을 보여드리기 위해, 제레미 레그(Jeremy Legg)와 반다나 샤르마(Vandana Sharma)를 무대로 모시겠습니다. AT&T에서 어떻게 쓰이는지 보시죠.", "en": "Companies around the world are already operating AI at scale with Agent 365. They're managing **over 50 million agents**, and we have companies like AT&T, KPMG and others across every industry and every region.\n\nSo to show that in action, let's welcome Jeremy Legg and Vandana Sharma to the stage — how it's used at AT&T."}}, {"type": "section", "t": 6618, "title": {"ko": "AT&T 데모 — 6만 개 에이전트를 관리하는 Agent 365 관리자 기능", "en": "AT&T demo — Agent 365 admin features for 60,000 agents"}, "lead": {"ko": "6만 개 이상의 에이전트를 운영하는 AT&T의 CTO 제레미 레그와 Microsoft의 반다나 샤르마가 Agent 365의 새 관리자 기능을 실제 화면으로 보여줍니다. 레지스트리와 에이전트 ID, 에이전트 맵, 할 일을 모아 주는 Action Center, 그리고 비용 급증 탐지·예측과 지출 정책까지, '대규모 에이전트를 어떻게 믿고 통제하느냐'에 대한 구체적인 답입니다. CFO를 만족시키는 기능이라는 농담 속 핵심은 비용 투명성입니다.", "en": "AT&T CTO Jeremy Legg, running 60,000+ agents, and Microsoft's Vandana Sharma walk through Agent 365's new admin features on screen: registry and agent ID, the agent map, Action Center, cost-spike detection and forecasting, and spending policies. It's a concrete answer to how you trust and control agents at scale — with cost transparency as the punchline (\"the feature you use to please your CFO\")."}}, {"type": "beat", "t": 6618, "text": {"ko": "(제레미 레그와 반다나 샤르마가 데모 데스크에 섬)", "en": "(Jeremy Legg and Vandana Sharma take the demo desk)"}}, {"type": "say", "sp": "jeremy", "t": 6618, "text": {"ko": "고마워요, 찰스. AT&T는 매일 **수억 명**을 연결합니다. 저희가 AI를 도입할 때는 대규모로 해야 합니다. 저희는 **6만 개가 넘는 에이전트**와 수많은 스킬을 전사적으로 운영하고 있고, 이것이 회사의 모든 부문과 수백만 고객에 걸쳐 있습니다.\n\n그래서 **투명성, 거버넌스, 가시성**이 더욱 필수적이고, 그것이 저희가 Agent 365를 엔터프라이즈의 일부로 쓰게 되어 기대하는 이유입니다. 한번 살펴보죠.", "en": "Thank you, Charles. At AT&T, we connect **hundreds of millions of people** every day. When we implement AI we have to do it at scale. We're operating **over 60,000 agents** as well as a multitude of skills across our enterprise, and it cuts across all of the divisions of our company as well as the millions of customers.\n\n**Transparency, governance and visibility** are even more essential, and that's why we're excited to use Agent 365 as part of our enterprise. Let's see a little bit about it."}}, {"type": "say", "sp": "vandana", "t": 6654, "text": {"ko": "AT&T는 이미 엄청난 규모로 에이전트를 운영하고 있죠. 제레미, 관리자가 한 걸음 더 나아갈 수 있도록 Agent 365에 새로 생긴 것들을 보시죠. 이것이 Agent 365, 관리자가 Microsoft와 비Microsoft 서비스 전반의 모든 에이전트를 통제할 수 있는 **가시성 플랫폼**입니다. 확장된 기능과 연결된 플랫폼들 덕분에 더 깊은 인사이트를 얻을 수 있습니다.\n\n여기 **레지스트리**에서 영업 에이전트(Wireless Sales Agent)를 보겠습니다. 판매 직원이 고객에게 맞는 요금제를 추천하도록 돕는 에이전트입니다. 이 **ID**가 에이전트에 고유한 신원을 부여해서, 관리자가 이 에이전트를 **사용자처럼 통제**할 수 있습니다.", "en": "AT&T is already running agents at an incredible scale. Jeremy, let's look at what's new in Agent 365 for admins to go even further. This is Agent 365, the **visibility platform** for admins to govern all of their agents across Microsoft and non-Microsoft services, and with the expanded capabilities and connected platforms they can get deeper insights.\n\nRight here in the **registry**, let's look at the sales agent. This helps sellers recommend the right plan to customers. This **ID** gives it a unique identity, so admins can **govern it like any user**."}}, {"type": "shot", "t": 6675, "cap": {"ko": "Microsoft 365 관리 센터의 Agent 365 Overview: 에이전트 레지스트리 60,631개, 모델 38개, 연결 플랫폼 4개, 도구 121개, 월 누적 비용 $2.3M·월말 예상 $2.9M. AT&T 규모가 숫자로 드러납니다.", "en": "Agent 365 Overview in the Microsoft 365 admin center: 60,631 agents in the registry, 38 models, 4 connected platforms, 121 tools, $2.3M month-to-date spend and $2.9M forecast — AT&T's scale in numbers."}, "img": "images/shot-38.jpg"}, {"type": "term", "term": "Agent ID", "kr": {"ko": "에이전트 ID — 에이전트에게 주는 사원증", "en": "Agent ID"}, "body": {"ko": "에이전트 ID는 각 AI 에이전트에 사람 직원처럼 고유한 디지털 신원(화면상 'Entra agent ID')을 부여하는 것입니다. 사원증이 있어야 출입 기록이 남고 권한을 줄 수도 회수할 수도 있는 것과 같습니다.\n\n신원이 있으면 관리자는 에이전트에게도 사람과 똑같이 접근 권한, 정책, 감사 기록을 적용할 수 있습니다. 반다나가 '관리자가 사용자처럼 통제할 수 있다'고 말한 의미입니다.", "en": "A unique digital identity for each agent (shown as the 'Entra agent ID'), like an employee badge, so admins can apply access rights, policies and audit trails just as they do for people."}}, {"type": "say", "sp": "vandana", "t": 6704, "text": {"ko": "이 멋진 **에이전트 맵(agent map)**으로 볼 수도 있습니다. 도구, 리소스, 사람, AI 모델이 전부 여기 있죠. 그리고 이 **빨간 선**은 관리자에게 예외나 오류를 보여 줘서, 문제 해결을 위해 어디를 봐야 할지 알 수 있게 해 줍니다.", "en": "It's visible via this beautiful **agent map**: tools, resources, people, AI models, all here. And this **red line** shows admins any exceptions or errors, so they know where to look to troubleshoot."}}, {"type": "shot", "t": 6716, "cap": {"ko": "에이전트 맵: Wireless Sales Agent를 중심으로 연결된 도구(25), 사용자(50), 지식(22), 다른 에이전트·모델이 그래프로 펼쳐집니다. 한 에이전트가 무엇과 연결돼 있는지 한눈에 보는 화면입니다.", "en": "Agent map: the Wireless Sales Agent at the center with its tools (25), users (50), knowledge (22), other agents and models — everything one agent touches, at a glance."}, "img": "images/shot-39.jpg"}, {"type": "say", "sp": "jeremy", "t": 6723, "text": {"ko": "에이전트를 대규모로 운영할 때는 그들이 **무엇을 하고 있는지, 그리고 무엇을 하면 안 되는지**를 알아야 합니다. 그래야 전사적으로 적절한 조치를 취할 수 있습니다.", "en": "When you're operating agents at scale you need to know **what they're doing and what they shouldn't be doing**, so you can take the appropriate actions across the enterprise."}}, {"type": "say", "sp": "vandana", "t": 6737, "text": {"ko": "맞아요. 때로는 어디서부터 시작해야 할지 정말 알기 어렵죠. 그래서 **Action Center**가 있습니다. 제가 신경 써야 할 모든 것을 바로 여기 모아 주고, 카테고리별로 묶고, 우선순위로 정렬하고, 다음 단계까지 알려 줍니다.\n\n예를 들어 **최근 90일 동안 사용되지 않은 에이전트**에 대한 알림이 있습니다. 하나하나 쫓아다니는 대신, 관리자는 대규모로 정리하는 **자동화**를 설정할 수 있습니다. 더 이상 필요 없는 것을 제거해 줍니다. 잡동사니도 줄고, 위험도 줄죠.", "en": "Exactly. Sometimes it's really hard to know where to start, and that's where **Action Center** comes in. It brings everything that needs my attention right here, groups by category, ranks by priority — it even gives me the next step.\n\nAlerts for agents that **haven't been used in the last 90 days**: instead of chasing each one, the admin can set **automation for cleanup at scale**. It removes what's no longer necessary. Less clutter, less risk."}}, {"type": "term", "term": "Action Center", "kr": {"ko": "Action Center — 관리자의 할 일 모음판", "en": "Action Center"}, "body": {"ko": "키노트 데모에 따르면 Action Center는 Agent 365에서 관리자가 처리해야 할 일(소유자 없는 에이전트, 보안 위험 에이전트, 오래 안 쓴 에이전트, 비용 급증 등)을 한 화면에 모아 카테고리별로 묶고 우선순위를 매겨 다음 조치까지 제안하는 기능입니다.\n\n수만 개의 에이전트를 하나씩 들여다볼 수 없으니, '오늘 무엇부터 처리해야 하는가'를 정리해 주는 업무 대시보드라고 보면 됩니다. 반복되는 정리 작업은 자동화로 걸어 둘 수 있습니다.", "en": "Per the demo, Action Center gathers everything an admin must handle — ownerless, risky, unused or cost-spiking agents — groups and prioritizes it, suggests next steps, and lets you automate cleanup."}}, {"type": "say", "sp": "jeremy", "t": 6774, "text": {"ko": "**잊힌 에이전트는 불량(rogue) 에이전트가 될 수 있습니다.** 에이전트는 디지털 직원이니까요. 그들이 여러분의 시스템, 권한, 접근 계층에 대한 접근 수준을 유지하고 있다는 걸 알면서, 그들이 하는 일을 어떻게 모니터링하겠습니까?\n\n그래서 그에 대한 **관측 가능성**이 있어야 하고, 사이버 보안 측면과 비용 측면을 모두 관리하기 위해 대규모로 **자동화된 조치**를 취할 수 있어야 합니다.", "en": "**Forgotten agents can become rogue agents.** They're digital employees — and how do you monitor what they're doing, knowing they maintain levels of access into your systems, your privileges, your access layers? So you have to have the **observability** associated with those, and be able to take **automated actions at scale** to manage both the cybersecurity side of it as well as your cost."}}, {"type": "say", "sp": "vandana", "t": 6799, "text": {"ko": "맞아요. 비용 얘기가 나왔으니, Action Center는 그것도 추적합니다. 여기 최근 **비용이 급증(cost spike)**한 에이전트들이 보이죠. 급증이 항상 나쁜 건 아니지만, 관리자에게는 그걸 통제할 수단이 필요합니다.\n\n에이전트 두 개가 최근 **다른 모델로 바꿨는데**, 여기 이 그래프가 세 가지 경우의 **지출 예측**을 보여 줍니다. 첫째, 아무것도 하지 않을 경우. 둘째, 예전 모델로 되돌릴 경우. 셋째, 급증 직전의 가격입니다.", "en": "Exactly. Speaking of costs, Action Center keeps track of that as well. Here we can see agents that recently had a **cost spike**. Spikes aren't always bad, but admins do need control over that.\n\nTwo agents recently **switched to a different model**, and this graph right here shows the **spending forecast** for three different options: one, if they did nothing; two, reverted back to the old model; and three, the price right before the spike happened."}}, {"type": "shot", "t": 6825, "cap": {"ko": "비용 급증 분석 화면: 월말 예상 비용 $68,126(급증으로 +$12,756), 모델 변경을 되돌리면 $6,984 절감 가능. 그래프는 '그대로 둘 때 / 모델을 되돌릴 때($61,142) / 급증 이전 예측($55,370)' 세 가지 경로를 비교합니다.", "en": "Cost-spike analysis: projected month-end cost $68,126 (+$12,756 from the spike), $6,984 avoidable by reverting model changes; the chart compares with-spike, reverted ($61,142) and pre-spike forecast ($55,370)."}, "img": "images/shot-40.jpg"}, {"type": "say", "sp": "vandana", "t": 6829, "text": {"ko": "그리고 이런 위험을 줄이기 위해 관리자는 이제 **지출 정책(spending policy)**을 설정할 수 있습니다. 여기 보시면, 두 에이전트가 특정 임계치에 도달하면 적절한 담당자에게 알림이 갑니다.\n\nMicrosoft 에이전트의 경우엔 한 걸음 더 나아가, 관리자가 **하드 리밋(hard limit)**을 설정할 수 있습니다. 상한에 닿는 즉시 멈춥니다. 그리고 **지출 그룹(spending groups)**으로, 현업 사용자는 일상적인 예산을 정하고 관리자는 그 위에 가드레일을 둘 수 있습니다.", "en": "And to mitigate those risks, admins can now set **spending policies**. Right here you can see that once the two agents hit a certain threshold, the right person is notified.\n\nWith Microsoft agents it goes a step further: admins can set **hard limits** — it stops as soon as it hits the cap. With **spending groups**, business users can now set budgets on the day-to-day while admins put guardrails in place."}}, {"type": "term", "term": "Spending policy & hard limit", "kr": {"ko": "지출 정책과 하드 리밋 — AI 비용 상한 장치", "en": "Spending policies and hard limits"}, "body": {"ko": "지출 정책은 에이전트의 비용이 일정 금액(예: 화면상 월 $20,000)에 도달하면 담당자에게 알림을 보내도록 정해 두는 규칙입니다. 하드 리밋은 한 걸음 더 나아가 상한에 닿는 순간 에이전트 실행을 멈추는 '차단기'입니다. 법인카드의 사용 알림과 한도 초과 시 결제 거절을 떠올리면 됩니다.\n\n키노트 설명에 따르면 하드 리밋은 Microsoft 에이전트에 적용되고, '지출 그룹'으로 현업은 예산을, 관리자는 가드레일을 나눠 맡습니다. 모델 하나 바꿨다고 비용이 폭주하는 일을 막는 장치입니다.", "en": "A spending policy alerts the right person when an agent's cost hits a threshold (e.g., $20,000/month on screen); a hard limit stops the agent at the cap — like card spending alerts vs. a declined payment. Per the keynote, hard limits apply to Microsoft agents; spending groups split day-to-day budgets (business) from guardrails (admins)."}}, {"type": "say", "sp": "jeremy", "t": 6866, "text": {"ko": "전 세계 CTO와 CIO 여러분, 이게 바로 **CFO를 기쁘게 해 줄 때 쓰는 기능**입니다. 비즈니스 쪽에 가시성을 돌려줘서, 회사를 위해 만들어 내는 **비용과 효익, 매출**에 대한 투명성이 있어야 합니다. 그 숫자들을 짐작으로 때우고 싶진 않으니까요.", "en": "For CTOs and CIOs out there, this is **the feature you use to please your CFO**. You need to have visibility back to the business, so there's transparency about **the costs and the benefits and the revenue** you're generating for the company. You don't want to guess at those numbers."}}, {"type": "say", "sp": "vandana", "t": 6888, "text": {"ko": "맞아요. 이것이 관리자를 위한 Agent 365의 새로운 기능입니다. 관리자는 전체 자산에 걸쳐 대규모로 관리할 수 있는 가시성을 갖게 되고, **자신 있게 더 빠르게** 움직일 수 있습니다. 정말 고마워요, 제레미.", "en": "Right. So that's what's new in Agent 365 for admins: they have the visibility to manage at scale across the entire estate, and they can **move faster with confidence**. Thank you so much, Jeremy."}}, {"type": "say", "sp": "jeremy", "t": 6904, "text": {"ko": "하이파이브!", "en": "High five."}}, {"type": "say", "sp": "vandana", "t": 6905, "text": {"ko": "찰스, 다시 넘길게요.", "en": "Back to you, Charles."}}, {"type": "beat", "t": 6906, "text": {"ko": "(두 사람 하이파이브, 박수)", "en": "(High five; applause)"}}, {"type": "say", "sp": "charles", "t": 6909, "text": {"ko": "정말 감사합니다.", "en": "Thank you so much."}}, {"type": "section", "t": 6910, "title": {"ko": "Agent 365 Business Analytics — 비용 통제에서 가치 관리로", "en": "Agent 365 Business Analytics — from cost control to value"}, "lead": {"ko": "AT&T의 IT 관리자 데모에 이어, Charles는 AI 지출을 '얼마 썼나'에서 '무슨 가치를 만들었나'로 옮겨 보는 새 경험을 소개합니다. 이어서 Stephanie Cronin이 IT가 아니라 사업부 리더(R&D 운영 책임자)의 자리에서 예산·예측·정책·비용 귀속(차지백)까지 시연합니다. AI 투자를 경영의 언어로 관리하는 방법에 주목해 들으면 됩니다.", "en": "Following the AT&T IT-admin demo, Charles introduces a new experience that shifts AI spend from 'how much did we spend' to 'what value did we create'. Stephanie Cronin then demos it from a business leader's seat (an R&D operations lead): budget, forecast, spending policies and chargeback. Listen for how AI investment gets managed in business terms."}}, {"type": "say", "sp": "charles", "t": 6910, "text": {"ko": "Jeremy, 그리고 Vandana Sharma, 감사합니다. AT&T 사례가 보여 주듯, Agent 365에서 가장 중요한 부분 중 하나는 **비용 통제**입니다. 비용 통제는 돈이 어디로 가고 있는지 알려 주고 지출이 계획대로 가도록 지켜 줍니다.\n\n하지만 동시에 **만들어지고 있는 가치**를 이해해야 합니다. 그것은 곧 여러분의 에이전트와 프로젝트 전반에서 투자를 비즈니스 성과와 연결한다는 뜻입니다.", "en": "Thank you, Jeremy and Vandana Sharma. AT&T shows that one of the most important parts of Agent 365 is its **cost controls**. Cost controls tell you where the money is going and keep your spending on track.\n\nBut it also requires understanding **the value that's being generated** — that means connecting investment to business outcomes across your agents and projects."}}, {"type": "say", "sp": "charles", "t": 6934, "text": {"ko": "그리고 **Agent 365 Business Analytics** 경험은 AI 지출, 도입 현황, 가치를 하나의 통합된 경험으로 묶어 줍니다. 쓴 토큰만이 아니라 **실제로 완료된 일**을 측정합니다. AI가 완료한 작업들을 다룹니다. 리더들에게 AI가 팀과 비즈니스를 어떻게 앞으로 나아가게 하는지 방향성 있는 시야를 줍니다. 시간이 지나면서 예산이나 플랫폼 같은 것을 바꿔 비용과 성능의 균형을 맞출 수 있습니다.\n\n목표는 단순히 AI에 돈을 덜 쓰는 것이 아니라 **더 많은 가치를 얻는 것**입니다. 또 다른 데모로, Stephanie가 나와서 비즈니스 리더를 위한 경험을 보여 드리겠습니다.", "en": "And the **Agent 365 Business Analytics** experience brings AI spend, adoption and value together in one integrated experience, and measures **the work that gets done**, not just the tokens that are spent. It covers the tasks that your AI completes. It gives leaders a directional view of how AI is helping their team and business move forward. You can change things like your budget and platforms to balance costs and performance over time.\n\nThe goal is not simply to spend less on AI, it's to **get more value**. For another demo, Stephanie will join us and show us the experience for business leaders."}}, {"type": "term", "term": "Agent 365 Business Analytics", "kr": {"ko": "AI 지출·사용·가치를 한 화면에서 보는 Agent 365의 새 분석 앱", "en": "New Agent 365 app showing AI spend, usage and value together"}, "body": {"ko": "키노트 설명에 따르면, Agent 365 Business Analytics는 AI에 쓴 돈(지출), 얼마나 쓰이는지(도입), 무엇을 만들어 냈는지(가치)를 한곳에 모아 보여 주는 새 경험입니다. 단순히 '토큰을 몇 개 썼나'가 아니라 AI가 끝낸 작업 단위로 성과를 봅니다.\n\n비유하자면 회사 법인카드 명세서에 '어디서 얼마 썼다'만 있는 게 아니라 '그 돈으로 어떤 일을 끝냈다'까지 붙어 있는 가계부입니다.\n\n이 키노트에서는 IT 관리자용 비용 통제(AT&T 데모) 다음 단계로, 사업부 리더가 직접 예산을 짜고 정책을 걸고 비용을 부서에 귀속시키는 도구로 소개됩니다. Frontier 퍼블릭 프리뷰로 오늘부터 사용 가능하다고 했습니다.", "en": "Per the keynote, a new experience that brings AI spend, adoption and value together and measures completed work rather than tokens. Positioned as the business-leader counterpart to IT cost controls; available today in Frontier public preview."}}, {"type": "beat", "t": 6979, "text": {"ko": "(Stephanie Cronin이 데모 데스크에서 시연 시작. 화면 하단 안내: aka.ms/a365analytics)", "en": "(Stephanie Cronin begins the demo at the desk. On-screen: aka.ms/a365analytics)"}}, {"type": "say", "sp": "stephanie", "t": 6981, "text": {"ko": "고마워요, Charles. 방금 IT 관리자가 Agent 365에서 비용을 어떻게 관리하는지 봤는데요, 이제 **비즈니스 리더로 자리를 바꿔** 보겠습니다. 여기 연구개발(R&D) 운영 책임자가 막 **다음 달 AI 예산**을 받았습니다.\n\n그래서 이분은 새 Business Analytics 앱에서 R&D로 범위가 한정된 화면을 보며 일하고 있습니다. 이 개요 페이지는 Copilot, Cowork, GitHub Copilot 전반의 지출, 사용, 가치를 보여 줍니다. 하지만 모든 예산에는 계획이 필요하죠.", "en": "Thanks, Charles. We just saw how IT admins manage costs in Agent 365. Now let's **switch seats to a business leader**. Here we can see a research and development operations leader has just received **next month's AI budget**.\n\nSo they're working in the new Business Analytics app with a view that's scoped to R&D. This overview page shows spend, use and value across Copilot, Cowork and GitHub Copilot. But every budget needs a plan."}}, {"type": "say", "sp": "stephanie", "t": 7016, "text": {"ko": "먼저 예측(Forecast) 화면에서 시작합니다. 이 차트는 각 서비스에서 나간 **1달러 1달러를 실제로 일을 하는 모델까지** 따라갑니다. 그리고 지금 **Copilot Cowork가 R&D 사용량의 39%**를 차지한다는 걸 볼 수 있어서, 그게 무슨 일을 하고 있는지 보고 싶어집니다.\n\n유스케이스 요약 맵이 바로 그걸 보여 줍니다. 가설 검증 같은 작업 단위의 추론을 보여 주고(자막 불명확), 그 가치가 **자기 부서의 작업 시간과 비용**으로 어떻게 계산되는지 보여 줍니다. 그래서 이 숫자는 그들의 비즈니스를 그대로 반영합니다.", "en": "They start in Forecast. This chart follows **every dollar from each of those services to the models doing the work**. And they can see that **Copilot Cowork is currently 39% of R&D's usage** today, and they want to see what it's doing.\n\nThe use case summary map shows exactly that. It shows task-level inferencing (caption unclear), like hypothesis testing, and how [the value] is calculated using **their own task times and costs** — so it reflects their business."}}, {"type": "shot", "t": 7030, "cap": {"ko": "Cost & forecast 화면의 흐름도: Copilot Cowork($88.7K, 39%)·GitHub Copilot·Agents의 지출이 Claude Opus, GPT-6 Astra, Claude Sonnet 등 개별 모델로 갈라져 흘러갑니다. '1달러가 어느 모델로 가는지'를 보여 주는 핵심 화면입니다.", "en": "Cost & forecast flow chart: spend from Copilot Cowork ($88.7K, 39%), GitHub Copilot and Agents fans out to individual models (Claude Opus, GPT-6 Astra, Claude Sonnet…), showing where each dollar goes."}, "img": "images/shot-41.jpg"}, {"type": "say", "sp": "stephanie", "t": 7053, "text": {"ko": "앞의 차트로 돌아가 보면, Copilot Cowork 사용량은 여러 다른 모델에 걸쳐 퍼져 있습니다. 이게 바로 **automodel**이 작동하는 모습입니다. 지금 하는 작업에 맞는 모델을 골라서 가치와 비용을 최적화하고 Cowork의 가치를 극대화하죠. 이것이 **멀티모델의 힘**입니다.", "en": "Back in the previous chart, Copilot Cowork usage is spread across several different models. This is **automodel** at work — selecting the right model for the task at hand, optimizing value and cost and maximizing the value of Cowork. Now, that's **the power of multi-model**."}}, {"type": "term", "term": "Automodel", "kr": {"ko": "작업마다 알맞은 AI 모델을 자동으로 골라 주는 기능", "en": "Automatic per-task model selection"}, "body": {"ko": "키노트 설명에 따르면, automodel은 Copilot Cowork가 작업마다 '가장 적합한 모델'을 자동으로 선택해 가치와 비용을 함께 최적화하는 방식입니다. 그래서 한 서비스의 사용량이 여러 모델(Claude, GPT 등)에 나뉘어 나타납니다.\n\n비유하면, 택배 회사가 물건 크기와 거리에 따라 오토바이·트럭·항공편을 알아서 고르는 것과 비슷합니다. 모든 일을 가장 비싼 모델에 맡기지 않으니 비용이 줄고, 어려운 일에는 강한 모델이 붙어 품질이 유지됩니다.\n\n이 키노트 전체를 관통하는 '멀티모델' 전략이 실제 비용 화면에서 어떻게 보이는지 보여 주는 장면입니다.", "en": "Per the keynote, automodel lets Copilot Cowork pick the right model for each task to optimize value and cost — which is why one service's usage is spread across several models. It's the multi-model strategy made visible in the cost view."}}, {"type": "say", "sp": "stephanie", "t": 7077, "text": {"ko": "그런데 이분은 **GitHub Copilot**도 살펴보고 싶어 합니다. 맨 위로 스크롤해 보면 GitHub Copilot의 비용 동인이 이 그룹들, 이 직무들이고, 이들은 엔지니어링 쪽 팀들입니다. 시간에 따른 비용과 크레딧을 자세히 보면 **월간 사용량이 꾸준히 늘고 있다**는 걸 알 수 있습니다.\n\n그래서 더 저렴한 클라우드 모델을 활용하는 **모델 믹스**를 적용해 보니, 예산에 상당한 영향이 있다는 게 바로 보입니다. 하지만 일 자체에 미치는 영향도 이해하고 싶어 합니다. 그래서 어떤 조치를 하기 전에 이 예측을 **엔지니어링 부서장에게 보내고**, 부서장은 파일럿과 필요한 **eval(평가)**을 돌려서 결과물 품질과 업무 연속성을 확인할 수 있습니다.", "en": "But they also want to take a look at **GitHub Copilot**. So if they scroll up to the top, they can see the cost drivers for GitHub Copilot are these groups and these job functions — and these are teams in engineering. Looking closer at the costs and credits over time, they can see **monthly usage has been steadily increasing**.\n\nThey apply a **model mix** that leverages lower-cost cloud models, and immediately they can see it has substantial impacts on the budget. But they want to understand the impact on the work itself. Before taking any action, they **send this forecast to the engineering department head**, who can then run the pilots and necessary **evals** to ensure output quality and business continuity."}}, {"type": "term", "term": "Evals", "kr": {"ko": "AI 결과물의 품질을 체계적으로 시험하는 평가", "en": "Systematic tests of AI output quality"}, "body": {"ko": "eval(evaluation)은 AI 모델이나 에이전트가 실제 업무에서 얼마나 잘하는지 정해진 문제 세트로 시험해 점수를 매기는 과정입니다. 사람으로 치면 '신입을 현업에 투입하기 전에 치르는 실무 테스트'입니다.\n\n이 장면에서 중요한 점은, 더 싼 모델로 바꾸면 돈은 아끼지만 코드 품질이 떨어질 수 있다는 것입니다. 그래서 재무 쪽 리더가 바로 바꾸지 않고, 엔지니어링 책임자가 eval로 품질을 확인한 뒤 결정하도록 넘깁니다. 비용 결정과 품질 검증을 분리하는 실무적인 흐름입니다.", "en": "Evals test how well a model or agent performs on a defined task set. Here, a cheaper model mix saves money but might hurt quality, so the forecast goes to the engineering head to validate with evals before switching."}}, {"type": "say", "sp": "stephanie", "t": 7123, "text": {"ko": "계획에는 한 가지 조각이 더 있습니다. 바로 **에이전트 자체**입니다. 여기서는 **Microsoft 에이전트와 Microsoft가 아닌 에이전트를 한 화면**에서 볼 수 있습니다. 첫 번째 에이전트를 보죠. Copilot Studio로 만든 에이전트인데, 이 에이전트의 비용을 볼 수 있고, 어떤 일을 지원하는지 보여 주는 유스케이스 요약, 모델 인사이트, 그룹 비교 같은 것도 볼 수 있습니다.\n\n비용이 Copilot Studio에서 직접 가져와지기 때문에 **지출 알림**이나, 한도에 도달하면 지출을 멈추는 **지출 한도** 같은 것을 설정할 수 있습니다.", "en": "There's one more piece to the plan — **the agents themselves**. Here, they can get **a single view of both Microsoft and non-Microsoft agents**. Let's take a look at this first agent here. It's built in Copilot Studio, and they can see the costs of the agent. They can also see things like the use case summary that shows the work it supports, and model insights and group comparisons.\n\nNow, since the cost is being pulled directly from Copilot Studio, they can set up things like a **spending alert** or a **spending limit** that stops spend when it's reached."}}, {"type": "say", "sp": "stephanie", "t": 7158, "text": {"ko": "그리고 Agent 365는 **설계부터 개방형**입니다. 에이전트 레지스트리로 돌아가 임상시험 모집(trial recruitment) 에이전트를 보면, 이 에이전트는 **Amazon Bedrock**으로 만들어졌고, 연결된 플랫폼에서 가져와 Agent 365에 공유된 정보를 보여 줍니다. 예상 비용 같은 것을 볼 수 있고, 그걸 바탕으로 지출 알림을 설정해서 비용이 특정 임계치에 도달하면 적절한 사람들에게 알리도록 할 수 있습니다.", "en": "Now, Agent 365 is **open by design**. So if we go back to the agent registry and take a look at the trial recruitment agent, we can see this agent that's built on **Amazon Bedrock** shows information pulled from the connected platform and shared to Agent 365. We can see things like the estimated cost, and with that they can set up spending alerts, so when that cost reaches a certain threshold they notify the right people."}}, {"type": "term", "term": "Amazon Bedrock", "kr": {"ko": "AWS의 생성형 AI 모델·에이전트 구축 서비스", "en": "AWS's managed service for building with generative AI models and agents"}, "body": {"ko": "Amazon Bedrock은 아마존 웹 서비스(AWS)가 제공하는 서비스로, 여러 회사의 AI 모델을 골라 쓰고 그 위에 에이전트를 만들 수 있게 해 줍니다. 즉 Microsoft의 경쟁사 플랫폼입니다.\n\n이 장면의 요점은 Microsoft 밖에서 만든 에이전트(Bedrock, Google Vertex AI, Databricks 등)도 Agent 365 한 화면에서 비용을 보고 알림을 걸 수 있다는 것, 즉 Agent 365가 '개방형'이라는 메시지입니다.", "en": "AWS's service for building on multiple AI models and agents — a competitor platform. The point: even non-Microsoft agents show up in Agent 365 with costs and alerts ('open by design')."}}, {"type": "say", "sp": "stephanie", "t": 7196, "text": {"ko": "이제 지출 정책 화면을 보면, 이 모든 AI 인사이트를 바탕으로 행동할 준비가 됐습니다. 리더는 Copilot Cowork 플랫폼에 대한 **지출 정책**을 만들었고, (자막 일부 누락) **자기 코스트 센터에 연결된 Azure 구독**으로 청구되도록 했습니다. 이게 Agent 365 Business Analytics이고, 다음 달 예산 계획이 끝났습니다.\n\n**보고, 예측하고, 예산을 잡고, 비용을 귀속시키는 것(charge it back).** 방금 보신 모든 것은 오늘부터 **Frontier 퍼블릭 프리뷰**로 제공되고, 위임형 지출 정책과 Microsoft 외 에이전트의 비용 가시성은 **12월**에 나옵니다. 감사합니다. Charles, 다시 넘길게요.", "en": "Now if we take a look here at spending policies — with all of these AI insights, they're ready to take some action. The leader has created a **spending policy** for the Copilot Cowork platform (caption partly missing), billed to an **Azure subscription tied to their cost center**. That's Agent 365 Business Analytics, and the budget for next month is planned.\n\n**See it, forecast it, budget it, and charge it back.** Everything you just saw is available today, starting in **Frontier public preview**, and we have delegated spending policies and non-Microsoft agent cost visibility coming in **December**. Thank you. Back to you, Charles."}}, {"type": "term", "term": "Chargeback / Cost center", "kr": {"ko": "쓴 비용을 실제 사용 부서의 예산으로 넘겨 청구하는 것", "en": "Billing usage back to the department that consumed it"}, "body": {"ko": "코스트 센터(cost center)는 회사 회계에서 비용을 묶어 관리하는 단위(보통 부서나 팀)입니다. 차지백(chargeback)은 IT가 한꺼번에 낸 비용을 실제로 쓴 부서의 코스트 센터로 넘겨 청구하는 관행입니다.\n\n비유하면 회사 공용 법인카드로 결제했더라도 월말에 '이건 마케팅팀 몫, 이건 R&D 몫'으로 나눠 각 팀 예산에서 빼는 것입니다.\n\n이 데모에서는 Copilot Cowork 지출 정책을 R&D 쪽 Azure 구독(=코스트 센터)에 연결해, AI 비용이 자동으로 해당 부서에 귀속되게 합니다. 'See it, forecast it, budget it, charge it back'이 바로 이 흐름의 요약입니다.", "en": "A cost center is an accounting unit (usually a department); chargeback bills centrally paid costs back to the department that used them. Here, a Cowork spending policy is tied to R&D's Azure subscription so AI costs land in the right budget."}}, {"type": "beat", "t": 7238, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "say", "sp": "charles", "t": 7241, "text": {"ko": "고마워요, Stephanie. 이렇게 해서 우리는 AI 지출을 단순히 통제하는 데서 벗어나 **AI가 만드는 가치를 이해하고 관리하는 단계**로 갈 수 있습니다. Agent 365는 회사 전체에 걸쳐, Microsoft는 물론 **OpenAI, Anthropic, AWS** 같은 다른 AI 플랫폼까지 아울러 여러분의 AI를 관리하도록 돕습니다.", "en": "Thank you, Stephanie. That's how we can move from just controlling AI spend to **really starting to understand and manage the value it creates**. Agent 365 helps you manage your AI across your entire company, across Microsoft and other AI platforms like **OpenAI, Anthropic and AWS** and more."}}, {"type": "section", "t": 7257, "title": {"ko": "Agent 365의 보안 기능 — 직원 PC 속 섀도 에이전트까지", "en": "Security in Agent 365 — down to shadow agents on devices"}, "lead": {"ko": "비용·가치 관리에서 '보안'으로 넘어가는 다리 구간입니다. Yina Arenas가 Agent 365 안에서 직원 기기에 깔린 로컬 에이전트(OpenClaw 등)까지 찾아내고, 위험도를 동적으로 계산하고, Intune으로 차단·격리하는 장면을 보여 줍니다. 자막이 많이 끊긴 구간이라 화면 설명을 함께 참고하세요.", "en": "A bridge from cost/value to security. Yina Arenas shows Agent 365 discovering local agents on employee devices (OpenClaw etc.), scoring their risk dynamically and blocking/isolating them via Intune. Captions are badly broken here, so rely on the screen notes too."}}, {"type": "say", "sp": "charles", "t": 7257, "text": {"ko": "엔터프라이즈 규모라는 것은 **그것을 보호하는 것**까지 의미합니다. Yina를 무대로 모시겠습니다.", "en": "Enterprise scale also means **securing it**. I want to invite Yina up on stage."}}, {"type": "beat", "t": 7262, "text": {"ko": "(Charles가 'Security in Agent 365' 화면 앞에서 소개. 화면 안내: aka.ms/Ignite/BRK262. 이어 Yina Arenas — Microsoft Entra and Secure AI CVP 겸 CPO — 가 데모 데스크에 등장)", "en": "(Charles introduces 'Security in Agent 365'; on-screen aka.ms/Ignite/BRK262. Yina Arenas, CVP & CPO, Microsoft Entra and Secure AI, appears at the demo desk)"}}, {"type": "say", "sp": "yina", "t": 7272, "text": {"ko": "고마워요, Charles. (자막 앞부분 누락) 에이전트도 그 **ID, 접근 권한, 행동을 관리**해야 할 필요가 있습니다. Agent 365 안에서 더 큰 가시성과 통제력을 주는 새 보안 기능들을 살펴보겠습니다.\n\n**에이전트 레지스트리**에서는 조직 전체의 모든 에이전트를 보고 관리할 수 있습니다. 그리고 **직원 기기에서 돌아가는 에이전트**도 찾아낼 수 있습니다. OpenClaw, OpenAI를 비롯해 많은 것들이 65개(자막 불명확) 있습니다.", "en": "Thank you, Charles. (start of caption missing) [Agents have] the need to manage their **identities, access and actions**. Let's take a look at the new security capabilities within Agent 365 that give you greater visibility and control.\n\n[In] the **agent registry**, we can see and manage all the agents across your organization. I can [also] discover **agents running on employee devices** — 65 (caption unclear) including OpenClaw, OpenAI and many more."}}, {"type": "say", "sp": "yina", "t": 7304, "text": {"ko": "OpenClaw를 보면, 이 에이전트 유형이 **어느 기기들에 배포돼 있는지** 보이고, 제가 어디에 주의를 기울여야 하는지 바로 알 수 있습니다. Microsoft는 로컬 에이전트까지 포함하는 **동적 위험(dynamic risk)** 평가를 도입합니다.\n\n이 동적 위험은 여러 신호를 한데 모아 무엇이 위험에 기여했는지 전체 그림을 보여 주는데, **보안팀이 이미 다루고 있는 것과 같은 인시던트**를 사용합니다. IT 팀과 AI 팀이 **같은 우선순위 목록**으로 일하고, 그 목록은 에이전트를 따라다니며 위험 상태가 바뀌면 그에 맞게 조정됩니다.", "en": "[With] OpenClaw, we can see **which devices the agent type has been deployed on** and immediately see where my attention is needed. Microsoft is introducing **dynamic risk**, including for local agents.\n\nThis dynamic risk brings [signals] together to get a total picture of what contributed to the risk, using **the same incidents that the security team is already working on**. IT and AI teams work from **the same priority list** that follows the agent and adapts as its risk posture changes."}}, {"type": "shot", "t": 7335, "cap": {"ko": "Shadow AI 탭의 OpenClaw 인스턴스 상세: 'Dynamic agent risk' 전체 High(런타임 위험 High, 노출 위험 Medium, 영향 반경 Low)와 Microsoft Defender에서 올라온 관련 케이스 목록. 로컬 에이전트도 보안팀과 같은 인시던트로 관리된다는 점을 보여 줍니다.", "en": "OpenClaw instance in the Shadow AI tab: Dynamic agent risk overall High (runtime High, exposure Medium, blast radius Low) plus related cases from Microsoft Defender — local agents tracked with the same incidents as the SOC."}, "img": "images/shot-42.jpg"}, {"type": "term", "term": "Shadow AI / Local agents", "kr": {"ko": "회사가 승인·파악하지 못한 채 직원 PC에서 돌아가는 AI 도구·에이전트", "en": "AI tools/agents running on employee devices without IT's knowledge"}, "body": {"ko": "섀도 IT(Shadow IT)는 직원이 회사 승인 없이 쓰는 소프트웨어를 말합니다. 섀도 AI는 그 AI 버전으로, 직원이 개인 PC에 ChatGPT Desktop, Claude Desktop, OpenClaw 같은 AI 앱이나 로컬 에이전트를 설치해 쓰는 경우입니다. OpenClaw는 사용자 PC에서 직접 파일·앱을 다루며 일을 대신하는 오픈소스 개인 에이전트로 널리 퍼진 도구입니다.\n\n문제는 이런 에이전트가 회사 데이터에 접근하고 스스로 행동할 수 있는데도 IT가 그 존재조차 모를 수 있다는 점입니다.\n\n이 데모의 핵심은 Agent 365가 클라우드 에이전트뿐 아니라 이런 로컬 에이전트까지 찾아내 목록에 올리고(화면의 'Shadow AI' 탭), 위험도를 매기고, 차단까지 할 수 있다는 것입니다.", "en": "Shadow AI = AI apps/agents (ChatGPT Desktop, Claude Desktop, OpenClaw — an open-source personal agent that acts on the user's PC) used without IT approval. Agent 365 now discovers them (the 'Shadow AI' tab), scores risk and can block them."}}, {"type": "term", "term": "Dynamic agent risk", "kr": {"ko": "에이전트의 위험도를 상황에 따라 계속 다시 계산하는 점수", "en": "Continuously re-computed risk score for each agent"}, "body": {"ko": "키노트 설명에 따르면, 동적 위험은 로컬 에이전트를 포함한 각 에이전트에 대해 여러 신호를 합쳐 위험도를 매기고, 무엇이 위험을 높였는지 보여 주는 기능입니다. 화면에는 런타임 위험, 노출 위험, 영향 반경(blast radius) 같은 항목이 나옵니다.\n\n'동적'이라는 말은 한 번 정해지고 끝나는 등급이 아니라, 새 경보나 인시던트가 생기면 점수가 바뀌고 우선순위 목록도 따라 바뀐다는 뜻입니다.\n\n중요한 점은 IT 팀과 보안팀이 같은 인시던트, 같은 우선순위 목록을 본다는 것입니다. 부서마다 따로 노는 대시보드가 아니라 하나의 '할 일 목록'으로 협업하게 됩니다.", "en": "Per the keynote, a risk score per agent (incl. local agents) combining signals such as runtime risk, exposure and blast radius, updated as incidents change — so IT and security share one priority list."}}, {"type": "say", "sp": "yina", "t": 7343, "text": {"ko": "또한 **기기 위의 에이전트도 통제**할 수 있습니다. **Intune** 연동으로 에이전트를 **차단**하고, 규정을 지키지 않는 기기에 플래그를 달 수 있습니다.\n\n이것이 Agent 365가 IT 팀과 보안팀에 주는 고유한 가치입니다. 두 팀이 **같은 우선순위** 위에서 움직이고 (자막 불명확: 'Foundry') 완전한 이해를 공유합니다. 다시 Charles에게 넘기겠습니다.", "en": "[We can] also **govern agents on devices**. With **Intune** integration, it can **block agents** [and] flag devices that aren't compliant.\n\nThat's the unique value for IT and security teams with Agent 365. They operate over **the same prioritized** [view] (caption unclear: 'Foundry'), [with] complete understanding. And back to you, Charles."}}, {"type": "shot", "t": 7365, "cap": {"ko": "OpenClaw의 Access 탭: 'Block agent(모든 기기에서 실행 차단 — Intune에서 관리)', 'Restrict'(기기를 비준수로 표시, 네트워크 트래픽 제한 — Global Secure Access, 에이전트 격리 — Microsoft Execution Containers). 섀도 에이전트를 실제로 막는 수단입니다.", "en": "OpenClaw Access tab: Block agent (manage in Intune) and Restrict options — mark device noncompliant, restrict network traffic (Global Secure Access), isolate agent (Microsoft Execution Containers)."}, "img": "images/shot-43.jpg"}, {"type": "term", "term": "Intune", "kr": {"ko": "회사 PC·휴대폰을 원격으로 관리하는 Microsoft 기기 관리 서비스", "en": "Microsoft's device management service"}, "body": {"ko": "Microsoft Intune은 회사가 직원들의 노트북·휴대폰에 보안 정책을 걸고, 앱 설치를 허용·차단하고, 규정을 지키지 않는 기기를 표시하는 기기 관리(MDM) 서비스입니다.\n\n이 데모에서는 Agent 365에서 발견한 위험한 로컬 에이전트를 Intune을 통해 '모든 기기에서 실행 차단'하거나, 해당 기기를 비준수로 표시하거나, 격리된 실행 환경에서만 돌게 하는 장면이 나옵니다. 에이전트 관리를 기존 기기 관리 도구와 바로 이어 붙였다는 점이 핵심입니다.", "en": "Microsoft's device-management (MDM) service for policies, app blocking and compliance. Here Agent 365 uses it to block risky local agents, mark devices noncompliant or isolate agents."}}, {"type": "say", "sp": "charles", "t": 7377, "text": {"ko": "감사합니다. 이 에이전트들은 데이터에 접근하기 때문에, 보안은 여러분의 **에이전트 자산(agentic estate)에서 핵심적인 부분**이 되어야 합니다. 그 더 넓은 영역에 대해 이야기하기 위해 Aleš를 무대로 모시겠습니다.", "en": "Thank you. These agents access data, and security has to become **a critical part of your agentic estate**. [To talk about] that broader estate, please welcome Aleš to the stage."}}, {"type": "section", "t": 7396, "title": {"ko": "사이버 보안의 '물리 법칙'이 바뀌다 — 새 사이버 스택과 Microsoft Perception", "en": "The physics of cyber are changing — a new cyber stack and Microsoft Perception"}, "lead": {"ko": "보안 파트의 도입부입니다. Aleš Holeček이 AI 때문에 공격 환경이 근본적으로 달라졌다는 세 가지 추세(취약점 양 10배, 발견 비용 $5 미만, 악용까지 시간 0)를 제시합니다. 그 해답으로 Microsoft가 새로 짠 3층 '사이버 스택'을 설명하고, 오늘 정식 출시(GA)된 Microsoft Perception을 발표합니다.", "en": "The opening of the security segment. Aleš Holeček lays out three AI-driven trends (10x vulnerability volume, <$5 discovery cost, near-zero time to exploit), then the new three-layer cyber stack Microsoft built in response, and announces Microsoft Perception as generally available."}}, {"type": "beat", "t": 7396, "text": {"ko": "(Aleš Holeček — Microsoft Security 사장 겸 수석 아키텍트 — 이 무대 중앙으로 걸어 나옴)", "en": "(Aleš Holeček, President & Chief Architect, Microsoft Security, walks to center stage)"}}, {"type": "say", "sp": "ales", "t": 7396, "text": {"ko": "고마워요, Charles. 안녕하세요, 여러분. 여러분과 함께, 그것도 보안에 대해 이야기하게 되어 정말 기쁩니다. 다들 아시다시피 AI 모델과 점점 더 자율적인 에이전트가 모든 산업을 바꾸고 있고, **사이버 보안도 예외가 아닙니다**.\n\n지난 12개월 동안 프런티어 모델들은 **취약점을 찾아내는 데 놀라울 만큼 능숙**해졌습니다. 그 결과 세 가지 중요한 추세가 나타났습니다.", "en": "Thank you, Charles. Hello, friends. It's really great to be here with you, especially talking about security. As we all know, AI models and more autonomous agents are changing every industry, and **cyber is no exception**.\n\nOver the past 12 months, frontier models have become **remarkably good at finding vulnerabilities**. [We see] three significant trends as a result."}}, {"type": "beat", "t": 7432, "text": {"ko": "(스크린: 'The physics of cyber are changing' — 사이버의 물리 법칙이 바뀌고 있다)", "en": "(Screen: 'The physics of cyber are changing')"}}, {"type": "say", "sp": "ales", "t": 7432, "text": {"ko": "첫째, **취약점의 양이 늘었습니다**. 바로 이번 달 Patch Tuesday에 저희는 **1,000개가 넘는 취약점**을 처리했습니다. 3월에는 100개도 안 됐는데 말이죠. 1년도 안 돼 **10배 증가**입니다. 그리고 이건 Microsoft만의 일이 아닙니다. 모든 주요 플랫폼, 브라우저, 오픈소스 패키지에서 같은 패턴이 나타나고 있습니다.", "en": "Number one, **increased volume of vulnerabilities**. Just this month's Patch Tuesday, we addressed **more than a thousand vulnerabilities**, compared to fewer than a hundred in March. That's a **10x increase in less than a year**. And it's not just Microsoft — the same pattern holds true for all major platforms, browsers and open source packages."}}, {"type": "term", "term": "Patch Tuesday", "kr": {"ko": "Microsoft가 매달 둘째 화요일에 보안 업데이트를 한꺼번에 내놓는 날", "en": "Microsoft's monthly security update day (second Tuesday)"}, "body": {"ko": "Patch Tuesday는 Microsoft가 매달 둘째 주 화요일에 Windows, Office 등 자사 제품의 보안 패치를 묶어서 배포하는 정례 일정입니다. 기업 IT 팀은 이 날짜에 맞춰 테스트와 배포 계획을 세웁니다.\n\n여기서 Aleš가 말하는 숫자는 충격적입니다. 한 달 패치 묶음에 담긴 취약점이 3월에는 100개 미만이었는데 이번 달은 1,000개 이상, 1년도 안 돼 10배가 됐다는 것입니다. AI가 취약점을 너무 잘 찾아내서 생긴 변화라는 것이 그의 진단입니다. 뒤에 나오는 David의 데모도 바로 이 Patch Tuesday 대응 장면으로 시작합니다.", "en": "Microsoft's scheduled monthly security release (second Tuesday). Aleš's point: one month's batch went from <100 vulnerabilities in March to 1,000+ now — a 10x jump driven by AI-powered discovery."}}, {"type": "say", "sp": "ales", "t": 7458, "text": {"ko": "두 번째 추세는 **비용 감소**입니다. 버그 바운티 프로그램들은 고품질 취약점 하나에 약 **30만 달러**를 지급합니다. 그런데 AI의 도움으로 연구자들도, 그리고 나쁜 사람들도, 이제 그런 취약점을 **5달러도 안 되는 비용**으로 찾아내고 있습니다.", "en": "The second trend we see is **reduced cost**. [Bug bounty] programs pay about **$300,000** for high-quality vulnerabilities. With the help of AI, researchers — and also the bad guys — are now finding them for **less than $5**."}}, {"type": "term", "term": "Bug bounty", "kr": {"ko": "보안 취약점을 찾아 신고한 사람에게 주는 포상금 제도", "en": "Rewards paid for reporting security vulnerabilities"}, "body": {"ko": "버그 바운티는 기업이 외부 보안 연구자에게 '우리 제품의 취약점을 찾아 알려 주면 돈을 주겠다'고 약속하는 제도입니다. 심각한 취약점일수록 포상금이 커서, 최고 수준은 수십만 달러에 이릅니다.\n\nAleš의 비교가 핵심입니다. 예전엔 숙련된 전문가가 몇 주를 들여야 해서 30만 달러짜리였던 발견이, 이제 AI로는 5달러 미만이면 가능하다는 것입니다. 이것은 방어자뿐 아니라 공격자에게도 똑같이 적용되므로, 공격의 문턱이 극적으로 낮아졌다는 뜻입니다.", "en": "Programs that pay outside researchers for finding vulnerabilities; top bugs earn hundreds of thousands of dollars. Aleš's point: AI now finds them for under $5 — for defenders and attackers alike."}}, {"type": "say", "sp": "ales", "t": 7479, "text": {"ko": "그리고 마지막 추세는 **시간**입니다. 취약점이 발견된 뒤 실제로 악용되기까지의 시간 창이 **0에 가까워지고 있습니다**. 이는 AI가 툴킷을 이용해 취약점을 즉시 악용할 수 있기 때문이기도 하지만, **책임 있고 조율된 공개(coordinated disclosure)** 프로세스 자체가 무너지고 있기 때문이기도 합니다.", "en": "And then the last trend is **time**. The time window between discovery and exploitation is **approaching zero**. This is driven by AI being able to immediately exploit vulnerabilities using toolkits, but also the process of **responsible and coordinated disclosure** is collapsing."}}, {"type": "term", "term": "Coordinated disclosure", "kr": {"ko": "취약점을 공개하기 전에 제조사가 고칠 시간을 주는 관행", "en": "Giving vendors time to fix a flaw before going public"}, "body": {"ko": "조율된 공개(coordinated 또는 responsible disclosure)는 취약점을 찾은 사람이 바로 세상에 알리지 않고, 먼저 제조사에 알려 패치를 만들 시간(보통 수십 일)을 준 뒤 함께 공개하는 업계 관행입니다. 그 사이 방어자는 패치를 준비할 수 있습니다.\n\nAleš는 이 관행이 무너지고 있다고 말합니다. AI로 누구나 같은 취약점을 거의 동시에 찾을 수 있으니 '비밀로 하고 기다리는' 시간이 의미가 없어지고, 발견에서 악용까지 걸리는 시간이 사실상 0이 된다는 것입니다. 그래서 방어도 '사람의 속도'가 아니라 '기계의 속도'로 움직여야 한다는 결론으로 이어집니다.", "en": "The norm of privately notifying a vendor and giving it time to patch before going public. Aleš says AI is collapsing it: when anyone can find the same bug at once, the discovery-to-exploit window approaches zero."}}, {"type": "say", "sp": "ales", "t": 7506, "text": {"ko": "저희의 사명은 **공격자들이 쓰는 것과 같은 기술을 책임감 있게 방어자의 손에 쥐여 주는 것**입니다. 그래서 에이전트 보안을 위해 설계된 **완전히 새로운 사이버 스택**을 만들었습니다.\n\n그 토대에는 이미 **160만 고객**이 신뢰하는 제품들이 있습니다. **Defender, Entra, Purview, Sentinel**입니다. 이 제품들은 뭔가 잘못되고 있을 때 감지하는 센서 역할을 합니다. 하지만 탐지만으로는 충분하지 않습니다. 공격을 받을 때는 빠르게 행동해야 하고, 그래서 이 제품들은 저희 보안 플랫폼 안에서 (자막 불명확: 실행 장치 역할도 한다는 취지) 움직입니다.", "en": "We're on a mission to **responsibly put the same technology the attackers are using into the hands of defenders**. That's why we built **a completely new cyber stack** designed for agentic security.\n\nAt the foundation are the products **1.6 million customers** already trust: **Defender, Entra, Purview and Sentinel**. They act as sensors when something is going wrong. But detection is not enough. When under attack you need to act at speed, and that's why they [also act as actuators] (caption unclear) in our security platform."}}, {"type": "shot", "t": 7530, "cap": {"ko": "'The new cyber stack' 슬라이드: 아래부터 Signals·Sensors·Actuators(신호·센서·실행 장치) → Security Context(보안 컨텍스트) → Agents·Harness·Models(에이전트·하네스·모델)의 3층 구조. 보안 파트 전체의 설계도입니다.", "en": "'The new cyber stack' slide: Signals, Sensors, Actuators → Security Context → Agents, Harness, Models. The blueprint for the whole security segment."}, "img": "images/shot-44.jpg"}, {"type": "term", "term": "Defender / Entra / Purview / Sentinel", "kr": {"ko": "Microsoft의 4대 보안 제품군 (위협 방어 / ID / 데이터 보호 / 보안 관제)", "en": "Microsoft's four core security product families"}, "body": {"ko": "Defender는 PC·서버·클라우드에서 악성코드와 공격을 막고 탐지하는 제품군, Entra는 사람과 에이전트의 ID(로그인·권한)를 관리하는 제품, Purview는 민감한 데이터를 분류·보호하는 데이터 보안·규정 준수 제품, Sentinel은 여러 곳의 보안 로그를 모아 분석하는 클라우드 보안 관제(SIEM) 제품입니다.\n\n이 키노트에서 Aleš는 이 네 제품을 새 사이버 스택의 맨 아래층, 즉 위험을 감지하는 '센서'이자 계정 차단·접속 차단 같은 조치를 실행하는 '손발'로 위치시킵니다. 그 위에 보안 컨텍스트와 에이전트 층이 올라갑니다.", "en": "Defender (threat protection), Entra (identity), Purview (data security/compliance), Sentinel (SIEM). Aleš places them as the bottom layer of the new stack — sensors and actuators."}}, {"type": "say", "sp": "ales", "t": 7558, "text": {"ko": "ID를 취소하거나, 운영 계층이나 데이터 계층에서 차단을 거는 식입니다. 여러분의 보안 스택이 여러 회사 제품으로 섞여 있다는 걸 저희도 알고 있고, **저희 것도 그렇습니다**. 저희 제품에 이런 커넥터들을 합치면 **매일 165조 개 이상의 신호**가 생성됩니다.\n\n저희는 이 신호들을 가져와 **Microsoft의 위협 인텔리전스, 여러분의 위협 인텔리전스, 그리고 여러분의 비즈니스 인텔리전스**로 보강합니다. 그리고 이 모든 정보를 에이전트가 추론하고 행동할 수 있는 **실시간 보안 컨텍스트**로 바꿉니다(자막 불명확: 'token'). 매일 이 컨텍스트를 정밀도(precision)와 재현율(recall)에 맞게 다듬어서, 에이전트가 정말 중요한 것에 대응할 수 있게 합니다.", "en": "[They can] revoke an identity or create a block at the operation or data layer. We understand your security stack is heterogeneous, **and ours is too**. Our products combined with these connectors generate **more than 165 trillion signals every day**.\n\nAnd we take these signals and we enrich them with **threat intelligence from Microsoft, and also threat intel from you, and also your business intelligence**. We turn all of this information into a **real-time security context** (caption unclear: 'token') that agents can reason over and act on. Every day we [tune] this context for precision and recall, so agents can act on what matters."}}, {"type": "term", "term": "Security context (precision & recall)", "kr": {"ko": "에이전트가 판단에 쓰도록 정리된 실시간 보안 정보 층", "en": "Real-time security knowledge layer agents reason over"}, "body": {"ko": "키노트 설명에 따르면, 보안 컨텍스트는 하루 165조 개가 넘는 신호에 Microsoft·고객의 위협 인텔리전스와 고객 비즈니스 정보를 더해, 에이전트가 이해하고 행동할 수 있는 형태로 실시간 정리한 층입니다. 새 사이버 스택의 가운데 층입니다.\n\n정밀도(precision)는 '경보라고 한 것 중 진짜 위협의 비율', 재현율(recall)은 '진짜 위협 중 놓치지 않고 잡아낸 비율'입니다. 정밀도가 낮으면 헛경보에 시달리고, 재현율이 낮으면 공격을 놓칩니다. 이 둘의 균형을 매일 맞춘다는 것은 에이전트가 '쓸데없는 일'과 '놓치는 일' 둘 다 줄이도록 한다는 뜻입니다.", "en": "Per the keynote, the middle layer: 165T+ daily signals enriched with threat and business intelligence into real-time context for agents. Precision = share of alerts that are real; recall = share of real threats caught. Tuning both keeps agents on what matters."}}, {"type": "say", "sp": "ales", "t": 7612, "text": {"ko": "스택의 맨 위에는 에이전트, 하네스, 그리고 모델이 있습니다. **전문화된 에이전트들이 함께 일하며** 보호와 보안 성과를 만들어 냅니다. 이 모든 것이 하나로 모인 것이 바로 저희의 새 에이전트 보안 시스템 **Microsoft Perception**이고, **오늘 정식 출시(GA)**됩니다.\n\n저희의 프런티어 보안 엔지니어이자 **Perception의 설계자**인 David Weston을 모시겠습니다. 제품을 직접 보여 드릴 겁니다.", "en": "At the top of the stack are the agents, harness and the models — **specialized agents work together** to deliver protection and security outcomes. All of this comes together in **Microsoft Perception**, our new agentic security system, **generally available today**.\n\nPlease welcome David Weston, our own frontier security engineer and **the architect of Perception**, to show you the product."}}, {"type": "section", "t": 7647, "title": {"ko": "Perception 둘러보기 — 레드·블루·그린 에이전트 팀과 MAI Cyber 2", "en": "Inside Perception — red, blue and green agent teams and MAI Cyber 2"}, "lead": {"ko": "David Weston이 Perception의 구성 요소를 짧게 투어합니다. 에이전트를 사람 보안팀처럼 역할별 팀으로 꾸리고, 플레이북으로 묶고, 비용과 사람 승인까지 관리하는 설계가 핵심입니다. 이어서 Aleš가 이 시스템 안에서 쓰이는 보안 특화 모델 MAI Cyber 2의 성능 대비 비용 수치를 밝힙니다.", "en": "David Weston tours Perception: agents organized like human security teams, combined into playbooks, with cost and human-approval controls. Aleš then gives the performance-per-cost numbers for the security-specialized model MAI Cyber 2."}}, {"type": "say", "sp": "david", "t": 7647, "text": {"ko": "좋습니다, 멋지네요. Aleš가 공격자들이 얼마나 빠르게 움직이는지 말씀드렸죠. 저희는 **방어자도 똑같이 빠르게** 움직일 수 있도록 이 시스템을 만들었습니다. 질문을 할 수도 있지만 **일을 위임할 수도** 있습니다. 에이전트가 자동으로 실행되도록 설정할 수 있고, **사람 직원처럼 팀으로 관리**할 수 있습니다. 어떤 모습인지 보여 드리죠.", "en": "All right, awesome. So Aleš told you how attackers are moving at speed. We built [this] system so **defenders can move just as fast**. You can ask questions, but you can also **delegate work**. You can set them up to automatically trigger and **manage them as teams like you would human folks**. Let's give you a view of what these look like."}}, {"type": "say", "sp": "david", "t": 7676, "text": {"ko": "이 에이전트들은 **사람 보안팀이 일하는 방식을 그대로 흉내** 냅니다. 먼저 **블루팀** 에이전트 팀이 있습니다. 숙련된 사람처럼 위협을 찾아다니고(헌팅), 탐지하고, 조사할 수 있습니다.\n\n둘째로, **레드팀 에이전트**라는 개념을 도입했습니다. 여러분의 환경을 선제적으로 분석하고, 위험을 짚어 주고, 위협 인텔리전스를 활용해 정교한 공격을 흉내 낼 수도 있습니다.\n\n그리고 **그린 에이전트**는 '고치는 역할'입니다. 들어와서 보안 태세를 바로잡고, 코드를 고치고, 탐지 규칙 작업을 돕습니다.", "en": "[They] **mimic the way human security teams operate**. We have a team of agents, our **blue team**: they can hunt, they can detect, they can investigate just like expert humans can.\n\nSecond, we've introduced this concept of **red team agents**: they can proactively analyze your environment, highlight your risk — they can even operate with threat intelligence to mimic sophisticated attacks.\n\nThe **green agents** — they're the fixers. They can come in and repair your posture, fix code, help with detections."}}, {"type": "term", "term": "Red / Blue / Green team", "kr": {"ko": "공격 역할(레드)·방어 역할(블루)·수리 역할(그린)로 나눈 보안팀 구성", "en": "Attack, defend and fix roles in security teams"}, "body": {"ko": "보안 업계에서 레드팀은 일부러 공격자 입장이 되어 우리 시스템을 뚫어 보는 팀, 블루팀은 실제 공격을 탐지·조사·대응하는 방어팀입니다. 그린팀은 이 키노트에서 '고치는 사람'으로 설명되는데, 발견된 문제를 실제로 수리(설정 보완, 코드 수정, 탐지 규칙 작성)하는 역할입니다.\n\n비유하자면 레드팀은 '모의 도둑', 블루팀은 '경비원', 그린팀은 '문과 자물쇠를 고치는 수리공'입니다.\n\nPerception은 AI 에이전트를 이렇게 사람 보안 조직과 같은 역할로 나눠 팀으로 운영합니다. 보안 담당자가 이미 익숙한 조직 구조를 그대로 가져왔다는 점이 포인트입니다.", "en": "Red team = simulated attackers; blue team = detect/investigate/respond; green team (as described here) = fixers who repair posture, code and detections. Perception organizes AI agents into these familiar roles."}}, {"type": "say", "sp": "david", "t": 7720, "text": {"ko": "이게 정말 흥미로워지는 지점은 **플레이북**이라는 개념입니다. 헌팅이나 분석처럼 아주 정교한 작업을 하는 **나만의 팀을 만들 수 있다**고 생각해 보세요. 상상할 수 있는 건 무엇이든 커스텀 플레이북으로 만들 수 있습니다.\n\n제 플레이북을 보면, 실행하면 **비용이 얼마나 들지 바로 투명하게** 볼 수 있습니다. 언제 실행될지 **트리거**도 설정할 수 있습니다. 위협 인텔리전스 에이전트, 탐지 규칙 작성, 보안 태세 에이전트 — 이들이 함께 모여 정교한 일을 해냅니다.", "en": "Where this really gets interesting is the concept of **playbooks**. Think about being able to **create your own team** to do highly sophisticated tasks like hunting, analysis — anything you can imagine you can create in a custom playbook.\n\n[In] my playbook, you can see right away, **transparently, what it's going to cost**. You can set up a **trigger** for when it will operate. The threat intelligence agent, detection authoring and posture — this comes together to do sophisticated work."}}, {"type": "shot", "t": 7745, "cap": {"ko": "'Protect against a threat' 플레이북 상세: 실행 전 예상 비용 $32–$86.40, 소요 시간 10–120분이 표시되고(빨간 박스), '매월 1일' 자동 실행 규칙을 켤 수 있습니다. 보안 작업에도 '가격표'가 붙는다는 점이 새롭습니다.", "en": "'Protect against a threat' playbook: estimated cost $32–$86.40 and 10–120 minutes shown up front (red box), plus a monthly automation trigger — security work with a price tag."}, "img": "images/shot-45.jpg"}, {"type": "term", "term": "Playbook", "kr": {"ko": "여러 단계의 보안 작업을 묶어 놓은 실행 각본", "en": "A reusable multi-step security procedure"}, "body": {"ko": "보안 운영에서 플레이북은 '이런 상황이면 이 순서로 이렇게 대응한다'는 절차서입니다. 예전엔 사람이 읽고 따라 하는 문서였다면, 요즘은 자동화 도구가 실행하는 워크플로를 뜻합니다.\n\nPerception에서는 플레이북이 여러 에이전트(위협 인텔리전스, 탐지 작성, 태세 개선 등)를 하나의 팀으로 엮은 실행 단위입니다. 화면에서 보듯 실행 전에 예상 비용과 시간이 표시되고, 매달·새 경보 발생 시처럼 자동 실행 조건(트리거)을 걸 수 있습니다.", "en": "A predefined response procedure. In Perception, a playbook strings multiple agents into a team, shows estimated cost/time up front, and can run on triggers."}}, {"type": "say", "sp": "david", "t": 7765, "text": {"ko": "여기서는 에이전트들을 관리할 수 있습니다. 어떤 에이전트가 **사람의 입력을 기다리고 있는지** 볼 수 있죠. 마지막으로 그만큼 중요한 것이 **FinOps 대시보드**입니다. 어떤 에이전트가 실행됐고, 비용이 얼마였고, 결과가 무엇이었는지 설명해 줍니다. 그리고 이 모든 것이 **Agent 365에 전파**됩니다. 이것이 프런티어 에이전트 보안 시스템입니다. Aleš에게 다시 넘깁니다.", "en": "This is where you can manage agents — which ones are **requiring human input**. Finally, just as important, we have our **FinOps dashboard** to explain what agents ran, what they cost and what the outcomes are. And this is all **propagated in Agent 365**. [That's our] frontier agentic security system. Back to Aleš."}}, {"type": "term", "term": "FinOps", "kr": {"ko": "클라우드·AI 비용을 재무 관점에서 관리하는 운영 방식", "en": "Financial operations for cloud/AI spend"}, "body": {"ko": "FinOps(Financial Operations)는 클라우드처럼 쓰는 만큼 돈이 나가는 서비스의 비용을, 기술팀과 재무팀이 함께 실시간으로 보고 최적화하는 관리 방식입니다.\n\n보안 에이전트도 돌릴 때마다 모델 사용료가 나가므로, Perception은 '어떤 에이전트가 무엇을 하고 얼마를 썼고 어떤 결과를 냈는지'를 보여 주는 FinOps 대시보드를 둡니다. 앞서 본 Agent 365 Business Analytics와 같은 철학이 보안 영역에도 적용된 것입니다.", "en": "Managing usage-based cloud/AI costs jointly by tech and finance. Perception's FinOps dashboard shows which agents ran, cost and outcomes — the same idea as Agent 365's cost views."}}, {"type": "say", "sp": "ales", "t": 7797, "text": {"ko": "Dave, 정말 끝내주네요. Perception은 **측정 가능한 보안 성과**를 내도록 만들어졌고, 실제 보안 업무에 기반한 엄격한 벤치마크로 평가됩니다. 저희의 **멀티모델 설계**는 모든 작업을 가장 적합한 모델로 보내는데, 여기에는 앞서 Satya가 발표한 **MAI Cyber 2**가 포함됩니다.\n\n저희는 이 사이버 모델을 수십 년간의 실제 보안 데이터와, 업계 최고 보안 전문가들이 만든 학습 환경으로 훈련했고, 최신 위협 지형을 반영합니다. 그 결과는 효과적인 보호입니다. **GPT-6 Astra보다 더 뛰어나면서 작업당 비용은 2% 미만**이어서, 에이전트 보안을 대규모로 감당할 수 있는 비용으로 만들어 줍니다.", "en": "Dave, that's some awesome sauce. [Perception] was built to deliver **measurable security outcomes**, [evaluated] against rigorous benchmarks grounded in real security work. Our **multi-model design** routes every [task] to the most qualified model, and that includes **MAI Cyber 2**, announced earlier by Satya.\n\nWe train the cyber models using decades of real-world security data and learning environments [built] by industry-leading security experts, reflecting the most up-to-date threat landscape. The result is effective protection — **better than GPT-6 Astra at less than 2% of the cost per task** — making agentic security affordable at scale."}}, {"type": "shot", "t": 7848, "cap": {"ko": "Microsoft Perception 슬라이드: '성능·효과 평가', '지속적 규모에서 효율적', '작업에 맞는 모델' — 그리고 'CyberGym-E2E에서 GPT-6 Astra보다 우수, 작업당 비용 2% 미만'. MAI Cyber 2의 핵심 수치입니다.", "en": "Perception slide: evaluated for performance, efficient at continuous scale, right model for the task — 'Better than GPT-6 Astra on CyberGym-E2E @ <2% of cost per task'."}, "img": "images/shot-46.jpg"}, {"type": "term", "term": "MAI Cyber 2 / CyberGym-E2E", "kr": {"ko": "Microsoft AI의 보안 특화 모델 / 실전형 보안 벤치마크", "en": "Microsoft AI's security model / an end-to-end security benchmark"}, "body": {"ko": "키노트 설명에 따르면, MAI Cyber 2는 Microsoft AI(MAI)가 수십 년간의 실제 보안 데이터와 전문가가 설계한 학습 환경으로 훈련한 사이버 보안 특화 모델이며, Perception의 멀티모델 구성에 들어갑니다(Satya가 앞에서 발표).\n\n화면 슬라이드에 따르면 비교 기준은 CyberGym-E2E라는 벤치마크입니다. CyberGym은 실제 소프트웨어 취약점을 AI가 재현·분석할 수 있는지 시험하는 보안 벤치마크 계열로, 'E2E'는 처음부터 끝까지(end-to-end) 과제를 수행하는 방식을 뜻합니다.\n\n핵심 주장은 범용 최상위 모델(GPT-6 Astra)보다 성능이 좋으면서 작업당 비용은 2% 미만이라는 것입니다. 보안 에이전트를 24시간 대량으로 돌리려면 비용이 결정적이기 때문에 이 숫자가 중요합니다.", "en": "Per the keynote, MAI's cyber-specialized model trained on decades of security data, used inside Perception. On-screen claim: better than GPT-6 Astra on the CyberGym-E2E benchmark at <2% of cost per task — key for running security agents at scale."}}, {"type": "section", "t": 7856, "title": {"ko": "보안 엔지니어의 하루 — 패치 대응과 경보 처리를 에이전트 팀에게", "en": "A security engineer's day — patching and alert triage with agent teams"}, "lead": {"ko": "David이 직접 '프런티어 보안 엔지니어' 역할로 두 가지 핵심 업무, 즉 취약점 노출 줄이기와 탐지·대응을 Perception으로 처리합니다. 실제로 악용 중인 Patch Tuesday 취약점 대응과, Okta 경보 조사에서 새 탐지 규칙 3개 배포까지가 흐름입니다. 마지막에 Aleš가 외부 공격자뿐 아니라 '권한 과다한 내부자'가 된 에이전트까지 지켜야 한다는 메시지로 보안 파트를 닫습니다.", "en": "David plays a frontier security engineer doing two core jobs in Perception: reducing exposure (an actively exploited Patch Tuesday vuln) and detection & response (an Okta alert ending in 3 new detections). Aleš closes the segment: agents themselves are overprivileged insiders that must be protected."}}, {"type": "say", "sp": "ales", "t": 7856, "text": {"ko": "David에게 다시 넘겨서, Perception이 David 같은 보안 실무자들이 **노출을 줄이고 에이전트로 방어**하도록 어떻게 돕는지 보겠습니다. David.", "en": "Let's hand it back to David to see how Perception helps security practitioners like him **reduce the exposure and defend with agents**. David."}}, {"type": "say", "sp": "david", "t": 7870, "text": {"ko": "좋습니다, 이제 저는 보안 엔지니어로 변신하겠습니다. 프런티어 보안 엔지니어로서 저에게는 **두 가지 큰 일**이 있습니다. 첫째는 **자산을 보호하는 것**입니다. 설정과 노출을 분석하고 패치를 적용해야 하죠. 이게 나쁜 사람들을 막아 내고 회사 주위에 요새를 쌓는 일입니다.\n\n둘째는 **탐지하고 대응하고 기업을 회복시키는 것**입니다. Perception이 프런티어 엔지니어에게 이 일을 얼마나 쉽게 만들어 주는지 보여 드리겠습니다.", "en": "Okay, so I'm going to transform into a security engineer. As a frontier security engineer, I have **two big jobs**. I need to **protect the estate**: I need to analyze configurations, exposures, apply patches. This keeps the bad folks out and creates a fortress around my company.\n\nAnd the second is **detecting and responding and healing the enterprise**. Let me show you how Perception makes this extremely easy for a frontier engineer."}}, {"type": "say", "sp": "david", "t": 7908, "text": {"ko": "Perception에서 제가 신경 써야 할 것이 보입니다. 회사 전체에 Patch Tuesday 업데이트가 배포됐는데, 그 안에 **현재 실제로 악용되고 있는 취약점**이 하나 있습니다. Perception 세션을 하나 열겠습니다. 우리 회사에서 어떤 기기가 패치됐고 어떤 기기가 취약한지 분석하는 작업을 잔뜩 하고 있네요.\n\n아직 살펴봐야 할 기기와 서버가 **52,000대**, 그 안에 **고유 CVE가 1,500개**(자막은 '15000', 화면은 1,520개) 있습니다. 위협 인텔리전스로 실제 악용 여부까지 맞춰 보고요. 이 모든 걸 **하나의 시스템**에서 얻습니다. 이 모든 정보가 에이전트와 함께 여기 **한 화면으로 압축**됩니다.", "en": "You can see [in] Perception something that I need to be concerned about: there's a Patch Tuesday pushed to all of my company, and within that Patch Tuesday there's a vulnerability that's **being actively exploited**. I'll pop open a Perception session. It's doing a bunch of work to analyze in my enterprise which machines have been patched or [are] vulnerable.\n\n**52,000 devices and servers** that still need to be looked at, **1,500 distinct CVEs** in there (caption '15000'; screen shows 1,520), [correlating] exploitation with threat intelligence. I get all of that **in a single system**. All of that information is **compacted into a single pane** here with the agent."}}, {"type": "term", "term": "CVE", "kr": {"ko": "공개된 보안 취약점마다 붙는 국제 고유 번호", "en": "Common Vulnerabilities and Exposures ID"}, "body": {"ko": "CVE(Common Vulnerabilities and Exposures)는 공개된 소프트웨어 보안 취약점마다 붙이는 표준 식별 번호입니다(예: CVE-2026-12345). 전 세계 보안 업계가 같은 취약점을 같은 이름으로 부르기 위한 '주민등록번호' 같은 것입니다.\n\nDavid의 화면에는 아직 확인이 필요한 기기 5만여 대(클라이언트 52,783대, 서버 6,419대)와 1,500개가 넘는 고유 CVE가 나옵니다. 사람이 하나씩 대조하면 며칠~몇 주가 걸릴 일을 에이전트가 한 화면으로 정리해 준다는 것이 요점입니다.", "en": "Standard IDs for publicly known vulnerabilities. David's screen shows ~59K devices (52,783 clients, 6,419 servers) and 1,500+ distinct CVEs, condensed by the agent into one pane."}}, {"type": "say", "sp": "david", "t": 7966, "text": {"ko": "그래서 저는 빠르게 움직이고 **신속 처리**하고 싶습니다. 바로 배포를 밀어붙이면, 클라이언트 시스템에 **중요 패치가 적용**되기 시작합니다. 그리고 새로운 **endpoint shield**를 써서 영향을 분석할 시간을 조금 더 법니다. 예전 같으면 복잡했을 일이죠.", "en": "So I want to move quick and I want to **expedite**. I push this out right away — **the critical patches are being applied** on client systems. I use our new **endpoint shield** to give me a little bit more time to analyze the impact — something that would have been complicated."}}, {"type": "term", "term": "Endpoint shield", "kr": {"ko": "패치 전까지 취약한 기기를 임시로 보호하는 방패 기능", "en": "Temporary protection for exposed devices until patched"}, "body": {"ko": "키노트 설명에 따르면, endpoint shield는 패치를 바로 적용하기 어려운 기기에 임시 보호막을 씌워 영향 분석과 패치 계획을 세울 시간을 벌어 주는 새 기능입니다. 데모 화면에는 'Shield exposed devices — All 6,419 servers'(패치 대기 중 임시 방패 적용) 작업이 나옵니다.\n\n비유하면 지붕 수리 일정을 잡는 동안 새는 곳에 우선 방수포를 덮어 두는 것입니다. 클라이언트 PC는 바로 패치하고, 서버처럼 함부로 재부팅하기 어려운 시스템은 방패로 먼저 막는 이중 전략입니다.", "en": "Per the keynote, a new capability that temporarily shields exposed devices (the demo shows 6,419 servers) while patches are pending, buying time to assess impact."}}, {"type": "say", "sp": "david", "t": 7994, "text": {"ko": "이제 제 다른 업무로 넘어가겠습니다. 회사 내 **경보를 분석하고 대응하는 일**인데, 제가 시간을 아주 많이 쓰는 곳이죠. 탐지 큐에는 분류(트리아지)가 필요한 열린 케이스가 잔뜩 있습니다. 여기서 Perception이 저 대신 힘든 일을 해 줍니다. 케이스 하나하나가 **몇 시간, 심지어 며칠**짜리 일일 수 있거든요.\n\n여기서 저는 들어가서 **에이전트 팀에게 일을 시킬** 수 있습니다. **새 경보가 생길 때마다 자동으로 실행**되게 하고 싶고요. 트리아지, 탐지 에이전트 각각이 이 경보들을 하나씩 처리할 텐데, 정교함에 따라 **10분에서 1시간** 정도 걸릴 겁니다.", "en": "Now I'm going to switch to my other job, which is **analyzing alerts in my enterprise and acting on them** — a place where I spend a lot of time. In the detection [queue], there's a bunch of cases that need to be triaged and [are] open. This is where Perception does the hard work for me. Each one might represent **hours or even days**.\n\nHere I can jump in [and] **ask my agent team to do work for me**. I want this to be **triggered any time there's a new alert**, and each of the triage [and] detection [agents] are going to work on each of those alerts. It's going to take **between ten minutes and an hour**, depending on the sophistication."}}, {"type": "term", "term": "Alert triage", "kr": {"ko": "쏟아지는 보안 경보를 진짜·가짜, 긴급·비긴급으로 가려내는 일", "en": "Sorting security alerts by validity and urgency"}, "body": {"ko": "트리아지는 원래 응급실에서 환자의 위급도를 분류하는 말입니다. 보안에서는 하루 수백~수천 건씩 울리는 경보 중 무엇이 진짜 공격이고 무엇이 오탐인지, 무엇부터 봐야 하는지 가려내는 작업을 뜻합니다.\n\n보안 관제 인력이 가장 많은 시간을 쓰는 반복 업무라, '경보 피로'로 진짜 공격을 놓치는 일도 생깁니다. 이 데모에서는 새 경보가 생길 때마다 Perception의 에이전트 팀이 자동으로 트리아지와 조사를 시작하고, 사람은 결과를 검토하는 쪽으로 역할이 바뀝니다.", "en": "Like ER triage: deciding which security alerts are real and urgent. It eats SOC time; here Perception's agent team auto-triages each new alert and humans review."}}, {"type": "say", "sp": "david", "t": 8038, "text": {"ko": "여러 조사가 진행되는 게 보이죠. 첫 번째로 보고 싶은 건 Perception이 **서드파티 데이터**를 어떻게 활용하는지입니다. **Okta 데이터**에 기반한 경보입니다. Perception이 힘든 일을 이미 많이 해 놨네요. 벌써 트리아지 중입니다.\n\n일을 하고 있는 에이전트를 들여다보죠. **공격 조사 에이전트**가 이미 몇 가지 발견 사항을 찾아 놨고, **탐지 작성 에이전트**가 내용을 보강하기 시작했습니다. 잠깐 돌아가게 두겠습니다.", "en": "You can see these different investigations. The first one I want to look at is how Perception can use **third-party data** — an alert based on **Okta data**. We can see that Perception did a lot of the heavy lifting; it's already triaging.\n\nLet's drop in on our agent doing a bunch of the work. We can see here that the **attack investigation agent** has already pulled up some findings for us, and the **authoring agent** is starting to enrich. We'll let this run for a second."}}, {"type": "term", "term": "Okta", "kr": {"ko": "기업용 로그인·ID 관리 서비스 (Microsoft Entra의 경쟁 제품)", "en": "Third-party identity/SSO provider"}, "body": {"ko": "Okta는 직원들이 한 번 로그인으로 여러 업무 앱에 들어가게 해 주는(SSO) 클라우드 ID 관리 서비스로, Microsoft Entra와 경쟁하는 다른 회사 제품입니다.\n\n이 장면의 요점은 Perception이 Microsoft 제품의 신호만이 아니라 Okta 같은 서드파티 데이터로 만든 경보도 조사한다는 것입니다. 앞서 Aleš가 '여러분의 보안 스택은 여러 회사 제품이 섞여 있고, 우리 것도 그렇다'고 말한 내용을 데모로 보여 주는 셈입니다. 화면의 사례는 'Okta 로그인 후 AWS로 넘어가는 공격'입니다.", "en": "A non-Microsoft identity/SSO provider (competes with Entra). Shows Perception investigating third-party signals — here an Okta-to-AWS attack chain."}}, {"type": "say", "sp": "david", "t": 8076, "text": {"ko": "먼저 보이는 건 새로운 **탐지 보고서**입니다. 이 보고서가 알려 주는 건, 조사 과정을 보니 우리가 탐지는 잘했지만, 탐지 규칙을 몇 개 더 써서 커버리지를 보강하면 **처음 발견했을 때보다 더 나은 상태**로 만들 수 있다는 겁니다. API와 여기 쓰이는 코딩 모델을 결합해서, **공격 체인 전체를 커버하는 커스텀 탐지 규칙**을 작성할 수 있습니다.\n\n이건 민감한 일이라 **제가 통제권을 쥐고 있는지** 확실히 하고 싶습니다. 규칙들을 검토하고 **클릭 한 번으로 게시**할 수 있습니다. 이 규칙들은 **오탐(false positive)** 검사도 거칩니다. **새 탐지 규칙 3개가 배포**됐고, 탐지 범위가 넓어졌고, 전체적으로 우리 회사가 더 잘 보호됩니다. 그럼 Aleš에게 다시 넘기겠습니다.", "en": "And the first thing we see here is a new **detection report**. What it's giving us is an idea [that] as the investigation happened, we did a good job of detecting, but we can **leave it better than where we found it** by writing a few more detections to augment our [coverage]. With the combination of APIs and the coding model in use here, we can write **custom detections to cover the entire attack chain**.\n\nThis is a sensitive thing — I want to make sure **I'm in control**. I can review the rules, **publish them with a single click**. These are also being checked for **false positives**. **Three new detections were deployed**, my scope of detection got better, and overall my enterprise is better protected. With that, I'll hand it back to Aleš."}}, {"type": "shot", "t": 8120, "cap": {"ko": "Custom detections 화면: '3개 규칙 게시 및 활성화' — Initial Access·Persistence·Privilege Escalation 등 공격 단계별 커버리지 레이더 차트와 AWS·Okta 관련 새 규칙 목록. 사람이 검토·승인한 뒤 배포된 결과입니다.", "en": "Custom detections: '3 rules published and enabled', with an ATT&CK-style coverage radar (Initial Access, Persistence, Privilege Escalation…) and new AWS/Okta rules — deployed after human review."}, "img": "images/shot-47.jpg"}, {"type": "term", "term": "False positive", "kr": {"ko": "오탐 — 위협이 아닌데 위협이라고 울리는 경보", "en": "An alert that fires on something harmless"}, "body": {"ko": "오탐(false positive)은 정상 활동을 공격으로 잘못 판단해 울리는 경보입니다. 화재경보기가 토스트 연기에 울리는 것과 같습니다.\n\n탐지 규칙을 새로 만들 때 가장 큰 위험은 오탐이 폭증해 보안팀이 헛경보에 파묻히는 것입니다. 그래서 David의 데모에서 AI가 쓴 새 탐지 규칙들은 배포 전에 오탐 검사를 거치고, 사람이 검토한 뒤 클릭 한 번으로 게시됩니다. '자동화하되 통제권은 사람이'라는 원칙을 보여 주는 대목입니다.", "en": "A harmless event flagged as an attack (like a smoke alarm for toast). New AI-written rules are checked for false positives and human-reviewed before publishing."}}, {"type": "say", "sp": "ales", "t": 8134, "text": {"ko": "네, 고마워요, David. Perception이 경계선(perimeter)에서 오는 위협을 어떻게 다루는지 보여 줘서 고맙습니다.\n\n하지만 AI는 **조직 내부에도 새로운 위험**을 가져옵니다. 바로 **에이전트**입니다. 꼭 악의적인 건 아니지만, 에이전트는 흔히 **권한이 과도하고**, 폭넓은 도구와 고가치 데이터에 접근하며, 점점 더 자율적으로 **24시간 내내 비즈니스 프로세스를 실행**합니다. **Perception과 Agent 365는 같은 컨텍스트를 공유**하며, 함께 기업 전체의 에이전트를 기계의 속도로 보호합니다.", "en": "Yeah, thank you, David. Thank you for walking us [through] how Perception takes on threats on the perimeter.\n\nBut AI also introduces **new risks inside of our organizations: agents**. While not entirely malicious, they're frequently **overprivileged**, have access to a broad set of tools and high-value data, and are increasingly more autonomous, **executing business processes around the clock**. **Perception and Agent 365 share the same context** and work together to secure agents across your entire enterprise at machine speed."}}, {"type": "term", "term": "Overprivileged agents (agentic insiders)", "kr": {"ko": "필요 이상으로 많은 권한을 가진 에이전트 = 새로운 내부자 위험", "en": "Agents with more access than they need — a new insider risk"}, "body": {"ko": "보안에서 '내부자 위협'은 회사 안의 사람이 권한을 악용하거나 실수로 사고를 내는 위험입니다. '최소 권한 원칙'은 누구에게나 일에 꼭 필요한 만큼만 권한을 주라는 원칙이고, 이를 어긴 상태를 '과도한 권한(overprivileged)'이라고 합니다.\n\nAleš는 에이전트가 바로 이런 새 내부자라고 말합니다. 악의는 없어도 많은 도구와 중요 데이터에 접근하고 사람 감독 없이 24시간 일하므로, 탈취되거나 오작동하면 피해가 큽니다. 그래서 외부 공격을 막는 Perception과 에이전트를 관리하는 Agent 365가 같은 컨텍스트를 공유하며 함께 지킨다는 것이 이 보안 파트의 결론입니다.", "en": "Insider risk = harm from those already inside; least privilege = only the access needed. Aleš frames agents as new overprivileged insiders, so Perception and Agent 365 share context to protect them."}}, {"type": "say", "sp": "ales", "t": 8170, "text": {"ko": "**AI는 사이버 보안의 물리 법칙을 바꿨습니다.** 그래서 저희는 Perception을 만들었습니다. 여러분의 기반을 지키고, 위협에 맞서 방어하고, **여러분의 에이전트 내부자들을 보호**하도록 돕는 에이전트 보안 시스템입니다. Judson, 다시 넘기겠습니다.", "en": "**AI has changed the physics of cyber**, and that's why we built Perception, an agentic security system that helps you secure your foundations, defend against threats and **protect your agentic insiders**. Judson, back to you."}}, {"type": "beat", "t": 8175, "text": {"ko": "(스크린: 'One source of truth. One consistent view across IT + Security' — Perception의 3층 스택이 Agent 365로 연결되는 그림)", "en": "(Screen: 'One source of truth. One consistent view across IT + Security' — Perception's stack connected to Agent 365)"}}, {"type": "section", "t": 8193, "title": {"ko": "BNY CIO와의 대담 — '신뢰가 곧 프로젝트'", "en": "Conversation with BNY's CIO — 'trust is the project'"}, "lead": {"ko": "Judson이 키노트를 마무리하기 전, 가장 규제가 엄격한 금융업의 CIO인 BNY의 Leigh-Ann Russell을 초대해 대담합니다. 거버넌스·보안을 처음부터 설계에 넣어야 오히려 빨리 확장된다는 주장, Microsoft 에이전트와 BNY 에이전트가 협상해 실제 거래를 체결한 '시장 최초' 사례, Perception 프리뷰 경험이 핵심입니다. 앞의 보안 파트를 실제 고객의 목소리로 확인하는 자리입니다.", "en": "Before closing,
