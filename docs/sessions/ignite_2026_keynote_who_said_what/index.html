ross the network, but Defender's **automatic attack disruption** kept containing those compromised accounts and isolating devices even as the agent continued to attack.\n\nAttacks like this one are unfortunately increasingly agentic and autonomous. That is why it is important to have that speed in our response. That is why we built Perception as this **complete agentic security system**."}}, {"type": "shot", "t": 1480, "cap": {"ko": "보안 연구자(@UK_Daniel_Card)의 X 게시물. 자율 공격 도구 ARTEX를 방어되지 않은 네트워크에 쓰면 '공격이 이기고', Defender(MDE)로 보호된 네트워크에 쓰면 '블루팀이 이긴다'는 내용과 Defender 경보 화면이 함께 보입니다.", "en": "A researcher's X post: ARTEX wins against an undefended network, but 'the blue team wins' against one protected by Defender (MDE), with Defender alerts shown."}, "img": "images/shot-10.jpg"}, {"type": "term", "term": "Lateral movement", "kr": {"ko": "수평 이동 — 침입자가 한 곳을 뚫은 뒤 네트워크 안의 다른 시스템으로 옮겨 다니는 것", "en": "An attacker hopping from one compromised system to others"}, "body": {"ko": "해커는 보통 처음 침입한 PC 하나로 끝내지 않고, 그 안에서 얻은 계정·권한을 이용해 서버, 다른 PC, 관리자 계정으로 옮겨 가며 피해를 키웁니다. 이를 수평 이동이라고 합니다. 건물에 한 번 들어온 도둑이 방에서 방으로 옮겨 다니는 것과 같습니다.\n\n이 사례에서 AI 공격 에이전트는 사람보다 훨씬 빠르게 이런 이동을 반복 시도했고, Defender는 탈취된 계정을 막고 장치를 격리해 이동 경로를 끊었습니다. Satya는 '공격이 기계 속도로 오니 방어도 기계 속도여야 한다'는 논리를 이 사례로 보여 줍니다.", "en": "After breaking in, attackers move from system to system using stolen credentials. Here an AI agent tried this repeatedly and Defender kept cutting it off—showing defense must run at machine speed."}}, {"type": "say", "sp": "satya", "t": 1516, "text": {"ko": "Perception을 이해하는 가장 좋은 방법은 이렇습니다. 공격을 시뮬레이션하는 **레드팀 에이전트**, 공격을 탐지하는 **블루팀 에이전트**, 문제를 고치고 복구하는 **그린팀 에이전트**가 있습니다. 블루팀 에이전트의 좋은 예는 Defender에 있는 에이전트로, 공격으로부터 보호하는 역할을 합니다. 레드팀 에이전트의 예를 들면, 웹 앱 같은 것의 전체 공격 표면 — API, 인젝션 공격, 비즈니스 로직 — 을 다 살펴보고, 여러분이 공격당할 수 없다는 것을 확인하는 데 필요한 모든 증거를 만들어 냅니다.\n\n사실 이것은 개별 에이전트 하나의 이야기가 아닙니다. 여러분이 직접 조합할 수 있는 **플레이북**, 즉 복잡한 일을 처리하는 에이전트 팀이 스스로 작동을 시작하고 자율적으로 조치를 취하는 것입니다.", "en": "The best way to think about Perception is: you have these **red team agents** that simulate attacks, **blue team agents** that detect attacks, and **green team agents** that fix and remediate. A good example of a blue team agent would be what you have in Defender, the protector against the attack. Another example would be the red team agent: it takes the entire surface area of something like a web app—the APIs, injection attacks, business logic—and creates all the evidence you need to confirm that you are not exploitable.\n\nIn fact, this isn't just any individual agent; it is the **playbooks** you can compose—teams of agents to tackle complex jobs that trigger and take action autonomously."}}, {"type": "term", "term": "Red team / Blue team / Green team", "kr": {"ko": "레드팀(공격)·블루팀(방어)·그린팀(복구) — 보안 역할 분담", "en": "Attack, defend and fix roles in security"}, "body": {"ko": "보안 업계에서 레드팀은 일부러 우리 시스템을 공격해 약점을 찾는 '모의 해커', 블루팀은 공격을 탐지하고 막는 '방어 담당'입니다. 그린팀은 발견된 취약점을 고치고 시스템을 원래대로 되돌리는 역할로 쓰입니다. 축구로 치면 공격수, 수비수, 그리고 부상 선수를 치료하고 경기장을 정비하는 팀입니다.\n\n키노트 설명에 따르면 Perception은 이 세 역할을 각각 AI 에이전트로 만들고, 이들을 묶은 '플레이북'이 사람 개입 없이도 자동으로 실행되도록 합니다. 공격이 AI로 자동화되는 만큼 방어 쪽도 에이전트 팀으로 맞서겠다는 것입니다.", "en": "Red teams attack to find weaknesses, blue teams detect and defend, green teams fix and remediate. Per the keynote, Perception turns each role into agents composed into autonomous playbooks."}}, {"type": "say", "sp": "satya", "t": 1566, "text": {"ko": "Perception은 또한 모든 자산에 걸쳐 있는 신호, 센서, 행위 주체를 연결해 줍니다. ID, 클라우드, 앱, 그리고 이제는 당연히 에이전트까지 포함해서, 여러분의 환경을 처음부터 끝까지 실질적으로 보호합니다. 그래서 오늘 **Perception이 정식 출시(GA)**되었다는 소식을 전하게 되어 매우 기쁩니다.", "en": "Perception also helps essentially connect the signals, the sensors, the actors across all the assets—your identity, your cloud and your apps, and of course agents now—and really secure your end-to-end environment. That's why I'm very excited to share that **Perception is now generally available**."}}, {"type": "beat", "t": 1595, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "term", "term": "Microsoft Perception", "kr": {"ko": "Microsoft Perception — 이번에 GA된 Microsoft의 에이전트형 보안 시스템", "en": "Microsoft's new agentic security system (GA)"}, "body": {"ko": "키노트 설명에 따르면 Perception은 Microsoft 보안 스택의 맨 위에 놓이는 '에이전트형 보안 시스템'입니다. 화면의 'Cyber stack' 그림에서는 Perception이 에이전트·하네스·모델과 보안 컨텍스트를 담당하고, 그 아래 Entra, Purview, Defender, Intune, Sentinel 같은 기존 제품들이 신호·센서·실행 수단 역할을 하는 구조로 표시되었습니다.\n\n핵심은 레드·블루·그린팀 에이전트와 이를 조합한 플레이북이 자율적으로 공격 시뮬레이션, 탐지, 복구를 수행한다는 점입니다. 이 키노트에서 정식 출시(GA)가 발표되었습니다.", "en": "Per the keynote, Perception sits atop Microsoft's cyber stack (Entra, Purview, Defender, Intune, Sentinel as signals/sensors/actuators) and runs red/blue/green team agents and autonomous playbooks. Announced GA."}}, {"type": "section", "t": 1598, "title": {"ko": "혁신과 안전의 양립: AI 투명성 이니셔티브", "en": "Innovation without trading off safety: the AI Transparency Initiative"}, "lead": {"ko": "제품 차원의 보안을 넘어, 업계 전체의 과제인 'AI 모델 내부를 들여다볼 수 없다'는 문제를 짚는 대목입니다. Satya는 모델이 스스로에 대해 하는 말을 믿을 수 없다는 '블랙박스' 문제를 제기하고, 그 해법으로 표준과 생태계 협력을 내세운 투명성 이니셔티브를 발표합니다.", "en": "Beyond product security, Satya raises an industry-wide problem: we cannot see inside AI models, and their self-reports can't be trusted. He announces a transparency initiative built on standards and ecosystem collaboration."}}, {"type": "say", "sp": "satya", "t": 1598, "text": {"ko": "결국 저희는 **혁신과 안전 사이에서 양자택일해야 하는 일은 결코 없어야 한다**고 믿습니다. 그래서 저희 제품 전반에서 해 온 일에 더해, 모든 사람이 빠른 속도로 혁신하고 안전하게 규모를 키울 수 있도록 생태계 전반에서도 함께 일하고 있습니다.\n\n오늘날 우리는 모델이 건드리는 거의 모든 것을 볼 수 있지만, **모델 내부에서 무슨 일이 일어나는지는 볼 수 없습니다**. 더 나쁜 것은, 모델이 자기 자신에 대해 말하는 내용은 독립적인 증거가 아니므로 신뢰할 수 없다는 것입니다. 한 모델이 다른 모델을 감시하는 것도 같은 문제를 안고 있습니다.", "en": "And at the end of the day, we believe there should **never be a choice between innovation and safety**. That means in addition to the work we have been doing across our products, we are also working across the ecosystem to ensure that everyone can innovate with speed and scale safely.\n\nToday, we can see almost everything the models touch, but you **cannot see what happens inside the model**. And really what is worse is that we know that what a model tells us about itself is not independent evidence and therefore cannot be trusted. And one model monitoring another model has the same issue."}}, {"type": "say", "sp": "satya", "t": 1649, "text": {"ko": "그래서 본질적으로 우리는 받아들일 수 없는 새로운 **블랙박스**들을 갖게 된 셈이고, 이제 이것을 투명하고 검증 가능하게 만들어야 합니다. 그것이 기술적 과제입니다. 따라서 우리에게는 AI가 무엇을 보고 무엇을 하는지 살펴보고, 그 행동을 독립적으로 검증하고, 무엇을 해도 되는지를 통제할 수 있게 해 주는 **표준**이 필요합니다.\n\n그래서 오늘 저희는 **AI Transparency Initiative(AI 투명성 이니셔티브)**도 발표합니다.", "en": "So you essentially have this unacceptable new set of **black boxes**, which we now need to make transparent and verifiable. That is the technical challenge. So therefore, we need **standards** that allow us to examine what AI sees and does, verify its actions independently, and control what it is allowed to do.\n\nThat is why today we are also announcing the **AI Transparency Initiative**."}}, {"type": "say", "sp": "satya", "t": 1677, "text": {"ko": "이 매우 중요한 이니셔티브에는 세 부분이 있습니다. 첫째, 에이전트 표준 이니셔티브(agent standards initiative)와의 협력을 확대하고 그 연구를 바탕으로 투명성, 보안, 거버넌스에 관한 **업계 전반의 표준** 개발을 돕겠습니다.\n\n둘째, 생태계적 접근을 취합니다. 즉 어떤 모델이든, 어느 공급자든 상관없이 책임성 있고 독립적으로 검증 가능하며 설계 단계부터 안전한 AI 시스템을 함께 가능하게 하겠다는 뜻입니다. 이미 **40개 조직**이 표준을 정의하고 적용하는 일에 저희와 함께하고 있습니다.\n\n셋째, 같은 표준을 저희의 모든 제품 — 저희 AI 모델(MAI), Foundry(자막 불명확), 그리고 Copilot — 에 반영하겠습니다. 이 모든 연구 작업과 제품 작업을 통한 저희의 목표는, AI를 더 투명하고 접근 가능하게 만드는 표준을 확립하는 데 기여하는 것입니다.", "en": "There are three parts to this very important initiative. First, we will expand our collaboration with the agent standards initiative, drawing on its research to help the development of **industry-wide standards** for transparency, security and governance.\n\nSecond, we are taking an ecosystem approach. That means together we will enable AI systems that are accountable, independently verifiable and safe by design, regardless of which model it is or who the provider is. Already **40 organizations** are working with us on defining and applying the standards.\n\nAnd third, we are going to incorporate the same standards across all our products—our AI models (MAI), Foundry (caption unclear) and Copilot. Our ambition, through all this work—the research work and the product work—is to help establish a standard that makes AI more transparent and accessible."}}, {"type": "shot", "t": 1680, "cap": {"ko": "'AI transparency initiative' 발표 슬라이드. ①AI 투명성의 기반(국제 권고안 이행) ②생태계적 접근(업계 40여 개 대형 조직) ③Microsoft의 약속(MAI 등 자사 제품 적용) 세 기둥이 보입니다.", "en": "AI Transparency Initiative slide: foundations for AI transparency, an ecosystem approach (40+ large organizations), and Microsoft's commitment (MAI and products)."}, "img": "images/shot-11.jpg"}, {"type": "term", "term": "AI Transparency Initiative", "kr": {"ko": "AI 투명성 이니셔티브 — AI 내부를 검증 가능하게 만들기 위한 표준·생태계 협력", "en": "Microsoft-led effort for verifiable AI transparency standards"}, "body": {"ko": "'블랙박스'란 입력과 출력은 보이지만 내부 작동은 알 수 없는 시스템을 말합니다. Satya의 문제 제기는, AI에게 '왜 그렇게 했니?'라고 물어도 그 답 자체가 AI가 만든 것이라 독립적 증거가 될 수 없고, 다른 AI가 감시해도 마찬가지라는 것입니다.\n\n키노트 설명에 따르면 이 이니셔티브는 ①에이전트 표준 관련 연구 협력을 통한 업계 표준 개발, ②모델·공급자에 상관없이 적용되는 생태계 접근(이미 40개 조직 참여), ③Microsoft 자사 모델과 제품에의 적용, 세 부분으로 구성됩니다. 화면 슬라이드 제목은 'AI transparency initiative'였습니다.", "en": "Black boxes: you see inputs and outputs but not the inside, and a model's self-report isn't independent evidence. Per the keynote: industry standards via agent-standards research, an ecosystem approach (40 orgs), and adoption across Microsoft's own products."}}, {"type": "section", "t": 1746, "title": {"ko": "에이전트 시대를 위한 인프라: GitHub에서 HorizonDB, Maia 300까지", "en": "Infrastructure for the agentic era: from GitHub to HorizonDB and Maia 300"}, "lead": {"ko": "앞서 말한 모든 경험(Copilot, IQ, 신뢰)을 실제로 전 세계 규모로 돌리는 바닥 계층, 즉 인프라를 훑는 대목입니다. 에이전트가 만들어 내는 폭발적 작업량을 GitHub 사례로 보여 준 뒤, 데이터센터·지속가능성·소버린 클라우드·로컬 모델·에이전트용 컴퓨팅·데이터베이스·자체 칩까지 층층이 발표가 이어집니다. 특히 Satya가 '25년의 꿈'이라 부른 HorizonDB와 Fabric의 결합에 주목하세요.", "en": "Satya walks the bottom layer that runs everything at global scale. Starting from GitHub's agent-driven load, he covers datacenters, sustainability, sovereign cloud, local models, agent compute, databases and silicon—highlighting HorizonDB in Fabric, his '25-year dream'."}}, {"type": "say", "sp": "satya", "t": 1746, "text": {"ko": "제가 방금 말씀드린 이 모든 경험의 밑바탕에는 이것을 전 세계 규모로 제공하는 인프라가 있습니다. 인프라는 언제나 새로운 플랫폼 시대의 주요 워크로드에 의해 형태가 정해집니다. 오늘날의 인프라는 대규모 학습, 그리고 이제는 대규모 **에이전트 추론 워크로드**에 의해 형태가 잡히고 있습니다.\n\n좋은 예가 GitHub에서 보고 있는 현상입니다. GitHub에서는 푸시, Actions, PR이 모두 에이전트에 의해 **기하급수적으로 증가**했습니다.", "en": "Underneath every one of these experiences that I just talked about is infrastructure to deliver them at global scale. And when it comes to infrastructure, it is always shaped by the primary workloads of any new platform era. Today's infrastructure is being shaped by large-scale training, and of course now **agentic inference workloads** at scale.\n\nA great example of this is what we are seeing with GitHub. GitHub has seen **exponential increases**—the pushes, the Actions, the PRs—all driven by agents."}}, {"type": "say", "sp": "satya", "t": 1788, "text": {"ko": "그래서 저희는 아키텍처부터 시작해 핵심 전체를 다시 만들고 있습니다. 시스템 기본 요소를 단순화하고, 실제로 스토리지와 컴퓨트를 분리하고, 푸시의 핵심 경로를 가장 작은 통합 단계로 줄여 조정 작업을 최소화했습니다. 이 모든 작업과 테스트를 마친 뒤, **5,000개의 에이전트를 하나의 저장소**에 투입했더니 **초당 7,200건의 쓰기**를 유지할 수 있었습니다. 현재 처리량의 **180배**입니다.\n\n이것이 에이전트 워크로드가 요구하는 규모입니다. 그리고 GitHub에서 효과를 본 것은 이제 Azure 플랫폼 전반에 퍼져야 합니다.", "en": "And we are really rebuilding all of the core, starting with the architecture: simplifying the system primitives, in fact decoupling storage and compute, minimizing the coordination by shrinking the critical path of a push to the smallest step of integration. After doing all that and testing, we pointed **5,000 agents at one repo** and we were able to sustain **7,200 writes per second**—that is **180x** the current throughput.\n\nThat is the kind of scale we need for the agentic workload. And of course what worked for GitHub now needs to be pervasive throughout the Azure platform."}}, {"type": "say", "sp": "satya", "t": 1835, "text": {"ko": "저희는 이제 **500개 이상의 데이터센터와 80개 Azure 리전**을 갖고 있으며, 이를 더 효율적이고 더 지속 가능하게 만들고, 저희가 운영하는 지역사회와 깊이 협력하기 위해 계속 노력하고 있습니다. 저희는 기술이 지역사회와 그들이 의존하는 시스템에 부담을 주는 것이 아니라 그것을 강화해야 한다고 굳게 믿습니다. 그 믿음이 저희의 **커뮤니티 우선(community-first) AI 인프라 약속**의 바탕입니다.\n\n그리고 이 모든 것을 지속 가능하게 하고 있습니다. 연간 전 세계 전력 소비의 **100%를 재생에너지로 매칭**하고, 전체 서버와 부품의 **92%를 재사용 또는 재활용**하며, 냉각 설계도 마찬가지입니다.", "en": "We now have more than **500 datacenters and 80 Azure regions**, and we are continually working to make them more efficient, more sustainable, and partnered deeply with the communities in which we operate. We absolutely believe we need technology to strengthen and not strain any community and the systems on which they depend, and that belief underpins our **community-first AI infrastructure commitments**.\n\nAnd we are doing all of that sustainably—from matching **100% of our annual global electricity consumption with renewable energy**, to reusing or recycling **92% of all servers and components**, and of course all of the cooling designs."}}, {"type": "say", "sp": "satya", "t": 1890, "text": {"ko": "고객들은 또한 가장 중요한 워크로드가 어떻게 운영되는지에 대해 더 많은 통제권을 요구하고 있습니다. 바로 여기서 **소버린 클라우드** 옵션이 혁신을 희생하지 않으면서 보안, 통제, 복원력, 역량의 연속적인 선택지를 제공합니다.", "en": "And customers are also asking for more control over how their most important workloads are run, and that is where **sovereign cloud** options provide a continuum of security, control, resilience and capabilities, without compromising on innovation."}}, {"type": "term", "term": "Sovereign cloud", "kr": {"ko": "소버린 클라우드 — 데이터와 운영 통제권을 특정 국가·조직 안에 두는 클라우드", "en": "Cloud with data and control kept within a jurisdiction"}, "body": {"ko": "소버린(sovereign)은 '주권'이라는 뜻입니다. 소버린 클라우드는 데이터가 어느 나라에 저장되는지, 누가 접근·운영할 수 있는지, 해외 법률의 영향을 받는지 등을 고객(특히 정부·금융·공공)이 통제할 수 있게 설계된 클라우드입니다.\n\n화면에는 'Sovereign Public Cloud(공용)', 'Sovereign Private Cloud(전용)', 'Sovereign Partner Ecosystem(파트너 운영)'이 하나의 연속선으로 표시되었습니다. Satya가 말한 '연속적인 선택지(continuum)'란, 규제 수준에 맞춰 이 중 하나를 고르되 최신 AI 기능은 포기하지 않아도 된다는 뜻입니다.", "en": "Cloud where customers control data location, access and legal exposure. The slide showed a continuum: Sovereign Public Cloud, Sovereign Private Cloud, Sovereign Partner Ecosystem."}}, {"type": "say", "sp": "satya", "t": 1899, "text": {"ko": "물론 저희는 Windows가 저희의 모든 인프라를 엣지까지 확장하는 것에도 기대가 큽니다. 이제 로컬에서 실행되는 유능한 모델들이 많고, Windows를 통해 **'미터기 없는 지능(unmetered intelligence)'**을 제공할 기회가 있다고 봅니다. 새로운 기기와 함께 이런 역량을 새로운 세대로 가져오기 위해 생태계 전반과 협력하고 있습니다. 어떤 의미에서는 **작년의 프런티어 모델을 노트북에서, 지난 분기의 모델을 데스크톱에서** 돌릴 수 있게 되는 것입니다.", "en": "And of course we are also excited about Windows extending all of our infrastructure to the edge. We now have many capable models that run locally, and we really see the opportunity with Windows to deliver **unmetered intelligence**. We are working across the ecosystem to bring those capabilities to a new generation, with new devices. You can run, in some sense, **last year's frontier models on your laptop and last quarter's models on your desk**."}}, {"type": "term", "term": "Unmetered intelligence (local models)", "kr": {"ko": "미터기 없는 지능 — 내 PC에서 돌아가 쓸 때마다 요금이 붙지 않는 AI", "en": "AI that runs locally without per-use charges"}, "body": {"ko": "클라우드 AI는 보통 사용한 토큰(글자 조각) 양만큼 요금이 붙습니다. 택시 미터기처럼 쓸수록 돈이 올라가는 구조입니다. 반면 PC나 노트북의 칩에서 직접 실행되는 로컬 모델은 기기만 있으면 추가 사용료 없이 계속 쓸 수 있습니다.\n\nSatya는 Windows가 클라우드 인프라를 '엣지(사용자 기기)'까지 넓혀, 1년 전 최고 수준이던 모델을 노트북에서 돌리는 시대가 온다고 말합니다. 화면에는 로컬과 클라우드를 오가는 'Hybrid intelligence'가 표시되었고, 이는 뒤에 나오는 Judson 데모(Surface 노트북의 로컬 파일 활용)와도 이어집니다.", "en": "Cloud AI is billed per token like a taxi meter; local models on your device run without per-use fees. The slide showed 'Hybrid intelligence' spanning local and cloud, which Judson's demo later uses."}}, {"type": "say", "sp": "satya", "t": 1937, "text": {"ko": "또한 저희는 Azure의 컴퓨트, 스토리지, 네트워킹 기본 요소의 핵심을 다시 설계하고 있습니다. GitHub 이야기에서 말씀드린 것처럼, 에이전트 규모로 실행하고 연결하고 컨텍스트를 공유하기 위해서입니다. 그 위에 **1초도 안 돼 뜨는 마이크로 VM**이 있고, 그 위로 완전한 샌드박스 격리가 적용되며, 이 모든 것이 컨피덴셜 컴퓨팅(자막 불명확) 안에서 실행될 수 있습니다.\n\n그리고 그 앞에 **에이전트 그리드(agent grid)**를 둘 수 있는데, 이것은 네트워킹 제어에 ID와 정책을 입혀서 각 에이전트마다 무엇에 접근할 수 있는지, 어디에 연결할 수 있는지, 심지어 어떤 다른 에이전트와 통신할 수 있는지까지 통제할 수 있게 해 줍니다. 그리고 이런 맥락에서 로딩을 가속하는(자막 불명확 — 화면상 'Context cache') 기능까지 더해, 이제 이 모든 것을 AKS와 Foundry로 감싸서 차세대 애플리케이션을 만드는 데 필요한 에이전트 기본 요소를 모두 제공합니다.", "en": "And we are also re-architecting the core of compute, storage and networking primitives in Azure to execute, connect and share context at agent scale, as I talked about when it comes to GitHub. On top of this, you have these **micro-VMs that come up in less than a second**, with full sandbox isolation on top, and all of this can run in confidential computing (caption unclear).\n\nAnd you can put an **agent grid** in front of it, which brings identity and policy to networking controls, so with each agent you can control what it can access, where it can connect and, in fact, what other agents it can communicate with. And within this context, accelerating loading (caption unclear; slide shows 'Context cache'), you can now take all of this and wrap it into AKS and Foundry, giving you all of the agentic primitives for you to build your next generation of applications."}}, {"type": "term", "term": "MicroVM / Agent sandbox", "kr": {"ko": "마이크로 VM·에이전트 샌드박스 — 에이전트마다 순식간에 만들어지는 작은 격리된 컴퓨터", "en": "Tiny, fast-starting isolated machines for agents"}, "body": {"ko": "가상머신(VM)은 한 대의 물리 서버 안에 여러 대의 '가상 컴퓨터'를 만드는 기술이고, 마이크로 VM은 이를 아주 가볍게 만들어 1초 안에 켜지도록 한 것입니다. 샌드박스는 그 안에서 실행되는 프로그램이 바깥을 건드리지 못하게 막는 '모래 놀이터' 같은 격리 공간입니다.\n\n에이전트는 코드를 실행하고 파일을 다루므로, 각 에이전트를 자기만의 격리된 상자 안에서 돌려야 사고가 나도 피해가 번지지 않습니다. 화면의 'AI core' 그림에서는 Confidential AI > Agent sandbox > MicroVM(AI agents) 구조 옆에 Agent grid(네트워크 통제)와 Context cache가 배치되어 있었습니다.", "en": "Micro-VMs are lightweight virtual machines that boot in under a second; sandboxes isolate what runs inside. The 'AI core' slide showed Confidential AI > Agent sandbox > MicroVM, flanked by Agent grid and Context cache."}}, {"type": "say", "sp": "satya", "t": 2006, "text": {"ko": "하지만 데이터 계층도 다시 상상해야 합니다. 에이전트에게는 이런 속도와 규모를 따라가면서도, 모든 추론과 행동에 필요한 컨텍스트를 제공해 줄 수 있는 데이터베이스가 필요합니다. 그래서 저희는 초저지연, 확장 가능한 읽기, 내장 검색과 AI 기능을 갖춘 새로운 분산 관리형 SQL 데이터베이스 **HorizonDB**를 만들고 있습니다. 정말 놀랍게도 **8배 빠른 성능**을 냅니다. 그리고 오늘 **HorizonDB가 Azure에서 정식 출시(GA)**되었다는 소식을 전하게 되어 기쁩니다.", "en": "But also reimagining the data layer: agents need databases that can keep up with this speed and scale while giving them the context they need for all of the reasoning and actions. And that is why we are building **HorizonDB**, our new distributed managed SQL database with ultra-low latency, scalable reads, and built-in search and AI capabilities. It is just mind-boggling—**8x faster performance**—and today I'm excited to share that **HorizonDB is generally available in Azure**."}}, {"type": "say", "sp": "satya", "t": 2057, "text": {"ko": "그리고 다음 부분은 제가 아마 인생의 **25년** 동안 매달려 온 일인데요, 저희는 **HorizonDB 전체를 Fabric 안으로** 가져옵니다. 이는 에이전트 시대를 위한 **트랜잭션 데이터와 분석 데이터의 완전한 통합**을 의미합니다.\n\n잠시 이게 무슨 뜻인지 생각해 보십시오. 과거에는 트랜잭션 데이터베이스가 있고, 무슨 일이 일어나고 있는지 이해하기 위한 두 번째 분석 시스템이 따로 있었습니다. 이제 수백만 건의 거래를 처리하고 모든 구매를 기록하는 전자상거래 기업을 상상해 보십시오. 이 모든 것이 실시간으로 일어납니다. HorizonDB와 Fabric이 하나로 합쳐지면, 에이전트는 그 실시간 거래와 함께 **페타바이트 규모의 과거 기록**까지 실시간으로 추론할 수 있습니다.", "en": "And this next part is what I've been working on for, I think, **25 years** of my life, which is: we are bringing all of **HorizonDB into Fabric**. This represents the **complete unification of transactional and analytical data** for the agentic era.\n\nThink about what this means for a second. In the past you had your transactional databases, and you had a second set of analytical systems to understand what is happening. Now imagine an e-commerce business processing millions of transactions and recording every purchase, all happening obviously in real time. With HorizonDB and Fabric coming together, agents can reason over those live transactions along with **petabytes of historical records** in real time."}}, {"type": "shot", "t": 2100, "cap": {"ko": "Copilot에 '지금 내 비즈니스에 무슨 일이?'라고 묻자 만들어진 가상 소매기업 Contoso Retail의 실시간 대시보드. 주문 수, 매출, 결제 성공률, 실시간 거래 목록, 에이전트 인사이트가 한 화면에 보입니다(상단에 'Powered by Fabric IQ').", "en": "A live Contoso Retail dashboard Copilot built from 'What is happening in my business right now?'—orders, revenue, payment success, live transactions and agent insights."}, "img": "images/shot-12.jpg"}, {"type": "say", "sp": "satya", "t": 2106, "text": {"ko": "이제 Copilot에 가서 그냥 '지금 내 비즈니스에 무슨 일이 일어나고 있는지 알려줘'라고 말하기만 하면, Copilot이 여러분의 **실시간 기업 현황을 보여 주는 라이브 대시보드**를 만들어 줍니다. 저희가 20년 넘게 품어 온 이 비전이 마침내 하나로 모여, 여러분이 차세대 시스템을 만들 수 있게 되었다는 것이 정말 흥분됩니다.", "en": "And now you can just simply go to Copilot and tell it, 'Tell me what is happening in my business right now,' and Copilot can create a **live dashboard of your real-time enterprise**. So this is really exciting—this vision we had for 20+ years is now finally coming together, for you to be able to build the next generation of systems."}}, {"type": "beat", "t": 2133, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "term", "term": "HorizonDB (and Fabric HorizonDB)", "kr": {"ko": "HorizonDB — 에이전트 시대용 Azure의 새 분산 SQL 데이터베이스", "en": "Azure's new distributed managed SQL database"}, "body": {"ko": "키노트 설명에 따르면 HorizonDB는 초저지연, 확장 가능한 읽기, 내장 검색·AI 기능을 갖춘 새로운 분산 관리형 SQL 데이터베이스로, '8배 빠른 성능'을 내세웠고(화면 슬라이드는 자체 관리형 PostgreSQL 대비 비교) 이번에 Azure에서 GA되었습니다.\n\n여기에 더해 HorizonDB를 Fabric(Microsoft의 데이터 분석 플랫폼)에 통합한다고 발표했는데, 화면에는 'Fabric HorizonDB — Public preview'로 표시되었습니다. 즉 Azure의 HorizonDB는 GA, Fabric 통합판은 공개 미리보기 단계로 보입니다.", "en": "Per the keynote: a new distributed managed SQL database with ultra-low latency, scalable reads and built-in search/AI, '8x faster' (slide compares to self-managed PostgreSQL); GA in Azure. Fabric HorizonDB was shown as Public preview."}}, {"type": "term", "term": "Transactional vs. analytical data (OLTP vs. OLAP)", "kr": {"ko": "트랜잭션 데이터 vs 분석 데이터 — '지금 일어나는 거래'와 '쌓인 기록 분석'", "en": "Live transaction systems vs. analytics systems"}, "body": {"ko": "트랜잭션(OLTP) 시스템은 주문·결제처럼 매 순간 일어나는 거래를 빠르고 정확하게 기록하는 데이터베이스입니다. 분석(OLAP) 시스템은 그렇게 쌓인 데이터를 모아 '이번 달 지역별 매출은?' 같은 질문에 답하는 곳입니다. 가게로 치면 계산대 포스기와 월말 장부 분석의 차이입니다.\n\n지금까지 기업은 두 시스템을 따로 두고 데이터를 복사·이동(ETL)해야 해서, 분석은 늘 '어제 기준'이었습니다. Satya가 '25년의 꿈'이라 부른 HorizonDB와 Fabric의 결합은 이 둘을 하나로 묶어, 에이전트가 실시간 거래와 과거 기록을 동시에 보고 판단하게 하겠다는 것입니다.", "en": "OLTP records live transactions; OLAP analyzes accumulated data. Traditionally separate and synced via copying, so analytics lagged. HorizonDB in Fabric aims to unify them so agents reason over live and historical data together."}}, {"type": "say", "sp": "satya", "t": 2137, "text": {"ko": "이 모든 것의 밑바탕에는 놀라운 시스템과 혁신도 있습니다. 저희는 **이기종(heterogeneous) 플릿**, 즉 생태계 전반의 최고 혁신을 활용할 수 있는 플랫폼을 구축하고 있으며, 동시에 자체 하드웨어 시스템도 발전시키고 있습니다. 데이터센터, 서버, 실리콘을 모두 저희 워크로드에 맞춰 함께 설계하고 있습니다.\n\n그리고 저희는 막 **Maia 300**을 발표했는데, 와트당 **40% 더 많은 토큰**을 제공할 것입니다. 또 Azure Boost와 Azure Integrated HSM은 인프라와 보안 기능을 담당합니다(자막 불명확). 그리고 오늘, 최고 성능과 앞선 가격 대비 성능을 갖춘 차세대 VM(화면상 **Cobalt 200** VM)의 **정식 출시**를 발표하게 되어 매우 기쁩니다.", "en": "Underneath all of this is also unbelievable systems innovation. We are building a **heterogeneous fleet**, a platform where we are able to tap into the best innovation across the ecosystem, and we are also advancing our own hardware systems—co-designing the datacenter, the servers, the silicon, all mapping to our workloads. And we just announced **Maia 300**, which will deliver **40% more tokens per watt**. And Azure Boost and Azure Integrated HSM take on the infrastructure and security functions (caption unclear). And today we are very excited to announce the **general availability** of our next generation (on screen: **Cobalt 200** VMs), our highest performance with leading price-performance."}}, {"type": "shot", "t": 2165, "cap": {"ko": "'Purpose-built Azure silicon(목적에 맞게 설계한 Azure 실리콘)' 슬라이드. Maia 300(AI 가속기), Boost DPU, Integrated HSM, Cobalt 200(CPU) 네 가지 자체 칩이 나란히 소개됩니다.", "en": "'Purpose-built Azure silicon': Maia 300, Boost DPU, Integrated HSM and Cobalt 200."}, "img": "images/shot-13.jpg"}, {"type": "term", "term": "Tokens per watt / Maia 300", "kr": {"ko": "와트당 토큰 — 전기 1단위로 AI가 처리하는 글자 조각 수(전력 효율 지표)", "en": "AI output per unit of power"}, "body": {"ko": "토큰은 AI가 글을 읽고 쓰는 최소 단위(단어 조각)입니다. '와트당 토큰'은 같은 전기로 얼마나 많은 AI 작업을 해내는지를 뜻하는 효율 지표로, 전력이 데이터센터의 가장 큰 제약이 된 지금 핵심 숫자입니다.\n\nMaia 300은 Microsoft가 직접 설계한 AI 가속기 칩으로, 키노트에서는 '와트당 40% 더 많은 토큰'이 강조되었습니다. 같은 전력으로 40% 더 많은 AI 답변을 만들 수 있다는 뜻이라 비용과 지속가능성 모두와 연결됩니다.", "en": "Tokens are AI's text units; tokens per watt measures power efficiency. Maia 300 is Microsoft's own AI accelerator, claimed to deliver 40% more tokens per watt."}}, {"type": "term", "term": "HSM (Hardware Security Module)", "kr": {"ko": "하드웨어 보안 모듈 — 암호 키를 안전하게 보관·사용하는 전용 장치", "en": "Dedicated hardware for protecting cryptographic keys"}, "body": {"ko": "HSM은 암호화 키를 일반 메모리가 아닌 별도의 보안 칩 안에 보관하고, 키가 밖으로 새어 나가지 않은 채 암호화·서명을 처리하는 장치입니다. 은행 금고 안에서만 도장을 찍게 하는 것과 비슷합니다.\n\n'Azure Integrated HSM'은 이를 서버마다 내장해 보안 기능을 하드웨어 수준에서 처리한다는 의미이며, Azure Boost(DPU)는 네트워크·스토리지 같은 인프라 작업을 별도 칩으로 넘겨 서버 성능을 높이는 역할을 합니다.", "en": "An HSM keeps cryptographic keys inside a tamper-resistant chip. Azure Integrated HSM builds this into servers; Azure Boost offloads infrastructure work to a dedicated chip."}}, {"type": "section", "t": 2197, "title": {"ko": "Satya의 마무리: 유비쿼터스 지능의 시대와 프런티어 생태계의 약속", "en": "Satya's close: the era of ubiquitous intelligence"}, "lead": {"ko": "Satya가 지금까지 훑은 모든 계층을 한 문장으로 정리하고, 키노트의 세 키워드(인간의 야망, 지능, 신뢰)를 '프런티어 생태계의 약속'으로 묶는 짧은 맺음말입니다. 이어 무대를 Judson에게 넘기며, 이제부터는 이 비전이 실제로 어떻게 구현되는지 보여 주는 순서로 바뀝니다.", "en": "Satya sums up all the layers in one line and binds the keynote's three themes—human ambition, intelligence, trust—into 'the promise of the frontier ecosystem', then hands over to Judson for the 'bringing it to life' part."}}, {"type": "say", "sp": "satya", "t": 2197, "text": {"ko": "(박수에) 감사합니다. 자, 이것이 저희가 만들고 있는 모든 계층을 아주 빠르게 둘러본 것입니다. 앞으로 다가올 모든 것을 보면 분명한 것은, 우리가 **유비쿼터스 지능(ubiquitous intelligence)의 시대**에 들어서고 있다는 것입니다.\n\n저희에게 핵심 과제는 **인간의 야망이 중심에 남도록** 하고, 기업이 **자신의 지능을 스스로 통제**하도록 하며, 널리 확산되는 기술에 대한 **신뢰가 유지되도록** 하는 것입니다. 이것이 **프런티어 생태계의 약속**이며, 저희가 여러분과 함께 만들어 가는 데 집중하고 있는 것입니다.", "en": "Thank you so much for that. So that is just a very quick walk across all of the layers of what we are building. And when you look at all of what is coming, what is clear is we are entering an **era of ubiquitous intelligence**.\n\nThe key imperatives for us are to ensure that **human ambition remains central**, that firms **control their own intelligence**, and that **trust** in technology that gets broadly diffused is maintained. This is the **promise of the frontier ecosystem**, and that's what we are focused on building together with you."}}, {"type": "say", "sp": "satya", "t": 2242, "text": {"ko": "이제 이 모든 것을 가지고 저희가 어떻게 실현해 가고 있는지 보여 드릴 Judson에게 무대를 넘기겠습니다. 정말 감사합니다. 멋진 Ignite 보내십시오.", "en": "And now let me hand it over to Judson to take all of this and show you how we are bringing it to life. Thank you all very much, and have a fantastic Ignite."}}, {"type": "beat", "t": 2261, "text": {"ko": "(박수 속에 Satya 퇴장, Judson Althoff 등장)", "en": "(Applause; Satya exits and Judson Althoff takes the stage)"}}, {"type": "part", "t": 2260, "kicker": {"ko": "PART 2 · HUMAN AMBITION", "en": "PART 2 · HUMAN AMBITION"}, "title": {"ko": "사람의 야망을 키우는 Copilot", "en": "Copilot, a platform for human ambition"}, "text": {"ko": "Judson Althoff가 진행을 이어받아 첫 번째 축인 ‘사람의 야망’을 다룹니다. 본인의 실제 업무 시연, Copilot 제품 설명, 그리고 Chevron·BlackRock·Salesforce·Accenture 사례로 ‘Copilot 안에서 일이 끝난다’는 메시지를 보여 줍니다.", "en": "Judson Althoff takes over with the first pillar, human ambition: his own real work, the Copilot product tour, and Chevron, BlackRock, Salesforce and Accenture showing that work gets done inside Copilot."}}, {"type": "section", "t": 2263, "title": {"ko": "Judson의 출발점: 인간의 야망, 지능, 신뢰라는 세 가지 지속적 자산", "en": "Judson's frame: three durable assets—human ambition, intelligence, trust"}, "lead": {"ko": "Satya로부터 바통을 받은 Judson이 키노트 후반부 전체의 뼈대를 제시하는 대목입니다. 남은 순서는 '인간의 야망 → 지능 → 신뢰' 순으로 진행되며, 첫 주제인 인간의 야망을 Copilot과 연결하면서 'Claude나 ChatGPT로 할 수 있는 건 Copilot으로 더 잘, 더 싸게'라는 도발적인 경쟁 메시지를 던집니다.", "en": "Taking over from Satya, Judson lays out the structure for the rest of the keynote—human ambition, then intelligence, then trust—and opens with a pointed competitive claim: anything you can do in Claude or ChatGPT you can do better with Copilot, for less."}}, {"type": "say", "sp": "judson", "t": 2263, "text": {"ko": "좋은 아침입니다, 여러분. Ignite에 오신 것을 환영합니다. 이 아레나에서, 그리고 온라인으로 보고 계신 모든 분과 함께하게 되어 정말 기쁩니다. 오늘 아침 키노트의 나머지는 **프런티어 전환의 세 가지 지속적 자산**과 우리 모두 앞에 놓인 여정을 중심으로 진행됩니다. 바로 **인간의 야망, 지능, 그리고 신뢰**입니다.\n\n먼저 인간의 야망부터 시작하겠습니다. Microsoft Copilot은 **인간의 야망을 위한 플랫폼**입니다. 여러분의 모든 구성원에게 놀라운 일상적 AI 경험을 제공하고, 그 위에 최첨단 최고 모델을 활용한 고가치 경험을 제공합니다. 간단히 말해, **Claude나 ChatGPT로 할 수 있는 것은 무엇이든 Copilot으로 더 잘, 그리고 더 저렴하게** 할 수 있습니다.", "en": "Well, good morning everyone, and welcome to Ignite. It is awesome to be here with you in the arena and with everybody watching online. The rest of our keynote this morning is going to be anchored around these **three durable assets of frontier transformation** and the journey that lies ahead for all of us: **human ambition, intelligence and trust**.\n\nAnd we are going to start with human ambition. Microsoft Copilot is a **platform for human ambition**. It enables amazing everyday AI experiences for all of your people, and on top of that, high-value experiences using the best state-of-the-art models. Simply stated, **anything you can do in Claude or ChatGPT you can do better with Copilot, and for less**."}}, {"type": "say", "sp": "judson", "t": 2306, "text": {"ko": "제 커리어 초기부터 제 야망은 언제나 기술을 활용해 사람과 조직이 문제를 해결하도록 돕는 것이었습니다. 그래서 이 키노트를 시작하는 좋은 방법은 제가 **제 야망을 위해 Copilot을 어떻게 쓰는지** 보여 드리는 것이라고 생각했습니다.", "en": "My ambition, since the beginning of my career, has always been about helping people and organizations solve problems using technology. So I thought a great way to start off this keynote would be to show you **how I use Copilot to support my ambition**."}}, {"type": "section", "t": 2322, "title": {"ko": "Judson의 실제 일요일: Copilot으로 NRF 키노트 준비하기", "en": "Judson's real Sunday: preparing the NRF keynote with Copilot"}, "lead": {"ko": "Judson이 데모용이 아닌 자신의 실제 업무 환경(11월 8일 일요일)을 보여 주며 '인간의 야망'을 구체화하는 대목입니다. Today, 프로젝트, Work IQ와 하이브리드 지능, Copilot 안의 Office, Cowork, Autopilot 'Amelia', Workspace, Code까지 Copilot의 새 기능이 하나의 실제 업무 흐름으로 이어집니다. 마지막의 '2시간, 약 100달러'라는 비용 숫자가 앞서 말한 '더 잘, 더 싸게'의 근거로 제시됩니다.", "en": "Judson shows his real environment (Sunday, Nov 8) to make 'human ambition' concrete: Today, Projects, Work IQ and hybrid intelligence, Office inside Copilot, Cowork, Autopilot 'Amelia', Workspaces and Code, chained in one real workflow. The closing '2 hours, about $100' backs up his 'better and for less' claim."}}, {"type": "say", "sp": "judson", "t": 2322, "text": {"ko": "그러기 위해 몇 주 전 일요일, 정확히는 **11월 8일**로 돌아가 보겠습니다. 저는 이번 행사를 준비하고 고객들을 만나느라 정말 바빴고, 솔직히 말하면 Ignite와 관련 없는 이메일과 Teams 메시지 처리가 조금 밀려 있었습니다.\n\n저는 지금 Copilot 안의 멋진 새 기능인 **Microsoft Today**에 들어와 있습니다. Outlook 화면과 Copilot 앱 양쪽에 모두 나타납니다. Today의 멋진 점은 제 받은편지함 전체와 모든 메시지를 훑어서 **가장 중요한 것을 보여 준다**는 것입니다.", "en": "To do that, let me take you back a couple of Sundays ago, very specifically **November 8th**. I've been super busy preparing for this event, meeting with customers, and let's just say a little bit behind on my emails and the Teams messages I've been getting outside of the context of Ignite.\n\nI'm in **Microsoft Today**, which is an awesome new feature inside Copilot. It appears both in the Outlook canvas as well as in the Copilot app. The cool thing about Today is that it scans my entire email inbox, all of my messages, and **shows me what is most important**."}}, {"type": "say", "sp": "judson", "t": 2357, "text": {"ko": "많은 부분이 가려지고 회색 처리된 게 보이실 텐데, 이건 데모가 아니라 **제 실제 환경**이라서 몇 가지를 가려야 했기 때문입니다. 여기 보시면 Today가 제 비서실장 Caroline Sanderson의 이메일을 띄워 주었습니다. 1월에 제가 **리테일 업계 최대 행사(NRF)의 메인 키노트**를 맡게 됐다는 사실을 상기시키는 내용입니다.\n\n그런데 저는 아직 준비를 전혀 못 했습니다. 그래서 이번 행사 준비로 아주 바쁜 제 팀을 귀찮게 하지 않고, Copilot에 들어가서 직접 준비를 시작해 보려고 합니다.", "en": "You see a lot of things redacted and grayed out—that's because this is **my real environment** and not a demo, so we have to hide a few things. But here you see that Today has surfaced this email from my Chief of Staff, Caroline Sanderson. It is calling to my attention that in January I have the **lead keynote at retail's biggest show**.\n\nAnd I really haven't done anything to prepare for it yet, so I'm going to go into Copilot and actually get started on some preparation without bothering my team, because they are super busy working on this event."}}, {"type": "term", "term": "Microsoft Today", "kr": {"ko": "Microsoft Today — 받은편지함과 메시지를 훑어 중요한 것만 골라 주는 Copilot 새 기능", "en": "New Copilot feature that surfaces what matters from your inbox"}, "body": {"ko": "키노트 설명에 따르면 Today는 Copilot 안의 새 기능으로, Outlook 화면과 Copilot 앱 양쪽에서 나타납니다. 이메일 받은편지함 전체와 메시지를 스캔해 지금 가장 중요한 항목을 'Today Feed'로 보여 줍니다.\n\n데모에서는 수많은 메일 가운데 '1월 NRF 메인 키노트가 확정됐다'는 비서실장의 메일을 골라 띄웠고, 이것이 이후 모든 준비 작업의 출발점이 됩니다. 비서가 아침마다 '오늘 꼭 보셔야 할 것'을 추려 주는 역할에 가깝습니다.", "en": "Per the keynote, Today scans your inbox and messages and shows what matters most, in Outlook and the Copilot app. Here it surfaced the NRF keynote email that kicked off the demo."}}, {"type": "term", "term": "NRF (Retail's Big Show)", "kr": {"ko": "NRF — 미국소매협회가 매년 1월 뉴욕에서 여는 세계 최대 리테일 행사", "en": "National Retail Federation's annual 'Big Show'"}, "body": {"ko": "NRF는 미국소매협회(National Retail Federation)이며, 매년 1월 뉴욕에서 'Retail's Big Show'라는 세계 최대 규모의 유통·리테일 컨퍼런스를 엽니다. 화면에는 'NRF 2027: Retail's Big Show, 2027년 1월 10–12일, 뉴욕'으로 표시되었습니다.\n\nJudson은 이 행사의 메인 키노트를 맡게 되었고, 데모 전체가 그 준비 과정을 Copilot으로 해내는 이야기입니다.", "en": "The National Retail Federation's January show in New York (NRF 2027: Jan 10–12, 2027). Judson's demo is about preparing his keynote there."}}, {"type": "say", "sp": "judson", "t": 2394, "text": {"ko": "그래서 Copilot에 들어가 **프로젝트**를 하나 만들었습니다. 프로젝트는 정말 멋진데, 내 비즈니스와 대화하고 고급 작업에는 **Cowork**를 쓸 수 있게 해 주기 때문입니다. 일을 처리하는 데 필요한 모든 모델을 쓸 수 있습니다. 보시면 간단한 프롬프트로 시작했습니다. 여기 보시면 저는 기본적으로 '무슨 일이 일어나고 있는지, 그리고 어떤 주제가 화제가 될지 알려 줘'라고 했습니다.\n\n아래로 스크롤하면 Copilot이 정말 멋진 일들을 해 놓은 걸 볼 수 있습니다. 먼저 제 **Work IQ** 전체와 모든 외부 정보를 훑었고, 제 Surface Laptop Ultra에서 **하이브리드 지능(hybrid intelligence)**을 사용했습니다. 즉 제 기기에 로컬로 있는 콘텐츠까지 끌어온 겁니다. 행사에서 연설하게 된다는 걸 알기 전에 다운로드해 둔 연사 가이드(자막상 'speaker mounts')였죠.", "en": "So I went to Copilot and I created a **project**. Projects are super cool because they allow you to chat with your business and use **Cowork** for advanced tasks. I can use all the models I need to get work done. You will see that I kicked things off with a simple prompt. If you look here, I said basically, tell me what is going on and what the hot topics are going to be.\n\nIf you scroll down, you can see that Copilot has done some really cool things here. First, it has scanned all of my **Work IQ**, all the external information, and it has used **hybrid intelligence** on my Surface Laptop Ultra, which means it is pulling in content that is local to my device—my speaker guidance (caption: 'speaker mounts') that I downloaded before finding out I was speaking at the event."}}, {"type": "term", "term": "Work IQ & hybrid intelligence", "kr": {"ko": "Work IQ — 내 메일·회의·문서 등 업무 맥락 / 하이브리드 지능 — 클라우드와 내 기기를 함께 쓰는 AI", "en": "Your work context + AI spanning cloud and device"}, "body": {"ko": "Work IQ는 앞서 Satya가 설명한 'IQ' 계층 중 하나로, 내 이메일·회의·채팅·문서 등 Microsoft 365 안의 업무 맥락을 Copilot이 이해하도록 해 주는 지식 기반입니다. 같은 질문이라도 '나의' 상황에 맞는 답을 내게 해 줍니다.\n\n하이브리드 지능은 클라우드 모델과 내 PC(여기서는 Surface Laptop Ultra)의 로컬 처리를 함께 쓰는 방식입니다. 데모 화면에는 'Using Hybrid Intelligence — Checking NRF-related files on this PC'라는 단계가 표시되어, 클라우드에 올리지 않은 내 노트북 속 PDF까지 참고했음을 보여 줍니다.", "en": "Work IQ is your Microsoft 365 work context (mail, meetings, files). Hybrid intelligence combines cloud models with on-device processing—here it read a PDF stored only on Judson's laptop."}}, {"type": "say", "sp": "judson", "t": 2446, "text": {"ko": "그렇게 해서 Copilot은 훌륭한 개요를 정리해 냈습니다. **일곱 가지 큰 주제**가 있다고 하는데, 에이전트 커머스부터 오프라인 매장 경험의 귀환, 공급망과 지속가능성까지 다양합니다.\n\n그래서 저는 Copilot과 대화하며 추가로 요청했습니다. 'Copilot, Ignite가 이 행사보다 두 달 앞서 있으니, NRF의 일곱 가지 주제를 여기 Ignite의 **세 가지 축(stanza)**에 연결하면 좋지 않을까?' Copilot은 가서 아주 훌륭한 개요를 만들어 줍니다.", "en": "What it has done is it has pulled together a great synopsis. It says there are **seven big topics**, ranging from agentic commerce to the return of the physical store experience, and supply chain and sustainability.\n\nSo I chat with Copilot and further prompt: Copilot, given that Ignite is two months prior to this, wouldn't it be great if we took the seven topics at NRF and mapped them to the **three stanzas** here at Ignite? Copilot goes off and creates an awesome outline for me."}}, {"type": "say", "sp": "judson", "t": 2482, "text": {"ko": "멋진 점은 **Office가 Copilot 안에 내장**되어 있다는 겁니다. 이건 사이드바가 아니라 **완전한 Office**입니다. 민감도 레이블이 그대로 적용되고, 리본 메뉴와 변경 내용 추적 기능도 다 보이실 겁니다. Dynamics 365 공급망 관련 소식도 들어 있네요. 정말 좋습니다.\n\n이건 닫고, 이제 좀 더 풍부한 작업을 열어서 Copilot **Cowork**로 한 단계 더 나아가 보겠습니다. 여기 제가 한 요청을 보시면 좀 더 탄탄합니다. '지금 무슨 일이 일어나고 있는지, 사람들이 왜 리테일 경험을 사랑하는지, 리테일러(머천트)의 기술이란 무엇인지 더 알려 주고, Word로 스토리를 만들고, Ignite가 끝나면 키노트 준비를 시작할 수 있게 팀과 공유할 프레젠테이션을 만들고, NRF에 참석하는 주요 고객과 그들이 Microsoft와 무엇을 하고 있는지 보여 주는 추적 문서도 만들어 줘.' 콘텐츠를 전달할 때 상황에 유연하게 대응하고 싶기 때문입니다.", "en": "The cool thing about this is **Office is embedded in Copilot**. This is not a sidebar—this is the **full-blown Office**. You can see all the sensitivity labeling carrying through, my ribbons and the ability to track changes. It has some news around Dynamics 365 Supply Chain. That is really cool.\n\nI can close that out, and then actually open up a richer body of work and use Copilot **Cowork** to take this a bit further. You can see the prompt I asked here; it is a bit more robust: tell me more about what is happening, why people love retail experiences, what the merchant's craft is all about, and build me a story using Word, a presentation I can share with my team once we get done with Ignite so we can get started on keynote prep, as well as a tracking document that shows me the top customers attending NRF and what they are doing with Microsoft—because we want to stay situationally fluid as we deliver the content."}}, {"type": "term", "term": "Copilot Cowork", "kr": {"ko": "Cowork — 여러 단계의 복잡한 작업을 맡아 문서·자료까지 만들어 내는 Copilot의 작업 모드", "en": "Copilot's mode for multi-step, deliverable-producing work"}, "body": {"ko": "키노트 설명에 따르면 Cowork는 프로젝트 안에서 '고급 작업'에 쓰는 Copilot 모드로, 일반 채팅처럼 답만 하는 것이 아니라 여러 하위 작업을 동시에 처리하고 각 작업에 가장 적합한 모델을 골라 Word 문서, PowerPoint, Excel 같은 결과물을 직접 만들어 냅니다.\n\n데모에서 Judson의 한 번의 요청으로 Cowork는 Word 스토리보드, PowerPoint 초안, Excel 고객 추적표를 함께 만들었습니다. 화면에는 '백그라운드 작업 6분 3초' 같은 진행 기록도 보였습니다.", "en": "Per the keynote, Cowork handles advanced, multi-step tasks, picking the best model per subtask and producing Word, PowerPoint and Excel deliverables—here from a single prompt."}}, {"type": "say", "sp": "judson", "t": 2539, "text": {"ko": "이것이 Copilot이 만들어 준 결과입니다. 여러 작업을 동시에 처리했고, 각 작업에 가장 적합하다고 판단한 모델을 사용해 **가장 효율적인 방식으로 훌륭한 결과물**을 만들어 냈습니다. 만들어 준 PowerPoint 프레젠테이션을 보실 수 있는데, 다시 말하지만 이건 진짜 PowerPoint라서 제 마음대로 편집할 수 있습니다.\n\n만들어 준 풍부한 스토리보드도 보실 수 있는데, 여기서 인간의 야망을 끌어내자는 제 생각, 즉 사람들이 왜 리테일을 사랑하는지, 이 리테일 경험 전체에서 머천트의 기술이란 무엇인지를 잘 잡아냈습니다. 그리고 키노트를 어떻게 진행할지 **분 단위 개요**까지 주는데, 이걸 팀과 공유할 수 있습니다.", "en": "Here's what it built for me. It multitasked; it used the models it felt were best for each task, producing **great work in the most efficient way**. You can see the PowerPoint presentation it built for me—again, this is PowerPoint; I can edit this document to my liking.\n\nYou can see the rich storyboard that it built, and it picked up on my notion to pull out the human ambition here: why people love retail, what is the merchant's craft in this whole retail experience. And it is giving me a **minute-by-minute outline** on how to run the keynote that I can share with my team."}}, {"type": "shot", "t": 2550, "cap": {"ko": "Copilot 안에 그대로 열린 PowerPoint. Cowork가 만든 NRF 2027 키노트 초안 첫 장('Your intelligence. Your advantage.')이 보이며, 왼쪽에는 프로젝트와 Amelia 등 Copilot 메뉴가 함께 있습니다.", "en": "Full PowerPoint inside Copilot showing the Cowork-built NRF 2027 keynote draft ('Your intelligence. Your advantage.')."}, "img": "images/shot-14.jpg"}, {"type": "say", "sp": "judson", "t": 2580, "text": {"ko": "그 맥락을 팀에게 주는 게 정말 강력합니다. 보통이라면 제 머릿속 아이디어를 꺼내서 행사의 맥락에 맞추느라 **회의에 회의를 거듭**해야 했을 테니까요. 그래서 이건 정말 큰 도움이 됩니다.\n\n마지막으로 Excel로 이 고객 추적표를 정리해 줬습니다. 역시 일부는 가려져 있지만, 저희가 이 고객들과 무엇을 하고 있는지, 그리고 저희에게 얼마나 중요한 고객인지를 정리해 줍니다. 아주 좋습니다.", "en": "And that context for them is so powerful, because normally we would have to spend **meeting after meeting** to get those ideas out of my head and into the context of the show. So this is super beneficial.\n\nLastly, it has pulled together this customer tracker in Excel—again some things are redacted—pulling together what we do with these customers and how important they are to us as customers. So, fantastic."}}, {"type": "say", "sp": "judson", "t": 2598, "text": {"ko": "마지막으로 하나 더 Copilot Cowork에 요청한 게 있는데, 이 멋진 스토리보드를 **Code를 이용해 3D 모델**로 바꾸는 것이었습니다. 그건 나중에 다시 와서 어떻게 됐는지 보여 드리겠습니다.\n\n그 사이에 이 일에 생명을 불어넣고 싶습니다. 프로젝트가 계속 굴러가게 하고 싶은 거죠. 그래서 제 **Autopilot**을 불러옵니다. 제 Autopilot **Amelia**입니다.", "en": "There's one last thing I asked Copilot Cowork to go do, and that is to take this awesome storyboard and turn it into a **3D model using Code**, and I will come back to that and show you what it did.\n\nBut meanwhile, I want to breathe life into this thing. I want to keep the project going in an ongoing way. To do that, I bring in my **Autopilot**—my Autopilot, **Amelia**."}}, {"type": "say", "sp": "judson", "t": 2622, "text": {"ko": "Amelia는 저를 위해 정말 멋진 일들을 할 겁니다. **두 가지 큰 업무를 지속적으로** 맡게 되는데요, 하나는 시장에서 일어나는 모든 일과 제 고객에게 가장 중요한 것으로 스프레드시트를 계속 최신 상태로 유지하는 것이고, 또 하나는 제 모든 제품 회의에 참석하는 것입니다. 제 일의 큰 부분이 제품의 속도를 조율하고 로드맵을 검토하는 것이거든요.\n\nAmelia는 저희가 작업 중인 모든 것을 추적하고, 1월 NRF에서 무엇을 발표하는 게 가장 좋을지 이해하도록 도와줄 겁니다. 그리고 이 모든 작업 내용을 제 팀의 나머지 사람들에게도 알려 줄 겁니다.", "en": "And Amelia is going to do some really cool things for me. She's going to do **two major bodies of work on an ongoing basis**: she's going to keep the spreadsheet up to date with everything that is happening in the market and what is most important to my customers, and she's also going to attend all of my product meetings—a big part of my job is pacemaking our products and working through roadmaps.\n\nAmelia is going to keep track of everything we are working on and help me understand what is best to present at NRF in January. She's going to inform the rest of my team about all of this work."}}, {"type": "say", "sp": "judson", "t": 2662, "text": {"ko": "그 간단한 프롬프트 하나로 Amelia는 스스로 **루틴(routine)**을 만들어 냅니다. 이 일을 지속적으로 해 나갈 겁니다. Amelia는 저만을 위해 일하는 게 아닙니다. **Teams 안에서도 일할 수 있습니다.** 제가 만든 기획 채널이 보이실 텐데, Amelia가 팀에게 자신이 할 세 가지 일을 알렸습니다.\n\n그리고 정말 멋진 건, Copilot에서 Teams의 이 NRF 기획 채널과 연결되는 **Workspace**를 만들 수 있다는 겁니다. 그러면 Autopilot과 제 사람들이 함께 일하게 됩니다. 제 Autopilot Amelia, 그리고 제 팀원들의 Autopilot들이 함께 이 콘텐츠를 다듬어 갈 수 있습니다. 이 모든 걸 **일요일에, 아무도 귀찮게 하지 않고** 혼자서 하고 있는 겁니다. Ignite가 끝나면 팀이 바로 시작할 수 있도록 준비해 두는 거죠.", "en": "With that simple prompt, Amelia is going off and creating **routines** for herself; she will do this on an ongoing basis. Amelia doesn't just work for me—**she can work in Teams**. You can see the planning channel I have created; she told the team the three things she's going to go do.\n\nAnd what's really cool is, in Copilot I can set up a **Workspace** that maps to this NRF planning channel in Teams. And the really cool thing is I've got Autopilots and my people working together—my Autopilot Amelia, my teammates' Autopilots—and they can work on curating this content. This is all **on a Sunday, not bothering anybody**, me working on my own to prepare the team for once we get done with Ignite."}}, {"type": "term", "term": "Autopilot (Amelia)", "kr": {"ko": "Autopilot — 정해진 업무를 루틴으로 만들어 지속적으로 수행하는 개인 AI 에이전트", "en": "A persistent personal agent that runs ongoing routines"}, "body": {"ko": "키노트 설명에 따르면 Autopilot은 한 번 묻고 끝나는 채팅이 아니라, 맡긴 일을 '루틴'(예: 매주 일요일 오전 9시 고객표 갱신, 평일 오후 5시 회의 정리)으로 스스로 설정해 계속 수행하는 개인 에이전트입니다. Judson은 자신의 Autopilot에 'Amelia'라는 이름을 붙였습니다.\n\nAutopilot은 Teams 채널에 들어가 팀에 공지할 수도 있고, Workspace를 통해 다른 팀원의 Autopilot들과 함께 작업할 수도 있습니다. 사람 비서에게 '앞으로 이 일은 계속 챙겨 줘'라고 맡기는 것에 가깝습니다.", "en": "Per the keynote, Autopilot is a personal agent that sets up recurring routines to keep doing assigned work, posts in Teams channels, and collaborates with teammates' Autopilots via Workspaces. Judson's is named Amelia."}}, {"type": "say", "sp": "judson", "t": 2707, "text": {"ko": "이제 Copilot이 만들어 준 마크다운 파일을 가져가겠습니다. 보시면 '이 마크다운 파일을 바탕으로 **3D 데모를 만들어 줘**'라는 간단한 프롬프트를 줬습니다. 색상과 글꼴, 배경에 대해 두어 가지 힌트를 주고 제 마음에 들게 만들어 달라고 했죠.\n\n여기 데모가 있습니다. 꽤 멋지죠. 리테일 경험 속에서 **인간의 야망**이 어떻게 살아나는지에 대한 이야기가 있고, 그 뒤에 있는 **지능**, 즉 데이터 소스, 리테일러 고유의 자산과 IQ, 쇼핑 에이전트, 물류 에이전트가 있습니다. 그리고 리테일러가 이 자산들을 관리하고, 거버넌스하고, 보호하고, 비즈니스 가치를 얻도록 해 주는 **신뢰 플랫폼**이 있고, 이 세 계층이 모두 하나로 합쳐집니다.", "en": "So I'm going to take that markdown file that Copilot built for me, and you can see I gave it a simple prompt: **build me a 3D demo** based on the markdown file. I gave it a couple of cues about the colors and the font and background, and to make it to my delight.\n\nAnd you can see the demo here—pretty cool. Here is the story about how **human ambition** comes to life in the retail experience. Here's the **intelligence** behind it—the data sources, the things that belong to the retailer, their unique IQ, the shopping agents, logistics agents—and the **trust** platform that enables the retailer to manage, govern, secure and get business value out of these assets, and all three layers coming together."}}, {"type": "shot", "t": 2730, "cap": {"ko": "Code로 만든 3D 데모 'Agentic commerce'. 인간의 야망(Copilot)·지능(Microsoft IQ)·신뢰(Agent 365) 세 계층으로 가상의 고객 Maya와 Contoso Retail의 쇼핑 경험을 입체 모형으로 보여 줍니다.", "en": "The 3D 'Agentic commerce' demo built with Code: human ambition (Copilot), intelligence (Microsoft IQ), trust (Agent 365), told through shopper Maya and Contoso Retail."}, "img": "images/shot-15.jpg"}, {"type": "say", "sp": "judson", "t": 2754, "text": {"ko": "이 데모의 정말 멋진 점은, 제가 **코드 한 줄도 쓰지 않았지만 그 뒤에는 진짜 코드**가 있다는 겁니다. 이 파일(자막상 'job description file')을 제 전문가들에게 넘기면, 그들이 이걸 Copilot과 데이터베이스(자막 불명확)에 넣어 바로 작업을 시작할 수 있습니다.\n\n다시 말하지만, 이 모든 것의 멋진 점은 일요일에 팀을 귀찮게 하지 않고 해냈다는 겁니다. 저는 몇 시간을 썼고, 제 사용량을 추적했습니다. 여기 보시면 그 일요일에 저는 **약 10,000 크레딧, 금액으로 약 100달러**를 썼습니다.", "en": "The really cool thing about this demo is, even though **I didn't write a line of code, there is real code behind it**. I can hand this file (caption: 'job description file') to my professionals, and they can drop it into Copilot and databases (caption unclear) and hit the ground running.\n\nAgain, the awesome thing with all of this: I did it without bothering my team on a Sunday. I spent a couple hours doing it, and I tracked my usage. If you look here, you can see on that Sunday I spent **about 10,000 credits, worth about $100**."}}, {"type": "shot", "t": 2785, "cap": {"ko": "Copilot 사용량 화면. 11월 4일~10일 일별 크레딧 사용 그래프에서 Judson이 작업한 일요일(11월 8일)에 약 10,000 크레딧으로 사용량이 크게 튄 것이 보입니다.", "en": "Copilot usage panel: daily credits for Nov 4–10, with the Sunday (Nov 8) spike of about 10,000 credits."}, "img": "images/shot-16.jpg"}, {"type": "term", "term": "Credits and tokens (AI usage cost)", "kr": {"ko": "크레딧·토큰 — AI 사용량을 재고 과금하는 단위", "en": "Units for metering and billing AI usage"}, "body": {"ko": "토큰은 AI 모델이 읽고 쓰는 텍스트의 최소 단위이고, 모델 사용 비용은 대개 처리한 토큰 수에 따라 매겨집니다. 크레딧은 여러 모델·기능의 사용량을 하나의 화폐처럼 묶어 보여 주는 내부 단위입니다.\n\nJudson의 설명에 따르면 그날 2시간 작업에 약 10,000 크레딧, 즉 약 100달러가 들었고, Copilot은 작업마다 필요한 모델만 골라 써서 비용을 최적화했습니다. 앞서 말한 'Claude나 ChatGPT보다 더 잘, 더 싸게'라는 주장을 실제 숫자로 뒷받침하려는 장면입니다.", "en": "Tokens are text units AI models process and bill by; credits bundle usage into one currency. Judson's 2 hours cost ~10,000 credits (~$100), offered as proof of 'better and for less'."}}, {"type": "say", "sp": "judson", "t": 2785, "text": {"ko": "**제 시간 2시간, 토큰 값 100달러.** Copilot은 필요한 모델만 사용해서 경험을 최적화했고, 제 팀은 제가 귀찮게 하지 않아도 NRF 준비를 바로 시작할 수 있게 됐습니다. 이것이 Copilot이 **제 야망에 힘을 실어 주는 방식**입니다.\n\nCopilot이 여러분의 야망에 어떻게 힘을 실어 줄 수 있는지 더 듣기 위해, 무대로 모시겠습니다 Copilot 총괄 부사장(EVP), **Jacob Andreou**입니다.", "en": "**Two hours of my time, $100 worth of tokens**, Copilot using only the models it needed, optimizing the experience, and my team hits the ground running for NRF without me bothering them. That is how Copilot **empowers my ambition**.\n\nTo hear more about how Copilot can empower your ambition, please join me in welcoming to the stage the Executive Vice President of Copilot, **Jacob Andreou**."}}, {"type": "beat", "t": 2804, "text": {"ko": "(Judson이 Copilot 담당 EVP Jacob Andreou를 무대로 소개 — 다음 순서로 이어짐)", "en": "(Judson introduces Jacob Andreou, EVP of Copilot—continues in the next part)"}}, {"type": "section", "t": 2815, "title": {"ko": "Copilot 안으로 들어온 Home·Office·Code", "en": "Home, Office and Code inside Copilot"}, "lead": {"ko": "Judson의 시연 직후, Copilot 제품 총괄 Jacob Andreou가 방금 본 장면이 특별 빌드가 아니라 지금 쓰는 실제 제품임을 강조하며 구성 요소를 하나씩 풀어 줍니다. 채팅과 Cowork를 한 입력창으로 묶은 Home, Copilot 안에 통째로 들어온 Word·Excel·PowerPoint, 말로 앱을 만드는 Code가 핵심입니다. ‘구독에 포함되어 추가 과금이 없다’는 메시지가 이후 비용 이야기의 복선입니다.", "en": "Right after Judson's demo, Copilot chief Jacob Andreou stresses that what we saw was not a special build but the shipping product, and unpacks its parts: Home (chat + Cowork in one composer), the full Word/Excel/PowerPoint inside Copilot, and Code for building apps by description. The 'included in your subscription, no meter' message sets up the cost discussion that follows."}}, {"type": "beat", "t": 2815, "text": {"ko": "(Jacob Andreou 등장, 박수)", "en": "(Jacob Andreou walks on, applause)"}}, {"type": "say", "sp": "jacob", "t": 2815, "text": {"ko": "감사합니다. 고마워요, Judson.\n\n방금 보신 것에서 정말 멋진 점은, 그게 **특별히 만든 빌드가 아니었다**는 겁니다. 지금 저희가 실제로 Copilot에서 일하는 방식이 바로 그렇습니다. 그리고 그가 하지 않아도 됐던 것들을 눈여겨보셨을 겁니다. 코드를 짜려고 개발자 도구로 넘어가지도 않았고, 다섯 개의 서로 다른 애플리케이션을 오가지도 않았습니다. **모든 걸 Copilot 안에서** 해냈죠. 방금 보신 것 중 상당수는 이미 여러분 직원들의 손에 있고, 일부는 곧 나옵니다.", "en": "Thank you. Thanks, Judson.\n\nWhat is so cool about what you just saw is that **wasn't a special build** — this is how we are getting our work done in Copilot right now. And you'll notice what he didn't have to do: he didn't jump into developer tools to write code, he didn't jump between five different applications, he did **everything right in Copilot**. Now, a ton of what you just saw is already in your people's hands, and some of it is coming soon."}}, {"type": "say", "sp": "jacob", "t": 2843, "text": {"ko": "Home부터 시작하겠습니다. Home은 **채팅과 Cowork가 하나의 입력창(composer)에서 만나는 곳**입니다. 그래서 간단한 질문이 있든, 프로젝트 하나를 통째로 시작하든, Home이 완벽한 출발점이 됩니다.", "en": "Let's start with Home. Home is where **chat and Cowork come together in a single composer**. This means that whether you have a quick question or you're kicking off an entire project, Home is the perfect starting point."}}, {"type": "say", "sp": "jacob", "t": 2861, "text": {"ko": "Office도 보셨죠. Anthropic과 OpenAI가 문서, 슬라이드, 스프레드시트를 받아들이는 걸 우리 모두 봤습니다. 하지만 단순화된 뷰어와 편집기는 기능과 협업 면에서 타협을 강요합니다. 실제 업무에는 둘 다 필요합니다.\n\n지식 노동은 이미 Word, Excel, PowerPoint 안에서 이뤄지고 있습니다. 여러분 팀이 이미 협업하고 있는 곳이죠. 그래서 저희는 **Word, Excel, PowerPoint의 전체 기능을 Copilot 안으로 직접** 가져왔습니다.", "en": "And you also saw Office. We have all seen Anthropic and OpenAI embrace documents, slides and spreadsheets. But simplified viewers and editors force compromise on power and collaboration. Real work needs both.\n\nKnowledge work already lives in Word, Excel and PowerPoint. It is where your team is already collaborating, and that is why we brought **the full functionality of Word, Excel and PowerPoint directly into Copilot**."}}, {"type": "say", "sp": "jacob", "t": 2898, "text": {"ko": "즉, **AI와 팀원과 동시에 협업**할 수 있다는 뜻입니다. Word의 변경 내용 추적도 되고, Excel의 진짜 고급 수식도 되고, 물론 팀원을 멘션해서 불러들일 수도 있습니다.\n\n그러니 팀 전체가 워크플로를 뒤엎을 필요도, 쓰던 앱을 바꿀 필요도 없습니다. 그리고 모든 파일은 **보안 레이블과 컴플라이언스 정책이 그대로 유지된 채 여러분의 테넌트 안에** 저장됩니다.", "en": "This means you can **collaborate with AI and your team at the exact same time**. This includes track changes in Word, it includes real advanced formulas in Excel, and of course the ability to mention a teammate to bring them in.\n\nThis means your whole team doesn't have to blow up the workflow, doesn't have to switch the app they are using, and all the files stay **at rest in your tenant with security labels and compliance policies fully intact**."}}, {"type": "say", "sp": "jacob", "t": 2923, "text": {"ko": "가장 좋은 점은, **Copilot 안의 Office 전부가 Copilot 구독에 포함**되어 있다는 겁니다. 즉 Copilot은 **미터기를 돌리지 않고(추가 사용량 과금 없이)** PowerPoint 프레젠테이션 초안을 만들 수 있는 유일한 방법입니다.", "en": "The best part is **all of Office in Copilot is included in your Copilot subscription**. That means Copilot is the only way to draft a PowerPoint presentation **without hitting a meter**."}}, {"type": "say", "sp": "jacob", "t": 2943, "text": {"ko": "Judson이 Code를 쓰는 것도 보셨죠. Code는 누구나 **만들고 싶은 것을 자기 말로 설명**할 수 있게 해 줍니다. 트래커든, 앱이든, 대시보드든 Copilot이 가장 좋은 방식을 골라 **완전히 작동하는 앱**을 만들어 줍니다. Code는 완전히 샌드박스 처리되어 있어서 로컬에서 돌리거나, 기본적으로 여러분 테넌트 안에서 안전하게 호스팅됩니다. 호스팅과 공유가 **Word 문서를 공유하는 것만큼 쉬워집니다.**\n\n그런데 이 모든 혁신도 대규모 환경에서 제대로 버티지 못하면 의미가 없습니다. 그리고 Chevron만 한 규모를 가진 곳은 많지 않죠. 그래서 Chevron이 일하는 방식을 어떻게 바꾸고 있는지 보여 주실 Ryder Booth를 모시겠습니다.", "en": "You also saw Judson use Code. Code allows anyone to **describe what they want to build in their own words**. Copilot picks the best approach — whether it is a tracker, an app or a dashboard — and builds a **full working app**. Code is fully sandboxed, running locally or hosted securely in your tenant by default. It makes hosting and sharing **as easy as sharing a Word document**.\n\nNow, none of this innovation matters unless it really holds up at scale. And few operate at the scale of Chevron, so I would like to welcome Ryder Booth to show us how Chevron is transforming its work."}}, {"type": "section", "t": 2983, "title": {"ko": "Chevron의 설계 기준서, 몇 달에서 몇 분으로", "en": "Chevron's basis of design: from months to minutes"}, "lead": {"ko": "Copilot이 ‘대규모 실무’에서도 통하는지 보여 주는 첫 고객 사례입니다. Chevron CTO Ryder Booth가 Cowork, Work IQ, Fabric IQ로 엔지니어링 설계 기준서(Basis of Design)를 만들고, 재사용 스킬로 바꿔 Teams에 공유하는 전 과정을 시연합니다. 마지막에 Judson이 ‘그래서 비용은?’이라고 묻는 장면이 다음 섹션(비용 관리)으로 이어지는 연결고리입니다.", "en": "The first customer proof that Copilot holds up at enterprise scale. Chevron CTO Ryder Booth uses Cowork, Work IQ and Fabric IQ to build an engineering basis of design, turns it into a reusable skill and posts it to Teams. Judson's 'what did it cost?' question bridges into the cost-control segment."}}, {"type": "say", "sp": "ryder", "t": 2983, "text": {"ko": "고마워요, Jacob. Chevron에서는 **인류의 진보를 가능하게 하는 것**이 저희의 목적입니다(자막 일부 불명확). 사회는 저희가 안정적이고 저렴한 에너지를 공급하기를, 그리고 그 과정에서 사람과 환경을 보호하기를 기대합니다.\n\n이를 실현하는 방법 중 하나가 엔지니어링 **설계 기준서(basis of design)**입니다. 저희 엔지니어들이 안전하고 안정적으로 실행하고 운영하기 위해 쓰는 청사진이죠. 하지만 이걸 만드는 데 **몇 달**이 걸릴 수 있습니다. 그래서 이를 개선하려고 저희는 Copilot으로 눈을 돌렸습니다. Copilot은 제 하루의 시작이자 끝이기도 합니다(자막 불명확).", "en": "Thanks, Jacob. At Chevron, **enabling human progress** is our purpose (caption partly unclear). Society depends on us to provide reliable, affordable energy, and to do this while protecting people and the environment.\n\nOne of the ways we achieve this is through an engineered **basis of design**. It is the blueprint our engineers use to ensure we execute and operate safely and reliably. However, building this can take **months**. So to improve this, we turned to Copilot, which is the typical start and end of my day (caption unclear)."}}, {"type": "term", "term": "Basis of Design", "kr": {"ko": "설계 기준서 — 설계·운영의 근거를 정리한 기준 문서", "en": "Basis of Design — the foundational design-criteria document"}, "body": {"ko": "설계 기준서(BoD)는 플랜트, 유정, 설비 같은 엔지니어링 프로젝트에서 ‘무엇을, 어떤 기준과 가정으로 설계했는가’를 정리한 핵심 문서입니다. 적용 표준, 설계 조건, 가정, 위험, 승인 이력 등이 담깁니다.\n\n건물을 짓기 전 설계 도면의 근거가 되는 ‘설계 조건서’에 해당합니다. 수많은 과거 자료와 사내 표준을 대조해야 해서 작성에 수개월이 걸리기도 합니다.\n\n이 키노트에서는 바로 이 고난도·고비용 문서 작업을 Cowork가 수백 개 파일과 사내 데이터를 근거로 몇 분 만에 초안화하는 사례로 쓰였습니다.", "en": "A basis of design (BoD) records the standards, conditions, assumptions and approvals behind an engineering design — the blueprint's rationale. It normally takes months of cross-checking; here Cowork drafts it in minutes from company files and data."}}, {"type": "say", "sp": "ryder", "t": 3021, "text": {"ko": "데모를 보여 드리겠습니다. 저희는 Copilot 채팅에서 시작해 **설계 기준서를 만드는 Cowork 프롬프트를 써 달라**고 요청했습니다. 보시는 게 그 프롬프트인데, Cowork에 주는 **300줄짜리 기술 지시문**입니다. 이걸 가능하게 한 건 백그라운드에서 관련 파일을 찾아온 Work IQ입니다. 클릭 한 번으로 이걸 Cowork로 보내겠습니다.\n\nCowork는 이미 **수백 개의 엔지니어링 파일**을 다 훑었습니다. 엔지니어가 설계 기준서를 만들려면 어디에 시간을 집중해야 하는지를 바로 여기 강조해 주었고요. 그리고 여기 아래에 첫 초안 두 개, 설계 기준서 문서와 Excel 워크북이 있습니다.", "en": "Let me walk you through the demo. We started in Copilot chat and asked it to **write a Cowork prompt to build a basis of design**. You can see, here's the prompt: it is **300 lines of technical instructions** to Cowork, and what enabled this is Work IQ in the background, sourcing relevant files. With one click, I will send this over to Cowork.\n\nAnd Cowork has already gone through **hundreds of engineering files**. It has highlighted to the engineer right here where they need to focus their time to build out the basis of design. And here at the bottom are our first two initial drafts: our basis of design document and Excel workbook."}}, {"type": "shot", "t": 3035, "cap": {"ko": "Copilot 채팅이 작성한 ‘Cowork prompt’ — Pelican Basin 설계 기준서용 Word 문서와 Excel 근거 워크북을 만들라는 수백 줄짜리 지시문입니다. 프롬프트 자체를 AI가 쓰고, Work IQ가 관련 파일을 찾아 붙였습니다.", "en": "The 'Cowork prompt' written by Copilot chat — hundreds of lines instructing Cowork to build a Pelican Basin basis-of-design Word document and an Excel evidence workbook, with Work IQ sourcing the files."}, "img": "images/shot-17.jpg"}, {"type": "say", "sp": "ryder", "t": 3064, "text": {"ko": "하지만 이 두 문서는 저희 전사 데이터에 비하면 비교적 작은 데이터 세트를 바탕으로 했습니다. 그래서 다음으로, 위로 스크롤해 보면, Cowork에게 **두 산출물을 저희 엔지니어링 표준과 회사 전반의 관련 데이터로 보강**하라고 요청했습니다.\n\n이걸 가능하게 하는 게 **Fabric IQ**입니다. 오른쪽 아래 플러그인에 Fabric IQ가 보이시죠. 그리고 **데이터 아키텍처를 하나도 바꾸지 않고**, 저희 설계 기준서를 회사가 운영하는 **수천, 수천 건의 설계와 운영 보고서**와 비교했습니다.", "en": "However, these two documents were based on a relatively small data set compared to our enterprise data. So next — I'll scroll up here — we asked Cowork to **enrich both deliverables with our engineering standards and with all of our relevant data across the company**.\n\nAnd what enables this is **Fabric IQ** — you can see it in the bottom right corner in the plug-ins, Fabric IQ. And **without changing any of our data architecture**, it has compared our basis of design to **thousands and thousands of company-operated designs and operational reports**."}}, {"type": "term", "term": "Fabric IQ", "kr": {"ko": "Fabric IQ — 회사 데이터(Microsoft Fabric)를 AI가 이해하도록 잇는 계층", "en": "Fabric IQ — the layer that lets AI understand company data in Microsoft Fabric"}, "body": {"ko": "Microsoft Fabric은 회사의 각종 데이터(데이터베이스, 보고서, 운영 데이터)를 한곳에서 다루는 데이터 플랫폼입니다. Fabric IQ는 키노트 설명에 따르면 이 데이터를 Copilot·Cowork가 업무 맥락으로 활용할 수 있게 해 주는 지능 계층으로, 여기서는 Cowork의 플러그인으로 연결되어 있습니다.\n\nWork IQ가 메일·문서·회의 같은 ‘업무 맥락’을 준다면, Fabric IQ는 ‘사업 데이터 맥락’을 준다고 보면 됩니다.\n\n이 시연의 포인트는 Chevron이 데이터 구조를 바꾸지 않고도, 인수한 회사의 시스템까지 포함한 수천 건의 설계·운영 데이터를 AI가 근거로 쓸 수 있었다는 점입니다.", "en": "Microsoft Fabric is Microsoft's data platform; per the keynote, Fabric IQ lets Copilot/Cowork use that business data as context (here, as a Cowork plug-in). Work IQ supplies work context; Fabric IQ supplies business-data context — without Chevron changing its data architecture."}}, {"type": "say", "sp": "ryder", "t": 3108, "text": {"ko": "아래로 스크롤하겠습니다. 잠깐이면 됩니다. 산출물로 가 보면, 업데이트된 두 산출물이 여기 있습니다. 설계 기준서를 클릭해 보겠습니다.\n\n**회사 템플릿을 바탕으로, 회사 표준을 반영하고**, 회사 전반의 데이터와 여러 시스템에 흩어진 저희의 **조직 지식**을 끌어왔습니다. 그중에는 **최근 인수한 회사의 시스템**도 포함되어 있고, 이 모든 걸 Fabric IQ가 가능하게 했습니다. 이걸 닫고 세션으로 돌아가겠습니다.", "en": "So I will scroll down — this takes just a second here — to the deliverables. You will see our two updated deliverables here, and I will click on our basis of design.\n\nIt's **based on our company template, informed by our company standards**, and pulling in data from across the company and our **institutional knowledge** located in multiple systems across the company — including **a system from a company we recently acquired** — all enabled by Fabric IQ. I will close out of this and get back into our session."}}, {"type": "shot", "t": 3135, "cap": {"ko": "완성된 ‘Pelican Basin Basis of Design, Designs A–F’ Word 문서(DRAFT – ENGINEERING REVIEW). 회사 템플릿 형식에 문서 관리 표, 승인란, 개정 이력까지 갖춘 실제 엔지니어링 문서 형태입니다.", "en": "The finished 'Pelican Basin Basis of Design, Designs A–F' Word document marked DRAFT – ENGINEERING REVIEW, in the company template with document control, approvals and revision history."}, "img": "images/shot-18.jpg"}, {"type": "say", "sp": "ryder", "t": 3161, "text": {"ko": "이 작업을 끝냈으니, 이제 Cowork에게 이 모든 걸 **재사용 가능한 스킬**로 바꿔 달라고 요청했습니다. 출력 부분까지 스크롤해 보면 작업하는 모습이 보이고요. 여기 있습니다. 화면 아래 assets에 basis of design 스킬이 있죠.\n\n엔지니어링 팀의 누구든 이 스킬을 쓸 수 있습니다. 사실 **회사의 어떤 엔지니어든** 이 스킬로 설계 기준서를 만들 수 있습니다.", "en": "Now that we have completed that task, we asked Cowork to turn all of this into a **reusable skill**. I will go ahead and just scroll down to the output — you can see it working here. And here it is: bottom of the screen, assets, basis of design skill.\n\nAnyone on the engineering team can use this skill. In fact, **any engineer in the company** can use this skill to create a basis of design."}}, {"type": "term", "term": "Skill", "kr": {"ko": "스킬 — AI가 재사용할 수 있게 저장한 업무 절차", "en": "Skill — a saved, reusable procedure for AI"}, "body": {"ko": "스킬은 한 번 잘 해낸 작업의 지시문, 절차, 참고 자료를 묶어 저장해 두고, 다음에 누구든 같은 방식으로 AI에게 시킬 수 있게 만든 ‘레시피’입니다.\n\n숙련자의 업무 노하우를 표준 작업 매뉴얼로 만들어 팀 전체에 나눠 주는 것과 비슷합니다.\n\n이 키노트에서 스킬은 개인의 성공을 조직 전체의 역량으로 퍼뜨리는 장치로 반복 등장합니다(Chevron의 설계 기준서 스킬, Accenture의 파이프라인 리뷰 스킬 등).", "en": "A skill packages the instructions, steps and references of a well-done task so anyone can have AI repeat it — like turning an expert's know-how into a shared playbook. In this keynote skills spread one person's success across the organization."}}, {"type": "say", "sp": "ryder", "t": 3189, "text": {"ko": "거의 다 끝났습니다. Cowork로 돌아가서, 지금까지 한 작업을 요약하고, 산출물 파일을 저희 **엔지니어링 Teams 채널에 올려서** 추가 검토를 받도록 프롬프트를 줬습니다. 그리고 클릭 한 번으로 끝났습니다. 저는 **Copilot을 한 번도 떠나지 않았습니다.**", "en": "We are almost finished. Go back into Cowork, and we give it a prompt to summarize the work we've done and post the deliverable files in our **engineering Teams channel** for further review. And with one click, we are done. And **I never left Copilot**."}}, {"type": "say", "sp": "judson", "t": 3219, "text": {"ko": "정말 멋졌어요, Ryder. 이 자리의 모두가 궁금해하는 질문을 제가 대신 드릴게요. **그 작업 전부에 비용이 얼마나 들었나요?**", "en": "That was really awesome, Ryder. I've got the question that everybody in the room is asking: **how much did all of that work cost you?**"}}, {"type": "say", "sp": "ryder", "t": 3225, "text": {"ko": "글쎄요, Judson, 비용은 늘 중요하죠. 그런데 Cowork에서 이 세션에 쓴 건 **4,500 크레딧, 약 45달러**입니다. 이걸 팀을 꾸려서 저희 엔지니어들의 시간으로 했다면(자막 일부 불명확)… **몇 달 걸리던 일이 몇 분으로** 줄었습니다.", "en": "Well, Judson, costs always matter, but in Cowork I can see, in this session, **4,500 credits — around $45**. Compared with building it with a team, in our engineers' time (caption partly unclear), **it went from months to minutes**."}}, {"type": "term", "term": "Credits (metered usage)", "kr": {"ko": "크레딧 — 쓴 만큼 차감되는 AI 사용량 단위", "en": "Credits — units of metered AI usage"}, "body": {"ko": "크레딧은 AI 에이전트가 일을 할 때 소모되는 사용량을 돈처럼 환산한 단위입니다. 정액 구독과 달리, 오래 걸리고 많은 데이터를 다루는 작업일수록 더 많이 차감되는 ‘미터기’ 방식입니다.\n\n이 시연에서 Ryder는 4,500 크레딧이 약 45달러라고 말합니다(즉 1크레딧 ≈ 1센트).\n\n키노트의 메시지는 두 가지입니다. 몇 달 걸리던 엔지니어링 작업이 수십 달러로 끝났다는 ‘가치’, 그리고 IT가 이 사용량을 볼 수 있고 한도를 걸 수 있다는 ‘통제’입니다. 바로 다음 Agent 365 시연이 그 통제 부분입니다.", "en": "Credits measure metered AI agent usage — longer, heavier jobs consume more, like a taxi meter. Ryder's 4,500 credits ≈ $45 (about one cent each). The keynote pairs this value story with IT's ability to see and cap the spend, shown next in Agent 365."}}, {"type": "section", "t": 3247, "title": {"ko": "IT가 보는 AI 비용, Agent 365", "en": "AI spend through IT's eyes: Agent 365"}, "lead": {"ko": "방금 본 ‘45달러’를 개인이 아니라 회사 IT 관점에서 어떻게 관리하는지 보여 주는 짧은 시연입니다. Chevron의 Steph Waters가 Agent 365에서 전사 AI 지출, 사용자별 상세(Ryder), 지출 한도·알림·모델 허용 설정을 보여 줍니다. ‘Cowork는 마음껏 쓰되 통제는 IT가 한다’는 안심 메시지가 목적입니다.", "en": "A short demo of how the '$45' looks from the IT side. Chevron's Steph Waters shows Agent 365's company-wide AI spend, a per-user drill-down (Ryder), and spend limits, alerts and model controls — reassurance that Cowork usage stays governed."}}, {"type": "say", "sp": "judson", "t": 3247, "text": {"ko": "훌륭합니다, 정말 고마워요, Ryder. Ryder가 간단한 명령 하나로 자기 비용을 확인하는 걸 보셨는데요, 이걸 **회사의 데이터·AI 팀 전체 관점**에서 보는 것도 정말 멋집니다(자막 일부 불명확). Steph Waters가 전사적으로 어떻게 보이는지 보여 드리겠습니다.", "en": "Fantastic, thank you so much, Ryder. So you saw how Ryder visualized his cost with one simple command, but it is really cool to see this from the perspective of the **entire data and AI team organization** (caption partly unclear). Here is Steph Waters to show us what this looks like across the company."}}, {"type": "beat", "t": 3260, "text": {"ko": "(Steph Waters — Chevron 엔터프라이즈 데이터·AI 팀 — 가 Judson 옆 데모 데스크에서 Agent 365 화면을 띄움)", "en": "(Steph Waters of Chevron's Enterprise Data and AI Team brings up Agent 365 at the demo desk next to Judson)"}}, {"type": "say", "sp": "steph_waters", "t": 3271, "text": {"ko": "Agent 365는 IT에게 **조직 전체의 AI 지출에 대한 가시성**을 주기 때문에, 투자가 어디로 가고 있는지 볼 수 있습니다. 한눈에 무엇을 썼고 무엇이 남았는지, 그리고 서비스·에이전트·정책·모델 전반에서 무엇이 지출을 이끌고 있는지 볼 수 있죠.\n\n사용자 단위로 내려가 볼 수도 있는데, 여기 **Ryder**가 보입니다. 그가 쓰는 모델과 서비스, 사용 사례, 그리고 Copilot을 써서 얻고 있는 **가치**까지 볼 수 있습니다.", "en": "Agent 365 gives IT **visibility into the AI spend across the organization**, so we can see where investment is going. At a glance I can see what we've used and what remains, and what's driving spend across our services, agents, policies and models. And I can drill down into our users, and here I can see **Ryder**.\n\nAnd I can see the models he's using, as well as the services and the use cases, and the **value** that he's getting from using Copilot."}}, {"type": "say", "sp": "steph_waters", "t": 3303, "text": {"ko": "중요한 점은, **누구든 Cowork를 쓰기 전에 IT가 먼저 지출 한도를 설정해야 한다**는 겁니다. 한도에 도달하면 사용자는 Copilot을 계속 쓰기 위해 한도 증액을 요청해야 합니다. **알림** 기능으로 IT는 문제가 생기기 전에 개입할 수 있습니다.\n\n또 어떤 모델을 쓸 수 있게 할지 정할 수 있고, 템플릿으로 정책을 만들 수도 있습니다(자막 불명확). 그래서 결국 저는 비용을 관리하는 데 그치지 않고 **우리가 만들어 내는 가치**를 볼 수 있고, 어디를 최적화하고 다음에 어디에 투자할지 더 나은 결정을 내릴 수 있습니다.", "en": "Now, importantly, **IT needs to set the spend limit before anyone can use Cowork**. Once that limit is reached, the user must request an increase in order to keep using Copilot. **Alerts** let IT step in before any issues occur.\n\nI can also set which models are available for use, as well as create policies from templates (caption unclear). So ultimately I'm not just managing costs — I can see **the value that we're creating** and make better decisions about where to optimize and where to invest next."}}, {"type": "shot", "t": 3305, "cap": {"ko": "Agent 365 ‘Cost management’ 화면에서 Ryder Booth를 열어 본 모습 — 이달 지출 $109.45, 월말 예상 $193, 세션 64건과 적용된 지출 정책(Executive Committee AI spend)이 보입니다. IT가 개인 단위까지 AI 비용을 들여다볼 수 있음을 보여 줍니다.", "en": "Agent 365 Cost management drilled into Ryder Booth: $109.45 month-to-date, $193 forecast, 64 sessions, and the 'Executive Committee AI spend' policy applied — IT can see AI cost down to the individual."}, "img": "images/shot-19.jpg"}, {"type": "say", "sp": "judson", "t": 3343, "text": {"ko": "훌륭했어요, Steph. Jacob, 다시 넘길게요.", "en": "Awesome job, Steph. Jacob, back to you."}}, {"type": "section", "t": 3346, "title": {"ko": "1달러의 가치를 극대화하는 Copilot과 곧 올 기능들", "en": "Maximizing every dollar, and what's coming next"}, "lead": {"ko": "Jacob이 비용 이야기를 마무리하며 ‘구독 + 자동 라우팅 + Work IQ’로 같은 돈에서 더 많은 가치를 낸다고, 즉 ‘Copilot이 돈을 아껴 준다’고 주장합니다. 이어 몇 주 안에 나올 Today, Autopilot, Workspaces를 소개하고, 부서별 전문성을 담는 플러그인 개념을 꺼내 다음 BlackRock 영업 사례로 넘어갑니다.", "en": "Jacob closes the cost thread — subscription, autorouting and Work IQ make every dollar go further: 'Copilot saves you money.' He then previews Today, Autopilot and Workspaces (coming in weeks) and introduces per-function plug-ins, setting up the BlackRock sales story."}}, {"type": "say", "sp": "jacob", "t": 3346, "text": {"ko": "이런 가드레일이 비용을 통제하는 데 도움을 주지만, Copilot은 **그 1달러 1달러가 최대한 멀리 가도록** 일합니다. 저희는 세 가지 방법으로 그렇게 합니다.\n\n첫째, Copilot 구독입니다. Copilot 구독은 **회사의 모든 사람에게 일상적인 AI를 주는 가장 좋은 방법**입니다. 채팅, Copilot 전체와 Office가 포함되어 있어서, 초안 작성, 요약, 분석을 모두 **미터기를 돌리거나 추가 요금을 발생시키지 않고** 할 수 있습니다.", "en": "Those guardrails help keep costs in control, but Copilot works to **maximize how far each of those dollars goes**. We do that in three ways.\n\nFirst, we do it with the Copilot subscription. The Copilot subscription is **the best way to give everyday AI to every person in your company**. It includes chat, all of Copilot and Office; you can do drafting, summarizing and analysis all **without hitting a meter or generating additional charges**."}}, {"type": "say", "sp": "jacob", "t": 3372, "text": {"ko": "또 보신 모든 것은 **자동 라우팅(autorouting)**으로 움직입니다. 하나의 입력창에서 올바른 모드, 올바른 모델, 올바른 노력 수준을 골라 주죠. 여러분은 가능한 최선의 답을 얻고, 저희는 내부에서 요청 하나하나의 비용을 관리하도록 돕습니다.\n\n또 Work IQ의 혜택도 받습니다. Work IQ는 여러분이 하는 모든 일을 회사의 맥락과 여러분의 일하는 방식에 근거하게 합니다. 비용을 통제하는 가장 효과적인 방법은 **처음부터 한 번에 제대로 일할 수 있는 맥락**을 갖추는 것이죠. 그래서 Copilot은 여러분의 일을 알고, 작업마다 최적의 모델을 고를 수 있으며, 그게 **고정 구독에 포함**되어 있습니다.\n\n가장 어려운 작업에는 고급 AI를. **Copilot은 여러분의 돈을 아껴 줍니다.** 이것이 일을 위해 만든 AI입니다.", "en": "Everything you saw is also powered by **autorouting**: the right mode, the right model and the right effort, all from a single composer. You get the best possible response, and we help manage the cost of each request under the hood.\n\nIt also benefits from Work IQ. Work IQ grounds everything that you do in your company context and how you work. The most impactful way to keep costs under control is to make sure you have **the context to do the job right the first time**. So Copilot knows your work, it's able to pick the best model for every task, and that's **included in a fixed subscription**.\n\nAdvanced AI for your hardest tasks. **Copilot saves you money.** This is AI built for work."}}, {"type": "shot", "t": 3430, "cap": {"ko": "‘AI built for work’ 슬라이드 — 사용자 1인당 월 예상 비용 비교. 일상 AI 사용자: Microsoft Copilot $30, ChatGPT $81, Claude $205 / 고급 AI 사용자: Copilot + Copilot Cowork $96, ChatGPT + ChatGPT Work $149, Claude + Claude Cowork $299. ‘Copilot이 돈을 아껴 준다’는 주장의 근거로 제시됐습니다.", "en": "'AI built for work' slide comparing estimated monthly cost per user. Everyday AI user: Microsoft Copilot $30, ChatGPT $81, Claude $205; advanced user: Copilot + Copilot Cowork $96, ChatGPT + ChatGPT Work $149, Claude + Claude Cowork $299 — the evidence for 'Copilot saves you money.'"}, "img": "images/shot-20.jpg"}, {"type": "term", "term": "Autorouting (Model Router)", "kr": {"ko": "자동 라우팅 — 질문마다 알맞은 AI 모델·노력 수준을 자동 선택", "en": "Autorouting — automatically picking the right model and effort per request"}, "body": {"ko": "AI 모델은 크고 비싼 것(어려운 추론에 강함)부터 작고 싼 것(간단한 일에 빠름)까지 다양합니다. 모델 라우터는 요청 내용을 보고 어떤 모델에, 얼마만큼 깊이 생각하게 할지 자동으로 배정하는 교통정리 장치입니다.\n\n간단한 문의는 일반 상담원이, 복잡한 건은 전문가가 받도록 콜센터가 전화를 자동 분배하는 것과 비슷합니다.\n\n이 키노트에서는 사용자가 모델을 고민할 필요 없이 최선의 답을 받으면서도, 불필요하게 비싼 모델을 쓰지 않아 비용이 절감된다는 근거로 제시됩니다.", "en": "A model router looks at each request and sends it to the right model with the right reasoning effort — like a call center routing simple calls to agents and hard ones to experts. Here it's presented as delivering the best answer while avoiding unnecessary cost."}}, {"type": "beat", "t": 3437, "text": {"ko": "(박수)", "en": "(Applause)"}}, {"type": "say", "sp": "jacob", "t": 3440, "text": {"ko": "지금까지 보신 건 **모두 지금 바로 사용 가능**합니다. 이제 잠깐 방향을 바꿔서, **앞으로 몇 주에 걸쳐** 출시될 정말 멋진 것들을 말씀드리겠습니다. Copilot이 여러분의 일을 ‘도와주는’ 단계에서 **실제로 일을 앞으로 진척시키는** 단계로 넘어가는 순간입니다.\n\nJudson이 Today를 보여 드렸죠. Today는 Copilot의 새로운 **선제적·개인화 경험**입니다. 메일, 일정, Teams, 회의, 작업을 아우르는 커맨드 센터로, 놓친 것과 주의가 필요한 것을 보여 줍니다. 그리고 Today는 일을 띄워 주기만 하는 게 아니라 일을 진척시킵니다. 초안은 이미 작성돼 있고, 제안된 일정 변경도 이미 반영돼 있으며, 모든 게 늘 그렇듯 **여러분의 승인을 기다립니다.**", "en": "So everything you've seen so far is **available now**. And I want to take a second to pivot to some of the really cool things rolling out **over the next couple of weeks**. This is when Copilot goes from helping you with your work to **actually moving your work forward**.\n\nJudson showed you Today. Today is our new **proactive, personalized experience** in Copilot. It's a command center that spans mail, calendar, Teams, meetings and tasks; it shows you what you missed and what needs your attention. And Today doesn't just surface the work, it helps move things forward: the draft is already written, the proposed schedule change is already made, and everything is waiting, as always, **for your approval**."}}, {"type": "say", "sp": "jacob", "t": 3485, "text": {"ko": "Autopilot도 보셨습니다. 여러분의 **디지털 팀원**이죠. 최초의 **엔터프라이즈급 장기 실행(long-running) 에이전트**로, 여러분의 테넌트 안에 살고, **자기만의 메모리, 자기만의 이메일, 자기만의 컴퓨터**를 가집니다. 그래서 Autopilot은 M365 앱에만 국한되지 않고, 여러분 비즈니스가 돌아가는 **모든 레거시 애플리케이션**을 쓸 수 있습니다. Autopilot은 채널을 지켜보고, 스레드에 후속 조치를 하고, 여러분이 자는 동안에도 **반복 업무를 앞으로 진척**시킬 수 있습니다.", "en": "You also saw Autopilot. It's your **digital teammate**: the first-ever **enterprise-grade, long-running agent**. It lives in your tenant; it has **its own memory, its own email, its own computer**. That means Autopilot is not just limited to M365 apps — it can use **all of the legacy applications** that your business runs on. Autopilot watches channels, can follow up on threads, and it can **push recurring work forward while you sleep**."}}, {"type": "say", "sp": "jacob", "t": 3527, "text": {"ko": "Workspaces입니다. 협업의 미래는 **사람과 AI를 한곳에** 모으는 것이고, Autopilot들은 Workspaces 안에서 살아 움직입니다. 지금까지 AI는 대부분 **싱글 플레이어**였는데, Workspaces는 이를 진정한 **멀티플레이어**로 만듭니다.\n\n워크스페이스에서는 사람과 에이전트가 **공유된 맥락**을 가지고 공동의 목표를 중심으로 모입니다. 워크스페이스는 일을 해내는 데 필요한 파일과 사람을 자동으로 끌어와서, 대화와 의사결정이 모두 한곳에 남습니다. 모두가 전체 맥락을 갖고, 일이 어디까지 왔는지, 다음에 무엇을 해야 하는지 압니다.", "en": "Workspaces: the future of collaboration is bringing **people and AI into one place**, and Autopilots come to life in Workspaces. Until now AI has been mostly **single player**, and Workspaces makes it truly **multiplayer**.\n\nIn a workspace, people and agents come together around a common goal with **shared context**. The workspace automatically pulls in the files and the people needed to get something done, so that conversations and decisions all live in one place. Everyone has full context; they know where things stand and they know what to do next."}}, {"type": "say", "sp": "jacob", "t": 3566, "text": {"ko": "저희는 이 모든 것이 Copilot을 여러분 회사의 모든 사람에게 도움이 되는 멋진 방법으로 만들 수 있다고 생각합니다. 하지만 여러분 회사를 차별화하는 것은 아마 **각 부서(function)**에 있을 겁니다. 법무, 영업, 재무, HR에 말이죠. 회사의 각 부서는 자기만의 시스템, 자기만의 데이터, 자기만의 일하는 방식을 가지고 있습니다.\n\nCopilot은 **인간의 야망을 위한 플랫폼**이고, **플러그인**은 Copilot이 비즈니스의 각 부서를 지원하는 방식입니다. 플러그인은 각 팀이 의존하는 스킬과 커넥터 등을 한데 묶어 줍니다. 플러그인은 Copilot이 그 업무의 **전문가**가 되는 방법입니다. IT가 플러그인을 **한 번 승인하면** 채팅, Code, 심지어 Autopilot에서까지 작동합니다.\n\nBlackRock의 Andrew를 맞아 주십시오.", "en": "We think all of these things can make Copilot an amazing way to serve every person at your business, but what sets your company apart likely lives in **the functions**: it lives in legal, in sales, in finance, in HR. Each of these functions in your company has its own systems, its own data, its own way of doing things.\n\nCopilot is **a platform for human ambition**, and **plug-ins** are how it supports each function in your business. They bring together the skills, the connectors and the tools that each of your teams rely on. Plug-ins are how Copilot becomes **an expert in the job to be done**. IT approves plug-ins **once** and they work across chat, Code and even Autopilot.\n\nPlease welcome Andrew from BlackRock."}}, {"type": "term", "term": "Plug-in", "kr": {"ko": "플러그인 — 부서별 스킬·커넥터를 묶은 Copilot 확장 패키지", "en": "Plug-in — a package of function-specific skills and connectors for Copilot"}, "body": {"ko": "플러그인은 특정 업무(영업, 재무, 법무 등)에 필요한 스킬, 데이터 연결(커넥터), 도구를 한 묶음으로 Copilot에 붙이는 확장 기능입니다. 스마트폰에 업무용 앱을 설치하는 것과 비슷합니다.\n\n키노트 설명에 따르면 IT가 한 번 승인하면 채팅, Code, Autopilot 어디서든 작동합니다.\n\n이어지는 사례에서 Dynamics 365 영업·서비스 플러그인(BlackRock), Salesforce 플러그인(Accenture), Fabric IQ 플러그인(Chevron)처럼, 각 회사의 핵심 시스템을 Copilot 안으로 끌어오는 연결고리 역할을 합니다.", "en": "A plug-in bundles the skills, connectors and tools a function (sales, finance, legal…) needs — like installing a work app on a phone. Per the keynote, IT approves once and it works in chat, Code and Autopilot; the Dynamics 365, Salesforce and Fabric IQ examples all use them."}}, {"type": "section", "t": 3627, "title": {"ko": "BlackRock, Copilot으로 다시 짜는 영업", "en": "BlackRock: reimagining sales with Copilot"}, "lead": {"ko": "플러그인이 한 부서(영업)를 어떻게 바꾸는지 보여 주는 사례입니다. BlackRock의 Andrew Gidney가 ‘영업은 관계의 비즈니스’라는 문제의식을 제시하고, Microsoft의 Nirja Trivedi(글로벌 영업 리더 역)와 Efe Abugo(고객 관계 매니저 역)가 Today, Cowork, Dynamics 365, Autopilot을 이어 쓰는 영업 캠페인을 시연합니다. 목표 달성률 73%→81%, 신규 파이프라인 5,900만 달러라는 결과 숫자에 주목하세요.", "en": "A function-level example of plug-ins. BlackRock's Andrew Gidney frames sales as a relationship business; Microsoft's Nirja Trivedi (as a global sales lead) and Efe Abugo (as a relationship manager) run a campaign with Today, Cowork, Dynamics 365 and Autopilot. Watch the results: 73% → 81% of goal and $59M of new pipeline."}}, {"type": "beat", "t": 3627, "text": {"ko": "(박수, BlackRock의 Andrew Gidney 등장)", "en": "(Applause; Andrew Gidney of BlackRock walks on)"}}, {"type": "say", "sp": "andrew", "t": 3628, "text": {"ko": "감사합니다, 고마워요 Jacob. 영업은 **관계의 비즈니스**입니다. 고객을 알고, 그들에게 무엇이 중요한지 이해하고, 적절한 때에 최선의 솔루션을 가져가는 일이죠.\n\n오늘날의 과제는 그렇게 할 정보가 없는 게 아닙니다. **대화와 시스템에 흩어진 정보를 연결하는 것**이 과제죠. 바로 거기서 AI가 정말 강력해집니다. AI는 그런 신호들을 한데 모아 저희 관계 매니저(RM)들에게 훨씬 나은 출발점을 줍니다. 그래서 그들은 **정보를 찾는 데 쓰는 시간은 줄이고 고객과 보내는 시간은 늘리게** 됩니다.", "en": "Thank you, thank you, Jacob. Sales is **a relationship business**. It's about knowing your clients, understanding what matters to them, and bringing the best solution to them at the right time.\n\nToday, the challenge isn't having the information to do that; it's **connecting the information across conversations and systems**. And that's where AI gets really powerful: it brings those signals together and gives our relationship managers a much better starting point, so they **spend more time with clients and less time searching for information**."}}, {"type": "say", "sp": "andrew", "t": 3655, "text": {"ko": "BlackRock에서 기회는 단순히 지금의 영업 방식에 AI를 덧붙이는 게 아닙니다. **고객 관계를 어떻게 꾸려 갈지 자체를 다시 상상하는 것**입니다. 우리 팀과 고객의 필요를 중심으로, 영업 담당자들이 인사이트를 발굴하고, 행동에 옮기고, **사업 성과를 가속**하도록 하는 거죠.\n\n그럼 저희가 지향하는 모습을 보여 드리도록 Nirja에게 넘기겠습니다.", "en": "At BlackRock, the opportunity isn't simply adding AI to the way sales works today; it's **reimagining how we approach client relationships**, around the needs of our teams and our clients, to enable our sellers to mine insights, take action and **accelerate commercial outcomes**.\n\nSo let me pass it to Nirja to show you what we're working towards."}}, {"type": "say", "sp": "nirja", "t": 3692, "text": {"ko": "고마워요, Andrew. 저는 Microsoft의 Nirja Trivedi입니다. 제가 **글로벌 영업 리더**라고 해 볼게요.\n\n제 하루는 Copilot, 정확히는 제 업무의 커맨드 센터인 **Today**에서 시작합니다. 여기에는 **Dynamics 365 Sales**의 정보가 제 업무 시스템 전반의 정보, 그리고 재무 건전성이나 파이프라인 실적 같은 비즈니스 시스템 정보와 함께 들어와 있습니다.\n\n예를 들어 여기 Dynamics 365 Sales를 보면 저희 팀은 **목표의 73%**에 와 있습니다. 목표를 달성하려면 **약 3배의 파이프라인 커버리지**가 필요한데, 지금은 **2.2배**밖에 안 됩니다.", "en": "Thank you, Andrew. I'm Nirja Trivedi from Microsoft. Let's say I'm a **global sales lead**.\n\nMy day starts in Copilot, specifically **Today**, the command center for my work. Here, information from **Dynamics 365 Sales** is pu
