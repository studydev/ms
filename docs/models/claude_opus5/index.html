ing good grades, and then I got a little **serial cable** to give the programs to my classmates — **and they got really good grades too.**\n\nThen the math got a little harder. **It wasn't something I could solve in BASIC anymore.** I'd gone from an algebra solver written in BASIC to needing to solve harder problems, and **once we got into calculus I had to learn assembly so I could write a better solver** — so I could cheat better, now that it was calculus."}}, {"type": "term", "term": "BASIC → Assembly", "kr": {"ko": "왜 이 일화가 학습론인가", "en": "why this anecdote is really about learning"}, "body": {"ko": "**BASIC**은 초보자용으로 설계된 아주 쉬운 언어이고, **어셈블리(assembly)** 는 CPU 명령어에 거의 일대일로 대응하는 **가장 낮은 수준의 언어**입니다. 사람이 쓰기엔 극도로 번거롭지만, 그만큼 **빠르고 기계를 정밀하게 통제**할 수 있습니다.\n\n중학생이 계산기 위에서 BASIC에서 어셈블리로 넘어갔다는 것은 **난도가 몇 단계 뛰는 일**입니다. 그런데 여기서 주목할 점은 그가 **\"어셈블리를 배워야지\"라고 결심한 적이 없다**는 것입니다. **풀어야 할 문제가 먼저 어려워졌고, 그것이 그를 더 깊은 도구로 끌어당겼습니다.**\n\n이 구조는 이 대담 전체와 정확히 겹칩니다.\n\n**\"모델이 할 수 있다고 생각하는 것보다 조금 더 어려운 과제를 줘라\"** (15:00) — **감당 가능한 수준을 살짝 넘는 문제가 능력을 끌어올린다.** 그가 모델에게 권하는 방식은, 사실 그 자신이 중학생 때 스스로에게 적용했던 방식입니다.", "en": "**BASIC** is a beginner-friendly language; **assembly** sits at the opposite end — nearly one-to-one with CPU instructions, painful to write by hand but **fast and precise in its control of the machine.**\n\nFor a middle schooler on a calculator, moving from BASIC to assembly is **a jump of several difficulty levels.** But notice: **he never decided \"I should learn assembly.\"** **The problem got harder first, and that pulled him toward the deeper tool.**\n\nThe structure maps exactly onto the rest of the talk.\n\n**\"Give the model slightly harder tasks than you think it can do\"** (15:00) — **a problem just past your current reach is what raises capability.** What he recommends for the model is what he was already doing to himself in middle school."}}, {"type": "a", "t": 2039, "text": {"ko": "그래서 저에게 프로그래밍은 늘 **아주 실용적인 것**이었습니다.\n\n그리고 이게 학교에 계신 분들께 늘 드리는 제 조언이기도 합니다. **컴퓨터 과학만 배우지 마세요.** 그건 지적으로 매혹적이고 알아둘 가치가 정말 큽니다. 하지만 **그걸 어떻게 응용하는지도 배우세요.**\n\n그리고 그 응용이란 대개 **스타트업을 만드는 것, 제품을 만드는 것**입니다. **자기만의 디자인 감각을 기르는 것, 비즈니스 감각을 기르는 것, 데이터 과학을 배우는 것, 사용자와 대화하는 법을 배우는 것** 말이죠.\n\n**이런 다른 기술들을 컴퓨터 과학·엔지니어링과 결합할 때 정말 정말 가치 있어집니다.** 그러니 **제가 여전히 손으로 직접 익히겠다고 하는 어려운 기술이 바로 그것들입니다.**", "en": "So for me, programming has always been **very practical.**\n\nAnd that's always my advice for people in school: **learn not just the computer science.** It's intellectually fascinating and really worth knowing — but **learn how to apply it.**\n\nAnd often that's about **building startups, building products. Developing your own design sense, developing your business sense, learning how to do data science, learning how to talk to users.**\n\n**When you combine those other skills with computer science and engineering, that's where it becomes really, really valuable.** So **those are the hard skills I would still be doing by hand.**"}}, {"type": "q", "t": 2074, "text": {"ko": "제가 듣고 정리해 보자면 — **먼저 나 자신이 원하는 것을 만들고, 그다음 단계를 올려서 사람들이 원하는 것을 만들어라.**", "en": "So if I'm hearing and summarizing: **start with making something you want for yourself, and then level up and make something people want.**"}}, {"type": "a", "t": 2085, "text": {"ko": "네.", "en": "Yes."}}, {"type": "q", "t": 2087, "text": {"ko": "그리고 저희에게 마지막 특별 발표가 하나 있습니다. 하실 말씀 있으시죠?", "en": "And we have one last special announcement. You want to do one last thing?"}}, {"type": "a", "t": 2092, "text": {"ko": "네. **오늘 여기 오신 모든 분께 Max 20x를 드리겠습니다.**", "en": "Yeah — **for everyone here today, you are getting Max 20x.**"}}, {"type": "beat", "t": 2098, "text": {"ko": "(환호)", "en": "(cheering)"}}, {"type": "a", "t": 2113, "text": {"ko": "**이메일로 코드를 확인해 주세요.** 여러분이 무엇을 만드실지 정말 기대됩니다.", "en": "**Look for a code in your email.** And I can't wait to see what you build."}}, {"type": "q", "t": 2131, "text": {"ko": "저도 궁금합니다. **이제 계정이 생기셨으니, 이 방에 계신 누군가는 몇 달씩 돌아가면서 수천 개의 에이전트를 쓰는 무언가를 만드셔야 합니다.**\n\n오늘 정말 감사했습니다.", "en": "I'm curious — **someone in this room should be building something that runs for multiple months and thousands of agents, now that you have the account to do it.**\n\nAnd with that, thank you so much."}}, {"type": "a", "t": 2145, "text": {"ko": "감사합니다.", "en": "Thank you."}}, {"type": "beat", "t": 2148, "text": {"ko": "(환호와 박수)", "en": "(cheering and applause)"}}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
let LANG = D.defaultLang || 'ko';

const UI = {
  ko:{watch:'YouTube에서 보기', play:'▶  영상 열기', toc:'대화의 흐름',
      cap:'위 썸네일 또는 각 발언의 타임코드를 누르면 해당 지점의 영상이 열립니다.',
      o1:'이 페이지는 영상의 대화 흐름을 한국어로 옮기고, 개념 용어에는 설명 상자를 덧붙인 학습용 정리본입니다.',
      o2:'원문 발언의 취지를 살린 의역이며, 정확한 표현은 원본 영상을 확인하세요.'},
  en:{watch:'Watch on YouTube', play:'▶  Open the video', toc:'How the conversation flows',
      cap:'Click the thumbnail, or any timecode, to open the video at that moment.',
      o1:'A study companion that follows the conversation turn by turn and annotates the jargon.',
      o2:'Paraphrased for clarity — check the original video for exact wording.'}
};

function T(o){ if(o==null) return ''; return (typeof o==='string')?o:(o[LANG]??o.ko??o.en??''); }
function mmss(t){const m=Math.floor(t/60),s=t%60;return m+':'+String(s).padStart(2,'0');}
function yt(t){return D.watchUrl+'&t='+t+'s';}

function rich(s){
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g,'<em>$1</em>');
  s = s.replace(/\((\d{1,2}):(\d{2})\)/g,(m,a,b)=>{
    const sec=parseInt(a,10)*60+parseInt(b,10);
    return '(<a href="'+yt(sec)+'" target="_blank" rel="noopener">'+a+':'+b+'</a>)';
  });
  return s.split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}

function render(){
  document.documentElement.lang = LANG;
  const u = UI[LANG]||UI.ko;
  document.title = T(D.title).replace(/<[^>]+>/g,'');
  kicker.textContent = T(D.kicker);
  eyebrow.textContent = T(D.kicker);
  h1.innerHTML = T(D.title);
  sub.textContent = T(D.subtitle);
  pill.innerHTML = '<b>'+D.durationLabel+'</b> · '+D.blocks.filter(b=>b.type==='q'||b.type==='a').length+(LANG==='ko'?' 발언':' turns');
  watch.textContent = u.watch; watch.href = D.watchUrl;
  thumblink.href = D.watchUrl; thumbimg.src = D.thumb; thumbimg.alt = T(D.title).replace(/<[^>]+>/g,'');
  playtxt.textContent = u.play; cap.textContent = u.cap;
  toch.textContent = u.toc; outro1.textContent = u.o1; outro2.textContent = u.o2;

  // TOC
  let n=0; tocl.innerHTML='';
  D.blocks.filter(b=>b.type==='section').forEach(b=>{
    n++; const li=document.createElement('li');
    li.innerHTML='<a href="#s'+n+'"><span class="n">'+String(n).padStart(2,'0')+'</span><span>'+T(b.title)+'</span></a>';
    tocl.appendChild(li);
  });

  // body
  let html='', sn=0;
  for(const b of D.blocks){
    if(b.type==='section'){
      sn++;
      html+='<section class="sec" id="s'+sn+'"><div class="sec-head">'
          + '<span class="sec-n">'+String(sn).padStart(2,'0')+'</span>'
          + '<h2 class="sec-t">'+T(b.title)+'</h2>'
          + '<a class="ts sec-time" href="'+yt(b.t)+'" target="_blank" rel="noopener">'+mmss(b.t)+'</a>'
          + '</div>';
    } else if(b.type==='q'||b.type==='a'||b.type==='beat'){
      const sp = b.type==='q' ? D.speakers.host : (b.type==='a'? D.speakers.guest : D.speakers.stage);
      const who = T(sp.name);
      const av = sp.img ? '<img src="'+sp.img+'" alt="'+who+'">' : (T(sp.initial)||'');
      html+='<div class="turn '+b.type+'"><div class="av">'+av+'</div><div class="body">'
          + '<div class="who"><b>'+who+'</b>'
          + (b.t!=null?'<a class="ts" href="'+yt(b.t)+'" target="_blank" rel="noopener">'+mmss(b.t)+'</a>':'')
          + '</div><div class="bub">'+rich(T(b.text))+'</div></div></div>';
    } else if(b.type==='term'){
      html+='<details class="term"><summary>'
          + '<span class="term-tag">'+(LANG==='ko'?'용어':'TERM')+'</span>'
          + '<b>'+b.term+'</b>'+(b.kr?'<span class="kr">'+T(b.kr)+'</span>':'')
          + '<span class="chev">▼</span>'
          + '</summary><div class="term-b">'+rich(T(b.body))+'</div>'
          + (b.src?'<div class="term-b term-src" style="border:0;padding-top:0">'+b.src+'</div>':'')
          + '</details>';
    }
  }
  html+='</section>';
  main.innerHTML = html;
}

// lang buttons
(D.langs||[['ko','한국어'],['en','English']]).forEach(([c,l])=>{
  const b=document.createElement('button'); b.textContent=l; b.dataset.c=c;
  b.onclick=()=>{LANG=c;[...langseg.children].forEach(x=>x.classList.toggle('on',x.dataset.c===c));render();};
  if(c===LANG) b.classList.add('on');
  langseg.appendChild(b);
});

// theme
const saved = localStorage.getItem('y2h-theme');
if(saved) document.documentElement.dataset.theme = saved;
else if(matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.dataset.theme='dark';
themebtn.onclick=()=>{
  const n = document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=n; localStorage.setItem('y2h-theme',n);
};

render();
</script>
</body>
</html>
